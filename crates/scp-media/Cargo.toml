[package]
name = "scp-media"
version = "0.1.0-beta.2"
description = "Real-time media transport types for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["media", "signaling", "real-time", "encryption"]
categories = ["multimedia", "cryptography"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
scp-core = { path = "../scp-core", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-identity = { path = "../scp-identity", version = "=0.1.0-beta.2" }
openmls_traits = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# Test-only: supplies `SystemClock` for the MLS group fixtures, which now take
# an injected `Clock` for KeyPackage `Lifetime` stamping (ADR-057 §Prereq-1).
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
# Test-only: `p256::testing::uncompressed_point_for`, the wrapping public key
# every MLS group and KeyPackage fixture publishes in its leaf (spec 09 §9.16.1).
scp-crypto = { path = "../scp-crypto", features = ["testing"] }

[lints]
workspace = true
