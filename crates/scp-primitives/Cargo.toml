[package]
name = "scp-primitives"
version = "0.1.0-beta.2"
description = "Shared low-level primitives for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "identity", "cryptography"]
categories = ["cryptography", "data-structures"]

[features]
default = []
# Enables non-standard did:key:{hex} DID format acceptance for testing.
# Only for integration tests that run outside `#[cfg(test)]`.
# Production builds must never enable this feature. See issue #128.
testing = ["dep:hex"]

[dependencies]
ed25519-dalek = { workspace = true }
serde = { workspace = true }
z-base-32 = { workspace = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
