[package]
name = "scp-relay"
version = "0.1.0-beta.2"
description = "Standalone SCP native relay server binary"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["relay", "server", "websocket"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "scp-relay"
path = "src/main.rs"

[dependencies]
# `sqlite-blob` is ungated on purpose: §17.17 of the persistence spec requires a
# shipped relay to retain a durable blob backend, and `sqlite` is this binary's
# default value for `SCP_RELAY_STORAGE_BACKEND`. The two cloud backends sit
# behind `cloud-blobs` below instead.
scp-transport = { path = "../scp-transport", version = "=0.1.0-beta.2", features = [
    "sqlite-blob",
    "redb-blob",
    "startup",
] }
axum = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
# The two cloud blob backends, OFF by default — the same feature name and the
# same contents as `scp-node`'s `cloud-blobs`. Both crates must gate them or
# neither gating is worth anything: cargo unifies `scp-transport`'s features
# across every package one invocation builds, so an ungated `scp-relay` would
# re-resolve `postgres-blob` and `s3-blob` into `scp-node` and into every FFI
# bridge that depends on it.
#
# A build that leaves this feature off rejects `SCP_RELAY_STORAGE_BACKEND=postgres`
# and `=s3` with a "not compiled in" diagnostic naming this feature, rather than
# falling back to another backend. `sqlite`, `redb` and `memory` are unaffected.
cloud-blobs = ["scp-transport/postgres-blob", "scp-transport/s3-blob"]

[lints]
workspace = true
