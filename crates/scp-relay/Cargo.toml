[package]
name = "scp-relay"
version = "0.1.0"
description = "Standalone SCP native relay server binary"
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "scp-relay"
path = "src/main.rs"

[dependencies]
scp-transport = { path = "../scp-transport", features = [
    "sqlite-blob",
    "redb-blob",
    "postgres-blob",
    "s3-blob",
] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
