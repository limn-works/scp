[package]
name = "scp-relay"
version = "0.1.0-beta.2"
description = "Standalone SCP native relay server binary"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["relay", "server", "websocket"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "scp-relay"
path = "src/main.rs"

[dependencies]
scp-transport = { path = "../scp-transport", version = "=0.1.0-beta.2", features = [
    "sqlite-blob",
    "redb-blob",
    "postgres-blob",
    "s3-blob",
    "startup",
] }
axum = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
