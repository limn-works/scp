[package]
name = "scp-relay"
version = "0.1.0-beta.2"
description = "Standalone SCP native relay server binary"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["relay", "server", "websocket"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "scp-relay"
path = "src/main.rs"

[dependencies]
scp-transport = { path = "../scp-transport", version = "=0.1.0-beta.2", features = [
    "sqlite-blob",
    "redb-blob",
    "startup",
] }
axum = "0.8"
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
# The same feature as `scp-node`'s `cloud-blobs`. scp-relay depends on
# scp-transport directly, so `cargo build -p scp-relay --features cloud-blobs`,
# the operator build `docs/guides/relay-operations.md` names, needs this crate's
# own feature to compile the PostgreSQL and S3 backends.
cloud-blobs = ["scp-transport/postgres-blob", "scp-transport/s3-blob"]

[lints]
workspace = true
