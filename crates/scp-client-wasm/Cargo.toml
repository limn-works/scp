[package]
name = "scp-client-wasm"
version = "0.1.0-beta.2"
description = "wasm-bindgen browser surface over scp-client — keys on-device, single-threaded participant driver (ADR-057 Slice 3)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
publish = false

[lib]
# `cdylib` is the wasm-pack / wasm-bindgen output artifact; `rlib` lets the
# native host test (`tests/wasm_surface_exchange.rs`) link the exposed surface
# and drive it with in-memory adapters where no JS runtime exists.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables non-production DID formats (did:key:, did:test:) in the underlying
# driver, mirroring scp-client/scp-mls `testing`. Used by the native-surface
# integration test, which builds did:key fixtures.
testing = ["scp-client/testing"]

[dependencies]
# The browser surface is a THIN translation layer over scp-client; it
# re-derives no protocol logic. It depends ONLY on the wasm-safe shared crates
# plus the wasm-bindgen stack — and MUST NOT depend on scp-runtime,
# scp-identity, or tokio (the ADR-057 mechanical fence; verified via
# `cargo tree`). The openmls wire types arrive transitively through scp-client.
scp-client = { path = "../scp-client", version = "=0.1.0-beta.2" }
# scp-mls (a wasm-safe shared crate, within the fence) is a direct dep ONLY so
# the error mapping can name `MlsError`'s convergent-timestamp variants and give
# them a distinct `[SCP-CRYPTO-4040]` code (ADR-057 #1975). A plain `use`, never
# a `pub use` shim.
scp-mls = { path = "../scp-mls", version = "=0.1.0-beta.2" }
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-protocol = { path = "../scp-protocol", version = "=0.1.0-beta.2" }
scp-event-log = { path = "../scp-event-log", version = "=0.1.0-beta.2" }

# MessagePack is the codebase's name-tagged, width-/endianness-independent wire
# form (ADR-057). The surface serializes the adder's event-log stream with it so
# the joiner can replay an identical sequence across the JS boundary.
rmp-serde = { workspace = true }

# JSON is the §5.4.5 outlet-stream chunk wire form the native bridges already
# use for the `OutletStreamChunk` FFI parameter; the pure `verify_chunk_signature`
# wrapper deserializes the same JSON bytes so the TS SDK sees ONE cross-binding
# chunk encoding (NAPI + WASM identical). Pure Rust, wasm-safe.
serde_json = { workspace = true }

# The pure `verify_chunk_signature` wrapper reconstructs the outlet OPERATOR's
# `VerifyingKey` from its 32 raw bytes before delegating to `scp-protocol`. A
# leaf crypto crate already present transitively (via scp-protocol / scp-mls);
# a direct edge here is inside the ADR-057 wasm fence (it is not scp-runtime /
# scp-identity / tokio) and compiles for wasm32.
ed25519-dalek = { workspace = true }

# wasm-bindgen is needed on BOTH targets: on wasm32 it generates the real JS
# glue; on native it provides an inert `JsValue` / `#[wasm_bindgen]` so the
# exposed surface still compiles and the host test can link it. The JS-extern
# adapters (captured Date.now, JsStorage, JsKeyCustody) that genuinely require a
# browser are additionally `cfg(target_arch = "wasm32")`-gated inside the crate.
wasm-bindgen = { workspace = true }

# Browser-only: js-sys / web-sys / serde-wasm-bindgen are wasm32-only because
# they bind real browser globals. The native build (workspace clippy) does not
# pull them in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["console"] }
serde-wasm-bindgen = { workspace = true }
# wasm32 randomness + uuid backends, mirroring scp-client/scp-mls so the
# transitive openmls stack has a getrandom backend under wasm32.
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# The host-surface integration test drives did:key fixtures through the exposed
# WasmScpClient, so it needs the testing DID formats enabled.
scp-client = { path = "../scp-client", features = ["testing"] }
scp-did = { path = "../scp-did", features = ["testing"] }

# The cross-target determinism KAT round-trips committed golden MLS wire blobs
# (Commit / Welcome / KeyPackage) through openmls's canonical TLS codec on BOTH
# targets (ADR-057 Prerequisite 5 (i)/(iii)): deserialize the golden blob, then
# re-serialize it, and assert the bytes are byte-identical to the golden — the
# encoding-determinism test, NOT a comparison of two independent constructions.
# `openmls` arrives transitively via `scp-client`; naming it (and `tls_codec`)
# directly as a dev-dep makes `MlsMessageIn`/`MlsMessageOut`/`KeyPackageIn` and
# the `tls_codec::{Serialize, Deserialize}` traits reachable from the test. The
# feature set mirrors `scp-client` so the transitive build stays unified.
openmls = { workspace = true, features = ["libcrux-provider", "js"] }
tls_codec = "0.4"

# wasm-bindgen-test is only meaningful under wasm32 (it needs a wasm test
# runner). It is declared so a `wasm-pack test` / `wasm32` `cargo test` can pick
# up the `#[wasm_bindgen_test]` cases; the host `cargo test` runs the native
# integration test instead.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
