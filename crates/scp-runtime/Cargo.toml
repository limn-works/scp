scp-runtime-broadcast = { path = "../scp-runtime-broadcast", version = "=0.1.0-beta.2" }
scp-runtime-economy = { path = "../scp-runtime-economy", version = "=0.1.0-beta.2" }
scp-runtime-trust-recovery = { path = "../scp-runtime-trust-recovery", version = "=0.1.0-beta.2" }
scp-runtime-standing = { path = "../scp-runtime-standing", version = "=0.1.0-beta.2" }
scp-runtime-ttl-close = { path = "../scp-runtime-ttl-close", version = "=0.1.0-beta.2" }
scp-runtime-outlets = { path = "../scp-runtime-outlets", version = "=0.1.0-beta.2" }
scp-runtime-push = { path = "../scp-runtime-push", version = "=0.1.0-beta.2" }
scp-runtime-queries = { path = "../scp-runtime-queries", version = "=0.1.0-beta.2" }
scp-runtime-saga = { path = "../scp-runtime-saga", version = "=0.1.0-beta.2" }
scp-runtime-lifecycle-control = { path = "../scp-runtime-lifecycle-control", version = "=0.1.0-beta.2" }
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_memory_storage = { workspace = true }
tokio = { workspace = true }
