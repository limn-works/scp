[package]
name = "scp-runtime"
version = "0.1.0-beta.2"
description = "Core protocol implementation for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "context", "governance", "encryption"]
categories = ["cryptography", "network-programming"]

[features]
# Turns on `testing` in every runtime crate; `scp-runtime-core/testing` turns it on in
# the scp dependencies the tests use. Only test builds enable it; see
# `scp-runtime-core`'s manifest for why no shipped artifact resolves it.
testing = ["allow_unencrypted_storage", "scp-runtime-core/testing", "scp-runtime-messaging/testing", "scp-runtime-lifecycle/testing", "scp-runtime-governance/testing", "scp-runtime-broadcast/testing", "scp-runtime-economy/testing", "scp-runtime-trust-recovery/testing", "scp-runtime-standing/testing", "scp-runtime-ttl-close/testing", "scp-runtime-outlets/testing", "scp-runtime-push/testing", "scp-runtime-queries/testing", "scp-runtime-saga/testing", "scp-runtime-lifecycle-control/testing", "scp-protocol/testing"]
# Forwards to `scp-runtime-core/allow_unencrypted_storage`, which gates
# `ProtocolRepository::new_for_testing()`.
allow_unencrypted_storage = ["scp-runtime-core/allow_unencrypted_storage"]
# Forwards to `scp-runtime-core/saga-witness-test-mint` (`RestoredContexts::for_test`,
# `CrossContextSagaSeal::for_test`). Deliberately NOT implied by `testing`; no
# crate's non-dev dependency enables it.
saga-witness-test-mint = ["scp-runtime-core/saga-witness-test-mint"]
# Forwards to `scp-runtime-core/outlet-capability-test-grant`
# (`Supervisor::test_grant_member_capability`) and to the messaging crate's match arm
# for the command variant it gates, an authority-escalation test
# seam. Deliberately NOT implied by `testing`.
outlet-capability-test-grant = ["scp-runtime-core/outlet-capability-test-grant", "scp-runtime-messaging/outlet-capability-test-grant"]

[dependencies]
scp-runtime-core = { workspace = true }
scp-runtime-messaging = { workspace = true }
scp-runtime-lifecycle = { workspace = true }
scp-runtime-governance = { workspace = true }
scp-runtime-broadcast = { workspace = true }
scp-runtime-economy = { workspace = true }
scp-runtime-trust-recovery = { workspace = true }
scp-runtime-standing = { workspace = true }
scp-runtime-ttl-close = { workspace = true }
scp-runtime-outlets = { workspace = true }
scp-runtime-push = { workspace = true }
scp-runtime-queries = { workspace = true }
scp-runtime-saga = { workspace = true }
scp-runtime-lifecycle-control = { workspace = true }
scp-protocol = { workspace = true }

[dev-dependencies]
# The shared valid-P-256-point test fixture (`scp_crypto::p256::testing`).
scp-crypto = { workspace = true, features = ["testing"] }
# The test vectors drive the KEL resolution verdict through `scp_kel::classify`.
scp-kel = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The `identity` example constructs `InMemoryDhtClient`, gated behind `scp-dht/testing`
# (ADR-062 §Decision 1). `scp-dht/testing` never appears in a non-testing feature list.
scp-dht = { workspace = true, features = ["testing"] }
scp-mls = { workspace = true, features = ["testing"] }
scp-protocol = { workspace = true, features = ["testing"] }
scp-platform = { workspace = true, features = ["testing", "encrypting"] }
scp-event-log = { workspace = true, features = ["testing"] }
openmls_basic_credential = { workspace = true, features = ["test-utils"] }
metrics-util = "0.19"
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
dashmap = { workspace = true }
ed25519-dalek = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
metrics = { workspace = true }
openmls = { workspace = true }
rand = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
scp-clock = { workspace = true }
scp-did = { workspace = true }
scp-identity = { workspace = true }
# The push tests match relay `ERR` codes through `scp_relay_client::code`.
scp-relay-client = { workspace = true }
scp-runtime-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
z-base-32 = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

