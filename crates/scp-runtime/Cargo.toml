[package]
name = "scp-runtime"
version = "0.1.0-beta.2"
description = "Core protocol implementation for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "context", "governance", "encryption"]
categories = ["cryptography", "network-programming"]

[features]
# Turns on `testing` in every runtime crate and in the scp dependencies the
# tests use. Only test builds enable it; see `scp-runtime-core`'s manifest for
# why no shipped artifact resolves it.
testing = ["allow_unencrypted_storage", "scp-runtime-types/testing", "scp-runtime-core/testing", "scp-runtime-messaging/testing", "scp-runtime-lifecycle/testing", "scp-runtime-governance/testing", "scp-runtime-broadcast/testing", "scp-runtime-economy/testing", "scp-runtime-trust-recovery/testing", "scp-runtime-standing/testing", "scp-runtime-ttl-close/testing", "scp-runtime-outlets/testing", "scp-runtime-push/testing", "scp-runtime-queries/testing", "scp-runtime-saga/testing", "scp-runtime-lifecycle-control/testing", "scp-crypto/testing", "scp-protocol/testing", "scp-platform/testing", "scp-mls/testing", "scp-dht/testing"]
# Forwards to `scp-runtime-core/allow_unencrypted_storage`, which gates
# `ProtocolRepository::new_for_testing()`.
allow_unencrypted_storage = ["scp-runtime-core/allow_unencrypted_storage"]
# Forwards to `scp-runtime-core/saga-witness-test-mint` (`RestoredContexts::for_test`,
# `CrossContextSagaSeal::for_test`). Deliberately NOT implied by `testing`; no
# crate's non-dev dependency enables it.
saga-witness-test-mint = ["scp-runtime-core/saga-witness-test-mint"]
# Forwards to `scp-runtime-core/outlet-capability-test-grant`
# (`Supervisor::test_grant_member_capability`) and to the messaging crate's match arm
# for the command variant it gates, an authority-escalation test
# seam. Deliberately NOT implied by `testing`.
outlet-capability-test-grant = ["scp-runtime-core/outlet-capability-test-grant", "scp-runtime-messaging/outlet-capability-test-grant"]

