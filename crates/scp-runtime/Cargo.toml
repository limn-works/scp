rand = { workspace = true }
sha2 = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
z-base-32 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
