# The examples declare no `required-features`, and this crate carries no dev-dependency
# edge back to itself. Such an edge turns `scp-runtime/testing` on for the dev targets,
# but cargo then builds this crate's lib before its lib test, and its lib check before
# its lib check-test, which runs the two largest units in the workspace in series on
# every edit. These examples need no feature of this crate. They get `InMemoryDhtClient`,
# `InMemoryKeyCustody` and `InMemoryPreRotationCustody` from the `testing` features of
# the `scp-dht` and `scp-platform` dev-dependencies, and they store through the
# production `ProtocolRepository::new` over an `EncryptingAdapter`. So
# `cargo run -p scp-runtime --example identity` and `scripts/check-examples-compile.sh`
# build them with no features. Those two dev-dependencies carry a `version` key because
# cargo drops a dev-dependency without one from a published manifest, which would leave
# the examples' imports unresolved there.
[[example]]
name = "identity"

[[example]]
name = "context"

[[example]]
name = "outlets"

[[example]]
name = "messaging"

