[dev-dependencies]
# The shared valid-P-256-point test fixture (`scp_crypto::p256::testing`).
scp-crypto = { path = "../scp-crypto", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# The discovery test modules construct `InMemoryDhtClient` (now gated behind
# `scp-dht/testing`); activate it for this crate's own test build (ADR-062
# §Decision 1). `scp-dht/testing` never appears in a non-testing feature list.
scp-dht = { path = "../scp-dht", version = "=0.1.0-beta.2", features = ["testing"] }
scp-mls = { path = "../scp-mls", features = ["testing"] }
scp-protocol = { path = "../scp-protocol", features = ["testing"] }
# `filesystem` backs ADR-052 §AC-9 `EncryptedStorage` seal doctests on
# `ProtocolRepository::new`: `FilesystemStorage` is a plaintext backend that a
# `compile_fail,E0277` assertion proves cannot reach a production constructor.
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.2", features = ["testing", "encrypting", "filesystem"] }
scp-event-log = { path = "../scp-event-log", features = ["testing"] }
openmls_basic_credential = { workspace = true, features = ["test-utils"] }
proptest = "1"
static_assertions = { workspace = true }
metrics-util = "0.19"

