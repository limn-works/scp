# Clippy configuration for scp-runtime.
#
# The actor-per-context refactor (ADR-049) moves per-context state onto
# an actor. Actor-owned state is serialized by the actor's command loop
# and needs no synchronization primitive. Shared state that does exist
# (e.g. metrics, non-context caches) uses `tokio::sync::Mutex` because
# every such lock is acquired from async code.
#
# `std::sync::Mutex` in async code is a deadlock hazard: holding its
# guard across an `.await` suspends the OS thread, not the task. The
# complementary `await_holding_lock = "deny"` at workspace level catches
# the dynamic version; this list catches the structural version.
#
# Pre-existing sites outside the actor path (tests, non-actor providers,
# and legacy `NodeMlsFactory`) carry `#[allow(clippy::disallowed_types)]`
# annotations with a pointer to the commit that deletes them. By the time
# the actor refactor completes (commit 12), the only remaining
# `std::sync::Mutex` uses are in code that is test-only.
#
# `tokio::sync::Mutex` is FORBIDDEN on read paths per ADR-049 §Decision 12,
# for the same lock-free-read-path invariant as the RwLock ban: a lock
# acquired on a hot read path costs cycles a lock-free atomic load does not.
# The ADR's empirical anchor (OpenSSL #30659) measured an rwlock *read*
# acquire at ~4× an atomic load; the Mutex ban applies that same invariant
# to Mutex — it is not a separate Mutex-specific ~4× measurement. Actor-owned
# per-context state is serialized by the command loop and needs no lock. The
# legitimate exceptions are the write serialization / bootstrap / join-gate
# `Mutex<()>` guards and the supervisor's `task_set` JoinSet holder; each
# such site carries an
# `#[allow(clippy::disallowed_types, reason = "ADR-049 §Decision 12 allow-list: …")]`
# annotation naming the specific reason. This is the sanctioned allow-list,
# NOT a weakening of the ban.
#
# `tokio::sync::RwLock` is banned here (ADR-049 §Decision 12 PR2). The legacy
# `ContextHandle.inner: Arc<RwLock<ContextInner>>` read-path lock has been
# eliminated (it is now a lock-free `Arc<ArcSwap<ContextState>>`; see
# `context::ContextHandle`, ADR-049 §Decision 12 / #2047), and
# `check-deleted-primitives.sh` bans the `RwLock<ContextInner>` shape from
# reappearing. The credential store's read-path `tokio::sync::RwLock` was
# migrated to `std::sync::RwLock` (#2044). With both blockers cleared,
# scp-runtime is free of `tokio::sync::RwLock`, so the blanket
# `disallowed-types` ban is now landed to keep it that way — same lock-free
# read-path invariant as the Mutex ban. Sanctioned exceptions (should any
# arise) carry an `#[allow(clippy::disallowed_types, reason = "…")]`.
disallowed-types = [
    { path = "std::sync::Mutex", reason = "Use tokio::sync::Mutex in runtime async code; actor-owned state needs no Mutex. See ADR-049." },
    { path = "tokio::sync::Mutex", reason = "ADR-049 §Decision 12: forbidden on read paths. Use ArcSwap+write_lock, OnceLock/AtomicU64/DashMap, or the actor-owned &mut PerContextState. Sanctioned exceptions carry an #[allow(clippy::disallowed_types, reason = \"ADR-049 §Decision 12 allow-list: …\")]." },
    { path = "tokio::sync::RwLock", reason = "ADR-049 §Decision 12: forbidden on read paths. Use ArcSwap+write_lock, OnceLock/AtomicU64/DashMap, or the actor-owned &mut PerContextState. Sanctioned exceptions carry an #[allow(clippy::disallowed_types, reason = \"ADR-049 §Decision 12 allow-list: …\")]." },
]
