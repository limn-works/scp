[package]
name = "scp-kel"
version = "0.1.0-beta.2"
description = "The SCP key-event log: the event codec, the identifier and routing derivations, chain validation, and key-state replay — wasm-safe, no async runtime, no I/O"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "identity", "key-event-log"]
categories = ["cryptography", "encoding"]

[dependencies]
# The key-state data model the snapshot encodes (09-security-model.md §9.7.4.2).
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
# P-256 point validation and the §9.5 strict (low-s) verifier every indexed
# signature is checked with (09-security-model.md §9.7.4.2, "Signature form").
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
# Every construction here is a SHA-256 over a domain-separated preimage.
sha2 = { workspace = true }
# The operating-system random source `CustodyProbe::fresh` draws its nonce from
# (09-security-model.md §9.7.4.1 item 5, step d). scp-crypto already depends on
# rand_core 0.6 with `getrandom` and selects getrandom's wasm32 JS backend, so
# this edge adds no crate to the graph.
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
thiserror = { workspace = true }

[features]
# `CustodyProbe::new`, which takes the probe nonce from its caller, for
# known-answer tests against spec 25 §25.34. No shipped build enables it, so
# production code reaches only `CustodyProbe::fresh`
# (09-security-model.md §9.7.4.1 item 5, step d: "32 fresh random bytes").
testing = []

[dev-dependencies]
hex = { workspace = true }
# Round-trips encode and decode over generated preimages of all four kinds.
# Without the default `fork` and `timeout` features, which pull in process
# APIs that do not build for wasm32: the crate's tests compile for the browser
# target too (`17-persistence-and-storage.md` §17.8; SCP-311).
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# Compile-time proof that no Default, Deserialize or From impl builds a
# ValidatedChain or a ReplayedState (tests/kel/construction.rs).
serde = { workspace = true }
static_assertions = { workspace = true }

# proptest draws its seed through getrandom 0.3, which builds for wasm32 only
# with the `wasm_js` feature; the root .cargo/config.toml selects that backend.
# Test-only: the library itself draws no randomness.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true
