[package]
name = "scp-did"
version = "0.1.0-beta.2"
description = "The DID data model for SCP (Shared Context Protocol) — wasm-safe identity types"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "identity", "did"]
categories = ["cryptography", "data-structures"]

[features]
default = []
# Enables the non-standard did:key:{hex} DID format for integration tests that
# run outside `#[cfg(test)]`. Production builds must never enable this feature.
testing = []

[dependencies]
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
z-base-32 = { workspace = true }
# The RFC 4648 base32 of the identifier text form (03-identity.md §3.1).
data-encoding = { workspace = true }
thiserror = { workspace = true }
# Refuses a relying-party identifier that is a public suffix, and a suffix
# match that reaches into an origin's public suffix (custody_offer.rs).
psl = { workspace = true }
# DidDocument logs each service entry it drops while deserializing (§18.2.1).
tracing = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
# Checks the absent-bridgeTarget sentinel against SHA-256(0x00) (§3.10.13).
sha2 = { workspace = true }
rmp-serde = { workspace = true }

[lints]
workspace = true
