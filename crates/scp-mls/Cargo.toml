[package]
name = "scp-mls"
version = "0.1.0-beta.2"
description = "Synchronous MLS state machine for SCP — wasm32-safe, shared by the native runtime and in-browser clients (ADR-057)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true

[features]
default = []
# Enables non-production DID formats (did:key:, did:test:) in ScpCredential
# construction, mirroring scp-protocol/testing. Used by the broad test suite.
testing = ["scp-protocol/testing", "scp-did/testing"]

[dependencies]
# scp-mls depends ONLY on the wasm-safe capability crates plus the openmls
# stack. It MUST NOT depend on scp-runtime (tokio/actor orchestration) or
# scp-identity (tokio-coupled custody/DHT) — the ADR-057 mechanical fence that
# keeps the crate compilable to wasm32-unknown-unknown. credential.rs imports
# the DID model (DID, DidDocument, …) from scp-did directly rather than via
# scp-identity.
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-protocol = { path = "../scp-protocol", version = "=0.1.0-beta.2" }
# Wasm-safe leaf: the single §9.10.4.A pseudonym-derivation source (ADR-057
# Option A). `derive_pseudonym` derives this member's per-context pseudonym over
# the wasm-held MLS SignatureKeyPair via this crate — no forked HMAC/HKDF recipe.
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
# The Ed25519 seed extracted from the MLS SignatureKeyPair is reconstructed into
# a `SigningKey` to feed `scp_crypto::pseudonym::derive_pseudonym_keypair`.
ed25519-dalek = { workspace = true }

# `js` is declared in the wasm32 section below, not here. openmls refuses to compile for
# wasm32 without it (`compile_error!` at openmls-0.8.1/src/lib.rs:148) and on every other
# target it adds `fluvio-wasm-timer`, which openmls imports only under
# `#[cfg(target_arch = "wasm32")]`, plus that crate's `parking_lot` 0.11 and `instant`.
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_memory_storage = { workspace = true }
tls_codec = "0.4"

serde = { workspace = true }
rmp-serde = { workspace = true }
# SHA-256 for the §9.5.1 canonical signing hash of the KeyPackage attestation
# (keypackage_attestation.rs). Workspace-pinned 0.10, wasm32-safe (the same dep
# scp-protocol uses on the wasm path).
sha2 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# wasm32 backends: mirror scp-protocol/Cargo.toml. The root .cargo/config.toml already
# sets getrandom_backend="wasm_js" globally for the wasm32 target, so no per-crate config
# is needed. See ADR-057 Prerequisite 1.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# openmls reads the current time for a KeyPackage Lifetime through fluvio-wasm-timer on
# wasm32 and through std::time elsewhere, and its `js` feature is what supplies that crate
# plus a getrandom 0.3 wasm_js backend. openmls's lib.rs raises `compile_error!` when a
# wasm32 build leaves the feature off, so this target section is where it belongs.
openmls = { workspace = true, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
scp-did = { path = "../scp-did", features = ["testing"] }
scp-protocol = { path = "../scp-protocol", features = ["testing"] }
openmls_basic_credential = { workspace = true, features = ["test-utils"] }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true }
bs58 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
proptest = "1"

[lints]
workspace = true
