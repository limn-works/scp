[package]
name = "scp-mcp"
version = "0.1.0-beta.2"
description = "MCP (Model Context Protocol) adapter for SCP — JSON-RPC 2.0 types and context namespace mapping"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mcp", "model", "context", "protocol", "json-rpc"]
categories = ["network-programming", "web-programming"]

[dependencies]
scp-core = { path = "../scp-core", version = "=0.1.0-beta.2" }
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
axum = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
# Test-only: building `ContextEvent` fixtures needs the `DID` type. The
# production surface of this crate carries DIDs as strings, so this stays a
# dev-dependency.
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }

[lints]
workspace = true
