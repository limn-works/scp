[package]
name = "scp-client"
version = "0.1.0-beta.2"
description = "Single-threaded SCP participant driver over scp-mls — wasm32-safe, keys on-device (ADR-057 Slice 2)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true

[features]
default = []
# Enables non-production DID formats (did:key:, did:test:) in credential
# construction, mirroring scp-mls/scp-protocol `testing`. Used by the
# integration tests.
testing = [
    "scp-mls/testing",
    "scp-protocol/testing",
    "scp-did/testing",
]

[dependencies]
# The `Signer` trait signs the §9.7.1 `KeyPackage` attestation, so the Ed25519
# type is part of this crate's public surface rather than a test-only detail.
# `LocalSigner::active_for_testing` generates such a key, which is why the
# random source sits here too rather than under dev-dependencies.
ed25519-dalek = { workspace = true }
rand = { workspace = true }
# scp-client depends ONLY on the wasm-safe shared crates plus the openmls
# stack. It MUST NOT depend on scp-runtime (tokio/actor orchestration) or
# scp-identity (tokio-coupled custody/DHT) — the ADR-057 mechanical fence that
# keeps the participant driver compilable to wasm32-unknown-unknown. All
# protocol logic is called through scp-mls / scp-protocol / scp-event-log; this
# crate re-derives nothing.
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-protocol = { path = "../scp-protocol", version = "=0.1.0-beta.2" }
scp-event-log = { path = "../scp-event-log", version = "=0.1.0-beta.2" }
scp-mls = { path = "../scp-mls", version = "=0.1.0-beta.2" }
# Wasm-safe leaves (ADR-057 transport slice). scp-crypto: the shared §9.10.4.A
# pseudonym derivation (consumed transitively via scp-mls::derive_pseudonym, and
# directly in the cross-target KAT). scp-relay-client: the shared relay wire
# types (ClientMessage / RelayMessage) the injected JsSocket carries — NO tokio,
# NO scp-runtime, so the wasm fence holds.
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
scp-relay-client = { path = "../scp-relay-client", version = "=0.1.0-beta.2" }

# openmls is needed directly for the wire (de)serialization of KeyPackages and
# MLS messages at the driver boundary (KeyPackageIn::tls_deserialize and
# friends); scp-mls exposes its op surface in terms of these openmls types.
openmls = { workspace = true, features = ["libcrux-provider", "js"] }
tls_codec = "0.4"

# MessagePack is the codebase's name-tagged, width-/endianness-independent wire
# form (ADR-057, §17.5). The driver serializes each context's participant
# snapshot with it for out-of-band persistence through the `Storage` trait, so a
# native and a wasm32 build round-trip byte-compatibly.
serde = { workspace = true }
rmp-serde = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }

# wasm32 backends: mirror scp-mls/Cargo.toml so the driver compiles to wasm32.
# The root .cargo/config.toml already sets getrandom_backend="wasm_js"
# globally for the wasm32 target. See ADR-057 Prerequisite 1.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# getrandom 0.4 arrives transitively via the openmls libcrux provider and needs
# its own wasm_js backend enabled (openmls's `js` feature only wires 0.3).
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }


[dev-dependencies]
scp-did = { path = "../scp-did", features = ["testing"] }
scp-protocol = { path = "../scp-protocol", features = ["testing"] }
scp-mls = { path = "../scp-mls", features = ["testing"] }
# The single-sourced faithful in-memory relay mock (the fidelity anchor for the
# transport-slice integration tests). Dev-only: it ships nothing, so the ADR-057
# wasm fence's shipped-dependency graph is unaffected (absent from `cargo tree
# --edges normal`).
scp-relay-mock = { path = "../scp-relay-mock" }


[lints]
workspace = true
