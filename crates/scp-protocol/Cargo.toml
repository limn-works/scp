[package]
name = "scp-protocol"
version = "0.1.0-beta.1"
description = "Pure sync protocol types and logic for SCP"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
scp-primitives = { path = "../scp-primitives", version = "=0.1.0-beta.1" }
scp-event-log = { path = "../scp-event-log", version = "=0.1.0-beta.1" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
unicode-normalization = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
metrics = { workspace = true }
lru = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
rmp-serde = { workspace = true }
proptest = "1"
# dev-only: some #[cfg(test)] blocks use async test infrastructure
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
scp-primitives = { path = "../scp-primitives" }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-event-log = { path = "../scp-event-log", features = ["testing"] }

[lints]
workspace = true
