[package]
name = "scp-protocol"
version = "0.1.0-beta.2"
description = "Pure sync protocol types and logic for SCP"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-event-log = { path = "../scp-event-log", version = "=0.1.0-beta.2" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
unicode-normalization = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
metrics = { workspace = true }

[features]
default = []
# Makes InMemoryNonceTracker public for cross-crate test use.
# Forwards to scp-did/testing and scp-event-log/testing for did:key: support.
testing = ["scp-did/testing", "scp-event-log/testing"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
serde_json = { workspace = true }
rmp-serde = { workspace = true }
proptest = "1"
scp-did = { path = "../scp-did", features = ["testing"] }
scp-event-log = { path = "../scp-event-log", features = ["testing"] }
# RFC 9180 reference implementation — used ONLY as a cross-validation oracle
# for the hand-implemented `crypto::hpke` core. Already present in Cargo.lock
# via openmls; dev-deps never ship in production or wasm32 builds. MPL-2.0
# (allowed in deny.toml). Gated #[cfg(not(target_arch = "wasm32"))] in the
# oracle test so `cargo check --target wasm32` is unaffected.
hpke-rs = "0.6"
hpke-rs-rust-crypto = "0.6"

[lints]
workspace = true
