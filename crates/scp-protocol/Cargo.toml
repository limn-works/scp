[package]
name = "scp-protocol"
version = "0.1.0-beta.1"
description = "Pure sync protocol types and logic for SCP"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
scp-primitives = { path = "../scp-primitives", version = "=0.1.0-beta.1" }
scp-event-log = { path = "../scp-event-log", version = "=0.1.0-beta.1" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
aes = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
unicode-normalization = { workspace = true }
jsonschema = { version = "0.28", default-features = false }
metrics = { workspace = true }
lru = { workspace = true }
z-base-32 = { workspace = true }

[features]
default = []
# Makes InMemoryNonceTracker public for cross-crate test use.
testing = []
# Enables test modules that reference scp-runtime async types (mint, store,
# create_inner_envelope). These tests cannot compile in scp-protocol alone
# because scp-runtime is not a dependency. They run only when compiled
# through scp-core's unified namespace.
_runtime_tests = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
serde_json = { workspace = true }
rmp-serde = { workspace = true }
proptest = "1"
# dev-only: some #[cfg(test)] blocks use async test infrastructure
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
scp-primitives = { path = "../scp-primitives" }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-event-log = { path = "../scp-event-log", features = ["testing"] }

[lints]
workspace = true
