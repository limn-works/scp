[package]
name = "scp-runtime-economy"
version = "0.1.0-beta.2"
description = "The economy domain of the SCP runtime: paid-action authorization, capture and payment receipts"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
keywords = ["protocol", "context", "governance", "encryption"]
categories = ["cryptography", "network-programming"]

[features]
# Turns on `scp-runtime-core/testing` and compiles this crate's `testing_access`
# module, which other runtime crates' tests call. Only test builds enable it.
testing = ["scp-runtime-core/testing", "scp-runtime-types/testing"]

[dependencies]
scp-runtime-types = { workspace = true }
scp-runtime-core = { workspace = true }
tokio = { workspace = true }
scp-did = { workspace = true }
scp-protocol = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
scp-protocol = { workspace = true, features = ["testing"] }

[lints]
workspace = true
