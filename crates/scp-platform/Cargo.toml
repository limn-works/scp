[package]
name = "scp-platform"
version = "0.1.0-beta.2"
description = "Platform abstraction traits for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "platform", "abstraction", "storage"]
categories = ["os", "cryptography"]

[features]
software_platform = [
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:rand",
    "dep:hmac",
    "dep:sha2",
    "dep:scp-crypto",
    "dep:uuid",
]
# Durability-only in-memory Storage adapter (`InMemoryStorage`, spec §17.6 /
# §17.17.2). A durability-only affordance (`SCP-CAPSEL-8010`): it loses state
# on restart but nullifies no security property, so it is shippable and
# selected explicitly via `StorageConfig` — never a default/fallback
# (`SCP-CAPSEL-8011`). Pulls no extra deps (uses std + the always-on tokio).
# Deliberately independent of `testing`: a build may compile the durable dev
# affordance WITHOUT the test-only nullifier doubles. See ADR-062 §0.
in-memory-storage = []
# Durability-only in-memory Push adapter (`InMemoryPush`). Same classification
# as `in-memory-storage`; mints synthetic UUID push tokens, so it pulls
# `dep:uuid`. See ADR-062 §0.
in-memory-push = ["dep:uuid"]
# Test-only nullifier platform doubles (`InMemoryKeyCustody`,
# `InMemoryDeviceAttestation`, `InMemoryPreRotationCustody`) — security
# nullifiers (`SCP-CAPSEL-8012`) gated separately from `software_platform` so
# crates needing crypto primitives (Ed25519, X25519) can enable
# `software_platform` without pulling in the insecure in-memory key storage.
# Also implies the durability-only in-memory adapters so test/dev builds get
# the full historical `testing::*` surface via `in_memory::*`. See GitHub
# issue #88 and ADR-062 §0.
testing = ["software_platform", "in-memory-storage", "in-memory-push"]
# Apple storage adapter with SQLCipher encryption (spec section 17.6).
# Same engine as `sqlite` but encryption key provided by caller (Apple Keychain).
apple = ["dep:rusqlite", "dep:hex", "dep:fs2"]
# SQLite storage adapter with SQLCipher encryption (spec section 17.6).
# `argon2` + `rand` back the passphrase key-derivation mode (§17.6) and its
# per-database salt generation; the shared `kdf` module is the single source
# of the Argon2id parameterization. `fs2` provides advisory file locking for
# the per-database salt sidecar (fail-closed on lock contention).
sqlite = ["dep:rusqlite", "dep:hex", "dep:argon2", "dep:rand", "dep:fs2"]
# Encrypted file-backed key custody (Argon2id + AES-256-GCM).
# Universal fallback for non-HSM platforms. See GitHub issue #391.
file = ["software_platform", "dep:aes-gcm", "dep:argon2"]
# Filesystem storage adapter (spec section 17.6).
filesystem = []
# EncryptingAdapter — wraps any Storage backend with AES-256-GCM per-value
# encryption, satisfying the sealed EncryptedStorage bound. See issue #695.
encrypting = ["dep:aes-gcm", "dep:rand"]
# SyncableStorage wrapper for P2P state synchronization (SCP-PERSIST-064).
# Adds mutation tracking via a write-ahead changelog stored in the inner storage.
sync = []

[dependencies]
serde = { workspace = true }
tokio.workspace = true
# `CustodySubstrate` — the trait through which a running custody backend reports
# the two facts a DID document's published custody value states (extractability
# and unlock factor). Every custody backend in this crate implements it, so
# `ScpKeyCustodyAttestation::derive` reads a participant's published custody off
# the backend the participant runs instead of off a field a caller fills in.
# The edge runs `scp-platform` → `scp-did` and never the reverse: `scp-did` is
# wasm-safe and stays free of this crate's tokio dependency.
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
thiserror.workspace = true
tracing = { workspace = true }
zeroize = { workspace = true }

# Named-`MessagePack` envelope serialization for the shared `store_value` module
# (the canonical `StoredValue` on-disk format, spec §17.5). Unconditional because
# `store_value` is a core storage primitive every consumer of this crate needs,
# and the `SyncableStorage` changelog (`sync` feature) also serializes with it.
rmp-serde = { workspace = true }

# file dependencies, gated behind the `file` feature flag.
aes-gcm = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }

# software_platform dependencies, gated behind the `software_platform` feature flag.
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# Per-context pseudonym derivation (§9.10.4.A) lives in the wasm-safe `scp-crypto`
# leaf (ADR-057 Option A); every software-custody backend delegates to it. Its
# HKDF/HMAC/SHA-256 primitives are pulled transitively, so `scp-platform` no
# longer needs a direct `hkdf` dependency.
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2", optional = true }

# sqlite dependencies, gated behind the `sqlite` feature flag.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"], optional = true }
hex = { workspace = true, optional = true }
# fs2 provides advisory POSIX / Windows file locking — used by SqliteStorage
# to refuse a second process/instance trying to open the same database
# directory concurrently (SQLite journal/WAL corruption guard, red-hat
# RED-1002). Tiny dep (flock/LockFileEx wrappers).
fs2 = { version = "0.4", optional = true }

[dev-dependencies]
scp-testing = { path = "../scp-testing" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
