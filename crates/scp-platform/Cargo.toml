[package]
name = "scp-platform"
version = "0.1.0-beta.2"
description = "Platform abstraction traits for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "platform", "abstraction", "storage"]
categories = ["os", "cryptography"]

[features]
software_platform = [
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:rand",
    "dep:hmac",
    "dep:sha2",
    "dep:scp-crypto",
    "dep:uuid",
]
# Durability-only in-memory Storage adapter (`InMemoryStorage`, spec §17.6 /
# §17.17.2). A durability-only affordance (`SCP-CAPSEL-8010`): it loses state
# on restart but nullifies no security property, so it is shippable and
# selected explicitly via `StorageConfig` — never a default/fallback
# (`SCP-CAPSEL-8011`). Pulls no extra deps (uses std + the always-on tokio).
# Deliberately independent of `testing`: a build may compile the durable dev
# affordance WITHOUT the test-only nullifier doubles. See ADR-062 §0.
in-memory-storage = []
# Durability-only in-memory Push adapter (`InMemoryPush`). Same classification
# as `in-memory-storage`; mints synthetic UUID push tokens, so it pulls
# `dep:uuid`. See ADR-062 §0.
in-memory-push = ["dep:uuid"]
# Test-only nullifier platform doubles (`InMemoryKeyCustody`,
# `InMemoryDeviceAttestation`, `InMemoryPreRotationCustody`) — security
# nullifiers (`SCP-CAPSEL-8012`) gated separately from `software_platform` so
# crates needing crypto primitives (Ed25519, X25519) can enable
# `software_platform` without pulling in the insecure in-memory key storage.
# Also implies the durability-only in-memory adapters so test/dev builds get
# the full historical `testing::*` surface via `in_memory::*`. See GitHub
# issue #88 and ADR-062 §0.
testing = ["software_platform", "in-memory-storage", "in-memory-push"]
# Apple storage adapter with SQLCipher encryption (spec section 17.6).
# Same engine as `sqlite` but encryption key provided by caller (Apple Keychain).
apple = ["dep:rusqlite", "dep:scp-sqlite-pools", "dep:hex", "dep:fs2"]
# SQLite storage adapter with SQLCipher encryption (spec section 17.6).
# `argon2` + `rand` back the passphrase key-derivation mode (§17.6) and its
# per-database salt generation; the shared `kdf` module is the single source
# of the Argon2id parameterization. `fs2` provides advisory file locking for
# the per-database salt sidecar (fail-closed on lock contention).
# `dep:libsqlite3-sys` names, on a non-Apple target only, the package rusqlite
# already compiles, so that `vendored-openssl` below has an edge to set a
# feature on; it adds no package to the build.
sqlite = ["dep:rusqlite", "dep:scp-sqlite-pools", "dep:hex", "dep:argon2", "dep:rand", "dep:fs2", "dep:libsqlite3-sys"]
# On a non-Apple target, compile OpenSSL from source into SQLCipher instead of
# linking the build host's libcrypto (see the `rusqlite` comment in the workspace
# Cargo.toml for what each host supplies). On an Apple target this feature
# changes nothing: `libsqlite3-sys` below is declared for non-Apple targets only,
# so an Apple host building an Apple target leaves SQLCipher on CommonCrypto from
# the Security framework, which ships with the OS and takes its patches from OS
# updates, unless the build environment sets OPENSSL_DIR (or both OPENSSL_LIB_DIR
# and OPENSSL_INCLUDE_DIR), bare or prefixed with the target triple as in
# AARCH64_APPLE_DARWIN_OPENSSL_DIR. libsqlite3-sys 0.30.1 takes its CommonCrypto
# branch only when both host and target are Apple, so a non-Apple host building
# an Apple target links `crypto` as a Linux build does.
# The feature cannot name `rusqlite/bundled-sqlcipher-vendored-openssl`
# directly: a Cargo feature carries no target condition, and libsqlite3-sys 0.30.1's build script
# checks that feature before its Apple branch, so an Apple build would drop
# CommonCrypto for the OpenSSL that `Cargo.lock` pins.
#
# Exactly one shipped configuration selects this: the one
# `bindings/python/pyproject.toml` declares, whose `[tool.maturin] features` list
# names `vendored-openssl`, the `scp-ffi` feature that forwards to this one. The
# PyPI wheel and the PyPI sdist both build from that table, the sdist on the
# installing machine. A Linux or Windows wheel installs onto a machine whose
# OpenSSL this build never saw, and a `pip install` of it runs no linker.
#
# No other shipped artifact selects it. `openssl-sys/vendored` statically links
# the OpenSSL that `Cargo.lock` pins, so the crypto inside a binary that selects
# it changes only when someone bumps that lockfile. The `scp-relay` and
# `scp-node` binaries leave it off and link `libcrypto.so.3` dynamically, and
# `Dockerfile` installs `libssl3` in their runtime image for that reason. The
# napi addon and the uniffi library also compile SQLCipher and also leave this
# feature off. No decision states why any of these four leaves it off; this
# comment claims none.
#
# `libsqlite3-sys?/` rather than `libsqlite3-sys/`: this feature adds a build mode
# to a SQLCipher that `sqlite` already asked for, and never pulls SQLCipher into a
# build that did not enable `sqlite`.
vendored-openssl = ["libsqlite3-sys?/bundled-sqlcipher-vendored-openssl"]
# Encrypted file-backed key custody (Argon2id + AES-256-GCM).
# Universal fallback for non-HSM platforms. See GitHub issue #391.
file = ["software_platform", "dep:aes-gcm", "dep:argon2"]
# Filesystem storage adapter (spec section 17.6).
filesystem = []
# EncryptingAdapter — wraps any Storage backend with AES-256-GCM per-value
# encryption, satisfying the sealed EncryptedStorage bound. See issue #695.
encrypting = ["dep:aes-gcm", "dep:rand"]
# SyncableStorage wrapper for P2P state synchronization (SCP-PERSIST-064).
# Adds mutation tracking via a write-ahead changelog stored in the inner storage.
sync = []

[dependencies]
serde = { workspace = true }
tokio.workspace = true
thiserror.workspace = true
tracing = { workspace = true }
zeroize = { workspace = true }

# Named-`MessagePack` envelope serialization for the shared `store_value` module
# (the canonical `StoredValue` on-disk format, spec §17.5). Unconditional because
# `store_value` is a core storage primitive every consumer of this crate needs,
# and the `SyncableStorage` changelog (`sync` feature) also serializes with it.
rmp-serde = { workspace = true }

# file dependencies, gated behind the `file` feature flag.
aes-gcm = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }

# software_platform dependencies, gated behind the `software_platform` feature flag.
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# Per-context pseudonym derivation (§9.10.4.A) lives in the wasm-safe `scp-crypto`
# leaf (ADR-057 Option A); every software-custody backend delegates to it. Its
# HKDF/HMAC/SHA-256 primitives are pulled transitively, so `scp-platform` no
# longer needs a direct `hkdf` dependency.
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2", optional = true }

# sqlite dependencies, gated behind the `sqlite` feature flag.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"], optional = true }
# Opens this crate's SQLCipher connections with SQLite's lookaside pool and page-cache
# bulk block off (spec section 17.6).
scp-sqlite-pools = { path = "../scp-sqlite-pools", version = "=0.1.0-beta.2", optional = true }
hex = { workspace = true, optional = true }
# fs2 provides advisory POSIX / Windows file locking — used by SqliteStorage
# to refuse a second process/instance trying to open the same database
# directory concurrently (SQLite journal/WAL corruption guard, red-hat
# RED-1002). Tiny dep (flock/LockFileEx wrappers).
fs2 = { version = "0.4", optional = true }

# The package rusqlite 0.32 compiles SQLCipher in, named directly so that the
# `vendored-openssl` feature can set its `bundled-sqlcipher-vendored-openssl`
# feature. Declared for non-Apple targets only, which confines that feature to
# them: resolver 2 activates no feature of a dependency declared for a target the
# build does not compile for. The version requirement matches rusqlite 0.32.1's,
# so Cargo resolves it to the same package.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { version = "0.30.1", optional = true }

[dev-dependencies]
scp-testing = { path = "../scp-testing" }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
