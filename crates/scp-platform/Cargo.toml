[package]
name = "scp-platform"
version = "0.1.0"
description = "Platform abstraction traits for SCP (Shareable Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
software_platform = [
    "dep:ed25519-dalek",
    "dep:x25519-dalek",
    "dep:rand",
    "dep:hmac",
    "dep:sha2",
    "dep:uuid",
]
# In-memory platform adapters for testing and development (ADR-006).
# Separate from `software_platform` so that crates needing crypto primitives
# (Ed25519, X25519) can enable `software_platform` without pulling in the
# insecure in-memory implementations. See GitHub issue #88.
testing = ["software_platform"]

[dependencies]
serde = { workspace = true }
tokio.workspace = true
thiserror.workspace = true
zeroize = { workspace = true }

# software_platform dependencies, gated behind the `software_platform` feature flag.
ed25519-dalek = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
