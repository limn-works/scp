[package]
name = "scp-ffi-uniffi"
version = "0.1.0"
description = "UniFFI FFI bridge for SCP — generates Swift and Kotlin bindings from a single definition"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "scp_ffi_uniffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["server"]
# Enables the `"in_memory"` custody path in `identity_create`, which uses
# `InMemoryKeyCustody` from `scp-platform/testing`. This stores private key
# material in unprotected heap memory — suitable for testing, CLI, and desktop
# contexts but NOT for production mobile builds (iOS/Android). Mobile CI MUST
# NOT enable this feature. See GitHub issue #88 and ADR-006.
allow_in_memory_custody = ["scp-platform/testing"]
# Shared relay/node startup code. Pulls in scp-node and scp-platform/filesystem.
server = ["scp-ffi-common/server", "dep:scp-node"]

[dependencies]
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
scp-core = { path = "../../scp-core" }
scp-media = { path = "../../scp-media" }
scp-identity = { path = "../../scp-identity", features = ["production-dht"] }
scp-event-log = { path = "../../scp-event-log" }
scp-ffi-common = { path = "../common" }
scp-node = { path = "../../scp-node", features = ["allow_unencrypted_storage"], optional = true }
hex = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
# Only `software_platform` and `encrypting` are enabled by default —
# `software_platform` provides crypto primitives (Ed25519, X25519);
# `encrypting` provides `EncryptingAdapter` for event log persistence (#484).
# The `testing` feature is NOT enabled unconditionally because it exposes
# `InMemoryKeyCustody` in production mobile builds. Instead, the bridge uses
# a local `BridgeInMemoryStorage` for the event log backing store.
# The `allow_in_memory_custody` feature above adds `scp-platform/testing`
# for dev/test/desktop builds only.
scp-platform = { path = "../../scp-platform", features = ["software_platform", "encrypting", "filesystem"] }
scp-mcp = { path = "../../scp-mcp" }
scp-transport = { path = "../../scp-transport" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
z-base-32 = { workspace = true }

[dev-dependencies]
# Tests need InMemoryKeyCustody — enable the `testing` feature for dev-deps.
scp-platform = { path = "../../scp-platform", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }

[[test]]
name = "e2e_bridge"
path = "tests/e2e_bridge.rs"
required-features = ["allow_in_memory_custody"]

[build-dependencies]
uniffi = { version = "0.29", features = ["build", "tokio"] }

[lints]
workspace = true
