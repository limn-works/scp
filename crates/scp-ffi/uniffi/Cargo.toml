[package]
name = "scp-ffi-uniffi"
version = "0.1.0"
description = "UniFFI FFI bridge for SCP — generates Swift and Kotlin bindings from a single definition"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "scp_ffi_uniffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["server"]
# Shared relay/node startup code. Pulls in scp-node.
server = ["scp-ffi-common/server", "dep:scp-node"]
# Single test-harness feature (ADR-062 §Decision 6): folds in every in-memory
# nullifier double. `scp-platform/testing` compiles `InMemoryKeyCustody`/
# `InMemoryDeviceAttestation`/`InMemoryPreRotationCustody` (the §17.17.2 security
# nullifiers, formerly behind the deleted custody switch) and
# enables the `"in_memory"` custody path in `identity_create`; `scp-dht/testing`
# makes the `InMemoryDhtClient` resolve nullifier nameable; `scp-ffi-common/testing`
# makes the shared `FfiDhtClient::InMemory` arm nameable; `scp-core/testing`
# (→ `scp-runtime/testing`) makes test-only actor affordances (e.g.
# `Supervisor::test_insert_member`) available. MUST NOT be enabled in production
# mobile builds (iOS/Android) — G1 proves `scp-platform/testing`/`scp-dht/testing`
# never reach a shipped artifact. `cargo test -p scp-ffi-uniffi --features testing`.
testing = [
    "scp-core/testing",
    "scp-dht/testing",
    "scp-ffi-common/testing",
    "scp-platform/testing",
]
# §5.4.5 streaming-outlet live-flow test seam (SCP-OUT-037, C8b). Enables
# `Supervisor::test_grant_member_capability` — an AUTHORITY-ESCALATION primitive
# deliberately NOT folded into `testing` (which leaks into every bridge test
# build and would compile the custody-escape-hatch into a released Swift/Kotlin
# SDK). Mirrors scp-ffi / scp-ffi-napi's
# `outlet-capability-test-grant`; enabled ONLY by the outlet-stream live-poll
# test, and the seam has ZERO FFI/SDK exports.
outlet-capability-test-grant = ["scp-core/outlet-capability-test-grant"]

[dependencies]
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
scp-core = { path = "../../scp-core" }
scp-media = { path = "../../scp-media" }
scp-clock = { path = "../../scp-clock" }
scp-did = { path = "../../scp-did" }
scp-identity = { path = "../../scp-identity", features = ["production-dht"] }
scp-dht = { path = "../../scp-dht", features = ["production-dht"] }
scp-event-log = { path = "../../scp-event-log" }
scp-ffi-common = { path = "../common", features = ["custody"] }
# Default features only. Both node front doors in `scp_ffi_common::server` reach
# a production `Node::start`, whose sealed `EncryptedStorage` bound this
# bridge's two storage handles satisfy, so this edge adds nothing on top.
# `scripts/check-shipped-feature-graph.sh` rejects any feature added here that
# its allowlist omits (ADR-062 §Decision 6).
scp-node = { path = "../../scp-node", optional = true }
hex = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
# Only `software_platform` and `encrypting` are enabled by default —
# `software_platform` provides crypto primitives (Ed25519, X25519);
# `encrypting` provides `EncryptingAdapter` for event log persistence (#484).
# The `testing` feature is NOT enabled unconditionally because it exposes
# the `InMemoryKeyCustody` nullifier in production mobile builds. Instead, the
# event-log backing store uses the durability-only
# `scp_platform::in_memory::InMemoryStorage` adapter (ADR-062 §0), pulled via
# `scp-ffi-common`'s `scp-platform/in-memory-storage` edge and wrapped by
# `EncryptingAdapter` in `build_event_log_provider` (#1447 / #484). The
# `testing` crate-feature above adds `scp-platform/testing` for
# dev/test/desktop builds only (ADR-062 §Decision 6).
# `file` compiles `FileKeyCustody`, the encrypted key store §3.2.2 of the
# identity spec names `encrypted_file`. It is a durability-only feature — the
# store derives an AES-256 key from a passphrase with Argon2id and encrypts each
# key entry under AES-256-GCM — and the allowlist of
# `scripts/check-shipped-feature-graph.sh` already carries it (ADR-062
# §Decision 6).
scp-platform = { path = "../../scp-platform", features = ["software_platform", "file", "encrypting", "sqlite"] }
scp-mcp = { path = "../../scp-mcp" }
scp-transport = { path = "../../scp-transport" }
ed25519-dalek = { workspace = true }
tls_codec = "0.4"
base64 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
z-base-32 = { workspace = true }

[dev-dependencies]
# Tests need InMemoryKeyCustody — enable the `testing` feature for dev-deps.
scp-platform = { path = "../../scp-platform", features = ["testing"] }
# Test seams (`install_seedable_resolver`) construct
# `FfiDhtClient::InMemory(..)`, whose arm is gated behind
# `scp-ffi-common/testing`; enable it for this crate's test build. The normal
# dep (below) carries `custody`; the test build unifies to `custody` + `testing`.
scp-ffi-common = { path = "../common", features = ["testing", "custody"] }
# Tests / test seams construct `FfiDhtClient::InMemory(InMemoryDhtClient::new())`,
# which is gated behind `scp-dht/testing`; activate it for this crate's test
# build (ADR-062 §Decision 1). `scp-dht/testing` never appears in a non-testing
# feature list.
scp-dht = { path = "../../scp-dht", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = "3"
# #1694: AST-based scan for the `check_ready_coverage` enforcement test.
# `full` enables statements + items; `visit` provides the `Visit` trait used
# to walk the bridge source without substring matching (PR #1690 retro).
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[[test]]
name = "e2e_bridge"
path = "tests/e2e_bridge.rs"
required-features = ["testing"]

# SCP-OUT-039 (§5.4.5) — replays the 7 outlet-streaming conformance vectors
# through the UniFFI bridge's public pure-wrapper exports. Needs
# `testing` for `Scp::new_in_memory_for_test`.
[[test]]
name = "outlet_stream_vectors_real"
path = "tests/outlet_stream_vectors_real.rs"
required-features = ["testing"]

[build-dependencies]
uniffi = { version = "0.29", features = ["build", "tokio"] }

[lints]
workspace = true
