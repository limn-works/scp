[package]
name = "scp-ffi-uniffi"
version = "0.1.0"
description = "UniFFI FFI bridge for SCP — generates Swift and Kotlin bindings from a single definition"
edition.workspace = true
repository.workspace = true

[lib]
name = "scp_ffi_uniffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
uniffi = { version = "0.29", features = ["tokio"] }
tokio = { workspace = true }
thiserror = { workspace = true }
scp-core = { path = "../../scp-core" }
scp-platform = { path = "../../scp-platform", features = ["testing"] }
scp-transport = { path = "../../scp-transport" }
serde_json = { workspace = true }

[build-dependencies]
uniffi = { version = "0.29", features = ["build", "tokio"] }

[lints]
workspace = true
