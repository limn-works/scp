[package]
name = "scp-ffi-uniffi"
version = "0.1.0"
description = "UniFFI FFI bridge for SCP — generates Swift and Kotlin bindings from a single definition"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "scp_ffi_uniffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
default = ["server"]
# Enables the `"in_memory"` custody path in `identity_create`, which uses
# `InMemoryKeyCustody` from `scp-platform/testing`. This stores private key
# material in unprotected heap memory — suitable for testing, CLI, and desktop
# contexts but NOT for production mobile builds (iOS/Android). Mobile CI MUST
# NOT enable this feature. See GitHub issue #88 and ADR-006.
# `scp-core/testing` (→ `scp-runtime/testing`) mirrors the NAPI bridge, where
# `allow_in_memory_custody` pulls `dep:scp-testing` → `scp-core/testing`. It
# makes test-only actor affordances (e.g. `Supervisor::test_insert_member`,
# used by the member-but-unhosted axis-a saga test) available whenever this
# feature is on, so per-test `#[cfg(feature = "allow_in_memory_custody")]`
# gating compiles AND runs under the documented per-crate test invocation
# (`cargo test -p scp-ffi-uniffi --features allow_in_memory_custody`).
allow_in_memory_custody = ["scp-platform/testing", "scp-core/testing"]
# Shared relay/node startup code. Pulls in scp-node and scp-platform/filesystem.
server = ["scp-ffi-common/server", "dep:scp-node"]
# Testing-only affordances (see scp-ffi/Cargo.toml for rationale). MUST NOT
# be enabled in production mobile builds; the parity harness (ADR-046)
# enables it.
testing = ["scp-core/testing"]

[dependencies]
uniffi = { version = "0.29", features = ["tokio", "cli"] }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
scp-core = { path = "../../scp-core" }
scp-media = { path = "../../scp-media" }
scp-clock = { path = "../../scp-clock" }
scp-did = { path = "../../scp-did" }
scp-identity = { path = "../../scp-identity", features = ["production-dht"] }
scp-event-log = { path = "../../scp-event-log" }
scp-ffi-common = { path = "../common", features = ["custody"] }
scp-node = { path = "../../scp-node", features = ["allow_unencrypted_storage"], optional = true }
hex = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
# Only `software_platform` and `encrypting` are enabled by default —
# `software_platform` provides crypto primitives (Ed25519, X25519);
# `encrypting` provides `EncryptingAdapter` for event log persistence (#484).
# The `testing` feature is NOT enabled unconditionally because it exposes
# `InMemoryKeyCustody` in production mobile builds. Instead, the bridge uses
# `scp-ffi-common::bridge_runtime::BridgeInMemoryStorage` for the event log
# backing store (#1447). The `allow_in_memory_custody` feature above adds
# `scp-platform/testing` for dev/test/desktop builds only.
scp-platform = { path = "../../scp-platform", features = ["software_platform", "encrypting", "filesystem", "sqlite"] }
scp-mcp = { path = "../../scp-mcp" }
scp-transport = { path = "../../scp-transport" }
ed25519-dalek = { workspace = true }
tls_codec = "0.4"
base64 = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
z-base-32 = { workspace = true }

[dev-dependencies]
# Tests need InMemoryKeyCustody — enable the `testing` feature for dev-deps.
scp-platform = { path = "../../scp-platform", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = "3"
# #1694: AST-based scan for the `check_ready_coverage` enforcement test.
# `full` enables statements + items; `visit` provides the `Visit` trait used
# to walk the bridge source without substring matching (PR #1690 retro).
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[[test]]
name = "e2e_bridge"
path = "tests/e2e_bridge.rs"
required-features = ["allow_in_memory_custody"]

[build-dependencies]
uniffi = { version = "0.29", features = ["build", "tokio"] }

[lints]
workspace = true
