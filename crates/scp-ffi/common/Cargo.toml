[package]
name = "scp-ffi-common"
version = "0.1.0"
description = "Shared bridge adapter types for SCP FFI bridges (PyO3, napi-rs, UniFFI)"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
# Enables the did:key:{hex} DID format in BridgeDidResolver. This is a
# non-standard test convenience — production builds must resolve via did:dht:z.
testing = []

[dependencies]
scp-core = { path = "../../scp-core" }
scp-identity = { path = "../../scp-identity" }
hex = { workspace = true }
z-base-32 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
scp-platform = { path = "../../scp-platform", features = ["testing"] }

[lints]
workspace = true
