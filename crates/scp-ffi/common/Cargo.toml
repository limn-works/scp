[package]
name = "scp-ffi-common"
version = "0.1.0"
description = "Shared bridge adapter types for SCP FFI bridges (PyO3, napi-rs, UniFFI)"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["resolvers"]
# Full resolver implementations (BridgeDidResolver, IdentityBackedDidResolver, etc.).
# Requires scp-core, scp-identity, tokio, scp-mcp.
resolvers = ["dep:scp-core", "dep:scp-identity", "dep:scp-event-log", "dep:scp-transport", "dep:scp-platform", "dep:scp-mcp", "dep:tokio", "dep:tokio-util", "dep:async-trait", "dep:thiserror", "dep:tracing", "dep:rand", "dep:ed25519-dalek"]
# Enables the did:key:{hex} DID format in BridgeDidResolver. This is a
# non-standard test convenience — production builds must resolve via did:dht:z.
# BridgeDidResolver delegates decoding to `scp_did::extract_public_key_from_did`,
# whose did:key:{hex} branch is itself gated behind `scp-did/testing`; forward
# the flag so the single shared parser still accepts did:key in test builds.
# `scp-node?/testing` forwards testing to scp-node ONLY when it is already
# activated (via the `server` feature): `server.rs`'s auto-generate node path
# generates an identity, and scp-node gates identity generation on its own
# `testing` feature (production creation fails closed with SCP-IDENT-1059 until
# a real pre-rotation custody backend lands, ADR-062 §Decision 4). The `?` keeps
# testing usable without `server`. Never in a default/non-testing list
# (ADR-062 §Decision 1).
# `scp-platform?/testing` compiles `InMemoryKeyCustody`, which the same
# auto-generate path names directly. scp-node's `testing` also pulls it, but the
# edge is stated here because THIS crate's source references the type.
# `scp-core?/testing` makes the testing-gated `FfiCredentialStore::InMemory`
# arm (which names `scp_core::bridge::credentials::InMemoryCredentialStore`,
# itself `#[cfg(any(test, feature = "testing"))]`) self-consistent whenever this
# crate's own `testing` is enabled (ADR-062 §Decision 5, SCP-CAPINJECT-009).
testing = [
    "resolvers",
    "scp-core?/testing",
    "scp-did/testing",
    "scp-dht/testing",
    "scp-node?/testing",
    "scp-platform?/testing",
    "scp-identity?/testing",
]
# Shared callback-custody byte/string parsing helpers (custody_parse module).
# Requires only scp-platform for the typed return values (KeyHandle,
# PseudonymKeypair, PublicKey, PlatformError). Deliberately NOT folded into
# `resolvers`: these are pure byte/string ops far lighter than the resolver
# stack.
custody = ["dep:scp-platform"]
# Shared relay/node startup code for FFI bridges that need to spawn servers.
# Requires scp-transport (relay), scp-node (application node), scp-platform, and
# tokio. Storage uses the durability-only in-memory-storage feature of
# scp-platform (ADR-062 Slice 0), wrapped in `scp-platform/encrypting`'s
# `EncryptingAdapter` so both node front doors satisfy `Node::start`'s sealed
# `EncryptedStorage` bound. This feature does NOT enable
# scp-platform's `testing` feature: since ADR-062 Slice 6 (SCP-CAPINJECT-006)
# server.rs's `Explicit`-identity phantoms are typed to the production
# `FileKeyCustody` (not the `InMemoryKeyCustody` nullifier), and the dev-relay
# auto-generate path FAILS CLOSED (`ServerError::AutoGenerateUnavailable`) on a
# shipped build instead of running a nullifier-backed node. It does NOT enable
# scp-node's `allow_unencrypted_storage` either, so `Node::start_for_testing`
# and `ProtocolRepository::new_for_testing` are absent from the shipped graph.
# No test-harness platform edge is present, transitively or otherwise — G1
# proves it.
#
# `dep:scp-core` is listed because `server.rs` names `scp_core::context::supervisor::Supervisor`
# and `scp_core::crypto::sender_keys::BroadcastKey` in non-optional code. Without
# it, `cargo check -p scp-ffi-common --no-default-features --features server` —
# the exact configuration `scripts/check-shipped-feature-graph.sh` models — did
# not build. It adds no feature edge the gate did not already resolve, because
# all three bridges depend on scp-core unconditionally.
server = ["dep:scp-core", "dep:scp-transport", "dep:scp-node", "dep:scp-platform", "scp-platform/in-memory-storage", "scp-platform/filesystem", "scp-platform/file", "dep:scp-identity", "dep:tokio", "dep:tokio-util", "dep:tracing", "dep:thiserror"]

[dependencies]
scp-core = { path = "../../scp-core", optional = true }
scp-mcp = { path = "../../scp-mcp", optional = true }
scp-protocol = { path = "../../scp-protocol" }
scp-clock = { path = "../../scp-clock" }
scp-did = { path = "../../scp-did" }
scp-event-log = { path = "../../scp-event-log", optional = true }
scp-identity = { path = "../../scp-identity", optional = true }
# Non-optional: the shared `FfiDhtClient` (src/dht.rs) always ships the real
# Mainline `PkarrDhtClient`, so `production-dht` is unconditional here (ADR-062
# §Decision 1). `dep:scp-dht` was therefore removed from the `resolvers`/`server`
# feature lists — the crate is always present, never feature-gated optional.
scp-dht = { path = "../../scp-dht", features = ["production-dht"] }
scp-transport = { path = "../../scp-transport", features = ["redb-blob"], optional = true }
# NO `allow_unencrypted_storage`: `server.rs` builds every node through
# `Node::start`, whose sealed `EncryptedStorage` bound both startup functions
# satisfy with `EncryptingAdapter` (ADR-062 §Status — this edge was the last
# confidentiality-nullifier residue in the shipped bridge feature graph). The
# `testing` feature re-adds it via `scp-node?/testing`, which is where
# `Node::start_for_testing` legitimately lives.
scp-node = { path = "../../scp-node", optional = true }
scp-platform = { path = "../../scp-platform", features = ["encrypting", "sqlite", "in-memory-storage"], optional = true }
async-trait = { workspace = true, optional = true }
dashmap = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
# `rand_core` with `getrandom` is used by the always-on
# `generate_context_id` helper (spec §18.4.1). Compiles on every target
# the three FFI bridges (PyO3, UniFFI, napi-rs) support, plus the
# `wasm32-unknown-unknown` compile-target compat that `scp-protocol`
# requires (native uses the OS RNG; the wasm32 target pulls `getrandom/js`).
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
scp-event-log = { path = "../../scp-event-log" }
scp-identity = { path = "../../scp-identity" }
scp-platform = { path = "../../scp-platform", features = ["testing"] }
# The crate's own tests (resolvers.rs, dht_capability_injection.rs) construct
# `InMemoryDhtClient`; activate `scp-dht/testing` for this crate's test build.
scp-dht = { path = "../../scp-dht", features = ["testing"] }
# `test-util` enables tokio's paused-clock test harness (time::pause/advance,
# #[tokio::test(start_paused = true)]) — not pulled in by the optional runtime
# `tokio` dep's "full" features, which intentionally excludes it.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
# Test-only: deterministic X25519 keypair generation for the shared broadcast
# key seal/open round-trip tests (src/broadcast.rs). Production code never needs
# X25519 here — the protocol layer owns the HPKE seal/open.
x25519-dalek = { workspace = true }
# Test-only: z-base-32 encode/decode for the resolver unit tests (building
# did:dht:z fixtures + the non-canonical-padding regression). Production
# DID→key extraction is delegated to `scp_did::extract_public_key_from_did`,
# so no production code path in this crate touches z-base-32 directly.
z-base-32 = { workspace = true }

[lints]
workspace = true
