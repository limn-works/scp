[package]
name = "scp-ffi-wasm"
version = "0.1.0"
description = "wasm-bindgen FFI bridge for SCP — exposes scp-core to TypeScript/JavaScript (browser target)"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Enables the caller-supplied `testing_seed: Option<Vec<u8>>` parameter
# on `identity_create` AND the `signed_at_override: Option<u64>`
# parameter on `scpid_sign` for the cross-bridge parity harness
# (ADR-046). Production WASM bundles reject any non-`undefined` value
# for both.
#
# The spec §3.2.1 two-key model (#0 identity key + #active signing key)
# is independently always-on — the no-seed path still derives a distinct
# `#active` via `OsRng`, matching `DidDht::create` on the other bridges.
# Only the deterministic-seed ingress is gated here.
#
# Pulls in `rand` for `StdRng::from_seed` — not needed in production WASM.
testing = ["dep:rand"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Crypto",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "SubtleCrypto",
    "Window",
] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
ed25519-dalek = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
# Deterministic RNG (`StdRng::from_seed`) only needed for the seeded
# path of `identity_create`, which is testing-gated (see `testing`
# feature comment above). Optional to keep production WASM bundles lean.
rand = { workspace = true, optional = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
jsonschema = { workspace = true }
hex = { workspace = true }
serde_bytes = { workspace = true }
scp-protocol = { path = "../../scp-protocol", version = "=0.1.0-beta.2" }
scp-event-log = { path = "../../scp-event-log", version = "=0.1.0-beta.2" }
scp-ffi-common = { path = "../common", default-features = false }
zeroize = { workspace = true }
subtle = { workspace = true }
# MLS encryption — openmls with `js` feature for WASM crypto backend.
# NOT workspace (workspace uses `libcrux-provider` which is native-only).
openmls = { version = "0.8", default-features = false, features = ["js"] }
openmls_traits = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
tls_codec = { version = "0.4", features = ["derive"] }
rmp-serde = { workspace = true }
aes-gcm = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Host-only dev-dependency: cross-bridge JSON parity tests deserialize
# WASM-emitted rotation events via the canonical native types. Behind
# `cfg(not(target_arch = "wasm32"))` because scp-identity pulls tokio
# multi-thread, which doesn't compile to wasm32 (ADR-034). Only loaded
# when running `cargo test` on the host.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
scp-identity = { path = "../../scp-identity", version = "=0.1.0-beta.2" }
# Host-only: encoder-parity tests pin the WASM-local `zbase32_encode`
# helper against the canonical `z-base-32` crate the native bridges use.
z-base-32 = { workspace = true }
# Property-based testing for the zbase32 encoder-parity sweep
# (1024 random 32-byte inputs per run). Host-only.
proptest = "1"

[profile.release]
opt-level = "s"

[lints]
workspace = true
