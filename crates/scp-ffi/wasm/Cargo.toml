[package]
name = "scp-ffi-wasm"
version = "0.1.0"
description = "wasm-bindgen FFI bridge for SCP — exposes scp-core to TypeScript/JavaScript (browser target)"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Enables the did:key:{hex} DID format in resolve_public_key. This is a
# non-standard test convenience — production builds must resolve via did:dht:z.
testing = []

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Crypto", "SubtleCrypto"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
ed25519-dalek = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
jsonschema = { workspace = true }
hex = { workspace = true }
scp-ffi-common = { path = "../common", default-features = false }
zeroize = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"

[lints]
workspace = true
