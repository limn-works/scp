[package]
name = "scp-ffi"
version = "0.1.0"
description = "PyO3 FFI bridge for SCP — exposes scp-core to Python as the _scp_core extension module"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "_scp_core"
crate-type = ["cdylib", "rlib"]
# rlib allows cargo test to link against this crate. The cdylib is only
# used by maturin when building the Python extension module.

[features]
default = ["server"]
# extension-module suppresses Python symbol linking — required for cdylib
# but incompatible with test binaries. Maturin passes this explicitly.
# cargo test runs WITHOUT it, so auto-initialize can embed Python.
extension-module = ["pyo3/extension-module"]
# Gates the "in_memory" custody path in `parse_custody` via code-level
# `#[cfg(feature = "allow_in_memory_custody")]` guards. `InMemoryKeyCustody`
# stores private key material in unprotected heap memory. Note: the `testing`
# feature is always enabled in deps (needed for `InMemoryStorage`), so this
# feature is a pure code-level gate. See issue #394 and ADR-006.
allow_in_memory_custody = ["scp-platform/testing", "dep:scp-testing"]
# Shared relay/node startup code. Pulls in scp-node and scp-platform/filesystem.
server = ["scp-ffi-common/server", "dep:scp-node"]
# Enables testing-only affordances like `scpid_sign(signed_at_override=...)`
# used by the cross-bridge parity harness (ADR-046). MUST NOT be enabled in
# production bridge builds — the override lets callers pin `signed_at` to
# an arbitrary value within the challenge window, which is a parity-test
# construct, not a protocol feature.
testing = ["scp-core/testing"]

[dependencies]
async-trait = { workspace = true }
pyo3 = { version = "0.24.1", features = ["experimental-async"] }
tokio = { workspace = true }
scp-core = { path = "../scp-core" }
scp-identity = { path = "../scp-identity" }
scp-primitives = { path = "../scp-primitives" }
scp-event-log = { path = "../scp-event-log" }
scp-ffi-common = { path = "common" }
scp-node = { path = "../scp-node", features = ["allow_unencrypted_storage"], optional = true }
scp-mcp = { path = "../scp-mcp" }
scp-platform = { path = "../scp-platform", features = ["software_platform", "file", "testing", "encrypting", "filesystem", "sqlite"] }
scp-media = { path = "../scp-media" }
scp-testing = { path = "../scp-testing", optional = true }
scp-transport = { path = "../scp-transport" }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
z-base-32 = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
rmp-serde = { workspace = true }
tls_codec = "0.4"
zeroize = { workspace = true }

[dev-dependencies]
pyo3 = { version = "0.24.1", features = ["auto-initialize"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
scp-ffi-common = { path = "common", features = ["testing"] }
# Tests need InMemoryKeyCustody.
scp-platform = { path = "../scp-platform", features = ["testing"] }
tempfile = "3"

[[test]]
name = "e2e_bridge"
path = "tests/e2e_bridge.rs"
required-features = ["allow_in_memory_custody"]

[lints]
workspace = true
