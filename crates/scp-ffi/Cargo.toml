[package]
name = "scp-ffi"
version = "0.1.0"
description = "PyO3 FFI bridge for SCP — exposes scp-core to Python as the _scp_core extension module"
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "_scp_core"
crate-type = ["cdylib", "rlib"]
# rlib allows cargo test to link against this crate. The cdylib is only
# used by maturin when building the Python extension module.

[features]
# extension-module suppresses Python symbol linking — required for cdylib
# but incompatible with test binaries. Maturin passes this explicitly.
# cargo test runs WITHOUT it, so auto-initialize can embed Python.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["experimental-async"] }
tokio = { workspace = true }
scp-core = { path = "../scp-core" }
scp-mcp = { path = "../scp-mcp" }
scp-platform = { path = "../scp-platform", features = ["software_platform"] }
scp-transport = { path = "../scp-transport" }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
dashmap = { workspace = true }
z-base-32 = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
