[package]
name = "scp-ffi"
version = "0.1.0"
description = "PyO3 FFI bridge for SCP — exposes scp-core to Python as the _scp_core extension module"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "_scp_core"
crate-type = ["cdylib", "rlib"]
# rlib allows cargo test to link against this crate. The cdylib is only
# used by maturin when building the Python extension module.

[features]
default = ["server"]
# extension-module suppresses Python symbol linking — required for cdylib
# but incompatible with test binaries. Maturin passes this explicitly.
# cargo test runs WITHOUT it, so auto-initialize can embed Python.
extension-module = ["pyo3/extension-module"]
# Shared relay/node startup code. Pulls in scp-node.
server = ["scp-ffi-common/server", "dep:scp-node"]
# Enables testing-only affordances like `scpid_sign(signed_at_override=...)`
# used by the cross-bridge parity harness (ADR-046). MUST NOT be enabled in
# production bridge builds — the override lets callers pin `signed_at` to
# an arbitrary value within the challenge window, which is a parity-test
# construct, not a protocol feature.
# Single test-harness feature (ADR-062 §Decision 6): folds in every in-memory
# nullifier double the bridge test seams construct. `scp-platform/testing`
# compiles `InMemoryKeyCustody`/`InMemoryDeviceAttestation`/
# `InMemoryPreRotationCustody` (the §17.17.2 security nullifiers, formerly behind
# the deleted custody switch); `scp-dht/testing` compiles the
# `InMemoryDhtClient` §17.17.3 nullifier; `scp-ffi-common/testing` exposes the
# `FfiDhtClient::InMemory` arm; `dep:scp-testing` pulls the full-stack E2E
# harness. Forwarded here (never in `default`/`server`) so every testing-gated
# seam compiles from this feature alone, without relying on dev-dependency
# feature unification. INVARIANT: `scp-platform/testing` and `scp-dht/testing`
# appear ONLY inside a `testing = [...]` list (ADR-062 §Decision 1/6) — the G1
# shipped-feature-graph gate proves they never reach a shipped artifact.
testing = [
    "scp-core/testing",
    "scp-dht/testing",
    "scp-ffi-common/testing",
    "scp-platform/testing",
    "dep:scp-testing",
]
# Forwards the non-leaking capability-escalation test seam feature so the
# outlet-stream live-flow e2e test can authorize a member invoker. Deliberately
# NOT implied by `testing` (see scp-runtime/Cargo.toml) so the
# capability-escalation seam is never compiled into a test-harness bridge build.
outlet-capability-test-grant = ["scp-core/outlet-capability-test-grant"]

[dependencies]
async-trait = { workspace = true }
pyo3 = { version = "0.24.1", features = ["experimental-async", "multiple-pymethods"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
scp-core = { path = "../scp-core" }
scp-identity = { path = "../scp-identity" }
# The real Mainline DHT backend (PkarrDhtClient) is compiled unconditionally —
# it is the single shipped backend (ADR-062 §Decision 1). `production-dht` is
# NOT test-gated: it must be present in the shipped graph.
scp-dht = { path = "../scp-dht", features = ["production-dht"] }
scp-clock = { path = "../scp-clock" }
scp-did = { path = "../scp-did" }
scp-event-log = { path = "../scp-event-log" }
scp-ffi-common = { path = "common", features = ["custody"] }
scp-node = { path = "../scp-node", features = ["allow_unencrypted_storage"], optional = true }
scp-mcp = { path = "../scp-mcp" }
# Production dep line: durability-only `in-memory-storage` (the shippable
# `{"type":"in_memory"}` storage affordance, SCP-CAPSEL-8011) — NEVER `testing`
# (that would ship the in-memory custody/attestation/pre-rotation nullifiers).
# The `testing` crate-feature adds `scp-platform/testing` on top for test builds.
scp-platform = { path = "../scp-platform", features = ["software_platform", "file", "in-memory-storage", "encrypting", "sqlite"] }
scp-media = { path = "../scp-media" }
scp-testing = { path = "../scp-testing", optional = true }
scp-transport = { path = "../scp-transport" }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
z-base-32 = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
rmp-serde = { workspace = true }
tls_codec = "0.4"
zeroize = { workspace = true }

[dev-dependencies]
pyo3 = { version = "0.24.1", features = ["auto-initialize", "multiple-pymethods"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
scp-ffi-common = { path = "common", features = ["testing", "custody"] }
# Tests need InMemoryKeyCustody.
scp-platform = { path = "../scp-platform", features = ["testing"] }
# Tests construct `InMemoryDhtClient` directly (the §17.17.3 DHT nullifier) via
# the `FfiDhtClient::InMemory` test seam. `features = ["testing"]` (no
# slash-string in a feature list) is fine per the ADR-062 §Decision 1 invariant.
scp-dht = { path = "../scp-dht", features = ["testing"] }
tempfile = "3"

[[test]]
name = "e2e_bridge"
path = "tests/e2e_bridge.rs"
# Needs `testing` for the in-memory custody/storage test
# harness (`new_in_memory_for_test`, `scp-platform/testing`).
required-features = ["testing"]

[[test]]
# SCP-OUT-039 (C12) — outlet-streaming conformance vectors replayed through the
# real PyO3 bridge exports. The pure tests (schema + receiver-gap tracker) need
# only the in-memory harness; the live-bridge tests additionally gate on
# `testing` + `outlet-capability-test-grant` (see the `live` module).
name = "outlet_stream_vectors_real"
path = "tests/outlet_stream_vectors_real.rs"
required-features = ["testing"]

[lints]
workspace = true
