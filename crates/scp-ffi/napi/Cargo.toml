[package]
name = "scp-ffi-napi"
version = "0.1.0"
description = "napi-rs FFI bridge for SCP — exposes scp-core to Node.js/Bun via native addon"
edition.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "tokio_rt", "async", "error_anyhow"] }
napi-derive = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
z-base-32 = { workspace = true }
hex = { workspace = true }
scp-core = { path = "../../scp-core" }
scp-identity = { path = "../../scp-identity" }
scp-event-log = { path = "../../scp-event-log" }
scp-ffi-common = { path = "../common" }
scp-platform = { path = "../../scp-platform", features = ["testing"] }
scp-transport = { path = "../../scp-transport" }

[dev-dependencies]
scp-ffi-common = { path = "../common", features = ["testing"] }

[build-dependencies]
napi-build = "2"
cc = "1"

[lints]
workspace = true
