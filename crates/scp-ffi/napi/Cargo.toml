[package]
name = "scp-ffi-napi"
version = "0.1.0"
description = "napi-rs FFI bridge for SCP — exposes scp-core to Node.js/Bun via native addon"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["server"]
allow_in_memory_custody = ["scp-platform/testing", "dep:scp-testing"]
# Shared relay/node startup code. Pulls in scp-node and scp-platform/filesystem.
server = ["scp-ffi-common/server", "dep:scp-node"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "tokio_rt", "async", "error_anyhow"] }
napi-derive = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
z-base-32 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
ed25519-dalek = { workspace = true }
tls_codec = "0.4"
scp-core = { path = "../../scp-core" }
scp-media = { path = "../../scp-media" }
scp-primitives = { path = "../../scp-primitives" }
scp-identity = { path = "../../scp-identity" }
scp-event-log = { path = "../../scp-event-log" }
scp-ffi-common = { path = "../common" }
scp-node = { path = "../../scp-node", features = ["allow_unencrypted_storage"], optional = true }
scp-platform = { path = "../../scp-platform", features = ["encrypting", "filesystem", "sqlite"] }
scp-mcp = { path = "../../scp-mcp" }
scp-testing = { path = "../../scp-testing", optional = true }
scp-transport = { path = "../../scp-transport" }
futures = "0.3"
tokio-util = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
scp-ffi-common = { path = "../common", features = ["testing"] }
tempfile = "3"

[build-dependencies]
napi-build = "2"
cc = "1"

[lints]
workspace = true
