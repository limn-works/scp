[package]
name = "scp-ffi-napi"
version = "0.1.0"
description = "napi-rs FFI bridge for SCP — exposes scp-core to Node.js/Bun via native addon"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["server"]
allow_in_memory_custody = ["scp-platform/testing", "dep:scp-testing"]
# Shared relay/node startup code. Pulls in scp-node and scp-platform/filesystem.
server = ["scp-ffi-common/server", "dep:scp-node"]
# Testing-only affordances (see scp-ffi/Cargo.toml for rationale). MUST NOT
# be enabled in production builds; the parity harness (ADR-046) enables it.
# `scp-dht/testing` makes the `InMemoryDhtClient` resolve nullifier nameable
# (ADR-062 §Decision 1); `scp-ffi-common/testing` makes the shared
# `FfiDhtClient::InMemory` arm nameable so the test/parity DHT seam
# (`build_shared_dht_client`) compiles without `--tests` (dev-deps absent).
# Both `/testing` flags appear ONLY in this `testing` list — never in
# default/server/other lists.
testing = ["scp-core/testing", "scp-dht/testing", "scp-ffi-common/testing"]
# §5.4.5 live-stream outlet test authorization seam
# (`Supervisor::test_grant_member_capability`). An AUTHORITY-ESCALATION
# primitive, so it is a DEDICATED leaf feature — deliberately NOT implied by
# `testing` (which leaks into every `allow_in_memory_custody` build) — mirroring
# scp-ffi's `outlet-capability-test-grant`. Enabled ONLY by the outlet-stream
# live-flow test lane. See scp-runtime/Cargo.toml and SCP-OUT-037 (C8a).
outlet-capability-test-grant = ["scp-core/outlet-capability-test-grant"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9", "tokio_rt", "async", "error_anyhow"] }
napi-derive = "3"
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing = { workspace = true }
base64 = { workspace = true }
dashmap = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
z-base-32 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
ed25519-dalek = { workspace = true }
tls_codec = "0.4"
scp-core = { path = "../../scp-core" }
scp-media = { path = "../../scp-media" }
scp-clock = { path = "../../scp-clock" }
scp-did = { path = "../../scp-did" }
scp-identity = { path = "../../scp-identity" }
# `production-dht` compiles the real Mainline `PkarrDhtClient` — the single
# shipped DHT backend the bridge fails closed onto (ADR-062 §Decision 1). The
# in-memory nullifier is NOT enabled here (only under the `testing` feature).
scp-dht = { path = "../../scp-dht", features = ["production-dht"] }
scp-event-log = { path = "../../scp-event-log" }
scp-ffi-common = { path = "../common", features = ["custody"] }
scp-node = { path = "../../scp-node", features = ["allow_unencrypted_storage"], optional = true }
# `testing` is enabled unconditionally (matching the PyO3 bridge) so the
# identity registry, retained-custody state, and the cold-storage
# `InMemoryPreRotationCustody` are available in production builds. These types
# back the production callback-custody path (`identityCreateWithCustody`) —
# `allow_in_memory_custody` remains a pure code-level gate over the in-memory
# custody *backend* only, not over the registry/retention machinery. See ADR-006.
scp-platform = { path = "../../scp-platform", features = ["testing", "encrypting", "filesystem", "sqlite"] }
scp-mcp = { path = "../../scp-mcp" }
scp-testing = { path = "../../scp-testing", optional = true }
scp-transport = { path = "../../scp-transport" }
futures = "0.3"
tokio-util = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
scp-ffi-common = { path = "../common", features = ["testing", "custody"] }
# This bridge constructs `InMemoryDhtClient` in its own tests (identity.rs,
# scp.rs) which is gated behind `scp-dht/testing`; activate it for this crate's
# test build (ADR-062 §Decision 1). `scp-dht/testing` never appears in a
# non-testing feature list.
scp-dht = { path = "../../scp-dht", features = ["testing"] }
tempfile = "3"
# Provides weak C stubs for napi runtime symbols so the test binary
# can link without a Node.js runtime. Kept as a dev-dependency so
# the cdylib build NEVER sees these stubs (if they leaked into the
# cdylib, they would shadow Node's real napi_* functions at static
# link time and every #[napi] registration would silently no-op).
scp-ffi-napi-test-stubs = { path = "../napi-test-stubs" }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
