[package]
name = "scp-identity"
version = "0.1.0-beta.2"
description = "Decentralized identity (DID) management for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["did", "identity", "decentralized", "dht"]
categories = ["authentication", "cryptography"]

[dependencies]
scp-primitives = { path = "../scp-primitives", version = "=0.1.0-beta.2" }
# DID-document, attestation, and multibase-decode types moved here (ADR-057
# Slice 1a) so they compile to wasm32 for the in-browser client; scp-identity
# re-exports them. scp-protocol is pure-sync and acyclic (it does not depend
# on scp-identity).
scp-protocol = { path = "../scp-protocol", version = "=0.1.0-beta.2" }
# `testing` is enabled non-optionally because the standalone identity
# construction front-end (`config.rs`, ADR-052 Phase B-P3e) mints an
# `InMemoryPreRotationCustody` on its production `Identity::create` path —
# the only `PreRotationCustody` backend that exists today. This mirrors
# `scp-node`, which enables `scp-platform/testing` non-optionally for the
# identical reason on its production `Node::start` path.
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.2", features = ["testing"] }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
z-base-32 = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
mainline = { version = "6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[features]
default = []
production-dht = ["dep:mainline", "dep:reqwest"]
testing = ["scp-platform/testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `encrypting` provides `EncryptingAdapter`, the `EncryptedStorage` test backend
# used by the persisted-`Identity::create` round-trip test in `config.rs`.
scp-platform = { path = "../scp-platform", features = ["testing", "encrypting"] }
ed25519-dalek = { workspace = true }

[lints]
workspace = true
