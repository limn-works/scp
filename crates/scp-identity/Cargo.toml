[package]
name = "scp-identity"
version = "0.1.0-beta.2"
description = "Decentralized identity (DID) management for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["did", "identity", "decentralized", "dht"]
categories = ["authentication", "cryptography"]

[dependencies]
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-dht = { path = "../scp-dht", version = "=0.1.0-beta.2" }
# `testing` is enabled non-optionally because the standalone identity
# construction front-end (`config.rs`, ADR-052 Phase B-P3e) mints an
# `InMemoryPreRotationCustody` on its production `Identity::create` path —
# the only `PreRotationCustody` backend that exists today. This mirrors
# `scp-node`, which enables `scp-platform/testing` non-optionally for the
# identical reason on its production `Node::start` path.
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.2", features = ["testing"] }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
z-base-32 = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

[features]
default = []
production-dht = ["scp-dht/production-dht"]
# Carries `scp-dht/testing` so downstream crates enabling `scp-identity/testing`
# get the in-memory DHT arm (`DidDht::with_in_memory_custody`, the SCP-006 test
# constructors). `scp-dht/testing` MUST appear only here / in dev-dependencies —
# never a default/non-testing list (ADR-062 §Decision 1).
testing = ["scp-platform/testing", "scp-dht/testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `encrypting` provides `EncryptingAdapter`, the `EncryptedStorage` test backend
# used by the persisted-`Identity::create` round-trip test in `config.rs`.
scp-platform = { path = "../scp-platform", features = ["testing", "encrypting"] }
# The dht.rs `#[cfg(test)]` module constructs `InMemoryDhtClient` (now gated
# behind `scp-dht/testing`); this dev-dep activates that feature for this
# crate's own test build (per-crate `cargo test -p scp-identity`).
scp-dht = { path = "../scp-dht", features = ["testing"] }
ed25519-dalek = { workspace = true }

[lints]
workspace = true
