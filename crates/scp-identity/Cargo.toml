[package]
name = "scp-identity"
version = "0.1.0-beta.2"
description = "Decentralized identity (DID) management for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["did", "identity", "decentralized", "dht"]
categories = ["authentication", "cryptography"]

[dependencies]
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-dht = { path = "../scp-dht", version = "=0.1.0-beta.2" }
# The key-event-log model (`kel/`): `IdentityError::IllegalKeyEvent` carries
# scp-kel's `CheckStep` (`03-identity.md` §3.10.10). Acyclic: scp-kel depends
# only on scp-did and scp-crypto.
scp-kel = { path = "../scp-kel", version = "=0.1.0-beta.2" }
# The DID-record relay frame (`DidRecordV1`, §9.10.12) lives in the wasm-safe
# `scp-protocol` leaf. Acyclic: `scp-protocol` depends only on `scp-did` /
# `scp-event-log`, neither of which depends on `scp-identity`.
scp-protocol = { path = "../scp-protocol", version = "=0.1.0-beta.2" }
# Crypto primitives ONLY (ADR-062 §Decision 6), plus the file custody the
# `KeyCustodySlot::EncryptedFile` arm names (`file`, `kel/slot.rs`). `testing`
# is not enabled here: no shipped path in this crate mints an in-memory custody,
# and the `testing` crate feature (below) adds it for the test harness only.
# `Identity::create` refuses with SCP-IDENT-1100 or 1121 before any key where
# the next-set custody's method is not admitted on the config's profile
# (`kel/create.rs`).
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.2", features = ["software_platform", "file"] }
tokio = { workspace = true }
serde = { workspace = true }
# The push signature verifier seam (`push_verify.rs`, PUSH-005): an async trait
# object the relay holds as `Arc<dyn PushSignatureVerifier>` (ADR-062), so it
# uses `async_trait` rather than RPITIT, which is not dyn-safe.
async-trait = { workspace = true }
# `PushVerifyError::wire_code` returns the ADR-004 push codes this wasm-safe leaf
# declares. Acyclic: scp-relay-client depends only on scp-protocol.
scp-relay-client = { path = "../scp-relay-client", version = "=0.1.0-beta.2" }
# The `testing`-gated push test verifier checks a real P-256 signature through
# `scp_crypto::p256::verify_prehash_strict` (§9.5.1 low-s rule included).
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
z-base-32 = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

[features]
default = []
production-dht = ["scp-dht/production-dht"]
# Carries `scp-dht/testing` so downstream crates enabling `scp-identity/testing`
# get the in-memory DHT arm (`DidDht::with_in_memory_custody`, the SCP-006 test
# constructors). `scp-dht/testing` MUST appear only here / in dev-dependencies —
# never a default/non-testing list (ADR-062 §Decision 1).
testing = ["scp-platform/testing", "scp-dht/testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
# `encrypting` and `sqlite` provide `EncryptingAdapter<SqliteStorage>`, the
# store the `kel/create.rs` tests reopen to read a device record a second
# writer wrote; `testing` provides the in-memory custodies those tests record.
scp-platform = { path = "../scp-platform", features = ["testing", "encrypting", "sqlite"] }
# The dht.rs `#[cfg(test)]` module constructs `InMemoryDhtClient` (now gated
# behind `scp-dht/testing`); this dev-dep activates that feature for this
# crate's own test build (per-crate `cargo test -p scp-identity`).
scp-dht = { path = "../scp-dht", features = ["testing"] }
ed25519-dalek = { workspace = true }
# Captures `tracing` output so the §3.10.6 layer-disabled MUST can be asserted
# mechanically (the warning is unconditional, so no callback observes it).
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true
