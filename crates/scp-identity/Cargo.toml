[package]
name = "scp-identity"
version = "0.1.0-beta.1"
description = "Decentralized identity (DID) management for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["did", "identity", "decentralized", "dht"]
categories = ["authentication", "cryptography"]

[dependencies]
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.1" }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
z-base-32 = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
mainline = { version = "6", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[features]
default = []
production-dht = ["dep:mainline", "dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
scp-platform = { path = "../scp-platform", features = ["testing"] }
ed25519-dalek = { workspace = true }

[lints]
workspace = true
