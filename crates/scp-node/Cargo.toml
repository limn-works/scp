[package]
name = "scp-node"
version = "0.1.0-beta.2"
description = "Application node composing relay, identity, and HTTP server for SCP"
edition.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"
homepage.workspace = true
readme = "README.md"
keywords = ["node", "server", "relay", "identity"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "scp-node"
path = "src/main.rs"

[dependencies]
scp-core = { path = "../scp-core", version = "=0.1.0-beta.2" }
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-identity = { path = "../scp-identity", version = "=0.1.0-beta.2", features = ["production-dht"] }
scp-dht = { path = "../scp-dht", version = "=0.1.0-beta.2", features = ["production-dht"] }
scp-transport = { path = "../scp-transport", version = "=0.1.0-beta.2", features = [
    "sqlite-blob",
    "redb-blob",
    "postgres-blob",
    "s3-blob",
    "startup",
] }
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.2", features = ["testing", "sqlite", "file", "encrypting"] }
arc-swap = { workspace = true }
axum = { workspace = true, features = ["ws"] }
ed25519-dalek = { workspace = true }
instant-acme = "0.8"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# default-features disabled to avoid quinn's `platform-verifier` feature, which
# pulls in `aws-lc-rs` and conflicts with the rest of scp-node's ring-backed
# rustls (a dual provider makes rustls' process-default ambiguous). We only need
# the tokio runtime and the ring-backed rustls integration.
quinn = { version = "0.11", optional = true, default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-pemfile = "2"
base64 = { workspace = true }
bs58 = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-util = { workspace = true }
tokio-tungstenite = { version = "0.24" }
tower-http = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
tower-service = "0.3"
futures = "0.3"
hex = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
url = "2"
x509-parser = "0.16"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
scp-core = { path = "../scp-core", features = ["allow_unencrypted_storage"] }
scp-platform = { path = "../scp-platform", features = ["testing"] }
# The node's tests (config.rs, lib.rs, self_host.rs) and `ApplicationNode::dev`
# construct `InMemoryDhtClient` (now gated behind `scp-dht/testing`); activate it
# for this crate's own test build. `production-dht` still comes from the normal
# [dependencies] edge, so `build_production_did_method` keeps its Pkarr client.
scp-dht = { path = "../scp-dht", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
rcgen = "0.14"
tempfile = "3"

[features]
# Gates `Node::start_for_testing` — accepts any `Storage`
# backend without the `EncryptedStorage` bound. See issue #695.
allow_unencrypted_storage = ["scp-core/allow_unencrypted_storage"]
# Test-harness-only. Carries `scp-dht/testing` so `ApplicationNode::dev`,
# `DhtMode::Memory`, and `build_memory_did_method` (all in-memory-DHT test
# doubles) compile; implies `allow_unencrypted_storage` because
# `ApplicationNode::dev` builds through `Node::start_for_testing`. MUST NOT
# appear in any default/non-testing feature list (ADR-062 §Decision 1); a
# shipped node build never enables it, so the in-memory DHT nullifier is absent
# from shipped artifacts.
testing = ["scp-dht/testing", "scp-platform/testing", "allow_unencrypted_storage"]
quic = ["scp-transport/quic", "dep:quinn"]
http3 = ["scp-transport/http3"]
udp = ["scp-transport/udp"]
coap = ["scp-transport/coap"]
upnp = ["scp-transport/upnp"]

[lints]
workspace = true
