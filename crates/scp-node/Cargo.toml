[package]
name = "scp-node"
version = "0.1.0-beta.2"
description = "Application node composing relay, identity, and HTTP server for SCP"
edition.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"
homepage.workspace = true
readme = "README.md"
keywords = ["node", "server", "relay", "identity"]
categories = ["network-programming", "command-line-utilities"]

# The binary needs the `node-bin` feature: the Prometheus exporter, the startup
# utilities, and the redb blob backend link only into it (track A2 of the
# crate-split plan). `node-bin` is in `default`, so `cargo build -p scp-node`
# still emits the binary the Dockerfile copies.
[[bin]]
name = "scp-node"
path = "src/main.rs"
required-features = ["node-bin"]

# Both tests spawn the `scp-node` binary through `CARGO_BIN_EXE_scp-node`, which
# exists only when the binary builds.
[[test]]
name = "run_mode_selection"
path = "tests/run_mode_selection.rs"
required-features = ["node-bin"]

[[test]]
name = "storage_backend_selection"
path = "tests/storage_backend_selection.rs"
required-features = ["node-bin"]

[dependencies]
# Links the wiping global allocator every shipped artifact installs
# (09-security-model.md §9.15, freed heap memory).
scp-alloc = { path = "../scp-alloc", version = "=0.1.0-beta.2" }
scp-core = { path = "../scp-core", version = "=0.1.0-beta.2" }
scp-clock = { path = "../scp-clock", version = "=0.1.0-beta.2" }
scp-crypto = { path = "../scp-crypto", version = "=0.1.0-beta.2" }
scp-did = { path = "../scp-did", version = "=0.1.0-beta.2" }
scp-identity = { path = "../scp-identity", version = "=0.1.0-beta.2", features = ["production-dht"] }
scp-dht = { path = "../scp-dht", version = "=0.1.0-beta.2", features = ["production-dht"] }
scp-transport = { path = "../scp-transport", version = "=0.1.0-beta.2", features = [
    # Ungated: `build_host_site_node` opens `BlobStorageBackend::sqlite` on the
    # path every `host_site()` consumer takes, and §17.17 requires a durable
    # blob backend on every shipped relay. `redb-blob` and `startup` come
    # from `node-bin`. `push-store` is ungated for the same reason: an enabled
    # `NodeConfig::push` carries the SQLite push registration store, the only
    # shipped arm (§17.17.5, PUSH-012). `webpush` is ungated because a domain
    # node publishes `.well-known/scp` and so may run the `WebPush` sender
    # (ADR-004 **VAPID key publication**, PUSH-023); `scp-relay` serves no such
    # document and does not enable it.
    "sqlite-blob",
    "push-store",
    "webpush",
] }
# Durability-only + real backends ONLY (ADR-062 §Decision 6). `testing` is NO
# LONGER enabled here: the production `Node::start` / first-start create path
# previously minted an `InMemoryPreRotationCustody` (a §17.17.2 security
# nullifier); with no real pre-rotation backend yet (RFC #2130 / #1729) it now
# FAILS CLOSED with a typed `IdentityError` (SCP-IDENT-1059). `software_platform`
# supplies crypto primitives; `in-memory-storage` is the durability-only dev
# storage affordance. `ApplicationNode::dev` / `start_for_testing` re-add
# `scp-platform/testing` via this crate's own `testing` feature only.
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.2", features = ["software_platform", "in-memory-storage", "sqlite", "file", "encrypting"] }
arc-swap = { workspace = true }
axum = { workspace = true, features = ["ws"] }
ed25519-dalek = { workspace = true }
# default-features disabled for the same reason the `quinn` note below gives. instant-acme's
# default feature set is `["aws-lc-rs", "hyper-rustls"]`, and its `aws-lc-rs` feature turns on
# `rcgen/aws_lc_rs` and `hyper-rustls/aws-lc-rs` as well as `dep:aws-lc-rs`, so a crate that
# every other TLS dependency here pins to ring was pulling aws-lc-rs and its `aws-lc-sys` C
# build in through the ACME client. `ring` forwards to `rcgen/ring` and `hyper-rustls/ring`
# the same way and enables `dep:rcgen`, so the resolved dependency set is the one below
# minus aws-lc.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# default-features disabled to avoid quinn's `platform-verifier` feature, which
# pulls in `aws-lc-rs` and conflicts with the rest of scp-node's ring-backed
# rustls (a dual provider makes rustls' process-default ambiguous). We only need
# the tokio runtime and the ring-backed rustls integration.
quinn = { version = "0.11", optional = true, default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-pemfile = "2"
base64 = { workspace = true }
bs58 = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tokio-util = { workspace = true }
tokio-tungstenite = { version = "0.24" }
tower-http = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
tower-service = "0.3"
futures = "0.3"
hex = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
x509-parser = "0.16"
# Only `main.rs` installs the global recorder and serves `/metrics`; the
# library emits through `scp-runtime` and needs no exporter. Gated by `node-bin`.
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
# The cross-transport integration tests build relay wire messages directly; the
# types live in the wasm-safe scp-relay-client leaf (ADR-057 Slice 3, D5).
scp-relay-client = { path = "../scp-relay-client" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
scp-core = { path = "../scp-core", features = ["allow_unencrypted_storage"] }
# `filesystem` backs ADR-052 §AC-9 `EncryptedStorage` seal assertions:
# `FilesystemStorage` is a plaintext backend that `Node::start`'s
# `compile_fail,E0277` doctest proves cannot reach a production constructor, and
# whose `EncryptingAdapter`-wrapped form is a positive control in
# `tests/encrypted_storage_seal.rs`.
scp-platform = { path = "../scp-platform", features = ["testing", "filesystem"] }
# The node's tests (config.rs, lib.rs, self_host.rs) and `ApplicationNode::dev`
# construct `InMemoryDhtClient` (now gated behind `scp-dht/testing`); activate it
# for this crate's own test build. `production-dht` still comes from the normal
# [dependencies] edge, so `build_production_did_method` keeps its Pkarr client.
scp-dht = { path = "../scp-dht", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
rcgen = "0.14"
tempfile = "3"
# `FixedAnswers` and `OwnAddressLookup::fixed`, which let the node's tests make a
# relay host resolve only after TLS provisioning, without real DNS.
scp-transport = { path = "../scp-transport", features = ["testing"] }

[features]
# `default` holds only `node-bin`, so a shipped `scp-node` binary enables
# neither `allow_unencrypted_storage` nor `testing`, and
# `scripts/check-shipped-feature-graph.sh` rejects a resolved set that names
# either. A library consumer (the FFI bridges, `scp-testing`) sets
# `default-features = false` and links none of the `node-bin` dependencies.
default = ["node-bin"]
# What only the `scp-node` binary needs: the Prometheus recorder and exporter,
# the shared startup utilities (environment parsing, tracing, backend
# selection), and the redb blob backend an operator can select with
# `SCP_RELAY_STORAGE_BACKEND=redb`. `[[bin]]` requires it.
node-bin = [
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "scp-transport/startup",
    "scp-transport/redb-blob",
]
# Gates `Node::start_for_testing` — accepts any `Storage`
# backend without an `EncryptedStorage` bound. See issue #695.
allow_unencrypted_storage = ["scp-core/allow_unencrypted_storage"]
# Test-harness-only. Carries `scp-identity/testing` so the `--ephemeral` path
# can build `InMemorySequenceStore`, and `scp-dht/testing` so `ApplicationNode::dev`,
# `DhtMode::Memory`, and `build_memory_did_method` (all in-memory-DHT test
# doubles) compile. It implies `allow_unencrypted_storage` for this crate's
# integration-test crates — `tests/integration.rs`, `tests/quic_listener.rs`, and
# `tests/quic_cross_transport.rs` each call `Node::start_for_testing`, and an
# external test crate cannot see a `#[cfg(test)]` half of that gate.
# `ApplicationNode::dev` no longer needs that implication: it wraps its ephemeral
# store in `EncryptingAdapter` and builds through a production `Node::start`.
# MUST NOT appear in any default/non-testing feature list (ADR-062 §Decision 1);
# a shipped node build never enables it, so an in-memory DHT nullifier is absent
# from shipped artifacts.
testing = [
    "scp-dht/testing",
    "scp-identity/testing",
    "scp-platform/testing",
    "allow_unencrypted_storage",
]
# The PostgreSQL and S3 blob backends, off by default so a default build links
# neither the `sqlx` PostgreSQL client nor the AWS S3 client. In `--relay-only`
# and persistent full-node mode, a build that did not compile the selected
# backend rejects `SCP_RELAY_STORAGE_BACKEND=postgres` or `=s3` with an error
# naming this feature, and never opens another backend in its place. Cargo unifies
# scp-transport's features across one invocation, so `scp-relay`'s `cloud-blobs`
# in the same invocation also compiles both backends here. `--self-host` rejects
# both values in every build, and so does `--ephemeral` in the `testing` build
# that compiles it, each with an error naming the mode.
cloud-blobs = ["scp-transport/postgres-blob", "scp-transport/s3-blob"]
quic = ["scp-transport/quic", "dep:quinn"]
http3 = ["scp-transport/http3"]
udp = ["scp-transport/udp"]
coap = ["scp-transport/coap"]
upnp = ["scp-transport/upnp"]

[lints]
workspace = true
