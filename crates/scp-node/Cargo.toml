[package]
name = "scp-node"
version = "0.1.0"
description = "Application node composing relay, identity, and HTTP server for SCP"
edition.workspace = true
repository.workspace = true
license = "AGPL-3.0-only"

[[bin]]
name = "scp-node"
path = "src/main.rs"

[dependencies]
scp-core = { path = "../scp-core" }
scp-transport = { path = "../scp-transport" }
scp-platform = { path = "../scp-platform", features = ["testing"] }
axum = { workspace = true, features = ["ws"] }
instant-acme = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = { version = "0.24" }
futures = "0.3"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
x509-parser = "0.16"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
scp-platform = { path = "../scp-platform", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
rcgen = "0.14"

[lints]
workspace = true
