[package]
name = "scp-transport"
version = "0.1.0"
description = "Transport abstraction layer for SCP (Shareable Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
sqlite-blob = ["dep:rusqlite"]
redb-blob = ["dep:redb"]
local-cache = []
combined = ["dep:rusqlite", "dep:scp-platform", "dep:zeroize"]
relay-persistence = ["dep:scp-platform"]
postgres-blob = ["dep:sqlx"]
s3-blob = ["dep:aws-sdk-s3", "dep:aws-config"]

[dependencies]
scp-core = { path = "../scp-core" }
scp-identity = { path = "../scp-identity" }
scp-platform = { path = "../scp-platform", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
subtle = "2"
rusqlite = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"], optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }

[dev-dependencies]
scp-core = { path = "../scp-core" }
ed25519-dalek = { workspace = true }
scp-platform = { path = "../scp-platform" }
scp-testing = { path = "../scp-testing" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
rmpv = { version = "1", features = ["with-serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[[test]]
name = "combined_conformance"
path = "tests/combined_conformance.rs"
required-features = ["combined"]

[[test]]
name = "local_cache_conformance"
path = "tests/local_cache_conformance.rs"
required-features = ["local-cache"]

[lints]
workspace = true
