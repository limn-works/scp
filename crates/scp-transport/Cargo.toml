[package]
name = "scp-transport"
version = "0.1.0-beta.1"
description = "Transport abstraction layer for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["transport", "relay", "websocket", "adapter"]
categories = ["network-programming", "asynchronous"]

[features]
sqlite-blob = ["dep:rusqlite"]
redb-blob = ["dep:redb"]
local-cache = []
combined = ["dep:rusqlite", "dep:scp-platform"]
relay-persistence = ["dep:scp-platform"]
postgres-blob = ["dep:sqlx"]
s3-blob = ["dep:aws-sdk-s3", "dep:aws-config", "dep:http-body"]
quic = ["dep:quinn", "dep:rustls", "dep:rcgen"]
udp = ["dep:openssl", "dep:socket2"]
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn", "dep:rustls", "dep:http"]
webtransport-wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys", "dep:wasm-bindgen-futures", "dep:getrandom_02", "dep:getrandom_03"]
coap = ["dep:coap-lite", "dep:openssl"]
nostr = ["dep:base64", "dep:k256"]
webrtc = []
upnp = ["dep:igd-next", "dep:natpmp"]

[dependencies]
scp-core = { path = "../scp-core", version = "=0.1.0-beta.1" }
scp-identity = { path = "../scp-identity", version = "=0.1.0-beta.1" }
scp-platform = { path = "../scp-platform", version = "=0.1.0-beta.1", optional = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
subtle = "2"
rusqlite = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
zeroize = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"], optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
http-body = { version = "1", optional = true }
quinn = { version = "0.11", optional = true }
openssl = { version = "0.10", optional = true }
socket2 = { version = "0.5", optional = true, features = ["all"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", optional = true }
bytes = "1"
http = { version = "1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["WebTransport", "WebTransportOptions", "WebTransportBidirectionalStream", "WebTransportSendStream", "WebTransportReceiveStream", "ReadableStream", "WritableStream", "ReadableStreamDefaultReader", "WritableStreamDefaultWriter", "WebSocket", "MessageEvent", "BinaryType", "ErrorEvent", "CloseEvent"] }
wasm-bindgen-futures = { version = "0.4", optional = true }
getrandom_02 = { package = "getrandom", version = "0.2", optional = true, features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", optional = true, features = ["wasm_js"] }
coap-lite = { version = "0.13", optional = true }
base64 = { workspace = true, optional = true }
k256 = { version = "0.13", optional = true, features = ["schnorr"] }
igd-next = { version = "0.16", optional = true, features = ["aio_tokio"] }
natpmp = { version = "0.5", optional = true, features = ["tokio"] }

[dev-dependencies]
scp-core = { path = "../scp-core" }
ed25519-dalek = { workspace = true }
scp-platform = { path = "../scp-platform" }
scp-testing = { path = "../scp-testing" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
rmpv = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
rcgen = "0.13"
k256 = { version = "0.13", features = ["schnorr"] }
base64 = { workspace = true }

[[test]]
name = "combined_conformance"
path = "tests/combined_conformance.rs"
required-features = ["combined"]

[[test]]
name = "local_cache_conformance"
path = "tests/local_cache_conformance.rs"
required-features = ["local-cache"]

[[test]]
name = "nostr_roundtrip"
path = "tests/nostr_roundtrip.rs"
required-features = ["nostr"]

[[test]]
name = "webrtc_roundtrip"
path = "tests/webrtc_roundtrip.rs"
required-features = ["webrtc"]

[lints]
workspace = true
