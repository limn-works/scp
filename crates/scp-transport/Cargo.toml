[package]
name = "scp-transport"
version = "0.1.0"
description = "Transport abstraction layer for SCP (Shareable Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
sqlite-blob = ["dep:rusqlite"]
redb-blob = ["dep:redb"]

[dependencies]
scp-core = { path = "../scp-core" }
scp-identity = { path = "../scp-identity" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
lru = { workspace = true }
rand = { workspace = true }
subtle = "2"
rusqlite = { workspace = true, optional = true }
redb = { workspace = true, optional = true }

[features]
local-cache = []

[dev-dependencies]
scp-core = { path = "../scp-core" }
ed25519-dalek = { workspace = true }
scp-testing = { path = "../scp-testing" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
rmpv = { version = "1", features = ["with-serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
