[package]
name = "scp-crypto"
version = "0.1.0-beta.2"
description = "Low-level cryptographic anchor (Ed25519 verification, P-256 primitives) for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["protocol", "cryptography", "ed25519", "p256"]
categories = ["cryptography"]

[features]
# Test support only: `p256::sign_prehash_rfc6979_unnormalized`, the raw RFC 6979
# signature before low-s normalisation, for tests that pin a high-s input.
# Enabled only from dev-dependencies, so no shipped build resolves it.
testing = []

[dependencies]
ed25519-dalek = { workspace = true }
# Pseudonym derivation (§9.10.4.A): HKDF-SHA-256 pseudonym secret + HMAC-SHA-256
# per-context seed, and the §9.10.4 seed-to-scalar HKDF-Expand. Pure RustCrypto
# crates already in the wasm tree, so `scp-crypto` stays wasm-safe. These are the
# workspace's one hash-crate generation; their HMAC and HKDF state is not wiped,
# so wiping secret intermediates is best effort: scp-crypto wipes the buffers it
# owns (`Zeroizing`), not the crates' internal state or compiler-made copies.
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# P-256 primitives (§9.5, §9.10.4): signing, strict/lenient verification, ECDH,
# SEC1 point validation, and the FIPS 186-5 A.2.1 seed-to-scalar step.
p256 = { workspace = true }
# The RNG trait `P256SecretKey::random` takes. p256 0.14 re-exports rand_core 0.10,
# which `rand` 0.8 (`rand::rngs::OsRng`, the workspace RNG) does not implement, so
# the key draw names the 0.6 trait directly. The `getrandom` feature gives
# `rand_core::OsRng`, from which `webpush::seal` draws its ephemeral key and salt
# itself, so no caller supplies the source. rand 0.8 already enables the feature
# elsewhere in the graph, so it adds no crate.
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
thiserror = { workspace = true }
# WebPush message encryption (RFC 8291, `webpush`): AES-128-GCM over one RFC 8188
# record. The workspace already pins aes-gcm 0.10 and aes 0.8 for scp-protocol, so
# neither adds a crate to the graph. `aes/zeroize` wipes the AES round keys when the
# cipher drops. Nothing wipes the GHASH key: aes-gcm 0.10's `zeroize` feature wipes
# only the temporary copy it makes while building the cipher, and it enables no
# `zeroize` feature on `ghash` or `polyval`, so the key held in the `polyval` state
# stays in memory after the cipher drops. The cipher lives here because the record
# key derives from a P-256 ECDH that deny.toml confines to this crate.
aes-gcm = { workspace = true, features = ["zeroize"] }
aes = { workspace = true, features = ["zeroize"] }

# getrandom 0.2 fails to compile on wasm32-unknown-unknown without a backend.
# In a wasm32 build it arrives through rand_core 0.6's `getrandom` feature, which
# rand 0.8 and aes-gcm 0.10 (via crypto-common 0.1) enable elsewhere in the graph;
# ed25519-dalek 2 and this crate's rand_core leave that feature off. Select the JS
# backend here, as scp-protocol and scp-client do.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
rand = { workspace = true }
hex = { workspace = true }
proptest = "1"
serde_json = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
