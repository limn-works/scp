[package]
name = "scp-testing"
version = "0.1.0"
description = "Integration tests for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
ci-tier2 = []
ci-tier3 = ["ci-tier2"]
sqlite = ["scp-platform/sqlite"]
filesystem = ["scp-platform/filesystem"]
sync = ["scp-platform/sync"]
combined = ["scp-transport/combined"]

[dependencies]
async-trait = { workspace = true }
scp-core = { path = "../scp-core", features = ["allow_unencrypted_storage", "testing"] }
scp-identity = { path = "../scp-identity", features = ["testing"] }
scp-platform = { path = "../scp-platform", features = ["testing"] }
# NORMAL testing edge (not dev-dep): `helpers.rs` uses `InMemoryDhtClient` /
# `TestDidDht` at LIB level (this whole crate is a test harness), mirroring its
# existing normal `scp-platform/testing` edge. `scp-dht/testing` gates the
# in-memory DHT nullifier; it never appears in a non-testing feature list
# (ADR-062 §Decision 1).
scp-dht = { path = "../scp-dht", features = ["testing"] }
scp-clock = { path = "../scp-clock" }
scp-did = { path = "../scp-did" }
scp-node = { path = "../scp-node", features = ["allow_unencrypted_storage"] }
scp-transport = { path = "../scp-transport" }
scp-event-log = { path = "../scp-event-log" }
scp-protocol = { path = "../scp-protocol" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
openmls = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
futures = "0.3"
rmp-serde = { workspace = true }
tls_codec = "0.4"
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
scp-core = { path = "../scp-core", features = ["testing"] }
# The SDK-usability integration test builds relay wire messages directly; the
# types live in the wasm-safe scp-relay-client leaf (ADR-057 Slice 3, D5).
scp-relay-client = { path = "../scp-relay-client" }
# SCP-OUT-039 (C12) — the outlet-streaming conformance tests drive the RAW
# runtime `open_stream_session` dispatch + `Supervisor::open_outlet_stream`
# directly (the streaming trackers, `InProcessStreamSigner`, and the dispatch
# entry are NOT re-exported through the `scp-core` facade — only the bridge
# control surface is). scp-testing is a publish=false test crate, so a direct
# dev-dep on the runtime is layering-clean.
scp-runtime = { path = "../scp-runtime", features = ["testing"] }
scp-protocol = { path = "../scp-protocol" }
scp-clock = { path = "../scp-clock" }
scp-identity = { path = "../scp-identity" }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-transport = { path = "../scp-transport" }
scp-ffi-common = { path = "../scp-ffi/common", features = ["resolvers"] }
# async-trait: the compromise-recovery integration test implements the async
# `RecoveryBackend` trait (ADR-049 Decision 7) with a mock backend.
async-trait = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = "0.3"
hex = { workspace = true }
openmls = { workspace = true }
openmls_traits = { workspace = true }
# serde (with derive) is required by the ffi_conformance test's JSON alias
# loader. serde_json is already listed below for the same test module.
serde = { workspace = true }
serde_json = { workspace = true }
# syn is used by the ffi_conformance test to parse bridge source files with a
# real Rust parser. This replaces a substring-match scanner that false-positived
# on trait method declarations and doc-comments, and false-negatived on
# functions hidden inside `#[cfg(test)] mod tests { ... }` blocks. The bash
# script `scripts/check-bridge-symmetry.sh` uses an awk-based brace-tracking
# collector to get the same semantics; syn here gives the Rust side parity.
syn = { version = "2", features = ["full", "visit"] }
# proc-macro2 is needed alongside syn so the ADR-048 §1 pure-helpers scanner
# can descend into MACRO token streams (`format!`, `bail!`, `tracing::error!`,
# etc.). syn parses macros as opaque `TokenStream` and never walks their
# contents — without this dep the scanner would falsely flag `__repr__` and
# friends as unbound because `self.field` lives inside `format!(...)`.
proc-macro2 = "1"
rmp-serde = { workspace = true }
tempfile = "3"
x25519-dalek = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
axum = { workspace = true, features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"

[[test]]
name = "outlet_stream_conformance"
path = "tests/integration/outlet_stream_conformance.rs"

