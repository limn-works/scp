[package]
name = "scp-testing"
version = "0.1.0"
description = "Integration tests for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
ci-tier2 = []
ci-tier3 = ["ci-tier2"]
sqlite = ["scp-platform/sqlite"]
filesystem = ["scp-platform/filesystem"]
sync = ["scp-platform/sync"]
combined = ["scp-transport/combined"]

[dependencies]
scp-core = { path = "../scp-core" }
scp-identity = { path = "../scp-identity" }
scp-platform = { path = "../scp-platform" }
scp-transport = { path = "../scp-transport" }
sha2 = { workspace = true }
bytes = "1"
futures = "0.3"
tokio = { workspace = true }

[dev-dependencies]
scp-core = { path = "../scp-core" }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-transport = { path = "../scp-transport" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = "0.3"
hex = { workspace = true }
openmls = { workspace = true }
openmls_traits = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
tempfile = "3"

[[test]]
name = "phase1"
path = "tests/integration/phase1.rs"

[[test]]
name = "persistence"
path = "tests/integration/persistence.rs"

[[test]]
name = "persistence_advanced"
path = "tests/integration/persistence_advanced.rs"

[[test]]
name = "protocol_store"
path = "tests/integration/protocol_store.rs"

[lints]
workspace = true
