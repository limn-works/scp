[package]
name = "scp-testing"
version = "0.1.0"
description = "Integration tests for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
ci-tier2 = []
ci-tier3 = ["ci-tier2"]
sqlite = ["scp-platform/sqlite"]
filesystem = ["scp-platform/filesystem"]
sync = ["scp-platform/sync"]
combined = ["scp-transport/combined"]
# Compiles `helpers`, the only module in this library that names `scp_identity`, `scp_dht`
# or `scp_node`, turns on the three optional `[dependencies]` edges that name those crates,
# and carries the two features that module's code needs, so this feature compiles the module
# on its own: `scp-identity/testing` compiles the `DidDht::with_in_memory_custody` and
# `DidDht::create_in_memory` constructors it calls (both `#[cfg(any(test, feature =
# "testing"))]`), and `scp-dht/testing` compiles the `InMemoryDhtClient` its `TestDidDht`
# alias names (the §17.17.3 resolve nullifier). The list is named `testing` because ADR-062,
# capability injection and prove-absent dev backends, permits `scp-dht/testing` "only in
# `testing` features and dev-dependencies" (§Decision 1). No manifest but this one names this
# feature: its own `[dev-dependencies]` entry on this crate turns it on for this crate's test
# build, and a build that takes this crate as a normal dependency leaves it off.
testing = [
    "dep:scp-identity",
    "scp-identity/testing",
    "dep:scp-dht",
    "scp-dht/testing",
    "dep:scp-node",
]

[dependencies]
async-trait = { workspace = true }
scp-core = { path = "../scp-core", features = ["allow_unencrypted_storage", "testing"] }
# Optional, default features. `helpers.rs` is the only module here that names
# `scp_identity`, so this crate's `testing` feature turns the edge on together with
# `scp-identity/testing`, and a build that takes this crate as a normal dependency —
# `scp-ffi`'s `testing` feature among them — compiles no scp-identity for it. The
# integration tests reach the crate through the `[dev-dependencies]` entry below.
scp-identity = { path = "../scp-identity", optional = true }
# `scp-platform/testing` stays on the dependency line: `builder.rs`, `fullstack/node.rs`,
# `simulator/identity.rs`, and `simulator/mod.rs` name `scp_platform::testing` and
# `scp_platform::in_memory` outside the `helpers` module, so every build of this library
# needs it.
scp-platform = { path = "../scp-platform", features = ["testing"] }
# Optional, default features. `scp-dht/testing` gates `InMemoryDhtClient`, the §17.17.3
# resolve nullifier, and `helpers.rs` is the only module here that names `scp_dht`, so the
# edge and the feature both ride on this crate's `testing` feature and its
# `[dev-dependencies]` entry below — the two locations ADR-062 §Decision 1 permits for that
# feature.
scp-dht = { path = "../scp-dht", optional = true }
scp-clock = { path = "../scp-clock" }
scp-did = { path = "../scp-did" }
scp-crypto = { path = "../scp-crypto" }
# Optional, default features. `helpers.rs` is the only module here that names `scp_node`,
# so this crate's `testing` feature turns the edge on. `scp-node/allow_unencrypted_storage`
# gates `Node::start_for_testing` and `SelfSignedTlsProvider`, which no module in this
# library names — `tests/integration/node.rs` and `tests/integration/sdk_usability.rs` are
# the only consumers, so the feature rides on the `[dev-dependencies]` entry below.
scp-node = { path = "../scp-node", optional = true }
scp-transport = { path = "../scp-transport" }
scp-event-log = { path = "../scp-event-log" }
scp-protocol = { path = "../scp-protocol" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
openmls = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
futures = "0.3"
rmp-serde = { workspace = true }
tls_codec = "0.4"
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# This crate, naming itself, to turn its `testing` feature on for its own test build and for
# no other. A `cargo test` or `cargo nextest` build of this crate unifies dev-dependency
# features into the library, so the `helpers` module compiles there; a build that takes this
# crate as a normal dependency never builds these dev-dependencies and never gets it.
# `tests/integration/sdk_usability.rs` and `tests/integration/node.rs` are the module's only
# consumers in the workspace.
scp-testing = { path = ".", features = ["testing"] }
# `tests/integration/node.rs` and `tests/integration/sdk_usability.rs` call
# `Node::start_for_testing`, which crates/scp-node/src/config.rs compiles under
# `allow_unencrypted_storage`. The feature rides here rather than on the `[dependencies]`
# entry above, because no module in this library names the item it gates.
scp-node = { path = "../scp-node", features = ["allow_unencrypted_storage"] }
scp-core = { path = "../scp-core", features = ["testing"] }
# The SDK-usability integration test builds relay wire messages directly; the
# types live in the wasm-safe scp-relay-client leaf (ADR-057 Slice 3, D5).
scp-relay-client = { path = "../scp-relay-client" }
# SCP-OUT-039 (C12) — the outlet-streaming conformance tests drive the RAW
# runtime `open_stream_session` dispatch + `Supervisor::open_outlet_stream`
# directly (the streaming trackers, `InProcessStreamSigner`, and the dispatch
# entry are NOT re-exported through the `scp-core` facade — only the bridge
# control surface is). scp-testing is a publish=false test crate, so a direct
# dev-dep on the runtime is layering-clean.
scp-runtime = { path = "../scp-runtime", features = ["testing"] }
scp-protocol = { path = "../scp-protocol" }
scp-clock = { path = "../scp-clock" }
# The integration tests `tests/integration/identity.rs`, `discovery.rs`, `agent_binding.rs`
# and `encrypted_relay_roundtrip.rs` name `InMemoryDhtClient` or the in-memory `DidDht`
# constructors themselves, so this crate's test build declares both nullifier features on
# its own dev-dependency edges as well as through the `testing` feature above. ADR-062
# §Decision 1 names `scp-testing` as one of the three crates that list `scp-dht/testing`
# here, alongside `scp-node` and `scp-runtime`.
scp-identity = { path = "../scp-identity", features = ["testing"] }
scp-dht = { path = "../scp-dht", features = ["testing"] }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-transport = { path = "../scp-transport" }
scp-ffi-common = { path = "../scp-ffi/common", features = ["resolvers"] }
# async-trait: the compromise-recovery integration test implements the async
# `RecoveryBackend` trait (ADR-049 Decision 7) with a mock backend.
async-trait = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = "0.3"
hex = { workspace = true }
openmls = { workspace = true }
openmls_traits = { workspace = true }
# serde (with derive) is required by the ffi_conformance test's JSON alias
# loader. serde_json is already listed below for the same test module.
serde = { workspace = true }
serde_json = { workspace = true }
# syn is used by the ffi_conformance test to parse bridge source files with a
# real Rust parser. This replaces a substring-match scanner that false-positived
# on trait method declarations and doc-comments, and false-negatived on
# functions hidden inside `#[cfg(test)] mod tests { ... }` blocks. The bash
# script `scripts/check-bridge-symmetry.sh` uses an awk-based brace-tracking
# collector to get the same semantics; syn here gives the Rust side parity.
syn = { version = "2", features = ["full", "visit"] }
# proc-macro2 is needed alongside syn so the ADR-048 §1 pure-helpers scanner
# can descend into MACRO token streams (`format!`, `bail!`, `tracing::error!`,
# etc.). syn parses macros as opaque `TokenStream` and never walks their
# contents — without this dep the scanner would falsely flag `__repr__` and
# friends as unbound because `self.field` lives inside `format!(...)`.
proc-macro2 = "1"
rmp-serde = { workspace = true }
tempfile = "3"
x25519-dalek = { workspace = true }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
axum = { workspace = true, features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"

