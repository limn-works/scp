[package]
name = "scp-testing"
version = "0.1.0"
description = "Integration tests for SCP (Shared Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
ci-tier2 = []
ci-tier3 = ["ci-tier2"]
sqlite = ["scp-platform/sqlite"]
filesystem = ["scp-platform/filesystem"]
sync = ["scp-platform/sync"]
combined = ["scp-transport/combined"]

[dependencies]
scp-core = { path = "../scp-core", features = ["allow_unencrypted_storage"] }
scp-identity = { path = "../scp-identity", features = ["testing"] }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-primitives = { path = "../scp-primitives" }
scp-node = { path = "../scp-node", features = ["allow_unencrypted_storage"] }
scp-transport = { path = "../scp-transport" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
openmls = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
futures = "0.3"
rmp-serde = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
scp-core = { path = "../scp-core", features = ["testing"] }
scp-event-log = { path = "../scp-event-log" }
scp-identity = { path = "../scp-identity" }
scp-platform = { path = "../scp-platform", features = ["testing"] }
scp-transport = { path = "../scp-transport" }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = "0.3"
hex = { workspace = true }
openmls = { workspace = true }
openmls_traits = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
tempfile = "3"
tls_codec = "0.4"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
axum = { workspace = true, features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"

[[test]]
name = "harness_meta"
path = "tests/integration/harness_meta.rs"

