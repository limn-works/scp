[package]
name = "scp-runtime-types"
version = "0.1.0-beta.2"
description = "Types, codecs and stateless services of the SCP (Shared Context Protocol) runtime"
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
keywords = ["protocol", "context", "governance", "encryption"]
categories = ["cryptography", "network-programming"]

[features]
# Test-harness feature (ADR-070 §5; runtime split plan §4). It turns on the
# `testing` features of the scp dependencies that this crate's
# `#[cfg(any(test, feature = "testing"))]` modules and the test fixtures in its
# unit tests name, and compiles `crypto::{dh_counting_custody,key_loss_custody}`
# and `crypto::mls::test_support` for the test targets of the crates above it.
# `scp-dht/testing` appears in no default or non-testing list, and no shipped
# artifact resolves this feature: `scripts/check-shipped-feature-graph.sh`
# proves `InMemoryDhtClient` absent from every shipped feature graph.
testing = ["scp-crypto/testing", "scp-protocol/testing", "scp-platform/testing", "scp-mls/testing", "scp-dht/testing"]

[dependencies]
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_basic_credential = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
scp-clock = { workspace = true }
scp-crypto = { workspace = true }
scp-did = { workspace = true }
scp-protocol = { workspace = true }
scp-mls = { workspace = true }
scp-platform = { workspace = true }
scp-identity = { workspace = true }
scp-dht = { workspace = true }
scp-event-log = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
z-base-32 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
lru = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }
subtle = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
scp-crypto = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
scp-dht = { workspace = true, features = ["testing"] }
scp-mls = { workspace = true, features = ["testing"] }
scp-protocol = { workspace = true, features = ["testing"] }
scp-platform = { workspace = true, features = ["testing", "encrypting"] }
scp-event-log = { workspace = true, features = ["testing"] }
openmls_basic_credential = { workspace = true, features = ["test-utils"] }
metrics-util = "0.19"

[lints]
workspace = true
