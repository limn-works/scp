[package]
name = "scp-core"
version = "0.1.0"
description = "Core protocol implementation for SCP (Shareable Context Protocol)"
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_memory_storage = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
scp-platform = { path = "../scp-platform" }
aes-gcm = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
z-base-32 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
uuid = { workspace = true }
jsonschema = { workspace = true, features = ["resolve-http", "resolve-file"] }
lru = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
scp-platform = { path = "../scp-platform", features = ["software_platform"] }
openmls_basic_credential = { workspace = true, features = ["test-utils"] }
proptest = "1"
scp-media = { path = "../scp-media" }

[lints]
workspace = true
