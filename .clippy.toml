cognitive-complexity-threshold = 25
# The auto-generated test harness for scp-core allocates ~700 KiB on the
# stack for the TestDescAndFn array (~3600 tests). This exceeds the default
# 512 KiB threshold but is safe — test binaries run on threads with ample
# stack space. Raising the threshold avoids a false positive on generated code.
# Increased from 750000 to 800000 after app sandboxing tests (#595) added ~100
# new test functions to scp-core.
# Increased from 800000 to 900000 after broadcast content tests (SCP-287)
# added ~68 new test functions to scp-core.
stack-size-threshold = 900000
# Default large_futures threshold is 16384. Adding `local_pseudonym: Option<[u8; 32]>`
# to create_context/join_context pushed test futures to 16416 bytes. Raise the
# threshold slightly to accommodate. Production code is unaffected.
future-size-threshold = 16512

# ----- Disallowed methods -----
# now_secs/now_millis are private to scp-clock — the compiler enforces
# this directly, so they need no entry here.
disallowed-methods = [
  { path = "openmls_basic_credential::SignatureKeyPair::store", reason = "writes the MLS signer's private key into provider storage, which snapshots persist and restores re-inject; every openmls operation SCP calls takes the signer as an argument, so it is never stored (security model spec §9.15)" },
  { path = "openmls_traits::storage::StorageProvider::write_signature_key_pair", reason = "stores the MLS signer's private key in provider storage (the trait method `SignatureKeyPair::store` calls), which snapshots persist and restores re-inject; every openmls operation SCP calls takes the signer as an argument, so it is never stored (security model spec §9.15)" },
  { path = "openmls_traits::crypto::OpenMlsCrypto::signature_key_gen", reason = "draws the key pair from the one `ChaCha20Rng` that openmls_rust_crypto's `RustCrypto` seeds once for the provider's life and never reseeds or zeroizes, so anyone who reads that long-lived seed from memory regenerates the signing key; create signers with `openmls_basic_credential::SignatureKeyPair::new`, which draws from `OsRng` (security model spec §9.15)" },
]
