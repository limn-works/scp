<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCP Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0f0f1a;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }
    .container { max-width: 600px; width: 100%; }
    h1 { margin-bottom: 1rem; font-size: 1.4rem; color: #7aa2f7; }
    #status { font-size: 0.85rem; color: #888; margin-bottom: 0.5rem; }
    #context-id {
      font-size: 0.75rem;
      color: #565f89;
      word-break: break-all;
      margin-bottom: 1rem;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .controls input {
      flex: 1;
      min-width: 200px;
      padding: 0.5rem;
      border: 1px solid #333;
      border-radius: 4px;
      background: #1a1b26;
      color: #e0e0e0;
      font-size: 0.9rem;
    }
    .controls button, #send-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background: #7aa2f7;
      color: #1a1b26;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .controls button:disabled, #send-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #messages {
      list-style: none;
      background: #1a1b26;
      border: 1px solid #333;
      border-radius: 4px;
      height: 350px;
      overflow-y: auto;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    #messages li { margin-bottom: 0.25rem; }
    #messages li strong { color: #bb9af7; }

    .send-row {
      display: flex;
      gap: 0.5rem;
    }
    .send-row input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #333;
      border-radius: 4px;
      background: #1a1b26;
      color: #e0e0e0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SCP Chat</h1>
    <div id="status">Loading WASM...</div>
    <div id="context-id"></div>

    <div class="controls">
      <button id="create-btn">Create</button>
      <input id="join-input" type="text" placeholder="Paste context ID to join..." />
      <button id="join-btn">Join</button>
    </div>

    <ul id="messages"></ul>

    <div class="send-row">
      <input id="msg-input" type="text" placeholder="Type a message..." disabled />
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script type="module" src="./dist/index.js"></script>
</body>
</html>
