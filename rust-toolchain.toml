# Pins the Rust compiler for every cargo invocation in this repository.
#
# Why the pin exists. Until 2026-08-22 this repository had no toolchain file,
# and every workflow step installed `dtolnay/rust-toolchain@stable`, which
# resolves to whichever stable Rust was published most recently. Rust 1.98.0
# shipped on 2026-08-20; its clippy added `chunks_exact_to_as_chunks` and
# `unused_async_trait_impl`. The `Rust / clippy` required check started failing
# on every branch the next morning, and a local run of the identical command on
# 1.97.1 reported nothing, so nobody could reproduce the failure that was
# blocking the merge queue. CLAUDE.md requires running CI locally before
# pushing; that requirement only means something when the local compiler and
# the CI compiler are the same compiler.
#
# How to raise it. Bumping the pin is a deliberate change, not a floating default.
# `scripts/check-toolchain-pin.sh` names every location that has to move together
# and fails when they disagree; run it after editing any of them. mise sets
# `RUSTUP_TOOLCHAIN` for the commands it runs, and that variable overrides this file
# entirely, which is why `.mise.toml` has to name the same version — check with
# `mise x -- printenv RUSTUP_TOOLCHAIN`, because plain `mise env` does not print it.
# After raising the version, run the CI clippy command from the "Orchestrator
# verification protocol" section of CLAUDE.md and fix everything the new release
# reports in that same pull request.
#
# `targets` lists every target some CI job cross-compiles for:
#   - wasm32-unknown-unknown ......... browser SDK (ci.yml wasm jobs)
#   - {aarch64,x86_64}-apple-darwin .. macOS binaries and the Swift SPM mirror
#   - aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios .. Swift SDK
#   - {aarch64,armv7,x86_64,i686}-linux-android* .. Kotlin SDK
#   - {x86_64,aarch64}-unknown-linux-gnu, x86_64-pc-windows-msvc .. release
#     build matrix
#
# This list, not the `targets:` inputs in the workflows, is what supplies those
# standard libraries. rustup names toolchains, and `stable-<host>` and
# `1.98.0-<host>` are different names even while stable resolves to 1.98.0, so a
# `dtolnay/rust-toolchain@stable` step installs its targets into a toolchain cargo
# does not use once this file is present. Those workflow steps still run: they cost
# one redundant toolchain install per job, and they keep CI working if this file is
# ever deleted. Deleting them, and moving each job's targets to a `rustup target add`
# step, would remove that redundancy — it is not done here because the cross-compiling
# jobs live in `build-matrix.yml`, which runs only on a release tag, so a pull request
# produces no signal on the change.
#
# `fuzz/` is a standalone crate outside the workspace and needs nightly. Both
# `.github/workflows/fuzz.yml` and the fuzz check in `.github/workflows/ci.yml`
# name that nightly on the command line, and an explicit `+toolchain` sets
# `RUSTUP_TOOLCHAIN` for the whole command tree, which overrides this file.
# `fuzz/rust-toolchain.toml` pins the same nightly and records the unpin condition.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
targets = [
    "wasm32-unknown-unknown",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
