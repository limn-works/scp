[workspace]
resolver = "2"
members = [
    "crates/scp-core",
    "crates/scp-transport",
    "crates/scp-platform",
    "crates/scp-testing",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/limn/scp"
license = "MIT"
readme = "README.md"
keywords = ["protocol", "identity", "encryption", "mls", "did"]
categories = ["cryptography", "network-programming"]

[workspace.dependencies]
openmls = { version = "0.8", features = ["libcrux-provider"] }
openmls_traits = "0.5"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
pkarr = "5"
z-base-32 = "0.1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
rmp-serde = "1"
rand = "0.8"
rand_chacha = "0.3"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.26"
async-trait = "0.1"
proptest = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
multiple_crate_versions = "allow"
