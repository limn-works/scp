[workspace]
resolver = "2"
members = [
    "crates/scp-clock",
    "crates/scp-crypto",
    "crates/scp-did",
    "crates/scp-dht",
    "crates/scp-platform",
    "crates/scp-identity",
    "crates/scp-event-log",
    "crates/scp-protocol",
    "crates/scp-relay-client",
    "crates/scp-mls",
    "crates/scp-client",
    "crates/scp-client-wasm",
    "crates/scp-relay-mock",
    "crates/scp-runtime",
    "crates/scp-core",
    "crates/scp-transport",
    "crates/scp-testing",
    "crates/scp-mcp",
    "crates/scp-media",
    "crates/scp-node",
    "crates/scp-relay",
    "crates/scp-ffi",
    "crates/scp-ffi/common",
    "crates/scp-ffi/uniffi",
    "crates/scp-ffi/napi",
    "crates/scp-ffi/napi-test-stubs",
]

# Every member except `crates/scp-testing`, which a bare `cargo build` at this
# root must not compile.
#
# `scp-testing` is a `publish = false` test harness. Its `scp-core` and
# `scp-platform` edges carry `allow_unencrypted_storage` / `testing` as NORMAL
# dependencies, because four modules name testing-gated items at lib level,
# outside any feature gate: `fullstack/node.rs` calls
# `Supervisor::test_install_access_key`, `handle_sender_key_request`,
# `land_sender_key_response` and `inspect_incoming_inner`, each
# `#[cfg(feature = "testing")]` in scp-runtime; `simulator/identity.rs` calls
# `ProtocolRepository::new_for_testing`; and `builder.rs`, `fullstack/node.rs`
# and `simulator/mod.rs` name `scp_platform::testing` and
# `scp_platform::in_memory`. Its `scp-identity`, `scp-dht` and `scp-node`
# `[dependencies]` edges are optional and carry no such feature: `helpers.rs` is
# the only module naming `scp_identity`, `scp_dht` and `scp_node`, `lib.rs`
# compiles it under this crate's `testing` feature, which turns on all three
# edges and names `scp-identity/testing` and `scp-dht/testing`,
# and only this crate's own integration tests call the
# `Node::start_for_testing` that `scp-node/allow_unencrypted_storage` gates. All
# three features ride on `crates/scp-testing/Cargo.toml`'s `[dev-dependencies]`
# entries instead, and its self entry there is the one edge that turns its
# `testing` feature on; cargo resolves those entries only when it builds that
# crate's own test targets. ADR-062 §Decision 1 states its invariant for one
# feature: "`scp-dht/testing` MUST NOT appear in any **default / non-testing**
# feature list — only in `testing` features and dev-dependencies." It states no
# such rule for `scp-identity/testing` or `scp-node/allow_unencrypted_storage`,
# so moving those two off the normal edges is this manifest's choice, not a rule
# the ADR states.
#
# This paragraph claims nothing about the rest of the workspace, where each of
# the three has its own routes: `crates/scp-ffi/Cargo.toml`'s `testing` feature
# names `scp-dht/testing`; the `[dev-dependencies]` entries of
# `crates/scp-runtime/Cargo.toml` and `crates/scp-ffi/common/Cargo.toml` name
# `scp-identity/testing`; and `crates/scp-node/Cargo.toml`'s `testing` feature
# names `allow_unencrypted_storage`, which `crates/scp-ffi/common/Cargo.toml`
# reaches through `scp-node?/testing`. What proves no SHIPPED artifact resolves
# any of them is `scripts/check-shipped-feature-graph.sh`, which resolves each
# shipped configuration with `cargo tree -e features,no-dev` and fails on any
# resolved feature its allowlist does not name.
# Resolver 2 unifies normal-dependency features across every package one
# invocation builds, so a workspace-wide `cargo build` still resolves
# `scp-platform/testing` for every member, both through the `scp-platform` edge
# above and through the `scp-core` edge above, because `scp-runtime/testing`
# names that feature too. `scp-platform/testing` gates the whole
# `scp_platform::testing` module, which holds `InMemoryKeyCustody`,
# `InMemoryDeviceAttestation` and `InMemoryPreRotationCustody`; the same
# unification resolves `allow_unencrypted_storage`, which compiles
# `ProtocolRepository::new_for_testing`. Such a build puts all four into each
# FFI bridge cdylib — binaries `.github/workflows/build-matrix.yml` uploads and
# `.github/workflows/release.yml` Authenticode-signs. Excluding one member here
# removes that unification path, and
# `scripts/check-shipped-feature-graph.sh` asserts a default-members build
# resolves nothing outside its permitted-production allowlist.
#
# A test run still covers `scp-testing`: CI passes `--workspace` explicitly,
# which overrides this list.
default-members = [
    "crates/scp-clock",
    "crates/scp-crypto",
    "crates/scp-did",
    "crates/scp-dht",
    "crates/scp-platform",
    "crates/scp-identity",
    "crates/scp-event-log",
    "crates/scp-protocol",
    "crates/scp-relay-client",
    "crates/scp-mls",
    "crates/scp-client",
    "crates/scp-client-wasm",
    "crates/scp-relay-mock",
    "crates/scp-runtime",
    "crates/scp-core",
    "crates/scp-transport",
    "crates/scp-mcp",
    "crates/scp-media",
    "crates/scp-node",
    "crates/scp-relay",
    "crates/scp-ffi",
    "crates/scp-ffi/common",
    "crates/scp-ffi/uniffi",
    "crates/scp-ffi/napi",
    "crates/scp-ffi/napi-test-stubs",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/limn/scp"
license = "Apache-2.0"
homepage = "https://github.com/limn/scp"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
uuid = { version = "1", features = ["v4", "v7"] }
# No `libcrux-provider`. That feature does one thing — add the optional dependency
# `openmls_libcrux_crypto` (openmls 0.9.0 Cargo.toml: `libcrux-provider =
# ["dep:openmls_libcrux_crypto", "openmls_test?/libcrux-provider"]`) — and
# openmls itself names that crate only under `#[cfg(test)]` and
# `#[cfg(feature = "libcrux-provider")]`. No file in this repository names libcrux, and
# every SCP call site takes a provider: `scp-runtime`'s `ScpMlsProvider` wraps
# `openmls_rust_crypto::RustCrypto` (crates/scp-runtime/src/crypto/mls/storage.rs) and
# `scp-mls`'s `InMemoryMlsProvider` wraps `openmls_rust_crypto::OpenMlsRustCrypto`
# (crates/scp-mls/src/provider.rs). Enabling it compiled 23 libcrux crates, 2 hax crates,
# `openmls_libcrux_crypto` and `hpke-rs-libcrux` into every build, and carried eleven
# RUSTSEC advisories that `deny.toml` had to ignore.
openmls = { version = "0.9" }
openmls_traits = "0.6"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
openmls_memory_storage = "0.6"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde_bytes = "0.11"
serde_json = "1"
serde_json_canonicalizer = "0.3"
z-base-32 = "0.1.3"
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
percent-encoding = "2"
base64 = "0.22"
bs58 = "0.5"
jsonschema = { version = "0.28", default-features = false }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
# The patch component is load-bearing: RUSTSEC-2026-0253 (unsoundness via
# non-panic-safe `LruCache::pop()`) is patched only in 0.18.2. Do not relax
# this to "0.18" — that would re-admit the affected 0.18.0 / 0.18.1.
#
# Scope of the exposure, so nobody re-derives it under pressure: the advisory
# is `informational = "unsound"`, and reaching the UB needs a key type with a
# potentially-panicking `Drop` under `catch_unwind`. Every SCP cache key is
# `BlobId(pub [u8; 32])`, `[u8; 32]`, or `String` — none has a user-defined
# `Drop` — so the precondition is unmet today even though `pop()` is on two
# live paths. This pin is gate compliance plus cover for a future key type;
# introducing an `lru` key whose `Drop` can panic is what would make it bite.
lru = "0.18.2"
dashmap = "6"
hex = "0.4"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
subtle = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
unicode-normalization = "0.1"
arc-swap = "1"
futures = "0.3"
# SQLCipher compiles from the bundled amalgamation and takes its crypto from the
# build host. For a Linux or Android target libsqlite3-sys 0.30 emits a dynamic link
# to `crypto`, which the linker resolves in that target's library path: the build
# host's libcrypto for a native Linux build, and no library at all for a cross build
# whose sysroot holds no libcrypto. On an Apple host building an Apple target it
# builds against CommonCrypto from the Security framework unless OPENSSL_DIR (or
# both OPENSSL_LIB_DIR and OPENSSL_INCLUDE_DIR) is set, in which case it links that
# OpenSSL's libcrypto dynamically; on a Windows host building a Windows target its
# build script panics unless OPENSSL_DIR (or both OPENSSL_LIB_DIR and
# OPENSSL_INCLUDE_DIR) names an OpenSSL installation. The build script reads each
# of these variables first under the target triple as a prefix
# (`AARCH64_APPLE_DARWIN_OPENSSL_DIR`), which acts as the bare name does.
# The PyPI wheel, which runs on a machine this build never saw, selects
# `scp-platform/vendored-openssl`. On a non-Apple target that feature sets
# `bundled-sqlcipher-vendored-openssl` on the libsqlite3-sys package `scp-platform`
# compiles, and the build links a static OpenSSL built from source. On an Apple target
# it sets nothing, so the macOS wheel, which a macOS runner builds, keeps
# CommonCrypto: libsqlite3-sys 0.30.1's build script checks the vendored feature
# before its Apple branch, and `crates/scp-platform/Cargo.toml` declares the edge for
# non-Apple targets only so that the vendored feature never reaches an Apple build.
# Naming `bundled-sqlcipher-vendored-openssl` here instead vendors OpenSSL into every
# artifact the workspace ships on every target, including the `scp-relay` and
# `scp-node` binaries.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
redb = "2"
static_assertions = "1.1"
# wasm-bindgen stack for the browser participant surface (ADR-057 Slice 3).
# Only the wasm32-targeted crate (scp-client-wasm) consumes these; they are
# declared at the workspace level so the version pins stay single-sourced.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"

# CRITERION: an intra-doc link that resolves to nothing is an error in every member
# of this workspace, on every `cargo doc` cargo runs for it.
# Cargo applies a lint level per package and a member receives this table only
# through its own `[lints] workspace = true`, so `check_rustdoc_lint_reaches_every_member`
# in scripts/tests/ci-gate/ci_gate_selftest.py reads every `[workspace] members` entry
# above and fails when one omits that line. The level is `forbid` because rustc honours
# a source-level `#![allow(rustdoc::broken_intra_doc_links)]` against a `deny` and
# rejects one against a `forbid`, so no crate can lower the level from inside its own
# source. Before this table, `crates/scp-runtime/src/lib.rs` alone declared the lint as
# a crate attribute, and job rust-doc in .github/workflows/ci.yml exited 0 over 271
# unresolved intra-doc links in the other crate directories.
[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
# proptest macro expansion creates large internal runner arrays on the stack;
# clippy cannot point to the source location so a crate-level allow is needed.
large_stack_arrays = "allow"
# `clippy::unused_async_trait_impl` (added in clippy 1.98.0) reports an `async fn`
# whose body contains no `.await`, inside an impl block.
#
# THE CRITERION for allowing it: this lint decides nothing that `clippy::unused_async`
# does not already decide, except on a trait impl, and on a trait impl the author of
# the impl does not control whether the future exists. `clippy::unused_async` stays
# enabled below, so the question "should this function be async at all" still has to
# be answered wherever the author of the function can answer it.
#
# The evidence behind that criterion, per kind of site the lint reaches:
#
#  - An inherent impl. `clippy::unused_async` reports the same function, so allowing
#    the second name drops no detection. It does not follow that every such function
#    carries an individual justification: three of the allows naming
#    `clippy::unused_async` are `#![allow(..)]` inner attributes covering a whole file or
#    module rather than one function.
#  - A trait impl. `clippy::unused_async` skips these deliberately. The trait declares
#    the method as future-returning, so the impl can only re-spell
#    `async fn f(..) -> T` as `fn f(..) -> impl Future<Output = T> + Send
#    { async move { .. } }`, which desugars to the identical future. Clippy's own
#    suggested form is not that re-spelling: it wraps the body's values in
#    `std::future::ready`, which runs the body at call time instead of at poll time
#    and so moves when a side effect such as a map insert happens.
#
# THE CASE THAT LOOKS LIKE AN EXCEPTION, AND IS NOT: a trait this workspace owns whose
# methods no impl awaits. `HandleQuerier` (crates/scp-runtime/src/discovery/addressing.rs)
# and `ContextQuerier` (crates/scp-runtime/src/discovery/search.rs) are the two, and
# de-asyncing either would be the wrong edit. Both declare methods that perform network
# I/O — `lookup_domain_handle` fetches `.well-known/scp`, `query_context` queries a remote
# context's `agent_search` outlet. No impl awaits because the implementations that would
# do that I/O do not exist yet: `ContextQuerier`'s only impl is a test double, and
# `LocalHandleQuerier` returns an empty vector from two methods it cannot perform.
# Removing `async` would write the missing backend's absence into the signature and make
# adding it a breaking change.
#
# `clippy::unused_async` is NOT allowed here — an async function with no await still
# has to justify itself at every inherent-impl and free-function site.
unused_async_trait_impl = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# Actor-per-context refactor (ADR-049): the actor body serializes access
# to per-context state; no lock is needed across awaits in actor code.
# In legacy code paths, any `await` while holding a `std::sync::Mutex` /
# `parking_lot::Mutex` / `RwLock` guard is a deadlock hazard and gets
# denied here. See scripts/check-block-in-place.py for the complementary
# sync-bridge enforcement.
await_holding_lock = "deny"

# ── Dev/test profile ────────────────────────────────────────────────────────
# Dev/test builds emit line-tables-only debug info instead of the cargo default
# full DWARF (`debug = 2`). Every compiled artifact keeps its line table (so
# panic/backtrace frames still resolve to `file:line:col`) but drops the bulky
# variable/type DWARF that only an interactive debugger consumes.
#
# MEASURED on this 24-member workspace, two clean from-scratch builds of
# `cargo build --workspace --all-targets` with the CI feature set, isolated
# CARGO_TARGET_DIRs, identical unit graphs (572 rlibs / 887 fingerprints each,
# macOS/aarch64, rustc 1.97.1):
#
#     debug = 2 (cargo default) ... 25.65 GB target/   (deps 16.5 GB)
#     debug = "line-tables-only" .. 18.95 GB target/   (deps 11.4 GB)
#     ------------------------------------------------------------------
#     saved ....................... 6.70 GB per clean pass = 26% total,
#                                   31% of debug/deps, 38% of rlib bytes
#
# That is one target dir, one feature combination. The cost scales with every
# additional feature-hash rebuild and every worktree sharing the build cache.
#
# TRADE-OFF (the honest one): `file:line:col` is preserved exactly, but a
# backtrace frame loses its DWARF-derived crate-qualified name and falls back
# to the linkage symbol — `deep at src/main.rs:4:5` instead of
# `bt_probe[hash]::deep at src/main.rs:4:5`. Local variables are not
# inspectable in lldb/gdb. Anyone who needs either can override
# per-invocation: `RUSTFLAGS="-C debuginfo=2" cargo test ...`.
#
# `test` and `bench` inherit `dev`, so `cargo test`/`cargo nextest` are covered.
[profile.dev]
debug = "line-tables-only"

# ── Release profile ─────────────────────────────────────────────────────────
# `debug-assertions = false` is the cargo release default; this line changes no
# behavior and keeps the setting explicit. The shipped browser wasm is a
# `--release` build (ADR-057 §Prereq-4). openmls 0.9.0 returns a typed error on a
# tampered ciphertext in every build profile, so no decrypt-path guarantee
# depends on this line.
[profile.release]
debug-assertions = false
