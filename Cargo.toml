[workspace]
resolver = "2"
members = [
    "crates/scp-primitives",
    "crates/scp-platform",
    "crates/scp-identity",
    "crates/scp-event-log",
    "crates/scp-core",
    "crates/scp-transport",
    "crates/scp-testing",
    "crates/scp-mcp",
    "crates/scp-media",
    "crates/scp-node",
    "crates/scp-relay",
    "crates/scp-ffi",
    "crates/scp-ffi/common",
    "crates/scp-ffi/uniffi",
    "crates/scp-ffi/wasm",
    "crates/scp-ffi/napi",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/limn/scp"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
uuid = { version = "1", features = ["v4"] }
openmls = { version = "0.8", features = ["libcrux-provider"] }
openmls_traits = "0.5"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
openmls_memory_storage = "0.5"
rmp-serde = "1"
serde_bytes = "0.11"
serde_json = "1"
z-base-32 = "0.1.3"
aes = "0.8"
aes-gcm = "0.10"
percent-encoding = "2"
base64 = "0.22"
bs58 = "0.5"
jsonschema = { version = "0.28", default-features = false }
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
lru = "0.12"
dashmap = "6"
hex = "0.4"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
subtle = "2"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
redb = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
# proptest macro expansion creates large internal runner arrays on the stack;
# clippy cannot point to the source location so a crate-level allow is needed.
large_stack_arrays = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
