# Each service names its blob storage backend and an absolute database path.
# Neither variable has a default: a binary started with either one unset exits
# 1 (persistence spec §17.7, SCP-CAPSEL-8000). The path sits on a named volume,
# so stored blobs survive a container restart.
services:
  relay:
    build: .
    entrypoint: ["/usr/local/bin/scp-relay"]
    ports:
      - "9000:9000"
    environment:
      SCP_RELAY_STORAGE_BACKEND: "sqlite"
      SCP_RELAY_STORAGE_PATH: "/data/scp-relay.db"
      SCP_RELAY_LOG_FORMAT: "pretty"
      SCP_RELAY_LOG_LEVEL: "info"
    volumes:
      - relay-data:/data

  node:
    build: .
    entrypoint: ["/usr/local/bin/scp-node"]
    ports:
      - "9001:9000"
    environment:
      SCP_NODE_DOMAIN: "localhost"
      SCP_RELAY_STORAGE_BACKEND: "sqlite"
      SCP_RELAY_STORAGE_PATH: "/data/scp-relay.db"
      SCP_RELAY_LOG_FORMAT: "pretty"
      SCP_RELAY_LOG_LEVEL: "info"
    volumes:
      - node-data:/data

volumes:
  relay-data:
  node-data:
