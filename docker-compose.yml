services:
  relay:
    build: .
    entrypoint: ["/usr/local/bin/scp-relay"]
    ports:
      - "9000:9000"
    environment:
      # Naming a blob storage backend is required — persistence spec §17.17.1
      # (SCP-CAPSEL-8000) gives this variable no default, and a relay that
      # reads it unset exits 1.
      SCP_RELAY_STORAGE_BACKEND: "sqlite"
      # The sqlite backend requires an absolute path and refuses a relative
      # one. The path sits on a named volume, so `docker compose down` keeps
      # the blobs the relay stored.
      SCP_RELAY_STORAGE_PATH: "/data/scp-relay.db"
      SCP_RELAY_LOG_FORMAT: "pretty"
      SCP_RELAY_LOG_LEVEL: "info"
    volumes:
      - relay-data:/data

  node:
    build: .
    entrypoint: ["/usr/local/bin/scp-node"]
    ports:
      - "9001:9000"
    environment:
      SCP_NODE_DOMAIN: "localhost"
      # A node serving a relay names its blob backend for that same reason.
      SCP_RELAY_STORAGE_BACKEND: "sqlite"
      SCP_RELAY_STORAGE_PATH: "/data/scp-relay.db"
      SCP_RELAY_LOG_FORMAT: "pretty"
      SCP_RELAY_LOG_LEVEL: "info"
    volumes:
      - node-data:/data

volumes:
  relay-data:
  node-data:
