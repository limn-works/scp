[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "scp-python"
version = "0.1.0b2"
description = "SCP (Shared Context Protocol) Python SDK — cryptographic identity, governed contexts, and trust for AI agents"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
keywords = ["scp", "protocol", "agents", "identity", "did", "ucan", "mls", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
scp-mcp = "scp_sdk.mcp:cli_main"

[project.urls]
Repository = "https://github.com/limn-scp/scp-protocol-core"
Documentation = "https://scp.dev/docs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "parity: cross-bridge runtime parity test (ADR-046)",
]

# ruff and mypy target the `requires-python` floor, 3.10, so they reject syntax and
# standard-library names that the cp310 and cp311 wheels cannot import, such as
# the PEP 695 `type` statement and type parameters, and never rewrite code into them.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.maturin]
# Features of `scp-ffi`, the package `manifest-path` below names. `extension-module`
# forwards `pyo3/extension-module`. `vendored-openssl` forwards
# `scp-platform/vendored-openssl`, which on a Linux or Windows target compiles
# OpenSSL from source into SQLCipher, because a `pip install` of the wheel runs no
# linker and the wheel installs onto a machine whose OpenSSL the build never saw.
# On a macOS target, the universal2 wheel and a macOS install from the sdist
# alike, it changes nothing and SQLCipher keeps CommonCrypto from the OS.
features = ["extension-module", "vendored-openssl"]
manifest-path = "../../crates/scp-ffi/Cargo.toml"
module-name = "scp_sdk._scp_core"
python-source = "."
