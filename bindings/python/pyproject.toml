[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "scp-python"
version = "0.1.0b2"
description = "SCP (Shared Context Protocol) Python SDK — cryptographic identity, governed contexts, and trust for AI agents"
# The ceiling: the locked PyO3 0.24 builds for CPython 3.13 at most, so pip on 3.14
# skips a release built from this file instead of failing in its sdist build. The
# 0.1.0b2 and 0.1.0b3 releases on PyPI predate the ceiling, and pip on 3.14 falls
# back to the 0.1.0b3 sdist while neither is yanked. The version above is one PyPI
# already serves, so the ceiling reaches PyPI only in a release that raises it.
requires-python = ">=3.10,<3.14"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
keywords = ["scp", "protocol", "agents", "identity", "did", "ucan", "mls", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
scp-mcp = "scp_sdk.mcp:cli_main"

[project.urls]
Repository = "https://github.com/limn-works/scp"
Documentation = "https://scp.dev/docs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "parity: cross-bridge runtime parity test (ADR-046)",
]

[tool.ruff]
# The floor `requires-python` names: ruff reports syntax newer than the target
# (PEP 695 `type X` and `def f[T]` among it), so code the 3.10 and 3.11 wheels
# cannot import fails lint.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.maturin]
# Features of `scp-ffi`, the package `manifest-path` below names. `extension-module`
# forwards `pyo3/extension-module`. `vendored-openssl` forwards
# `scp-platform/vendored-openssl`, which compiles OpenSSL from source into
# SQLCipher: a `pip install` runs no linker, and this wheel installs onto a machine
# whose OpenSSL the build never saw. `scripts/check-vendored-openssl-scope.sh` fails
# when any second shipped artifact selects that feature.
features = ["extension-module", "vendored-openssl"]
manifest-path = "../../crates/scp-ffi/Cargo.toml"
module-name = "scp_sdk._scp_core"
python-source = "."
