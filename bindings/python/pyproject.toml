[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "scp-sdk"
version = "0.1.0"
description = "SCP (Shareable Context Protocol) Python SDK — cryptographic identity, governed contexts, and trust for AI agents"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
keywords = ["scp", "protocol", "agents", "identity", "did", "ucan", "mls", "context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
scp-mcp = "scp_sdk.mcp:cli_main"

[project.urls]
Repository = "https://github.com/limn-scp/scp-protocol-core"
Documentation = "https://scp.dev/docs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF"]
ignore = ["UP047"]  # PEP 695 type params require Python 3.12+, we support 3.10+

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.maturin]
features = ["extension-module"]
manifest-path = "../../crates/scp-ffi/Cargo.toml"
module-name = "scp_sdk._scp_core"
python-source = "."
