android.useAndroidX=true
# Gradle's default daemon heap (512 MiB) is too small for D8's dex merge of the
# androidTest dependencies: kotlin-android-instrumented failed with
# `OutOfMemoryError: Java heap space` in mergeExtDexDebugAndroidTest. Setting
# jvmargs replaces every default, so the metaspace cap and encoding are restated.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
