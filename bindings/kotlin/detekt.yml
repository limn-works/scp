build:
  maxIssues: 0

# UniFFI-generated bindings in `src/main/kotlin/works/limn/scp/internal/uniffi/`
# are excluded via the Gradle `tasks.withType<Detekt>().configureEach`
# block in each module's build.gradle.kts. detekt 1.23 removed the
# `build.excludes` YAML key that used to live here; the Gradle-side
# exclusion is the supported replacement.

complexity:
  CyclomaticComplexMethod:
    threshold: 25
  LongMethod:
    threshold: 60
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 15
    thresholdInInterfaces: 15
  ComplexCondition:
    threshold: 4

style:
  ForbiddenComment:
    values: ["TODO", "FIXME", "HACK"]
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
