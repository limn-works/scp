build:
  maxIssues: 0
  excludes:
    - "**/internal/uniffi/**"

complexity:
  CyclomaticComplexMethod:
    threshold: 25
  LongMethod:
    threshold: 60
  TooManyFunctions:
    thresholdInFiles: 30
  ComplexCondition:
    threshold: 4

style:
  ForbiddenComment:
    values: ["TODO", "FIXME", "HACK"]
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
