# Read by scripts/check-examples-typecheck.sh. The SDK's floor is Python 3.10
# (bindings/python/pyproject.toml), so a site that type-checks here runs on every
# interpreter the SDK supports.
[mypy]
python_version = 3.10
strict = True
warn_unused_configs = True

# The gate judges the sites, not the SDK: mypy reads the SDK's types and reports
# no error inside the SDK itself.
[mypy-scp_sdk.*]
follow_imports = silent
