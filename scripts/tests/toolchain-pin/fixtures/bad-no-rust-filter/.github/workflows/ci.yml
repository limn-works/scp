# Fixture: the `rust` filter is absent entirely. The gate reports the missing
# filter instead of passing because it found nothing to compare, which is the
# fail-closed shape `.docs/lessons/coverage-gates-must-fail-closed.md` requires.
name: CI
env:
  FUZZ_TOOLCHAIN: nightly-2026-05-03
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            fuzz:
              - 'fuzz/**'
