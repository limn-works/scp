# Fixture: someone narrowed the `fuzz` filter to the fuzz targets, so a change to
# `fuzz/rust-toolchain.toml` no longer runs the fuzz-crate check that compiles on
# the nightly that file pins.
name: CI
env:
  FUZZ_TOOLCHAIN: nightly-2026-05-03
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'rust-toolchain.toml'
            fuzz:
              - 'fuzz/fuzz_targets/**'
              - 'crates/scp-protocol/**'
