# A second workflow writing the same group: the cap is per repository, so the check
# counts writers across files.
name: Bad B
on: schedule
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
