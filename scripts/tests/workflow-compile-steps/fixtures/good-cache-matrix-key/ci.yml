name: Good
on: push
jobs:
  optional:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [transport, node-relay]
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: optional-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
  reader:
    runs-on: macos-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: optional-transport
          save-if: false
