name: Good
# A schedule writes these groups, so check `push runs`, which governs only what a push
# to main runs, leaves the jobs below alone; good-push-runs holds the push shape.
on:
  schedule:
    - cron: "0 3 * * *"
jobs:
  optional:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [transport, node-relay]
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: optional-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
  reader:
    runs-on: macos-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: optional-transport
          save-if: false
