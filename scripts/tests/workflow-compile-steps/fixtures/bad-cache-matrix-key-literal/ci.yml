name: Bad
on: push
jobs:
  optional:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [transport, node-relay, platform-testing]
    steps:
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: transport-optional
          save-if: ${{ github.ref == 'refs/heads/main' }}
