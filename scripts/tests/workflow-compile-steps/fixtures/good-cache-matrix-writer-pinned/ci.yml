name: Good
on: push
jobs:
  sharded:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: fuzz_a
          - target: fuzz_b
    steps:
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-run
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'fuzz_a' }}
