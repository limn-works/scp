# Three groups, one writer each, on main — the build-mode and check-mode jobs that
# write one `target/debug` hold two of them, and a job whose commands span both modes
# restores both groups, one step each; six uniffi-bindgen steps whose `cargo run`
# flags name the directory the `--library` sits in.
name: Good
# A schedule writes these groups, so check `push runs`, which governs only what a push
# to main runs, leaves the jobs below alone; good-push-runs holds the push shape.
on:
  schedule:
    - cron: "0 3 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo test
          cargo test --doc
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          cargo clippy
          cargo doc
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: false
      - uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-check
          save-if: false
      - run: |
          cargo test --doc
          cargo doc --no-deps
  fuzz-nightly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [a, b]
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "fuzz -> target"
          shared-key: fuzz-run
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'a' }}
  fuzz-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-cache
        with:
          workspaces: "fuzz -> target"
          shared-key: fuzz-run
          save-if: false
  swift:
    runs-on: macos-26
    steps:
      - run: cargo build --release --target aarch64-apple-darwin -p scp-ffi-uniffi
      - run: |
          cargo run --release --target aarch64-apple-darwin -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library target/aarch64-apple-darwin/release/libscp_ffi_uniffi.dylib \
            --language swift
  android:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cargo run -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library target/debug/libscp_ffi_uniffi.so \
            --language kotlin
  profile-flag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cargo +stable run \
            --profile release \
            --target x86_64-unknown-linux-gnu \
            -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library=target/x86_64-unknown-linux-gnu/release/libscp_ffi_uniffi.so \
            --language kotlin
  custom-profile:
    runs-on: macos-26
    steps:
      # A custom profile writes a directory named after itself: the shape
      # build-xcframework.sh takes under `--profile ci-bridge`.
      - run: |
          cargo run --profile ci-bridge --target aarch64-apple-darwin -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library target/aarch64-apple-darwin/ci-bridge/libscp_ffi_uniffi.dylib \
            --language swift
  built-in-profiles:
    runs-on: ubuntu-latest
    steps:
      # Cargo writes `debug` for the built-in `test` profile and `release` for `bench`.
      - run: |
          cargo run --profile test -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library target/debug/libscp_ffi_uniffi.so \
            --language kotlin
      - run: |
          cargo run --profile bench -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library target/release/libscp_ffi_uniffi.so \
            --language kotlin
