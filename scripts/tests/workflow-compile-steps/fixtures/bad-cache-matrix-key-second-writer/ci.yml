name: Bad
on: push
jobs:
  optional:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [transport, node-relay]
    steps:
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: optional-${{ matrix.group }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
  other:
    runs-on: ubuntu-latest
    steps:
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: optional-transport
          save-if: ${{ github.ref == 'refs/heads/main' }}
