name: Install pinned Android SDK packages from checked archives
description: >-
  Keeps each requested Android SDK package the runner image already holds at its pinned
  revision. Downloads every other one's archive under a time bound, checks its size and
  SHA-256 against a pin, retries a failed attempt, and unpacks only an archive that
  matches; when every attempt fails the step fails naming the package. Puts the command-line tools, platform-tools and emulator on PATH and turns off
  the Android Gradle plugin's own SDK downloads. install.py beside this file states why
  and holds the pins. Every CI job that needs an Android SDK package installs it here,
  never through `sdkmanager --install`, android-actions/setup-android or
  reactivecircus/android-emulator-runner; check `verified-download` of
  scripts/tests/ci-gate/ci_gate_selftest.py enforces that.
inputs:
  packages:
    description: >-
      Space-separated SDK package paths as sdkmanager spells them, each one install.py
      pins (for example `ndk;27.3.13750724`).
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned Android SDK packages from checked archives
      shell: bash
      env:
        ANDROID_SDK_PACKAGES: ${{ inputs.packages }}
      # Word splitting is the point: one argument per package path. `-u` writes each
      # line as it is printed, so the log times every download and unpack; -I makes
      # python ignore PYTHONUNBUFFERED, so the flag and not the variable does this.
      run: python3 -I -u "$GITHUB_ACTION_PATH/install.py" $ANDROID_SDK_PACKAGES
