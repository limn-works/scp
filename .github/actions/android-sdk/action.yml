name: Install pinned Android SDK packages from checked archives
description: >-
  Downloads each requested Android SDK package's archive, checks its size and the SHA-1
  Google's repository manifest publishes against a pin, retries a mismatch, and unpacks
  only an archive that matches; when every attempt mismatches the step fails naming the
  package. Puts the command-line tools, platform-tools and emulator on PATH and turns off
  the Android Gradle plugin's own SDK downloads. install.py beside this file states why
  and holds the pins. Every CI job that needs an Android SDK package installs it here,
  never through `sdkmanager --install`, android-actions/setup-android or
  reactivecircus/android-emulator-runner; check `verified-download` of
  scripts/tests/ci-gate/ci_gate_selftest.py enforces that.
inputs:
  packages:
    description: >-
      Space-separated SDK package paths as sdkmanager spells them, each one install.py
      pins (for example `ndk;27.2.12479018`).
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned Android SDK packages from checked archives
      shell: bash
      env:
        ANDROID_SDK_PACKAGES: ${{ inputs.packages }}
      # Word splitting is the point: one argument per package path.
      run: python3 -I "$GITHUB_ACTION_PATH/install.py" $ANDROID_SDK_PACKAGES
