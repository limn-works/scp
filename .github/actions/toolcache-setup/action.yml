name: Set up Python, Node or Java from the runner's tool cache
description: >-
  Runs actions/setup-python, setup-node or setup-java only when the runner image's tool
  cache already holds the requested version, and fails when the action downloaded
  anything; guard.py states why. Check `verified-download` in
  scripts/tests/ci-gate/ci_gate_selftest.py fails a workflow that calls those actions
  directly.
inputs:
  tool:
    description: python, node or java.
    required: true
  version:
    description: >-
      The version (python and node also take several, one per line), as the upstream
      action's python-version, node-version or java-version input takes it.
    required: true
  registry-url:
    description: setup-node's registry-url; node only.
    required: false
    default: ""
outputs:
  python-path:
    description: setup-python's python-path output; python only.
    value: ${{ steps.python.outputs.python-path }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOOLCACHE_TOOL: ${{ inputs.tool }}
        TOOLCACHE_VERSION: ${{ inputs.version }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
        "$py" -I "$GITHUB_ACTION_PATH/guard.py" before "$TOOLCACHE_TOOL" "$TOOLCACHE_VERSION"
    - if: inputs.tool == 'python'
      id: python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.version }}
    - if: inputs.tool == 'node'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.version }}
        registry-url: ${{ inputs.registry-url }}
    - if: inputs.tool == 'java'
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: ${{ inputs.version }}
    - shell: bash
      env:
        TOOLCACHE_TOOL: ${{ inputs.tool }}
      run: |
        if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
        "$py" -I "$GITHUB_ACTION_PATH/guard.py" after "$TOOLCACHE_TOOL"
    # pyo3's build script resolves PYO3_PYTHON by name (ci.yml, cache-warm.yml and
    # compile-timings.yml set `python3.12`) and reruns only when PYO3_PYTHON or
    # PYO3_ENVIRONMENT_SIGNATURE changes (pyo3-build-config 0.24.2, src/impl_.rs,
    # find_interpreter). A restored cargo cache therefore keeps the library directory of
    # the interpreter on the cache writer's runner image: in run 42004309416 a runner
    # holding CPython 3.12.15 linked against /opt/hostedtoolcache/Python/3.12.16/x64/lib,
    # which it lacks. The signature names the interpreter's executable, version and
    # LIBDIR, so a different interpreter reruns the build script and the same one
    # rebuilds nothing. A PYO3_PYTHON that names no command fails the step.
    - if: inputs.tool == 'python'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${PYO3_PYTHON:-}" ]; then
          exit 0
        fi
        if ! command -v "$PYO3_PYTHON" > /dev/null; then
          echo "::error::PYO3_PYTHON names $PYO3_PYTHON, which is no command on PATH"
          exit 1
        fi
        signature="$("$PYO3_PYTHON" -I -c 'import sys, sysconfig; print(sys.executable, sys.version.split()[0], sysconfig.get_config_var("LIBDIR"))')"
        echo "PYO3_ENVIRONMENT_SIGNATURE=$signature" >> "$GITHUB_ENV"
