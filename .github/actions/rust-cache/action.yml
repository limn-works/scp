name: Restore and save the cargo cache, keyed on every input that changes an artifact
description: >-
  Runs Swatinem/rust-cache with the digest manifest-digest.sh prints for each workspace's
  root Cargo.toml in its `prefix-key`. rust-cache hashes member manifests, Cargo.lock,
  `.cargo/config.toml`, `rust-toolchain(.toml)`, `rustc -vV` and the CARGO*/RUST*
  environment, but never a virtual root manifest, which holds this repository's
  `[profile.*]` tables, `[workspace.dependencies]` features and `[patch.crates-io]`.
  manifest-digest.sh states what the digest drops and why. For a group that
  .github/workflows/cache-warm.yml writes, the prefix also carries a digest of that
  file, whose commands decide what the group's entry holds; every other group's key
  ignores it. Every workflow step that
  restores the cargo cache uses this action; job ci-workflow-selftest rejects a direct
  Swatinem/rust-cache step.
inputs:
  shared-key:
    description: The cache group; rust-cache's `shared-key`.
    required: true
  save-if:
    description: Whether this step saves; rust-cache's `save-if`.
    required: true
  workspaces:
    description: >-
      rust-cache's `workspaces`: one `<root> -> <target>` per line. The digest covers the
      Cargo.toml at each root.
    required: false
    default: ". -> target"
outputs:
  cache-hit:
    description: >-
      rust-cache's `cache-hit`: "true" when the restored entry's key matched exactly,
      which also means the save step will not write.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Digest each workspace's root Cargo.toml
      id: manifest
      shell: bash
      env:
        CACHE_WORKSPACES: ${{ inputs.workspaces }}
        CACHE_GROUP: ${{ inputs.shared-key }}
      run: |
        set -euo pipefail
        roots=()
        while IFS= read -r line; do
          root="${line%%->*}"
          root="${root#"${root%%[![:space:]]*}"}"
          root="${root%"${root##*[![:space:]]}"}"
          [[ -n $root ]] && roots+=("$root")
        done <<< "$CACHE_WORKSPACES"
        digest="$(bash "$GITHUB_ACTION_PATH/manifest-digest.sh" "${roots[@]}")"
        # The commands .github/workflows/cache-warm.yml compiles decide what each
        # group it writes holds, so a change to them must write a new entry in place
        # of leaving the old one as an exact match that skips the save. The test reads
        # the group name alone, so a reader and its writer always agree, and a group
        # the file does not write keeps its key when the file changes.
        warm_file="$GITHUB_WORKSPACE/.github/workflows/cache-warm.yml"
        [[ -f $warm_file ]] || { echo "::error::$warm_file is not checked out, so this step cannot tell whether that workflow writes group $CACHE_GROUP"; exit 1; }
        key="${digest:0:16}"
        if grep -Eq "^[[:space:]]+shared-key:[[:space:]]+${CACHE_GROUP}[[:space:]]*$" "$warm_file"; then
          key="${key}-$(shasum -a 256 "$warm_file" | cut -c1-16)"
        fi
        echo "digest=${key}" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: v0-rust-${{ steps.manifest.outputs.digest }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
        workspaces: ${{ inputs.workspaces }}
