name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft PR, proceeding"

  # ── Rust ────────────────────────────────────────────────────────────
  rust-fmt:
    needs: check-draft
    name: Rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    needs: check-draft
    name: Rust / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Enable allow_in_memory_custody for scp-ffi-uniffi so that the
          # in-memory custody code paths are lint-checked. Mobile production
          # builds (iOS XCFramework, Android .aar) MUST NOT enable this
          # feature. See GitHub issue #88.
          cargo clippy --workspace --all-targets --features scp-ffi-uniffi/allow_in_memory_custody,scp-core/testing -- -D warnings

  rust-test:
    needs: check-draft
    name: Rust / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: |
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${LIBDIR}${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          # Enable allow_in_memory_custody for scp-ffi-uniffi so that
          # in-memory custody tests run. Mobile production builds (iOS
          # XCFramework, Android .aar) MUST NOT enable this feature.
          # See GitHub issue #88.
          cargo nextest run --workspace --features scp-ffi-uniffi/allow_in_memory_custody,scp-core/testing

  rust-doc:
    needs: check-draft
    name: Rust / doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run doc tests and build docs
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --doc --features scp-ffi-uniffi/allow_in_memory_custody,scp-core/testing
          cargo doc --workspace --no-deps --features scp-ffi-uniffi/allow_in_memory_custody,scp-core/testing

  rust-deny:
    needs: check-draft
    name: Rust / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Python ──────────────────────────────────────────────────────────
  python-lint:
    needs: check-draft
    name: Python / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  python-test:
    needs: check-draft
    name: Python / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio
      - run: PYTHONPATH=. pytest tests/ -v

  # ── TypeScript ──────────────────────────────────────────────────────
  typescript-check:
    needs: check-draft
    name: TypeScript / check + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run lint
      - run: bun test

  # ── Kotlin ──────────────────────────────────────────────────────────
  kotlin-test:
    needs: check-draft
    name: Kotlin / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
