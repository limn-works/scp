name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft PR, proceeding"

  # Detect which language areas changed. Jobs skip when their paths
  # haven't been touched, but still report "success" to branch protection.
  changes:
    needs: check-draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            python:
              - 'bindings/python/**'
            typescript:
              - 'bindings/typescript/**'
            kotlin:
              - 'bindings/kotlin/**'
            swift:
              - 'bindings/swift/**'
              - 'crates/scp-ffi/uniffi/**'

  # ── Error codes ───────────────────────────────────────────────────
  error-codes:
    needs: check-draft
    name: Error code conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-error-codes.sh

  # ── Rust ────────────────────────────────────────────────────────────
  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Enable allow_in_memory_custody for scp-ffi-uniffi so that the
          # in-memory custody code paths are lint-checked. Mobile production
          # builds (iOS XCFramework, Android .aar) MUST NOT enable this
          # feature. See GitHub issue #88.
          cargo clippy --workspace --all-targets --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing -- -D warnings

  # Matrix jobs must always expand so each OS variant reports a status
  # to branch protection. Step-level `if` skips the heavy work instead.
  rust-test:
    needs: changes
    name: Rust / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Free disk space (Ubuntu)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          # The full Rust workspace (657 deps, 16 crates) needs ~12GB to compile.
          # Ubuntu runners ship with ~14GB free but pre-installed SDKs consume
          # most of it. Remove unused toolchains to reclaim ~20GB.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.rust == 'true'
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.rust == 'true'
      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${LIBDIR}${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          # Enable allow_in_memory_custody for scp-ffi-uniffi so that
          # in-memory custody tests run. Mobile production builds (iOS
          # XCFramework, Android .aar) MUST NOT enable this feature.
          # See GitHub issue #88.
          cargo nextest run --workspace --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing

  rust-doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / doc
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run doc tests and build docs
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --doc --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing
          cargo doc --workspace --no-deps --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing

  rust-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Python ──────────────────────────────────────────────────────────
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio
      - run: PYTHONPATH=. pytest tests/ -v

  # ── TypeScript ──────────────────────────────────────────────────────
  typescript-check:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    name: TypeScript / check + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run lint
      - run: bun test

  # ── Kotlin ──────────────────────────────────────────────────────────
  kotlin-lint:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :scp-sdk-kotlin:runKtlintCheckOverMainSourceSet
      - run: ./gradlew :scp-sdk-kotlin:detekt

  kotlin-test:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  # ── WASM ───────────────────────────────────────────────────────────
  wasm-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: WASM / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p scp-ffi-wasm --target wasm32-unknown-unknown -- -D warnings

  # ── Swift ──────────────────────────────────────────────────────────
  swift-lint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / lint + format
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/swift
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint and SwiftFormat
        # HOMEBREW_NO_AUTO_UPDATE prevents brew from auto-upgrading
        # formulae between CI runs, reducing version drift risk.
        # Known-good versions: swiftlint 0.63.2, swiftformat 0.60.1.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint swiftformat
      - run: swiftlint lint --strict
      - run: swiftformat --lint Sources/ Tests/

  swift-build-test:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build XCFramework (dev mode — macOS arm64 only)
        run: bindings/swift/build-xcframework.sh --dev
      - name: Build Swift package
        working-directory: bindings/swift
        run: swift build
      - name: Run Swift tests
        working-directory: bindings/swift
        run: swift test
