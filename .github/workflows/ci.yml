      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pin wasm-pack for reproducibility (same version as the wasm-test job) —
      # the --release-only build guard depends on the shipped wasm being a
      # release build (ADR-057 Prereq-4).
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Install dependencies
        working-directory: bindings/typescript-wasm
        run: bun install
      - name: Build (wasm-pack release + tsup + wasm asset copy)
        working-directory: bindings/typescript-wasm
        run: bun run build
      - name: Guards (--release-only + node-free bundle isolation)
        working-directory: bindings/typescript-wasm
        run: |
          bun run guard:release-only
          bun run guard:node-free
      - name: Check + lint + test (real wasm)
        working-directory: bindings/typescript-wasm
        run: |
          bun run check
          bun run lint
