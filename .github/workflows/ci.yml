name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft PR, proceeding"

  # Detect which language areas changed. Jobs skip when their paths
  # haven't been touched, but still report "success" to branch protection.
  changes:
    needs: check-draft
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` selects the compiler for every lane below, not only the Rust
    # one: `python-test` runs `maturin develop`, `typescript-check` runs
    # `cargo build -p scp-ffi-napi`, the two wasm jobs run `wasm-pack build`, `kotlin-test`
    # runs `cargo build -p scp-ffi-uniffi`, and `swift-build-test` runs
    # `build-xcframework.sh`. Every job those outputs guard is written
    # `if: needs.changes.outputs.<lane> == 'true'`, and the `ci` job that aggregates every
    # other job's result counts a skipped job as a pass, so a lane the pin does not reach
    # lets a version bump merge with nothing compiling on the new compiler.
    #
    # `.cargo/config.toml` reaches every one of those lanes for the same reason: cargo
    # reads a `.cargo/config.toml` out of every ancestor of the directory a cargo command
    # runs in, so the rustflags it sets apply to each of those compiles.
    #
    # The `toolchain` filter below holds both files, and every output ORs that filter in,
    # so this workflow names each of them once. `scripts/check-toolchain-wiring.sh` reads
    # these output names out of this file and fails when one of them drops the OR, so a
    # lane added later is covered without editing that gate.
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.toolchain == 'true' }}
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.toolchain == 'true' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.toolchain == 'true' }}
      typescript-wasm: ${{ steps.filter.outputs.typescript-wasm == 'true' || steps.filter.outputs.toolchain == 'true' }}
      scaffold-typescript-web: ${{ steps.filter.outputs.scaffold-typescript-web == 'true' || steps.filter.outputs.toolchain == 'true' }}
      kotlin: ${{ steps.filter.outputs.kotlin == 'true' || steps.filter.outputs.toolchain == 'true' }}
      swift: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.toolchain == 'true' }}
      # `fuzz-build` is the one job the stable pin does not decide: it runs `cargo check`
      # with `working-directory: fuzz`, where rustup resolves `fuzz/rust-toolchain.toml`
      # instead, and the `fuzz` filter's `fuzz/**` entry already covers that file.
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The files that decide how every lane compiles, rather than what any one lane
            # compiles. The `outputs:` block above ORs this filter into every other lane,
            # so no other filter repeats an entry listed here.
            toolchain:
              - 'rust-toolchain.toml'
              # Cargo reads `.cargo/config.toml` out of every ancestor directory of the
              # one a cargo command runs in, so this file reaches every cargo invocation
              # in this workspace and every `wasm-pack build` under it. Its
              # `[target.wasm32-unknown-unknown]` stanza sets the rustflag that selects
              # getrandom's wasm backend, and `typescript-wasm-check` and
              # `scaffold-typescript-web-check` fail to link without it. A `[build]`
              # stanza added there would change what every other lane compiles.
              - '.cargo/**'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              # The `docker-image` job builds from these two and is guarded by this
              # filter, so a change to either has to reach it.
              - 'Dockerfile'
              - '.dockerignore'
              # `rust-clippy` reads `.clippy.toml` and `rust-fmt` reads `rustfmt.toml`,
              # and this filter guards both. A pull request that lowers a threshold in
              # either file and changes nothing else would otherwise skip the job that
              # reads it, and the next branch to rebase would find the check red.
              - '.clippy.toml'
              - 'rustfmt.toml'
              # `scripts/check-toolchain-wiring.sh` enumerates every root-level file in
              # the git tree, and every cargo configuration file the tree holds at any
              # depth, and fails when one is listed neither here nor in the `toolchain`
              # filter, unless that gate declares that no job reads it while it compiles.
              # A file added at the repository root later, or a `.cargo/config.toml`
              # added under any directory, fails that gate until someone classifies it.
            python:
              - 'bindings/python/**'
              - 'crates/scp-ffi/src/**'
              - 'crates/scp-ffi/common/**'
              # Two pytest suites live outside bindings/python. Without these
              # entries an edit to either one triggers no Python job. Neither
              # suite has a step in python-test below; a comment where each
              # step would go says why. These entries only make an edit under
              # either directory run Python jobs at all, and a step that reads
              # either suite still has to be added.
              - 'examples/reference-agent/**'
              - 'tests/integration/**'
            typescript:
              - 'bindings/typescript/**'
              - 'crates/scp-ffi/napi/**'
              - 'crates/scp-ffi/common/**'
            typescript-wasm:
              # The full path-dep closure of scp-client-wasm (verified via
              # `cargo tree -p scp-client-wasm -e no-dev`) — a change to any of
              # these can break the wasm32 compile / real-wasm e2e / guards, so
              # each must trigger this job.
              - 'bindings/typescript-wasm/**'
              - 'bindings/typescript/src/errors.ts'
              - 'crates/scp-client-wasm/**'
              - 'crates/scp-client/**'
              - 'crates/scp-mls/**'
              - 'crates/scp-crypto/**'
              - 'crates/scp-did/**'
              - 'crates/scp-clock/**'
              - 'crates/scp-protocol/**'
              - 'crates/scp-event-log/**'
              - 'crates/scp-relay-client/**'
            scaffold-typescript-web:
              # The browser scaffold builds against the local @limn-works/scp-ts-wasm
              # package (file: link), so a change to the scaffold OR to that package's
              # surface can break its typecheck / bundle — both must trigger this job.
              - 'scaffolds/typescript-web/**'
              - 'bindings/typescript-wasm/**'
            kotlin:
              - 'bindings/kotlin/**'
              - 'crates/scp-ffi/uniffi/**'
              - 'crates/scp-ffi/common/**'
            swift:
              - 'bindings/swift/**'
              - 'crates/scp-ffi/uniffi/**'
              - 'crates/scp-ffi/common/**'
            fuzz:
              - 'fuzz/**'
              - 'crates/scp-protocol/**'
              - 'crates/scp-transport/**'
              - 'crates/scp-runtime/**'
              - 'crates/scp-event-log/**'
              - 'crates/scp-clock/**'
              - 'crates/scp-crypto/**'
              - 'crates/scp-did/**'
              - 'crates/scp-dht/**'
              - 'crates/scp-mls/**'

  # ── Error codes ───────────────────────────────────────────────────
  error-codes:
    needs: check-draft
    name: Error code conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-error-codes.sh

  # ── Fail-closed pre-rotation (ADR-062 §Decision 6 / SCP-CAPINJECT-006) ──
  # Runs the production (no-`testing`) identity-creation paths and asserts they
  # FAIL CLOSED with the typed IdentityError::NoPreRotationBackend (SCP-IDENT-1059)
  # rather than minting the severed in-memory pre-rotation nullifier. These tests
  # are `#[cfg(not(feature = "testing"))]`, so they compile/run ONLY in the bare
  # build where the nullifier is severed (the workspace test lane runs WITH
  # `testing`, which mints — there the tests are excluded by cfg). This lane is the
  # standing regression guard: if the fail-closed lowering ever regresses to a
  # silent nullifier fallback, `Ok(_)` trips the assertion.
  fail-closed-pre-rotation:
    needs: check-draft
    name: Fail-closed pre-rotation (SCP-IDENT-1059)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: scp-node self-host create paths fail closed
        run: cargo test -p scp-node --lib pre_rotation_severance -- --nocapture
      # scp-identity carries two `#[cfg(not(feature = "testing"))]` fail-closed
      # proofs, matching scp-node. A workspace test lane enables `testing`, which
      # compiles both away, so neither proof executed anywhere.
      #
      # nextest with `--no-tests=fail`, not `cargo test <filter>`: a filter that
      # selects nothing exits 0 under `cargo test`, so a dependency edge turning
      # `testing` on for scp-identity would delete both proofs and leave this lane
      # green over zero assertions. `--no-tests=fail` exits 4 instead.
      - name: scp-identity create paths fail closed
        run: cargo nextest run --no-tests=fail -p scp-identity --lib -E 'test(fails_closed_without_pre_rotation_backend)'

  # ── G1: shipped-feature-graph prove-absence gate (ADR-062 §Decision 6) ──
  # Asserts every shipped FFI bridge and the scp-node/scp-relay binaries' resolved
  # SCP-crate feature set (dev-deps EXCLUDED) is a subset of an explicit
  # durability-only + real-backend allowlist — so NO
  # in-memory nullifier (custody / attestation / pre-rotation / DHT / did:key)
  # feature can reach a production binary. Closed ⊆-whitelist; ZERO nullifier
  # features is the gate's design mandate/target, with one disclosed
  # allow_unencrypted_storage residue — see ADR-062 §Status / #2292.
  # The fixture harness (a/b/c + soundness + allowlist hygiene) runs
  # first and must pass before the real workspace gate. NEVER add a resolved
  # nullifier feature to the allowlist to make this pass — fix the dependency edge.
  shipped-feature-graph:
    needs: check-draft
    name: Shipped-feature-graph (G1 prove-absence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: G1 — shipped-feature-graph ⊆ permitted-production allowlist (ZERO-nullifier mandate)
        run: bash scripts/check-shipped-feature-graph.sh

  # ── Cross-layer ──────────────────────────────────────────────────────
  cross-layer:
    needs: check-draft
    if: github.event_name == 'pull_request'
    name: Cross-layer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Check cross-layer coverage
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-cross-layer.sh

  # ── Bridge symmetry (ADR-047) ────────────────────────────────────────
  # Verifies that the three FFI bridges (PyO3, UniFFI, NAPI) expose the
  # same canonical operation set (per scripts/bridge-aliases.json). Scope is
  # SURFACE-AREA symmetry only; call-ordering invariants are enforced by
  # Layer B (scripts/check-call-invariants.py). Complements the Rust-side
  # enforcement in crates/scp-testing/tests/integration/ffi_conformance.rs —
  # the JSON alias table is the shared source of truth. See
  # .docs/adrs/ADR-047-bridge-symmetry-enforcement.md for rationale,
  # alternatives considered, and enforcement invariants.
  bridge-symmetry:
    needs: check-draft
    name: Bridge symmetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run bridge-symmetry CI check
        run: bash scripts/check-bridge-symmetry.sh
      - name: Run bridge-symmetry fixture tests
        run: bash scripts/tests/bridge-symmetry/run-tests.sh
      - name: Run enforcement-file hook tests
        run: bash scripts/tests/enforcement-files-hook/run-tests.sh

  # ── SDK coverage ─────────────────────────────────────────────────────
  sdk-coverage:
    needs: check-draft
    name: SDK capability matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin pytest and tree-sitter-rust to compatible version ranges so a
      # breaking upstream release cannot silently break CI (round-6 MINOR-3).
      # Other tree-sitter grammars remain unpinned to match the convention
      # used by the protocol-sync job below and minimize churn.
      - run: pip install 'pytest>=8,<10' 'tree-sitter-rust>=0.21,<0.25' tree-sitter tree-sitter-python tree-sitter-typescript tree-sitter-kotlin tree-sitter-swift
      - name: Gate self-tests (extractor null-safety)
        run: python3.12 -m pytest scripts/test_check_sdk_coverage.py -v
      - run: python3.12 scripts/check-sdk-coverage.py
      - run: python3.12 scripts/check-call-invariants.py
      - name: cfg-walker unit tests (regression guard for MAJOR-1/MINOR-1/MINOR-2)
        run: python3.12 -m pytest scripts/tests/call-invariants/ -v

  # ── Protocol enforcement ─────────────────────────────────────────────
  protocol-sync:
    needs: check-draft
    name: Protocol sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-rust
      - run: python3.12 scripts/check-protocol-sync.py

  # ── Python stub parity ───────────────────────────────────────────────
  pyi-generated:
    needs: check-draft
    name: Python stub signature parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff pinned for reproducible CI — an unpinned `pip install ruff`
      # silently tracks upstream and a new release (e.g. 0.16.x restyling
      # Markdown code blocks) can red the lint gate repo-wide with no local
      # change. Bump deliberately in its own PR. Keep in sync with python-lint.
      - run: pip install tree-sitter tree-sitter-rust ruff==0.15.4
      # Self-test MUST run first: it plants a deliberately-transposed stub
      # parameter and proves the gate REJECTS it, before we trust it on the
      # real tree.
      - name: Self-test gate
        run: bash scripts/check-pyi-generated.sh --self-test
      - name: Real check (.pyi ↔ PyO3 signature parity)
        run: bash scripts/check-pyi-generated.sh

  # ── Construction pattern (ADR-052) ──────────────────────────────────────
  construction-pattern:
    needs: check-draft
    name: Construction pattern (ADR-052)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3.12 scripts/check-construction-pattern.py

  protocol-deps:
    needs: check-draft
    name: Protocol deps check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-protocol-deps.sh
      - run: bash scripts/check-no-shim-reexports.sh

  # ── FFI singleton enforcement (ADR-048, #1549 Phase 4) ──────────────────
  bridge-globals:
    needs: check-draft
    name: FFI / no-bridge-globals + OnceLock ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/check-no-bridge-globals.sh

  fallback-registry:
    needs: check-draft
    name: FFI / no-fallback-registry regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-fallback-registry.sh

  handle-affinity:
    needs: check-draft
    name: FFI / handle-affinity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-handle-affinity.sh

  # ── Toolchain wiring ───────────────────────────────────────────────
  # `rust-toolchain.toml` is the one place this repository names a Rust version, so
  # nothing can disagree with it. Two things a derivation cannot establish: that every
  # container build copies the pin into its image, since the base tag no longer names a
  # compiler; and which CI jobs a change to a pin has to reach, since every Rust job is
  # guarded by a paths filter and the `ci` aggregator counts a skipped job as a pass.
  toolchain-wiring:
    needs: check-draft
    name: enforcement / toolchain wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The mise check parses `.mise.toml` with `tomllib`, which the Python standard
      # library has held since 3.11, and it fails when no interpreter on PATH imports it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/check-toolchain-wiring.sh
      - name: Run toolchain-wiring cases
        run: bash scripts/tests/toolchain-wiring/run-tests.sh

  # ── Mutable shared process-global enforcement (ADR-048, #1549 Phase 4) ──
  # Forward-prevention gates that forbid the DEFAULT_BRIDGE_INSTANCE pattern
  # from creeping back in any language. Every new piece of per-system state
  # must live on the bridge instance or the language SDK class — not in a
  # module-level `static` / `let` / `var` / `static var` declaration.
  #
  # One job per language to keep failure attribution obvious.
  no-mutable-globals-rust:
    needs: check-draft
    name: enforcement / no-mutable-globals (rust workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-mutable-globals.sh

  no-mutable-globals-python:
    needs: check-draft
    name: enforcement / no-mutable-module-globals (python sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3.12 scripts/check-no-mutable-module-globals.py

  no-mutable-globals-ts:
    needs: check-draft
    name: enforcement / no-mutable-globals (typescript sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-ts-mutable-globals.sh

  no-mutable-globals-kotlin:
    needs: check-draft
    name: enforcement / no-mutable-globals (kotlin sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-kotlin-mutable-globals.sh

  # Swift `no_static_var` / `no_static_lazy_var` custom rules live inside
  # `bindings/swift/.swiftlint.yml` and are enforced by the existing
  # `swift` job's `swiftlint --strict` step (see the Swift build matrix).
  # This block is documentation — the gate runs elsewhere.

  # ── Actor-refactor enforcement (ADR-049) ────────────────────────────
  # Gates introduced by the actor-per-context refactor. Each script is
  # documented in its own file header; see .docs/adrs/ADR-049-actor-per-context.md
  # for the bigger picture.

  block-in-place:
    needs: check-draft
    name: Actor / block-in-place AST check + ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-rust
      # Self-test MUST run first: it proves the scanner catches every
      # known bypass pattern before we trust it on the real tree.
      - name: Self-test scanner
        run: python3.12 scripts/check-block-in-place.py --self-test
      - name: Real scan
        run: python3.12 scripts/check-block-in-place.py

  deleted-primitives:
    needs: check-draft
    name: Actor / deleted primitives ban
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-deleted-primitives.sh

  handler-no-panic:
    needs: check-draft
    name: Actor / handler panic-family ban (ADR-049 §10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-handler-no-panic.sh

  no-panic-abort:
    needs: check-draft
    name: FFI / no panic=abort in cdylib profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Self-test MUST run first: it plants panic = "abort" in a scratch
      # manifest (must be DETECTED) and confirms benign lines
      # (panic = "unwind" / the clippy lint panic = "deny" / a comment) are
      # NOT flagged — proving the gate is alive before we trust it on the tree.
      - name: Self-test gate
        run: bash scripts/check-no-panic-abort.sh --self-test
      - name: Real check
        run: bash scripts/check-no-panic-abort.sh

  saga-gating-granularity:
    needs: check-draft
    name: Actor / saga gating granularity (ADR-049 §3a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Self-test MUST run first: it plants an instance-wide AtomicBool saga
      # guard + a fake FFI saga export (must FAIL), correct per-set gating
      # (must PASS), and a no-gating-at-all supervisor (must FAIL) — proving
      # the gate is alive before we trust it on the real tree.
      - name: Self-test gate
        run: bash scripts/check-saga-gating-granularity.sh --self-test
      - name: Real check
        run: bash scripts/check-saga-gating-granularity.sh

  bridge-instance-lifecycle:
    needs: check-draft
    name: Actor / BridgeInstance lifecycle drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-rust
      - run: python3.12 scripts/check-bridge-instance-lifecycle.py

  wasm-protocol:
    needs: check-draft
    name: WASM / protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check -p scp-clock -p scp-crypto -p scp-did -p scp-protocol -p scp-relay-client -p scp-mls -p scp-client -p scp-event-log -p scp-client-wasm --target wasm32-unknown-unknown

  wasm-test:
    needs: check-draft
    name: WASM / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pin wasm-pack to a specific version for reproducibility (via the same
      # taiki-e/install-action the nextest job uses), instead of the unpinned
      # `curl … | sh` installer that always pulls latest.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Runs the `#[wasm_bindgen_test]` cases under Node — the real wasm32
      # execution the `wasm-protocol` build gate only compiles. Covers the
      # cross-target determinism KAT wasm entries, the error-mapping `JsValue`
      # wrapping, and the `JsStorage` extern round-trip (ADR-057 Prerequisite 5).
      - run: wasm-pack test --node crates/scp-client-wasm

  # ── Rust ────────────────────────────────────────────────────────────
  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Enable testing for scp-ffi-uniffi so that the
          # in-memory custody code paths are lint-checked. Mobile production
          # builds (iOS XCFramework, Android .aar) MUST NOT enable this
          # feature. See GitHub issue #88.
          cargo clippy --workspace --all-targets --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/testing,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/testing,scp-ffi-uniffi/outlet-capability-test-grant -- -D warnings
          # The optional network transports (quic, http3, udp, coap) are not in
          # the default feature set and are not activated by --workspace, so the
          # sweep above never lints them. They rotted undetected for months
          # (the quic feature stopped compiling). Lint them explicitly so a
          # broken optional transport fails CI. They co-compile (openssl-backed
          # udp/coap alongside ring-backed quic/http3), so a single combined
          # invocation covers all four.
          # `nostr` and `webrtc` join this list for that same reason: each
          # gates a `src/` module plus a `[[test]] required-features` target,
          # and no lint or test invocation activated either feature, so 41
          # tests and both adapter modules went unlinted and unrun.
          cargo clippy -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --all-targets -- -D warnings

  # Matrix jobs must always expand so each OS variant reports a status
  # to branch protection. Step-level `if` skips the heavy work instead.
  rust-test:
    needs: changes
    name: Rust / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Free disk space (Ubuntu)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          # The full Rust workspace (657 deps, 16 crates) needs ~12GB to compile.
          # Ubuntu runners ship with ~14GB free but pre-installed SDKs consume
          # most of it. Remove unused toolchains to reclaim ~20GB.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.rust == 'true'
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.rust == 'true'
      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${LIBDIR}${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          # Enable testing for scp-ffi-uniffi so that
          # in-memory custody tests run. Mobile production builds (iOS
          # XCFramework, Android .aar) MUST NOT enable this feature.
          # See GitHub issue #88.
          cargo nextest run --workspace --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/testing,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/testing,scp-ffi-uniffi/outlet-capability-test-grant
          # Test scp-transport with optional features that aren't enabled by
          # --workspace (combined includes rusqlite + scp-platform; local-cache
          # enables caching logic).
          cargo test -p scp-transport --features combined,local-cache
          # Optional network transports (quic, http3, udp, coap, nostr,
          # webrtc) are also not activated by --workspace. They co-compile, so
          # one combined invocation exercises every transport's test suite and
          # guards against silent rot, which broke `quic` for months.
          # `nostr` and `webrtc` each declare a `[[test]] required-features`
          # target (nostr_roundtrip, webrtc_roundtrip) that this list must
          # activate; without them those 10 tests plus 31 in-module tests under
          # src/nostr/ and src/webrtc/ compiled into no test binary CI ran.
          cargo nextest run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc
          # scp-node declares two `[[test]]` targets gated on its own `quic`
          # feature (quic_listener, quic_cross_transport). --workspace activates
          # neither, so their 5 tests ran nowhere.
          cargo nextest run -p scp-node --features quic,testing --test quic_listener --test quic_cross_transport
          # scp-node's well_known module asserts its advertised-transport
          # list twice per transport: once for a feature-off arm and once for a
          # feature-on arm. --workspace activates neither http3 nor udp, so only
          # those off arms ran.
          #
          # nextest with `--no-tests=fail`, not `cargo test <filter>`: a filter
          # that selects nothing exits 0 under `cargo test`, so renaming this
          # module would leave a green lane over zero assertions. `--no-tests=fail`
          # exits 4 instead. That expression selects 12 tests today.
          cargo nextest run --no-tests=fail -p scp-node --features http3,udp,testing --lib -E 'test(well_known)'
          # scp-platform gates its Apple SQLCipher storage adapter behind `apple`
          # and its syncable-storage trait behind `sync`. No crate enables either,
          # so both modules' tests — including a storage_conformance! expansion
          # over SyncableStorage — compiled into nothing.
          cargo nextest run -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing
          # persistence_advanced holds two tests gated on scp-testing's `sync` and
          # `combined` features, which --workspace does not activate.
          cargo nextest run -p scp-testing --features sync,combined --test persistence_advanced
          # The saga-journal durable crash-recovery round-trip is gated behind
          # scp-testing/sqlite (it opens a real on-disk SqliteStorage across two
          # processes). --workspace does NOT activate this optional feature, so
          # run that test explicitly with it enabled. Scoped to the
          # saga_bridge_journal_swap target on purpose: the broader
          # `-p scp-testing --features sqlite` also pulls in `persistence_sdk`,
          # which has a PRE-EXISTING SqliteStorage advisory-lock-on-reopen bug
          # (fails identically on main; the supervisor's spawned actors hold the
          # SqliteStorage Arc past the test's reopen). That is unrelated to this
          # journal swap and is left to its own focused fix.
          cargo nextest run -p scp-testing --features sqlite --test saga_bridge_journal_swap

  # Exercises the napi bridge in its PRODUCTION configuration: default features
  # (`server` on) but WITHOUT `testing` / `scp-core/testing` /
  # `scp-runtime/testing`. This is the config the feature-free context-export
  # tests target — `NodeMlsFactory::validate_creator_identity` only accepts
  # `did:dht:z*` identities here (no `did:test:` / `did:key:` test gate), so a
  # callback-shaped custody signer must round-trip and fail-closed for real.
  # Without this lane the production/bare napi test target could silently
  # regress (stop compiling, or stop running the export tests) unnoticed.
  rust-test-napi-production:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / test (napi production config)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run napi tests in production config (no custody/testing features)
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Default features = production: `server` on, no in-memory custody and
          # no `scp-runtime`/`scp-core` `testing` gates. The feature-free
          # context-export tests run here for real; the bare/production target
          # must compile and pass without the testing affordances.
          cargo test -p scp-ffi-napi --features server
          # Run scp-ffi-common with DEFAULT features (no `testing`, no
          # `testing`) so the DHT capability-injection ABSENCE
          # tripwires — `ffi_dht_client_is_pkarr_only_in_shipped_build` and
          # `disabled_node_resolution_returns_ok_none_for_unknown_did`, both
          # `#[cfg(not(feature = "testing"))]` — actually EXECUTE in CI. The
          # workspace nextest lane enables `scp-ffi-common/testing`, which
          # compiles those tests OUT, so without this production-config lane the
          # G1 in-memory-nullifier-absence tripwires would be latent (ADR-062
          # Slice 1). ci.yml is not an enforcement file; this is an added
          # positive test lane.
          cargo test -p scp-ffi-common

  # Builds the pyo3 bridge (`scp-ffi`) in its PRODUCTION configuration: default
  # features (`server` on) but WITHOUT `testing`. This is the
  # config `build-matrix.yml` only exercises at release/tag time, so a PR could
  # re-gate a production identity/SCPID/custody op behind the test-only
  # `testing` feature — making it vanish from the production lib —
  # and the regression would go unnoticed until release. This is the per-PR guard
  # against that over-gating regression class. Build-only (lib + bins): the pyo3
  # test suite assumes in-memory custody and does not compile in prod config, so
  # a full prod-config test lane is a separate follow-up. The lib build still
  # catches the bug class — a production op gated out of the lib won't compile.
  rust-build-pyo3-production:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / build (pyo3 production config)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Build pyo3 bridge in production config (no in-memory custody)
        run: |
          # pyo3 links libpython, so LD_LIBRARY_PATH must point at LIBDIR.
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Default features = production: `server` on, no `testing`.
          cargo build -p scp-ffi --features server

  # Builds the uniffi bridge (`scp-ffi-uniffi`) in its PRODUCTION configuration:
  # default features (`server` on) but WITHOUT `testing`. Same
  # guardrail rationale as the pyo3 lane above: `build-matrix.yml` only builds
  # the mobile (iOS XCFramework / Android .aar) production libs at release time,
  # so a PR could re-gate a production op behind the test-only feature and break
  # the production lib unnoticed until release. This is the per-PR guard against
  # that over-gating regression class. Build-only (lib + bins): the uniffi test
  # suite assumes in-memory custody and does not compile in prod config, so a
  # full prod-config test lane is a separate follow-up.
  rust-build-uniffi-production:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / build (uniffi production config)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build uniffi bridge in production config (no in-memory custody)
        run: |
          # Default features = production: `server` on, no `testing`.
          cargo build -p scp-ffi-uniffi --features server

  rust-doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / doc
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run doc tests and build docs
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --doc --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint
          cargo doc --workspace --no-deps --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint

  rust-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Container image ─────────────────────────────────────────────────
  # Builds the `Dockerfile` that ships `scp-relay` and `scp-node`, and that
  # `templates/personal-relay/README.md` tells a self-hosting operator to run. Nothing
  # built this image until this job existed, so it sat on `FROM rust:1.85-slim` —
  # thirteen minor versions behind the pin — while every other file read the current
  # one, and its `.dockerignore` excluded the `*.md` files twelve crates pull in with
  # `#![doc = include_str!("../README.md")]`. Both defects compile fine and break only
  # at `docker build`.
  #
  # The build reaches the release compile of both binaries, so it is the slowest job
  # here; the gha cache keeps a re-run that changes no dependency to the final stage.
  docker-image:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Docker / relay and node image
    runs-on: ubuntu-latest
    steps:
      # The builder stage measures about 6 GB — 2 GB of it the pin's cross-compilation
      # targets — before the buildx cache blobs. `rust-clippy` here and all three jobs in
      # `fuzz.yml` already reclaim this space.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Read the cache everywhere; write it only from a push to `main`. A cache
          # written on a pull-request ref is readable only by that pull request, and it
          # would evict entries from the 10 GB budget the ~18 `Swatinem/rust-cache` steps
          # in this workflow share. `ignore-error` so a cache-service failure cannot fail
          # the build check: this job answers whether the image builds.
          cache-from: type=gha,scope=docker-image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=docker-image,ignore-error=true' || '' }}

  # ── Python ──────────────────────────────────────────────────────────
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff pinned for reproducible CI (see the pyi-generated job above for
      # rationale). Bump deliberately in its own PR.
      - run: pip install ruff==0.15.4
      - run: ruff format --check .
      - run: ruff check .
      # H14 / M16: enforce `is not None` over falsy checks on Optional
      # collection parameters at the FFI boundary. Run from the repo root
      # because the script resolves paths relative to its own location.
      - name: Falsy-Optional check
        working-directory: ${{ github.workspace }}
        run: python3.12 scripts/check-python-falsy-optionals.py

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio maturin
      - name: Build PyO3 native module
        run: |
          source .venv/bin/activate
          cd bindings/python
          # `testing` forwards `scp-dht/testing`, which compiles the in-memory
          # DHT seam (`FfiDhtClient::InMemory`) the co-located multi-party tests
          # rely on to resolve each participant's DID within one process. Without
          # it the bridge would build the real Mainline Pkarr client for DID
          # resolution, and same-process governance vote verification would
          # fail-close to "unknown voter" (ADR-062 §Decision 1 gated the in-memory
          # DHT nullifier behind `testing`; the functional test harness opts in).
          maturin develop --release --features testing
      - name: Run tests (including real FFI)
        run: |
          source .venv/bin/activate
          cd bindings/python
          # Parity tests require Bun/Kotlin/Swift runners that are not
          # available in this job — they run in dedicated parity jobs below.
          PYTHONPATH=. pytest tests/ -v -m "not parity"
      # `cd bindings/python` above resolves `tests/` to `bindings/python/tests/`,
      # so pytest suites that live elsewhere in this repository run in no CI job.
      # Two such suites exist, and neither gets a step. Each comment below says
      # why its suite gets none.
      #
      # `examples/reference-agent/test_agent.py` gets no step. Two of its 23
      # tests, `TestEndToEnd::test_full_lifecycle` and
      # `TestDemoScript::test_demo_exits_zero`, fail whenever `scp_sdk` imports,
      # which the `maturin develop` step above makes true. Every one of the nine
      # SDK call sites in `examples/reference-agent/agent.py` names a symbol
      # `scp_sdk` no longer defines: `Identity.create_sync`, `Identity.load_sync`,
      # `Context.create_sync`, `Context.join_sync`, `context.send_sync`,
      # `context.leave_sync`, and a `Context(context_id=..., identity=...)`
      # constructor whose real signature reads `Context(handle, identity_did,
      # scp)`. `scp_sdk` defines no `*_sync` method at all today, because
      # identity and context operations moved onto an async `SCP` facade whose
      # constructor requires a storage config, as
      # `await scp.identity_create(custody)` and
      # `await scp.context_create(identity_did, params)`. Each call site sits
      # under `except ImportError`, which does not catch the `AttributeError`
      # that a deleted attribute raises, so that example returns a
      # `uuid`-fabricated DID when `scp_sdk` is absent and raises when it is
      # present. Rewriting that example against the async facade replaces its
      # agent module, its demo module, and its end-to-end tests, and makes the
      # suite require the compiled PyO3 module that its README calls optional,
      # which is a scoped work item rather than a CI wiring change.
      #
      # `tests/integration/phase3_integration_test.py` gets no step. Its 17 tests
      # import `ToolDefinition` and call `Identity.create`, `Context.create`,
      # `ctx.join`, `ctx.send`, `ctx.receive`, `ctx.close`, and `ctx.invoke`.
      # `scp_sdk` exports none of those today: an outlet redesign replaced
      # `ToolDefinition` with `scp_sdk.outlets.OutletDefinition`, which adds a
      # required `kind: OutletKind`, and context operations moved onto an `SCP`
      # facade as `SCP.context_create(identity_did, params)` and its siblings.
      # That module therefore fails at import, and every test in it patches
      # `sys.modules["_scp_core"]` with a `MagicMock`, so no test in it reaches
      # a PyO3 bridge either way. Rewriting that suite against a current facade
      # means re-deriving its 13 steps from `.docs/adrs/phase-3.md`, which is a
      # scoped work item rather than a CI wiring change.

  # ── TypeScript ──────────────────────────────────────────────────────
  typescript-check:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    name: TypeScript / check + lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NAPI native addon
        run: |
          # `scp-ffi-napi/testing` compiles the in-memory DHT seam
          # (`FfiDhtClient::InMemory`) the co-located multi-party TypeScript tests
          # rely on to resolve each participant's DID within one process. Without
          # it the addon builds the real Mainline Pkarr client for DID resolution,
          # and same-process resolution/governance flows would block on the network
          # (test timeouts) or fail-close to "unknown voter" (ADR-062 §Decision 1
          # gated the in-memory DHT nullifier behind `testing`).
          cargo build -p scp-ffi-napi --release --features scp-ffi-napi/testing,scp-ffi-napi/testing
      - name: Install TypeScript dependencies
        working-directory: bindings/typescript
        run: bun install
      - name: Wire NAPI addon into node_modules
        run: |
          # Determine the platform-specific package name and library filename
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) NAPI_PKG="@limn-works/scp-ts-napi-linux-x64-gnu" ;;
            aarch64|arm64) NAPI_PKG="@limn-works/scp-ts-napi-linux-arm64-gnu" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          # Create a fake platform package in node_modules so createRequire finds it
          PKG_DIR="bindings/typescript/node_modules/${NAPI_PKG}"
          mkdir -p "$PKG_DIR"
          # The cargo build produces a cdylib; copy and rename to .node for NAPI loading
          LIB_FILE="target/release/libscp_ffi_napi.so"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: cdylib not found at $LIB_FILE"
            ls -la target/release/libscp_ffi_napi* 2>/dev/null || true
            exit 1
          fi
          cp "$LIB_FILE" "$PKG_DIR/index.node"
          # Create a minimal package.json so require() resolves
          echo '{"name":"'"$NAPI_PKG"'","version":"0.1.0","main":"index.node"}' > "$PKG_DIR/package.json"
      - name: Run checks
        working-directory: bindings/typescript
        run: |
          bun run check
          bun run lint
          bun test

  # ── TypeScript (wasm tier) ──────────────────────────────────────────
  typescript-wasm-check:
    needs: changes
    if: needs.changes.outputs.typescript-wasm == 'true'
    name: TypeScript-wasm / build + check + lint + guards + test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pin wasm-pack for reproducibility (same version as the wasm-test job) —
      # the --release-only build guard depends on the shipped wasm being a
      # release build (ADR-057 Prereq-4).
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Install dependencies
        working-directory: bindings/typescript-wasm
        run: bun install
      - name: Build (wasm-pack release + tsup + wasm asset copy)
        working-directory: bindings/typescript-wasm
        run: bun run build
      - name: Guards (--release-only + node-free bundle isolation)
        working-directory: bindings/typescript-wasm
        run: |
          bun run guard:release-only
          bun run guard:node-free
      - name: Check + lint + test (real wasm)
        working-directory: bindings/typescript-wasm
        run: |
          bun run check
          bun run lint
          bun test

  # ── TypeScript (browser scaffold) ───────────────────────────────────
  # Bounded gate for the structural browser scaffold (ADR-057 Slice 4, #1951):
  # it depends on the local @limn-works/scp-ts-wasm package via a file: link, so
  # build that package first (it emits the dist/ the scaffold resolves), then
  # install + typecheck + lint + bundle the scaffold. Build + check + lint +
  # build — not a new enforcement framework.
  scaffold-typescript-web-check:
    needs: changes
    if: needs.changes.outputs.scaffold-typescript-web == 'true'
    name: TypeScript-web scaffold / build wasm dep + check + lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Build the local wasm SDK package so the scaffold's file: dependency
      # resolves against real, built dist/ (types + ESM + the .wasm sibling).
      - name: Build @limn-works/scp-ts-wasm (dependency)
        working-directory: bindings/typescript-wasm
        run: |
          bun install
          bun run build
      - name: Install scaffold dependencies
        working-directory: scaffolds/typescript-web
        run: bun install
      - name: Check + lint + build
        working-directory: scaffolds/typescript-web
        run: |
          bun run check
          bun run lint
          bun run build

  # ── Kotlin ──────────────────────────────────────────────────────────
  kotlin-lint:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9acab5b5fbb560a72797e9277c5b0adfeed3bca" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-googlexr-license
          echo -e "\ne7ce8e93e13705710e8a1b7fdea3c49f149b1386" > $ANDROID_HOME/licenses/mips-android-sysimage-license
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :scp-kt:runKtlintCheckOverMainSourceSet
      - run: ./gradlew :scp-kt:detekt
      # `generateUniffiBindings` writes into `src/main/kotlin`, so Gradle fails
      # any task that reads that root and carries no ordering edge to it. Gradle
      # reports the failure only when both tasks land in one build and the
      # reader executes, and no job ran `sourcesJar` or `dokkaHtml` beside the
      # generator — so both shipped without an edge, and the release workflow's
      # publish-maven step would have aborted at `sourcesJar`. This gate reads
      # the edges out of Gradle's task model, so it fails on a missing edge
      # whatever the caller asked to build. It compiles no Rust, which is why it
      # belongs in this job rather than in `kotlin-test`.
      - run: ./gradlew :scp-kt:checkUniffiBindingsOrdering
      # `:scp-kt-android` declares detekt in its own build.gradle.kts and no job
      # invoked it, so every rule in ../detekt.yml — ForbiddenComment among them,
      # which is how this repository enforces its Kotlin stub policy — went
      # unread across that entire Android module.
      #
      # Run it in a step of its own rather than alongside a test task: Gradle
      # rejects `detekt` in one invocation with `:scp-kt:generateUniffiBindings`,
      # because detekt reads that task's output directory without declaring a
      # dependency on it.
      - run: ./gradlew :scp-kt-android:detekt

  kotlin-test:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9acab5b5fbb560a72797e9277c5b0adfeed3bca" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-googlexr-license
          echo -e "\ne7ce8e93e13705710e8a1b7fdea3c49f149b1386" > $ANDROID_HOME/licenses/mips-android-sysimage-license
      - run: sdkmanager "platforms;android-35"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UniFFI native library
        run: |
          cargo build -p scp-ffi-uniffi --features testing
      - name: Generate Kotlin bindings
        run: ./scripts/generate-uniffi-kotlin.sh --skip-build --features=testing
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: bindings/kotlin
        run: |
          # Set JNA library path to find the compiled Rust cdylib
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Name both modules' test tasks explicitly. `:scp-kt` applies a
          # `kotlin("jvm")` plugin, which registers `test` and never registers
          # `testDebugUnitTest`; `:scp-kt-android` applies `com.android.library`,
          # which registers `testDebugUnitTest`. A bare `./gradlew
          # testDebugUnitTest` therefore resolved in an Android module alone and
          # ran none of 492 tests in `:scp-kt` — including the real-FFI suites
          # that exercise the compiled cdylib this job builds two steps above.
          ./gradlew :scp-kt:test :scp-kt-android:testDebugUnitTest

  # ── Swift ──────────────────────────────────────────────────────────
  swift-lint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / lint + format
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/swift
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint and SwiftFormat
        # HOMEBREW_NO_AUTO_UPDATE prevents brew from auto-upgrading
        # formulae between CI runs, reducing version drift risk.
        # Known-good versions: swiftlint 0.63.2, swiftformat 0.60.1.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint swiftformat
      - run: swiftlint lint --strict
      - run: swiftformat --lint Sources/ Tests/

  swift-build-test:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build XCFramework (dev mode — macOS arm64 only)
        run: bindings/swift/build-xcframework.sh --dev
      - name: Build Swift package
        working-directory: bindings/swift
        run: swift build
      - name: Run Swift tests
        working-directory: bindings/swift
        run: swift test

  # ── Fuzz build check ─────────────────────────────────────────────────
  # Fast compilation check for the fuzz crate on every PR. Does not run
  # the fuzzer. Catches breakage when production APIs change and fuzz
  # targets are not updated to match. Requires nightly because the fuzz
  # crate uses libFuzzer internals.
  fuzz-build:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    name: Fuzz / build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      # This step names no channel. rustup applies the toolchain file of the directory a
      # command runs in, so running `cargo check` from `fuzz/` resolves
      # `fuzz/rust-toolchain.toml` and installs the nightly it names — the same
      # invocation `fuzz/README.md` documents. That file records why the channel is a
      # dated nightly and what unpins it.
      - name: Check fuzz crate compiles
        working-directory: fuzz
        run: cargo check
      # `cargo check` never compiles `#[cfg(test)]`, so one library test in a
      # fuzz crate — which asserts that Arbitrary MessageType discriminants
      # still match a production enum — ran in no job.
      - name: Run fuzz crate library tests
        working-directory: fuzz
        run: cargo test --lib

  # ── Bridge parity (ADR-046) ────────────────────────────────────────
  # Cross-bridge runtime parity harness: drives PyO3 (in-process) and
  # NAPI (Bun child) with identical inputs, asserts normalized output
  # equality. Layer C of the bridge enforcement stack (Layer A = FFI
  # conformance, Layer B = SDK capability matrix).
  bridge-parity:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Cross-bridge runtime parity
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - name: Check for unresolved issue placeholders
        # Runs immediately after checkout — a 1-second grep should not wait
        # on ~10 minutes of toolchain setup and native builds below.
        # Guards the whole bridge_parity directory (all op fixtures,
        # runners, and docstrings) against unresolved issue placeholders.
        # Any xfail or divergence callout must resolve to a real #NNNN
        # ref before merge — CLAUDE.md forbids fabricated story references.
        #
        # Historically this grep targeted a tracking file that held xfail
        # paperwork; that file was deleted when the last xfail was resolved.
        # The directory-wide grep kept here is a durable tripwire for any
        # future divergence paperwork that sneaks in under a sentinel shape.
        #
        # Pattern is intentionally broad: matches angle-bracket sentinels
        # containing "issue", "TODO", "TBD", or "placeholder". This catches
        # common rewordings a reviewer might use to bypass a literal phrase
        # match — e.g. "<TODO: file issue>", "<issue: pending>",
        # "<TBD: will file later>", "<placeholder issue>". Harmless angle
        # brackets like List<str> or <em>text</em> do not match. If you hit
        # a false positive, resolve it to a real #NNNN ref rather than
        # weakening the pattern.
        run: |
          if grep -rnE '<[^>]*(issue|TODO|TBD|placeholder)[^>]*>' bindings/python/tests/bridge_parity/; then
            echo "ERROR: Unresolved issue placeholder in bridge_parity docs. File the GitHub issues and substitute real #NNNN refs before merging." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio maturin
      - name: Build PyO3 native module
        run: |
          source .venv/bin/activate
          cd bindings/python
          maturin develop --release --features scp-core/testing,testing
      - name: Build NAPI native addon
        run: |
          cargo build -p scp-ffi-napi --release \
            --features scp-ffi-napi/testing,scp-ffi-napi/testing,scp-core/testing
      - name: Wire NAPI addon into node_modules
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) NAPI_PKG="@limn-works/scp-ts-napi-linux-x64-gnu" ;;
            aarch64|arm64) NAPI_PKG="@limn-works/scp-ts-napi-linux-arm64-gnu" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          PKG_DIR="bindings/typescript/node_modules/${NAPI_PKG}"
          mkdir -p "$PKG_DIR"
          LIB_FILE="target/release/libscp_ffi_napi.so"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: cdylib not found at $LIB_FILE"
            ls -la target/release/libscp_ffi_napi* 2>/dev/null || true
            exit 1
          fi
          cp "$LIB_FILE" "$PKG_DIR/index.node"
          echo '{"name":"'"$NAPI_PKG"'","version":"0.1.0","main":"index.node"}' > "$PKG_DIR/package.json"
      - name: Install TypeScript workspace deps
        working-directory: bindings/typescript
        run: bun install
      - name: Run parity tests (NAPI only)
        # The Kotlin and Swift alt-bridge cases are covered by dedicated
        # jobs (`bridge-parity-kotlin`, `bridge-parity-swift`) that own
        # their respective toolchains. Filter by test ID (which encodes
        # the alt-bridge mode as a prefix, e.g. `napi-identity_create...`)
        # so this job's selection stays a single source of truth aligned
        # with `_BRIDGE_MATRIX` in test_bridge_parity.py.
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/bridge_parity/ -v -m parity -k "napi"

  # ── Bridge parity (Kotlin UniFFI) ──────────────────────────────────
  # Layer C extension: runs the same ADR-046 harness against the UniFFI
  # Kotlin bindings. Separate job because it needs a JVM toolchain and
  # a pre-built UniFFI Kotlin binding tree on top of the Python + Rust
  # stack the parent bridge-parity job already carries.
  bridge-parity-kotlin:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.kotlin == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Cross-bridge runtime parity (UniFFI Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio maturin
      - name: Build PyO3 native module
        run: |
          source .venv/bin/activate
          cd bindings/python
          maturin develop --release --features scp-core/testing,testing
      - name: Build UniFFI cdylib
        run: |
          cargo build -p scp-ffi-uniffi --features testing
      - name: Generate UniFFI Kotlin bindings
        run: ./scripts/generate-uniffi-kotlin.sh --skip-build --features=testing
      - name: Build Kotlin parity runner (installDist)
        # Uses the bindings/kotlin/gradlew wrapper against the runner
        # project; `-p` points Gradle at the runner's directory so its
        # settings.gradle.kts (which composite-includes scp-kt) is
        # honored. `installDist` lays out a runnable bin script that
        # the Python harness launches directly — NOT via `gradle run`,
        # which would wire the Gradle daemon into the stdio pipe.
        #
        # `-Pscp.uniffi.extraFeatures=testing` threads the `testing`
        # cargo feature through scp-kt's `generateUniffiBindings` task
        # (see build.gradle.kts). Without it, the task's invocation of
        # `generate-uniffi-kotlin.sh --features=testing`
        # would re-run `cargo build -p scp-ffi-uniffi` without
        # `testing`, overwriting the dylib we just built (line above)
        # with both features. The parity harness drives
        # `signed_at_override`, which is `#[cfg(feature = "testing")]`-
        # gated — so the overwritten dylib rejects the parameter and
        # the Kotlin job fails.
        run: |
          bindings/kotlin/gradlew \
            -p bindings/python/tests/bridge_parity/helpers/kotlin_bridge_runner \
            installDist --no-daemon \
            -Pscp.uniffi.extraFeatures=testing
      - name: Run parity tests (UniFFI Kotlin only)
        env:
          # JNA loads the UniFFI cdylib via the system library path.
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          # Explicit runner-binary override (conftest also falls back
          # to the default installDist output; this makes CI failures
          # easier to diagnose by pinning the path).
          SCP_PARITY_KOTLIN_RUNNER: ${{ github.workspace }}/bindings/python/tests/bridge_parity/helpers/kotlin_bridge_runner/build/install/kotlin-bridge-runner/bin/kotlin-bridge-runner
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/bridge_parity/ -v -m parity -k "uniffi-kotlin"

  # ── Bridge parity (Swift UniFFI, macOS) ────────────────────────────
  # Layer C extension: runs the same ADR-046 harness against the UniFFI
  # Swift bindings. Pinned to macos-latest because UniFFI Swift ships
  # as an .xcframework that targets Apple platforms.
  bridge-parity-swift:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.swift == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Cross-bridge runtime parity (UniFFI Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio maturin
      - name: Build PyO3 native module
        run: |
          source .venv/bin/activate
          cd bindings/python
          maturin develop --release --features scp-core/testing,testing
      - name: Build XCFramework (dev mode — macOS arm64 only)
        run: bindings/swift/build-xcframework.sh --dev
      - name: Build Swift parity runner
        run: |
          cd bindings/python/tests/bridge_parity/helpers/swift_bridge_runner
          swift build -c release
      - name: Run parity tests (UniFFI Swift only)
        env:
          SCP_PARITY_SWIFT_RUNNER: ${{ github.workspace }}/bindings/python/tests/bridge_parity/helpers/swift_bridge_runner/.build/release/swift-bridge-runner
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/bridge_parity/ -v -m parity -k "uniffi-swift"

  # ── CI Gate ─────────────────────────────────────────────────────────
  # Single required check for branch protection. Depends on all CI jobs
  # and uses if: always() so it runs even when paths-filter skips jobs.
  # Reports success only when every non-skipped job succeeded.
  ci:
    if: always()
    needs:
      - error-codes
      - shipped-feature-graph
      - fail-closed-pre-rotation
      - cross-layer
      - bridge-symmetry
      - sdk-coverage
      - protocol-sync
      - protocol-deps
      - bridge-globals
      - fallback-registry
      - handle-affinity
      - pyi-generated
      - construction-pattern
      - block-in-place
      - no-panic-abort
      - handler-no-panic
      - saga-gating-granularity
      - deleted-primitives
      - bridge-instance-lifecycle
      - toolchain-wiring
      - docker-image
      - no-mutable-globals-rust
      - no-mutable-globals-python
      - no-mutable-globals-ts
      - no-mutable-globals-kotlin
      - wasm-protocol
      - wasm-test
      - rust-fmt
      - rust-clippy
      - rust-test
      - rust-test-napi-production
      - rust-build-pyo3-production
      - rust-build-uniffi-production
      - rust-doc
      - rust-deny
      - python-lint
      - python-test
      - typescript-check
      - typescript-wasm-check
      - scaffold-typescript-web-check
      - kotlin-lint
      - kotlin-test
      - swift-lint
      - swift-build-test
      - fuzz-build
      - bridge-parity
      - bridge-parity-kotlin
      - bridge-parity-swift
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=( \
            "${{ needs.error-codes.result }}" \
            "${{ needs.shipped-feature-graph.result }}" \
            "${{ needs.fail-closed-pre-rotation.result }}" \
            "${{ needs.cross-layer.result }}" \
            "${{ needs.bridge-symmetry.result }}" \
            "${{ needs.sdk-coverage.result }}" \
            "${{ needs.protocol-sync.result }}" \
            "${{ needs.protocol-deps.result }}" \
            "${{ needs.bridge-globals.result }}" \
            "${{ needs.fallback-registry.result }}" \
            "${{ needs.handle-affinity.result }}" \
            "${{ needs.pyi-generated.result }}" \
            "${{ needs.construction-pattern.result }}" \
            "${{ needs.block-in-place.result }}" \
            "${{ needs.no-panic-abort.result }}" \
            "${{ needs.handler-no-panic.result }}" \
            "${{ needs.saga-gating-granularity.result }}" \
            "${{ needs.deleted-primitives.result }}" \
            "${{ needs.bridge-instance-lifecycle.result }}" \
            "${{ needs.toolchain-wiring.result }}" \
            "${{ needs.docker-image.result }}" \
            "${{ needs.no-mutable-globals-rust.result }}" \
            "${{ needs.no-mutable-globals-python.result }}" \
            "${{ needs.no-mutable-globals-ts.result }}" \
            "${{ needs.no-mutable-globals-kotlin.result }}" \
            "${{ needs.wasm-protocol.result }}" \
            "${{ needs.wasm-test.result }}" \
            "${{ needs.rust-fmt.result }}" \
            "${{ needs.rust-clippy.result }}" \
            "${{ needs.rust-test.result }}" \
