name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  # CARGO_INCREMENTAL=0 turns off incremental compilation, which a CI job that compiles
  # a tree once gains nothing from. `Swatinem/rust-cache` hashes every CARGO_* variable
  # into its cache key, so the value also has to match across every job that shares a
  # cache group.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# ── Cargo cache groups ────────────────────────────────────────────────────────
#
# Every `Swatinem/rust-cache` step below names a `shared-key` and a `save-if`, and this
# comment says why both are required rather than left at their defaults.
#
# WHAT THE DEFAULTS DID. `add-job-id-key` defaults to true, so each step wrote its own
# entry: eighteen entries from this workflow, each holding the same ~650 compiled
# dependencies. GitHub caps a repository at 10 GB and evicts least-recently-used entries
# over that cap. Measured on 2026-09-13, this repository held 26 entries totalling
# 13.4 GB, none of them on `refs/heads/main`, so the cap was evicting entries faster
# than the runs wrote them. A run reads only the caches of its own ref and of the
# default branch, and a pull-request ref and a `gh-readonly-queue/…` ref are readable by
# nothing else, so those writes bought their own run nothing and evicted the entries a
# later run needed. Run 34711741563 missed on all four of its long jobs and took
# 33.6 minutes; run 34750056435 hit on three of the four and took 19.5 minutes; run
# 34731762140 hit on two and missed on two, which is eviction landing mid-run.
#
# WHAT THE TWO INPUTS DO. `shared-key` replaces the job id in the key, so the jobs that
# compile the same crate graph into the same target directory read and write one entry.
# `save-if` restricts writing to a push to `main`, whose entries every pull request and
# every merge-queue run can read.
#
# THE GROUPS. Cargo hashes the compile mode into every artifact's metadata
# suffix beside the profile and the feature set, so `cargo clippy` and `cargo doc`,
# which compile each dependency to an `.rmeta` in check mode, share no artifact with
# `cargo build` and `cargo nextest`, which compile the same dependency to an `.rlib` in
# build mode: the two land under different `.fingerprint/<crate>-<hash>` names in the
# same `target/debug`, and a check-mode job that restores a build-mode entry gets the
# registry and recompiles every dependency. That is why the directory alone does not
# name a group. rust-cache already appends the OS and architecture to every key, so a
# group name never spells one out:
#
#   workspace-debug   `target/debug` under build mode — rust-test (both matrix legs),
#                     rust-test-napi-production, rust-build-pyo3-production,
#                     rust-build-uniffi-production, kotlin-test, fail-closed-pre-rotation,
#                     shipped-feature-graph; and
#                     rust-doc (its `cargo test --doc`) in part, as the paragraph after
#                     this list says.
#   workspace-check   `target/debug` under check mode and the workspace feature
#                     resolution — rust-clippy's `workspace` leg, whose
#                     `cargo clippy --workspace` command compiles every dependency to an
#                     `.rmeta`, and rust-doc in part (its `cargo doc --no-deps`, whose
#                     dependency units cargo compiles in check mode as well). rust-doc
#                     restores both groups, one rust-cache step each, because its two
#                     commands read two disjoint artifact sets out of the one directory.
#   clippy-examples   `target/debug` under check mode, one package's dev-target feature
#                     set at a time — rust-clippy's `examples` leg, which runs
#                     scripts/check-examples-compile.sh and is the only member.
#   clippy-packages   `target/debug` under check mode and the feature resolution of
#                     each `-p` command it runs — rust-clippy's `packages` leg, the
#                     only member. None of its commands resolves the workspace
#                     feature set, so the `workspace-check` entry holds few of its units.
#   workspace-ci-bridge
#                     `target/ci-bridge` on Linux — pyo3-module, which runs
#                     `maturin develop --profile ci-bridge`, and napi-addon, which runs
#                     `cargo build -p scp-ffi-napi --profile ci-bridge`. The four
#                     producers other than kotlin-test (pyo3-module, pyo3-module-macos,
#                     napi-addon and xcframework) build under the `ci-bridge` profile the root
#                     Cargo.toml defines (SCP's crates at opt-level 1, dependencies at
#                     opt-level 3). This group and the two `-ci-bridge` groups below
#                     replaced `workspace-release`, `apple-uniffi` and `apple-parity`,
#                     which held `--release` output, when the producers moved to the
#                     profile. Keeping the old names would have stalled each group:
#                     rust-cache's key hashes no `[profile]` table, so the old entry
#                     matched the new key in full, restored a `target/release` the
#                     profile never reads, and a full match skips the save, so `main`
#                     would never have written the `target/ci-bridge` entry. Measured
#                     on the pull request's run: napi-addon restored
#                     `v0-rust-workspace-release-…` with `full match: true` and
#                     compiled every dependency (6m49s). Those two jobs are the
#                     only members. python-test, typescript-check and bridge-parity
#                     ran the `--release` form of one or both of those commands and
#                     belonged to `workspace-release`;
#                     they now download what the producers upload, so none of them
#                     runs cargo and none of them reads a cargo cache.
#                     bridge-parity-kotlin belonged to `workspace-release` for its `maturin develop
#                     --release`; it now downloads the PyO3 module from pyo3-module
#                     and the UniFFI cdylib from kotlin-test, and runs no cargo
#                     command. The two members write one
#                     directory under two feature resolutions and share one entry,
#                     which pyo3-module writes. `maturin develop` builds package
#                     scp-ffi, so that entry holds the dependency tree both bridges
#                     share and omits three direct dependencies
#                     crates/scp-ffi/napi/Cargo.toml names that reach no other member
#                     of this workspace — napi, napi-derive and napi-build — which
#                     napi-addon compiles on each run that builds the addon. Giving napi-addon a second group
#                     would cache those three and would also store a second copy of
#                     the shared tree, which is nearly all of `target/ci-bridge`,
#                     against the 10 GB repository cap the paragraph below counts, so
#                     the group keeps one writer. bridge-parity wrote the
#                     `workspace-release` entry before this arrangement and ran both
#                     `--release` commands, so what it wrote
#                     did cover the NAPI dependencies.
#   transport-optional
#                     `target/debug` again, but under a feature resolution no
#                     other job produces — rust-test-optional-features. Its
#                     `-p scp-transport`, `-p scp-testing`, `-p scp-node` and
#                     `-p scp-relay` selections resolve features over one
#                     package's subgraph, not the workspace. The scp-transport
#                     and scp-testing selections drop `scp-runtime/testing`,
#                     which gave 337 packages a fingerprint the `workspace-debug`
#                     entry does not hold, measured before the scp-node and
#                     scp-relay selections existed. Sharing that entry would
#                     restore artifacts none of its units match.
#   wasm32            `target/wasm32-unknown-unknown/release` — typescript-wasm-check
#                     and scaffold-typescript-web-check, which both run
#                     `wasm-pack build`. Jobs wasm-protocol and wasm-test read this
#                     group for its registry alone, because both compile under the dev
#                     profile; each step below says so where it sits.
#   apple-uniffi-ci-bridge
#                     `target/aarch64-apple-darwin/ci-bridge` — xcframework, which runs
#                     `bindings/swift/build-xcframework.sh --dev --profile ci-bridge`
#                     for both macOS jobs that read an XCFramework. swift-build-test
#                     ran `build-xcframework.sh --dev` and wrote the `apple-uniffi`
#                     entry; it downloads the result instead and reads no
#                     cargo cache.
#   apple-parity-ci-bridge
#                     `target/ci-bridge` on macOS — pyo3-module-macos, which runs
#                     `maturin develop --profile ci-bridge` for bridge-parity-swift.
#                     A rename abandons the entry `main` holds under the old name, so
#                     a group keeps its name unless, as here, that entry holds a
#                     directory its members no longer read.
#   fuzz              `fuzz/target/debug` — fuzz-build, whose `cargo check` compiles a
#                     separate workspace on the nightly `fuzz/rust-toolchain.toml`
#                     names, under the dev profile.
#
# rust-doc reads `workspace-debug` and `workspace-check` without matching either
# entry in full. Its two commands add `scp-node/cloud-blobs` and
# `scp-relay/cloud-blobs` to a `--workspace` command. Those features change the
# resolved features of scp-transport and of every workspace package that depends
# on it, and they add the `sqlx` and `aws-sdk-s3` dependency graphs. No job that
# writes either group runs a `--workspace` command with those features, so
# neither entry holds those units under rust-doc's feature resolution, and
# rust-doc recompiles them on every run because it saves no entry. No group
# holds rust-doc's resolution: the recompile costs one job's minutes, and a
# further entry per generation would cost cache space that every run shares.
#
# The cap is per repository, so `.github/workflows/fuzz.yml` counts against the same
# 10 GB: it writes one further group, `fuzz-run`, holding
# `fuzz/target/<host triple>/release` under `cargo fuzz run`'s RUSTFLAGS (its group
# comment on job fuzz-nightly says more). Eleven groups per generation across the two
# workflows, where the two together wrote thirty-six entries before. The four
# bridge-artifact entries the producer jobs save are not rust-cache groups; the
# comment above job pyo3-module counts them.
# `scripts/check-workflow-compile-steps.py`, run by job toolchain-wiring, fails any
# rust-cache step in any workflow that names no `shared-key` or no `save-if`, and any
# group with zero or with two writers or with a writer off `main`.
#
# WHICH JOB IN A GROUP WRITES. Exactly one, named below as the group's producer, and
# every other member carries `save-if: false`. The first job to reach its post step wins
# the upload and every later job with the same key is told the entry exists, so leaving
# `save-if` at its default would let the shortest job in a group decide the entry's
# contents — shipped-feature-graph resolves a feature graph and compiles almost nothing,
# and it finishes eleven minutes before rust-test. The producers are rust-test
# (workspace-debug), rust-clippy's three legs (workspace-check, clippy-examples and
# clippy-packages, one each), rust-test-optional-features
# (transport-optional), pyo3-module (workspace-ci-bridge), typescript-wasm-check
# (wasm32), xcframework (apple-uniffi-ci-bridge), pyo3-module-macos
# (apple-parity-ci-bridge) and
# fuzz-build (fuzz): in each group, the job that compiles the most of that directory
# under that mode.
#
# WHAT IS DELIBERATELY LEFT OFF. `cache-workspace-crates` stays false. A checkout writes
# every source file with the checkout's own mtime, which is newer than any cached
# artifact, so cargo rebuilds each workspace crate regardless and the entry would carry
# ~1 GB that never produces a hit.
#
# A rust-cache entry decides how long a job takes and never what it reports: cargo compares
# fingerprints against every restored artifact and recompiles what does not match. A
# group named wrong costs a miss, never a wrong result.

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Not a draft PR, proceeding"

  # Detect which language areas changed. Jobs skip when their paths
  # haven't been touched, but still report "success" to branch protection.
  changes:
    needs: check-draft
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` selects the compiler for every lane below, not only the Rust
    # one: `pyo3-module` and `pyo3-module-macos` run `maturin develop`, `napi-addon` runs
    # `cargo build -p scp-ffi-napi`, the two wasm jobs run `wasm-pack build`, `kotlin-test`
    # runs `cargo build -p scp-ffi-uniffi`, and `xcframework` runs `build-xcframework.sh`. Every job those outputs guard is written
    # `if: needs.changes.outputs.<lane> == 'true'`, and the `ci` job that aggregates every
    # other job's result counts a skipped job as a pass, so a lane the pin does not reach
    # lets a version bump merge with nothing compiling on the new compiler.
    #
    # `.cargo/config.toml` reaches every one of those lanes for the same reason: cargo
    # reads a `.cargo/config.toml` out of every ancestor of the directory a cargo command
    # runs in, so the rustflags it sets apply to each of those compiles.
    #
    # The `toolchain` filter below holds both files, and every output ORs that filter in,
    # so this workflow names each of them once. `scripts/check-toolchain-wiring.sh` reads
    # these output names out of this file and fails when one of them drops the OR, so a
    # lane added later is covered without editing that gate.
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.toolchain == 'true' }}
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.toolchain == 'true' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.toolchain == 'true' }}
      typescript-wasm: ${{ steps.filter.outputs.typescript-wasm == 'true' || steps.filter.outputs.toolchain == 'true' }}
      scaffold-typescript-web: ${{ steps.filter.outputs.scaffold-typescript-web == 'true' || steps.filter.outputs.toolchain == 'true' }}
      kotlin: ${{ steps.filter.outputs.kotlin == 'true' || steps.filter.outputs.toolchain == 'true' }}
      swift: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.toolchain == 'true' }}
      # `fuzz-build` is the one job the stable pin does not decide: it runs `cargo check`
      # with `working-directory: fuzz`, where rustup resolves `fuzz/rust-toolchain.toml`
      # instead, and the `fuzz` filter's `fuzz/**` entry already covers that file.
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The files that decide how every lane compiles, rather than what any one lane
            # compiles. The `outputs:` block above ORs this filter into every other lane,
            # so no other filter repeats an entry listed here — except `fuzz`, whose
            # output reads its own filter alone, so the `fuzz` filter lists this workflow
            # file a second time.
            toolchain:
              - 'rust-toolchain.toml'
              # This file itself. Every job a filter in this workflow guards takes its
              # command, its feature list, its matrix and its cache group from this file:
              # pyo3-module runs `maturin develop`, napi-addon runs
              # `cargo build -p scp-ffi-napi`, kotlin-test runs
              # `cargo build -p scp-ffi-uniffi`, xcframework runs
              # `bindings/swift/build-xcframework.sh`, and rust-test runs
              # `cargo nextest`, each with the arguments written here. A change to this
              # file decides what every one of those jobs compiles and runs, so it sits
              # in the filter every output but `fuzz` ORs in.
              #
              # It meets the criterion
              # `.docs/lessons/route-a-changed-file-to-every-lane-it-decides.md` states
              # for a path that needs routing: omitting it is invisible on an ordinary
              # pull request. A pull request that rewrites job rust-test's cargo command
              # and changes nothing else left every filter output false, skipped
              # rust-test, and merged with the `ci` aggregator green over a command
              # nothing had run — the rewritten lane first executing on whichever later
              # pull request happened to touch `crates/`. Listing the file in the `rust`
              # filter alone closed that hole for the Rust lane and left it open for
              # python-test, typescript-check, typescript-wasm-check,
              # scaffold-typescript-web-check, kotlin-test, swift-build-test and
              # fuzz-build, each of which takes its command from this file too.
              #
              # This is not the `'**'`-minus-exclusions filter that lesson rejects. That
              # alternative runs every lane on every `.docs/` and
              # `.claude/agent-memory/` commit, which is most of them; this entry names
              # one file, and a commit that edits it is rare and is exactly the commit
              # that needs every lane. The other workflows stay out of this filter:
              # `docs.yml` guards its own `rust-docs` job and lists itself in its own
              # `toolchain` filter, and `fuzz.yml`, `release.yml` and
              # `build-matrix.yml` define no job a paths filter guards.
              # `scripts/check-toolchain-wiring.sh` check 2e reads every output of the
              # `changes` job of every paths-filtered workflow and fails when one of them
              # reads no filter that lists the workflow's own path.
              - '.github/workflows/ci.yml'
              # Cargo reads `.cargo/config.toml` out of every ancestor directory of the
              # one a cargo command runs in, so this file reaches every cargo invocation
              # in this workspace and every `wasm-pack build` under it. Its
              # `[target.wasm32-unknown-unknown]` stanza sets the rustflag that selects
              # getrandom's wasm backend, and `typescript-wasm-check` and
              # `scaffold-typescript-web-check` fail to link without it. A `[build]`
              # stanza added there would change what every other lane compiles.
              - '.cargo/**'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              # The rust-clippy job runs scripts/check-examples-compile.sh and
              # its cases, so a change to either must trigger the job that runs it.
              - 'scripts/check-examples-compile.sh'
              - 'scripts/tests/examples-compile/**'
              # The `docker-image` job builds from these two and is guarded by this
              # filter, so a change to either has to reach it.
              - 'Dockerfile'
              - '.dockerignore'
              # `rust-clippy` reads `.clippy.toml` and `rust-fmt` reads `rustfmt.toml`,
              # and this filter guards both. A pull request that lowers a threshold in
              # either file and changes nothing else would otherwise skip the job that
              # reads it, and the next branch to rebase would find the check red.
              - '.clippy.toml'
              - 'rustfmt.toml'
              # `scripts/check-toolchain-wiring.sh` enumerates every root-level file in
              # the git tree, and every cargo configuration file the tree holds at any
              # depth, and fails when one is listed neither here nor in the `toolchain`
              # filter, unless that gate declares that no job reads it while it compiles.
              # A file added at the repository root later, or a `.cargo/config.toml`
              # added under any directory, fails that gate until someone classifies it.
            python:
              - 'bindings/python/**'
              - 'crates/scp-ffi/src/**'
              - 'crates/scp-ffi/common/**'
            typescript:
              - 'bindings/typescript/**'
              - 'crates/scp-ffi/napi/**'
              - 'crates/scp-ffi/common/**'
            typescript-wasm:
              # The full path-dep closure of scp-client-wasm (verified via
              # `cargo tree -p scp-client-wasm -e no-dev`) — a change to any of
              # these can break the wasm32 compile / real-wasm e2e / guards, so
              # each must trigger this job.
              - 'bindings/typescript-wasm/**'
              - 'bindings/typescript/src/errors.ts'
              - 'crates/scp-client-wasm/**'
              - 'crates/scp-client/**'
              - 'crates/scp-mls/**'
              - 'crates/scp-crypto/**'
              - 'crates/scp-did/**'
              - 'crates/scp-clock/**'
              - 'crates/scp-protocol/**'
              - 'crates/scp-event-log/**'
              - 'crates/scp-relay-client/**'
              # scp-client-wasm is member 15 of the root workspace, so
              # `wasm-pack build` resolves every `dep = { workspace = true }`
              # entry in the crates above against the root manifest's
              # `[workspace.dependencies]` and pins each one from the root
              # lockfile. A dependency bump that edits only those two files —
              # the shape of the h2 0.4.18 and rustls-webpki 0.103.13 advisory
              # updates — changes what this job compiles while it touches no
              # directory listed above. Until these two entries landed, such a
              # bump skipped this job and `scaffold-typescript-web-check` while
              # `ci` reported success.
              - 'Cargo.toml'
              - 'Cargo.lock'
            scaffold-typescript-web:
              # The browser scaffold builds against the local @limn-works/scp-ts-wasm
              # package (file: link), so a change to the scaffold OR to that package's
              # surface can break its typecheck / bundle — both must trigger this job.
              - 'scaffolds/typescript-web/**'
              - 'bindings/typescript-wasm/**'
            kotlin:
              - 'bindings/kotlin/**'
              - 'crates/scp-ffi/uniffi/**'
              - 'crates/scp-ffi/common/**'
            swift:
              - 'bindings/swift/**'
              - 'crates/scp-ffi/uniffi/**'
              - 'crates/scp-ffi/common/**'
            fuzz:
              # Every crate `cargo tree -e no-dev` reaches from fuzz/Cargo.toml,
              # read 2026-08-17. This list named nine of thirteen: it omitted
              # scp-relay-client, which fuzz/Cargo.toml declares as a direct
              # dependency, and omitted scp-core, scp-identity and scp-platform,
              # which scp-runtime pulls in. A change to any of those four broke
              # the fuzz build while job fuzz-build skipped.
              # scripts/tests/ci-gate/ci_gate_selftest.py recomputes this closure
              # from Cargo.toml path dependencies and fails when an entry is
              # missing, so a new dependency edge cannot silently shrink it.
              - 'fuzz/**'
              - 'crates/scp-clock/**'
              - 'crates/scp-core/**'
              - 'crates/scp-crypto/**'
              - 'crates/scp-dht/**'
              - 'crates/scp-did/**'
              - 'crates/scp-event-log/**'
              - 'crates/scp-identity/**'
              - 'crates/scp-mls/**'
              - 'crates/scp-platform/**'
              - 'crates/scp-protocol/**'
              - 'crates/scp-relay-client/**'
              - 'crates/scp-runtime/**'
              - 'crates/scp-transport/**'
              # Every crate above is a member of the root workspace and reads
              # its dependency versions from the root manifest's
              # `[workspace.dependencies]`, so a bump that edits only that table
              # changes what `cd fuzz && cargo check` compiles. This filter
              # lists no root `Cargo.lock`, because fuzz/Cargo.toml carries its
              # own `[workspace]` table and cargo resolves this build against
              # fuzz/Cargo.lock, which `fuzz/**` above already covers.
              - 'Cargo.toml'
              # This file itself, listed a second time because the `fuzz` output above
              # reads this filter alone and never the `toolchain` filter, which holds
              # the other copy. Job fuzz-build takes its `cargo check` command, its
              # working directory and its cache group from this file, so a pull request
              # that rewrites that command and changes nothing else would otherwise
              # skip the one job that runs it.
              - '.github/workflows/ci.yml'

  # ── Error codes ───────────────────────────────────────────────────
  error-codes:
    needs: check-draft
    name: Error code conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-error-codes.sh

  # ── Fail-closed pre-rotation (ADR-062 §Decision 6 / SCP-CAPINJECT-006) ──
  # Runs the production (no-`testing`) identity-creation paths and asserts they
  # FAIL CLOSED with the typed IdentityError::NoPreRotationBackend (SCP-IDENT-1059)
  # rather than minting the severed in-memory pre-rotation nullifier. These tests
  # are `#[cfg(not(feature = "testing"))]`, so they compile/run ONLY in the bare
  # build where the nullifier is severed (the workspace test lane runs WITH
  # `testing`, which mints — there the tests are excluded by cfg). This lane is the
  # standing regression guard: if the fail-closed lowering ever regresses to a
  # silent nullifier fallback, `Ok(_)` trips the assertion.
  fail-closed-pre-rotation:
    needs: check-draft
    name: Fail-closed pre-rotation (SCP-IDENT-1059)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - name: scp-node self-host create paths fail closed
        # nextest, not `cargo test`, because `cargo test <filter>` exits 0 when
        # its filter selects no test. Every test this filter selects (each
        # `pre_rotation_severance` test in crates/scp-node/src/lib.rs and
        # src/self_host.rs) carries `#[cfg(not(feature = "testing"))]`, so a
        # dependency edge that turned `testing` on for scp-node would delete
        # them and leave this lane green over zero assertions. Measured on this
        # tree: `cargo test -p scp-node --lib no_such_name` exits 0, while
        # `cargo nextest run --no-tests=fail -p scp-node --lib -E
        # 'test(no_such_name)'` exits 4.
        # This lane now reports such a loss instead of hiding it.
        run: cargo nextest run --no-tests=fail -p scp-node --lib -E 'test(pre_rotation_severance)'
      - name: scp-node shipped binary refuses --ephemeral before --health
        # The test spawns the shipped `scp-node` binary and asserts that `main`
        # calls `unavailable_mode` before the `--health` probe. It carries
        # `#[cfg(not(feature = "testing"))]`, and every other lane builds
        # scp-node with `testing` (the workspace nextest unifies it through
        # scp-ffi-common's `scp-node?/testing`), so every other lane compiles it
        # out. `-p scp-node` without `--features` builds it without `testing`,
        # as the step above relies on. This is its own step, not a second
        # filter on the step above, because `--no-tests=fail` fails only when an
        # invocation selects zero tests overall: kept apart, either test
        # disappearing turns its own step red.
        run: cargo nextest run --no-tests=fail -p scp-node --test run_mode_selection -E 'test(shipped_build_refuses_ephemeral_before_the_health_probe)'
      - name: scp-identity create paths fail closed
        # Three manifests turn `scp-identity/testing` on, each in its own
        # `[dev-dependencies]`: crates/scp-testing/Cargo.toml,
        # crates/scp-runtime/Cargo.toml, and crates/scp-ffi/common/Cargo.toml.
        # One cargo invocation resolves one feature set per package, so every
        # workspace-wide test build compiles scp-identity with `testing`
        # on — which compiles out its two `#[cfg(not(feature = "testing"))]`
        # assertions (ephemeral_create_fails_closed_without_pre_rotation_backend
        # and persisted_create_fails_closed_without_pre_rotation_backend at
        # crates/scp-identity/src/config.rs). Job rust-test therefore never ran
        # them. A `-p scp-identity` build reads none of those three manifests,
        # so `testing` stays off and both assertions execute here.
        # `--no-tests=fail` exits 4 rather than 0 when a feature flip selects
        # zero tests, and check_testing_unification_readers in
        # scripts/tests/ci-gate/ci_gate_selftest.py rejects re-pairing these
        # assertions with a lane whose build turns `testing` back on.
        run: cargo nextest run --no-tests=fail -p scp-identity --lib -E 'test(fails_closed_without_pre_rotation_backend)'

  # ── G1: shipped-feature-graph prove-absence gate (ADR-062 §Decision 6) ──
  # Asserts every shipped FFI bridge and the scp-node/scp-relay binaries' resolved
  # SCP-crate feature set (dev-deps EXCLUDED) is a subset of an explicit
  # durability-only + real-backend allowlist — so NO
  # in-memory nullifier (custody / attestation / pre-rotation / DHT / did:key)
  # feature, and no allow_unencrypted_storage feature (which unseals
  # ProtocolRepository::new_for_testing), can reach a production binary. Closed
  # ⊆-whitelist carrying ZERO nullifier exceptions — see ADR-062 §Decision 6.
  # The fixture harness (a/b/c + soundness + root-blindness + target-triple +
  # shipping-drift + allowlist hygiene) runs first and must pass before the real
  # workspace gate, and the real gate opens and closes with live positive
  # controls: the resolver must report `scp-ffi-common/server`, an activation
  # only cargo's per-package feature rendering carries, and the ⊆ check must
  # REJECT `scp-node --features testing`. NEVER add a resolved nullifier feature
  # to the allowlist to make this pass — fix the dependency edge.
  shipped-feature-graph:
    needs: check-draft
    name: Shipped-feature-graph (G1 prove-absence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - name: G1 — shipped-feature-graph ⊆ permitted-production allowlist (ZERO-nullifier mandate)
        run: bash scripts/check-shipped-feature-graph.sh

  # ── Cross-layer ──────────────────────────────────────────────────────
  cross-layer:
    needs: check-draft
    if: github.event_name == 'pull_request'
    name: Cross-layer check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1
      # Self-test MUST run first, following a convention pyi-generated,
      # block-in-place, no-panic-abort and saga-gating-granularity jobs set: it
      # plants an FFI export at a first line and at a last line of a 155 KB
      # diff and proves this gate finds both, then plants a missing export and
      # proves it still rejects that. Its search used to return one verdict
      # for a first case and a different verdict for a second.
      - name: Self-test gate
        run: bash scripts/tests/cross-layer/run-tests.sh
      - name: Check cross-layer coverage
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-cross-layer.sh

  # ── Bridge symmetry (ADR-047) ────────────────────────────────────────
  # Verifies that the three FFI bridges (PyO3, UniFFI, NAPI) expose the
  # same canonical operation set (per scripts/bridge-aliases.json). Scope is
  # SURFACE-AREA symmetry only; call-ordering invariants are enforced by
  # Layer B (scripts/check-call-invariants.py). Complements the Rust-side
  # enforcement in crates/scp-testing/tests/integration/ffi_conformance.rs —
  # the JSON alias table is the shared source of truth. See
  # .docs/adrs/ADR-047-bridge-symmetry-enforcement.md for rationale,
  # alternatives considered, and enforcement invariants.
  bridge-symmetry:
    needs: check-draft
    name: Bridge symmetry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run bridge-symmetry CI check
        run: bash scripts/check-bridge-symmetry.sh
      - name: Run bridge-symmetry fixture tests
        run: bash scripts/tests/bridge-symmetry/run-tests.sh

  # ── SDK coverage ─────────────────────────────────────────────────────
  sdk-coverage:
    needs: check-draft
    name: SDK capability matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin pytest and tree-sitter-rust to compatible version ranges so a
      # breaking upstream release cannot silently break CI (round-6 MINOR-3).
      # Other tree-sitter grammars remain unpinned to match the convention
      # used by the protocol-sync job below and minimize churn.
      - run: pip install 'pytest>=8,<10' 'tree-sitter-rust>=0.21,<0.25' tree-sitter tree-sitter-python tree-sitter-typescript tree-sitter-kotlin tree-sitter-swift
      - name: Gate self-tests (extractor null-safety)
        run: python3.12 -m pytest scripts/test_check_sdk_coverage.py -v
      - run: python3.12 scripts/check-sdk-coverage.py
      - run: python3.12 scripts/check-call-invariants.py
      - name: cfg-walker unit tests (regression guard for MAJOR-1/MINOR-1/MINOR-2)
        run: python3.12 -m pytest scripts/tests/call-invariants/ -v

  # ── Protocol enforcement ─────────────────────────────────────────────
  protocol-sync:
    needs: check-draft
    name: Protocol sync check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-rust
      - run: python3.12 scripts/check-protocol-sync.py

  # ── Python stub parity ───────────────────────────────────────────────
  pyi-generated:
    needs: check-draft
    name: Python stub signature parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff pinned for reproducible CI — an unpinned `pip install ruff`
      # silently tracks upstream and a new release (e.g. 0.16.x restyling
      # Markdown code blocks) can red the lint gate repo-wide with no local
      # change. Bump deliberately in its own PR. Keep in sync with python-lint.
      - run: pip install tree-sitter tree-sitter-rust ruff==0.15.4
      # Self-test MUST run first: it plants a deliberately-transposed stub
      # parameter and proves the gate REJECTS it, before we trust it on the
      # real tree.
      - name: Self-test gate
        run: bash scripts/check-pyi-generated.sh --self-test
      - name: Real check (.pyi ↔ PyO3 signature parity)
        run: bash scripts/check-pyi-generated.sh

  # ── Construction pattern (ADR-052) ──────────────────────────────────────
  construction-pattern:
    needs: check-draft
    name: Construction pattern (ADR-052)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3.12 scripts/check-construction-pattern.py

  protocol-deps:
    needs: check-draft
    name: Protocol deps check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-protocol-deps.sh
      - run: bash scripts/check-no-shim-reexports.sh

  # ── FFI singleton enforcement (ADR-048, #1549 Phase 4) ──────────────────
  bridge-globals:
    needs: check-draft
    name: FFI / no-bridge-globals + OnceLock ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/check-no-bridge-globals.sh

  fallback-registry:
    needs: check-draft
    name: FFI / no-fallback-registry regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-fallback-registry.sh

  handle-affinity:
    needs: check-draft
    name: FFI / handle-affinity check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-handle-affinity.sh

  # ── Toolchain wiring ───────────────────────────────────────────────
  # `rust-toolchain.toml` is the one place this repository names a Rust version, so
  # nothing can disagree with it. Two things a derivation cannot establish: that every
  # container build copies the pin into its image, since the base tag no longer names a
  # compiler; and which CI jobs a change to a pin has to reach, since every Rust job is
  # guarded by a paths filter and the `ci` aggregator counts a skipped job as a pass.
  #
  # The gate's fourth check compares the compiler the shell resolved against the pin. Its
  # target is a `RUSTUP_TOOLCHAIN` in a developer's or an agent's environment, and this
  # runner exports none, so here that check reports what it found and passes. The same
  # command fails in a shell carrying the variable, and an agent runs this gate locally
  # before it pushes. This step installs no Rust: this runner's `rustc` dispatches through
  # rustup, no directory override redirects the checkout, and rustup holds no pinned
  # toolchain, which is the state the check proves before it skips running `rustc` — a
  # comparison that would otherwise download the pin's 13 targets and could not disagree.
  toolchain-wiring:
    needs: check-draft
    name: enforcement / toolchain wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The mise check parses `.mise.toml` with `tomllib`, which the Python standard
      # library has held since 3.11, and it fails when no interpreter on PATH imports it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/check-toolchain-wiring.sh
      - name: Run toolchain-wiring cases
        run: bash scripts/tests/toolchain-wiring/run-tests.sh
      # scripts/hooks/pre-commit runs the toolchain check above on every commit, and runs
      # each language's format and lint steps only for files that differ from what the
      # commit's parent — or, on a merge, each merged-in head — already carries. These
      # cases commit through the real hook in throwaway repositories with `cargo` stubbed.
      - name: Run pre-commit merge cases
        run: bash scripts/tests/pre-commit-merge/run-tests.sh
      # The compile-steps check reads every workflow file with PyYAML, which
      # `actions/setup-python` does not ship, so the step before it installs the library.
      # The check holds every `Swatinem/rust-cache` step to the group shape the header
      # comment of this file describes — a `shared-key`, a `save-if`, one writer per group
      # and that writer on `main` — counted across every workflow, because the 10 GB cap
      # is per repository; and it holds every uniffi-bindgen step to reading the library
      # out of the directory its own `cargo run` writes, which is the step shape that
      # compiled the crate graph twice in build-xcframework.sh and in build-matrix.yml.
      - run: pip install 'pyyaml>=6,<7'
      - run: python3.12 scripts/check-workflow-compile-steps.py
      - name: Run workflow-compile-steps cases
        run: bash scripts/tests/workflow-compile-steps/run-tests.sh

  # ── The check a fix round runs before it pushes ──────────────────────
  # scripts/fix-round-check.sh is the one entry point a fix agent runs in place
  # of a gate set it assembles itself, so a regression in it hands that agent a
  # verdict the agent has not earned and the agent pushes on that word.
  # scripts/tests/fix-round-check/run-tests.sh holds it to its contract: it
  # refuses to compile on a compiler rust-toolchain.toml does not name, each
  # step's non-zero exit reaches the script's own exit code, and a run that
  # names no crate derives its crate set from the files the branch changed or
  # fails saying why.
  #
  # This job installs what case 3 of that suite needs, which is what the 29
  # gates in the runner's list read: the tree-sitter grammars nine Python gates
  # parse with, the PyYAML check-workflow-compile-steps.py reads every workflow
  # file with, the ruff check-pyi-generated.sh runs, the jq
  # check-bridge-symmetry.sh requires, a Rust toolchain for the twelve `cargo
  # tree` resolutions check-shipped-feature-graph.sh and check-protocol-deps.sh
  # run, and the base ref check-cross-layer.sh diffs against. No step here
  # compiles a crate: the suite replaces `cargo check` and `cargo fmt` with
  # stubs, because what it tests is what the runner does with their exit codes.
  #
  # The `if:` matches the one the cross-layer job above carries, and for the
  # reason that job carries it: check-cross-layer.sh reads a declared exemption
  # out of the pull request's body, a merge_group event publishes no body, and
  # the 29 gates this suite runs include that one. Without the condition, a pull
  # request whose exemption the cross-layer job accepted would fail this job in
  # the merge queue over an exemption the queue cannot read. Every fix round
  # pushes to a pull request, so the suite runs on the head each round produces.
  fix-round-check-selftest:
    needs: check-draft
    if: github.event_name == 'pull_request'
    name: enforcement / fix-round-check runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # check-cross-layer.sh diffs against origin/$GITHUB_BASE_REF, and against
      # origin/main when no base ref arrives, which is the merge-queue case.
      - name: Fetch the base branch the cross-layer gate diffs against
        run: git fetch origin ${{ github.base_ref || 'main' }} --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same pins the sdk-coverage and pyi-generated jobs carry, for the
      # same reason: a breaking upstream release cannot red a required check
      # without a deliberate bump.
      # PyYAML for check-workflow-compile-steps.py, which parses every workflow
      # file and which the toolchain-wiring job installs the same pin for.
      - run: pip install 'tree-sitter-rust>=0.21,<0.25' tree-sitter tree-sitter-python tree-sitter-typescript tree-sitter-kotlin tree-sitter-swift ruff==0.15.4 'pyyaml>=6,<7'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      # This job reads the `workspace-debug` cache group for its registry alone,
      # the way job shipped-feature-graph does: the twelve `cargo tree`
      # resolutions the suite drives download the index and the `.crate` files,
      # and no step here compiles a crate into `target/debug`. `save-if: false`
      # keeps job rust-test the group's one writer, which is the shape the
      # header comment of this file describes and
      # scripts/check-workflow-compile-steps.py enforces: every rust-cache step
      # names a `shared-key` and a `save-if`, and each group has exactly one
      # writer, on `main`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - name: Run the fix-round-check cases
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/tests/fix-round-check/run-tests.sh

  # ── Mutable shared process-global enforcement (ADR-048, #1549 Phase 4) ──
  # Forward-prevention gates that forbid the DEFAULT_BRIDGE_INSTANCE pattern
  # from creeping back in any language. Every new piece of per-system state
  # must live on the bridge instance or the language SDK class — not in a
  # module-level `static` / `let` / `var` / `static var` declaration.
  #
  # One job per language to keep failure attribution obvious.
  no-mutable-globals-rust:
    needs: check-draft
    name: enforcement / no-mutable-globals (rust workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-mutable-globals.sh

  no-mutable-globals-python:
    needs: check-draft
    name: enforcement / no-mutable-module-globals (python sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3.12 scripts/check-no-mutable-module-globals.py

  no-mutable-globals-ts:
    needs: check-draft
    name: enforcement / no-mutable-globals (typescript sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-ts-mutable-globals.sh

  no-mutable-globals-kotlin:
    needs: check-draft
    name: enforcement / no-mutable-globals (kotlin sdk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-no-kotlin-mutable-globals.sh

  # Swift `no_static_var` / `no_static_lazy_var` custom rules live inside
  # `bindings/swift/.swiftlint.yml` and are enforced by the existing
  # `swift` job's `swiftlint --strict` step (see the Swift build matrix).
  # This block is documentation — the gate runs elsewhere.

  # ── Actor-refactor enforcement (ADR-049) ────────────────────────────
  # Gates introduced by the actor-per-context refactor. Each script is
  # documented in its own file header; see .docs/adrs/ADR-049-actor-per-context.md
  # for the bigger picture.

  block-in-place:
    needs: check-draft
    name: Actor / block-in-place AST check + ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-rust
      # Self-test MUST run first: it proves the scanner catches every
      # known bypass pattern before we trust it on the real tree.
      - name: Self-test scanner
        run: python3.12 scripts/check-block-in-place.py --self-test
      - name: Real scan
        run: python3.12 scripts/check-block-in-place.py

  # Every `§N.M` citation in the artifacts that tell an agent how to write and how to
  # work names a heading its spec file carries. It runs on every pull request, without a
  # paths filter, because the `ci` aggregator counts a skipped job as a pass.
  doc-citations:
    needs: check-draft
    name: Docs / spec citations resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Self-test MUST run first: it plants a dead citation and asserts the scanner
      # reports it, so a green real scan means the scanner read the tree rather than
      # that it can no longer fail.
      - name: Self-test citation checker
        run: python3.12 scripts/check-doc-citations.py --self-test
      - name: Real scan
        run: python3.12 scripts/check-doc-citations.py

  # A `[mirror]` site of the identity-substrate plan carries an include directive and
  # the Owner's bytes, and this job re-runs the resolver into a temporary tree and
  # fails where a site's bytes differ from the fragment its directive names. It runs on
  # every pull request, without a paths filter, because the `ci` aggregator counts a
  # skipped job as a pass.
  doc-includes:
    needs: check-draft
    name: Docs / transcluded fragments match their owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Self-test MUST run first: it plants each of the eight failure conditions and
      # asserts the checker reports it, so a green real scan means the checker read the
      # tree rather than that it can no longer fail.
      - name: Self-test include checker
        run: python3.12 scripts/check-doc-includes.py --self-test
      - name: Real scan
        run: python3.12 scripts/check-doc-includes.py

  # Every agent definition in `.claude/agents/` opens with a `## Verdict criterion`
  # section carrying a `**Criterion:**` line and an `**Indicators, not the criterion.**`
  # line, so the "Write every agent prompt as a contract" rule of AGENTS.md describes the tree
  # instead of asserting a state nobody produced. It runs on every pull request, without
  # a paths filter, because the `ci` aggregator counts a skipped job as a pass.
  agent-verdict-criterion:
    needs: check-draft
    name: Agents / every definition states a verdict criterion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Real check
        run: bash scripts/check-agent-verdict-criterion.sh
      # The cases run after the real check and plant each way the section can break,
      # so a gate that can no longer go red fails here instead of reporting green.
      - name: Run agent-verdict-criterion cases
        run: bash scripts/tests/agent-verdict-criterion/run-tests.sh

  deleted-primitives:
    needs: check-draft
    name: Actor / deleted primitives ban
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-deleted-primitives.sh

  handler-no-panic:
    needs: check-draft
    name: Actor / handler panic-family ban (ADR-049 §10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-handler-no-panic.sh

  no-panic-abort:
    needs: check-draft
    name: FFI / no panic=abort in cdylib profiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Self-test MUST run first: it plants panic = "abort" in a scratch
      # manifest (must be DETECTED) and confirms benign lines
      # (panic = "unwind" / the clippy lint panic = "deny" / a comment) are
      # NOT flagged — proving the gate is alive before we trust it on the tree.
      - name: Self-test gate
        run: bash scripts/check-no-panic-abort.sh --self-test
      - name: Real check
        run: bash scripts/check-no-panic-abort.sh

  saga-gating-granularity:
    needs: check-draft
    name: Actor / saga gating granularity (ADR-049 §3a)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Self-test MUST run first: it plants an instance-wide AtomicBool saga
      # guard + a fake FFI saga export (must FAIL), correct per-set gating
      # (must PASS), and a no-gating-at-all supervisor (must FAIL) — proving
      # the gate is alive before we trust it on the real tree.
      - name: Self-test gate
        run: bash scripts/check-saga-gating-granularity.sh --self-test
      - name: Real check
        run: bash scripts/check-saga-gating-granularity.sh

  bridge-instance-lifecycle:
    needs: check-draft
    name: Actor / BridgeInstance lifecycle drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-rust
      - run: python3.12 scripts/check-bridge-instance-lifecycle.py

  wasm-protocol:
    needs: check-draft
    name: WASM / protocol
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Reads the `wasm32` group typescript-wasm-check writes. This command compiles
      # under the dev profile and that job builds under release, so what this restore
      # supplies is the registry — the crates.io sources every dependency of these nine
      # crates is compiled from — and not their compiled artifacts. It writes nothing:
      # a 1-minute job that saved its own entry would hold ~200 MB of the repository's
      # 10 GB cache budget against the entries the long jobs read.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32
          save-if: false
      - run: cargo check -p scp-clock -p scp-crypto -p scp-did -p scp-protocol -p scp-relay-client -p scp-mls -p scp-client -p scp-event-log -p scp-client-wasm --target wasm32-unknown-unknown

  wasm-test:
    needs: check-draft
    name: WASM / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Reads the `wasm32` group typescript-wasm-check writes. `wasm-pack test` compiles
      # scp-client-wasm under the dev profile and that job builds under release, so this
      # restore supplies the registry rather than compiled artifacts. It writes nothing,
      # for the reason spelled out on the same step in job wasm-protocol above.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32
          save-if: false
      # Pin wasm-pack to a specific version for reproducibility (via the same
      # taiki-e/install-action the nextest job uses), instead of the unpinned
      # `curl … | sh` installer that always pulls latest.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Runs the `#[wasm_bindgen_test]` cases under Node — the real wasm32
      # execution the `wasm-protocol` build gate only compiles. Covers the
      # cross-target determinism KAT wasm entries, the error-mapping `JsValue`
      # wrapping, and the `JsStorage` extern round-trip (ADR-057 Prerequisite 5).
      - run: wasm-pack test --node crates/scp-client-wasm

  # ── Rust ────────────────────────────────────────────────────────────
  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  # ── Why this job is a three-leg matrix ──────────────────────────────────────
  #
  # Measured on the 2026-10-04 runs, the single job spent 53 s restoring its cache
  # and then about 6.5 min in three serial blocks of work: the `--workspace`
  # sweep (87 s), scripts/check-examples-compile.sh (about 77 s), and the
  # per-package feature commands (about 4 min). Each leg
  # runs one block, so the job takes as long as its longest leg rather than the
  # sum. Every command the single job ran runs on exactly one leg, with the
  # flags and features it had there.
  #
  # Each leg compiles under its own feature resolution, so each restores and
  # writes its own rust-cache group (the group listing at the top of this file
  # names all three), and only `main` writes.
  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / clippy (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [workspace, examples, packages]
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      # scripts/check-examples-compile.sh parses cargo metadata with jq, which
      # the runner image ships. This step fails the job by name if an image drops it.
      - name: Require jq
        if: matrix.leg == 'examples'
        run: command -v jq || { echo "::error::jq is not on PATH; scripts/check-examples-compile.sh needs it"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Writes the `workspace-check` group. The `--workspace` sweep compiles every
      # dependency in check mode, to an `.rmeta` under a metadata hash that includes
      # the mode, so the `workspace-debug` entry rust-test writes under build mode
      # holds nothing this leg can restore: reading that entry gave this job the
      # registry and a `Checking` line for every one of the ~650 dependencies on every
      # run. This leg is the one that compiles the most of `target/debug` in check
      # mode under the workspace feature resolution, so it is the group's producer;
      # rust-doc reads the group for its `cargo doc`.
      - uses: Swatinem/rust-cache@v2
        if: matrix.leg == 'workspace'
        with:
          shared-key: workspace-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Writes the `clippy-examples` group: scripts/check-examples-compile.sh lints
      # each example target alone, one package's dev-target feature set at a time,
      # a resolution the `workspace-check` entry does not hold.
      - uses: Swatinem/rust-cache@v2
        if: matrix.leg == 'examples'
        with:
          shared-key: clippy-examples
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Writes the `clippy-packages` group: each `-p` command below resolves features
      # over one package's subgraph under the features it names.
      - uses: Swatinem/rust-cache@v2
        if: matrix.leg == 'packages'
        with:
          shared-key: clippy-packages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run clippy over the workspace
        if: matrix.leg == 'workspace'
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Enable testing for scp-ffi-uniffi so that the
          # in-memory custody code paths are lint-checked. Mobile production
          # builds (iOS XCFramework, Android .aar) MUST NOT enable this
          # feature. See GitHub issue #88.
          cargo clippy --workspace --all-targets --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/testing,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/testing,scp-ffi-uniffi/outlet-capability-test-grant -- -D warnings
      - name: Run the examples gate
        if: matrix.leg == 'examples'
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Asserts two things: every example target compiles and its example
          # source holds no construct the script's source scan rejects, and every
          # published examples/*.rs is some target's source. The script header
          # states what the check cannot prove; do not restate it here.
          bash scripts/check-examples-compile.sh
      - name: Run clippy over per-package feature sets
        if: matrix.leg == 'packages'
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # The optional network transports (quic, http3, udp, coap) are not in
          # the default feature set and are not activated by --workspace, so the
          # workspace leg's sweep never lints them. They rotted undetected for months
          # (the quic feature stopped compiling). Lint them explicitly so a
          # broken optional transport fails CI. They co-compile (openssl-backed
          # udp/coap alongside ring-backed quic/http3), so a single combined
          # invocation covers all four.
          # `nostr` and `webrtc` join this list for that same reason: each
          # gates a `src/` module plus a `[[test]] required-features` target,
          # and no lint or test invocation activated either feature, so 41
          # tests and both adapter modules went unlinted and unrun.
          cargo clippy -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --all-targets -- -D warnings
          # Job rust-test-optional-features also runs code behind four more
          # feature sets that no other command of this job activates: scp-node's quic test
          # files and its http3/udp well_known arms, scp-platform's `apple`
          # SQLCipher adapter and `sync` storage module, and scp-testing's
          # persistence_advanced tests. That job denies no warnings, so these
          # commands are the only lint those builds get.
          cargo clippy -p scp-node --features quic,http3,udp,testing --all-targets -- -D warnings
          cargo clippy -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing --all-targets -- -D warnings
          cargo clippy -p scp-testing --features sync,combined --all-targets -- -D warnings
          # scp-node and scp-relay compile the PostgreSQL and S3 blob backends
          # only under their off-by-default `cloud-blobs` feature, which the
          # --workspace sweep of the workspace leg leaves off. The first command lints the
          # backends' own modules and their `#[ignore]`d unit tests, which need a
          # live PostgreSQL or S3 endpoint to run; the second and third lint each
          # binary's cloud-blobs build and its backend-selection test, which job
          # rust-test-optional-features runs. Each binary gets its own command
          # because cargo unifies scp-transport's features across every package
          # one invocation builds: in a joint command, scp-node's `cloud-blobs`
          # would compile the backends for scp-relay even when scp-relay's own
          # `cloud-blobs` no longer enables them.
          cargo clippy -p scp-transport --features sqlite-blob,redb-blob,postgres-blob,s3-blob,startup --all-targets -- -D warnings
          cargo clippy -p scp-node --features cloud-blobs,testing --all-targets -- -D warnings
          cargo clippy -p scp-relay --features cloud-blobs --all-targets -- -D warnings
      # Runs scripts/check-examples-compile.sh against throwaway one- and two-crate
      # workspaces, each carrying a defect the gate must reject or a layout it must accept.
      - name: Run examples-compile cases
        if: matrix.leg == 'examples'
        run: bash scripts/tests/examples-compile/run-tests.sh

  # This job runs `cargo nextest run --workspace`, so a merge gate rests on it.
  # It gates on `rust` at job level, never at step level. It carried seven
  # step-level `if: needs.changes.outputs.rust == 'true'` conditions instead,
  # under a comment claiming each matrix leg had to expand and report a status
  # to branch protection. That claim no longer holds: a repository ruleset
  # requires one status check, `ci`, and scripts/ci-aggregate-result.py judges a
  # skipped dependency against that dependency's own job-level `if:`. Under
  # step-level conditions, a renamed or misspelled filter output skipped every
  # step, this job reported success over zero tests, and both an aggregate and a
  # filter-key check in scripts/tests/ci-gate/ci_gate_selftest.py read only
  # job-level conditions, so neither could see it. That self-test now rejects
  # any `needs.changes.outputs.*` reference outside a job-level `if:`.
  #
  # ── Why this job is a 2 × 4 matrix ──────────────────────────────────────────
  #
  # Measured on run 34721754678, whose log line
  # `Restored from cache key "v0-rust-rust-test-Linux-x64-…" full match: true.`
  # makes it the one warm sample in that week's runs: the ubuntu leg spent
  # 4 min 16 s compiling (26 `Compiling` lines — rust-cache restores the 890
  # dependency crates and every workspace crate rebuilds, because a checkout
  # writes each source file with the checkout's own mtime) and 6 min 43 s running
  # 11314 tests. Execution was the larger half and it divides; compilation does
  # not, since nextest builds every test binary before it runs any subset.
  #
  # `--partition count:k/4` splits the run and not the build, so four shards cost
  # four compiles and turn 6 min 43 s of execution into 1 min 41 s. Each shard is
  # therefore about 0.9 + 4.3 + 1.7 minutes rather than 16.8, and the union of
  # the four shards is the same 11314 tests: nextest assigns each test to exactly
  # one partition.
  #
  # Only shard 1 writes the `workspace-debug` cache. All four legs compile the
  # same target directory, so any of them could, and naming one keeps the
  # entry's contents decided rather than raced.
  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / test (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    steps:
      - name: Free disk space when the runner is short of it
        if: runner.os == 'Linux'
        run: |
          # This step used to delete four preinstalled SDK trees unconditionally,
          # under a comment reading "Ubuntu runners ship with ~14GB free but
          # pre-installed SDKs consume most of it". That premise is stale. The
          # runner image these jobs get reports `/dev/root 145G 40G 105G 28% /`
          # after the deletions (run 34721754678 and run 34750056435 both print
          # it), so about 85 GB was free before them, against the ~12 GB this
          # workspace needs. The deletions bought nothing and cost between 21 s
          # and 2 min 12 s per job across the six jobs that ran them.
          #
          # The guarantee stays and only the work goes: the threshold below is
          # what the removed comment claimed the runner lacked, plus room for the
          # restored cache and the test binaries, so a future image with a
          # smaller disk still reclaims the space and this one skips in under a
          # second.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /usr/local/lib/android
            sudo rm -rf /opt/ghc
            sudo rm -rf /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: |
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${LIBDIR}${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          # Enable testing for scp-ffi-uniffi so that
          # in-memory custody tests run. Mobile production builds (iOS
          # XCFramework, Android .aar) MUST NOT enable this feature.
          # See GitHub issue #88.
          #
          # `--no-tests=fail` because `--partition` narrows the selection: a
          # filter that selects nothing must fail this shard rather than report
          # success over zero assertions, which is the zero-test defect
          # scripts/tests/ci-gate/ci_gate_selftest.py records.
          cargo nextest run --workspace --no-tests=fail --partition count:${{ matrix.shard }}/4 --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/testing,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/testing,scp-ffi-uniffi/outlet-capability-test-grant

  # ── Optional-feature test lanes ─────────────────────────────────────────────
  #
  # Three invocations that job rust-test above used to carry, the three
  # `cloud-blobs` backend-selection commands, and two `cargo check` commands on
  # scp-testing. Each one activates or drops a feature `--workspace` does not, so
  # each one recompiles its package's graph under a feature set no other command
  # in rust-test builds. The first three cost 2 min 53 s of compilation and 43 s
  # of execution on the warm run cited above. Sharding rust-test four ways would
  # have repeated all of it four times per OS.
  #
  # Both operating systems, for the same reason rust-test runs on both: the
  # scp-testing lane below opens a real on-disk SQLite database across two
  # processes and takes an `fs2` advisory file lock, whose semantics differ
  # between Darwin and Linux, and the quic/udp lane sets socket options whose
  # kernel behaviour differs between the two.
  #
  # ── Why this job gets its own cache group and does not fold into rust-test ──
  #
  # `-p scp-transport` resolves a different feature set than `--workspace` does,
  # and not only for scp-transport: the resolver drops `scp-runtime/testing`,
  # `scp-runtime/saga-witness-test-mint` and
  # `scp-core/outlet-capability-test-grant`, then unifies third-party features
  # over scp-transport's subgraph alone. Measured on run 34750056435's cold
  # ubuntu leg, that reaches 247 packages for the `combined,local-cache`
  # invocation and 90 for the scp-testing one, down to `proc-macro2`, every one
  # of which the workspace invocation had already compiled under its own
  # resolution.
  #
  # That is the reason to give this job its own `shared-key`, and it is also the
  # reason NOT to fold these commands into `cargo nextest run --workspace
  # --features …,scp-transport/quic,…`. One invocation would compile each
  # package once, and it would compile scp-transport's graph with the workspace's
  # `testing` features ON and all six optional transport features on together.
  # These lanes exist because that graph rotted unseen under exactly that
  # unification — `crates/scp-transport`'s `quic` feature stopped compiling for
  # months — and because a `--workspace` build compiles a crate's
  # `#[cfg(not(feature = "testing"))]` items out, which is the defect
  # `check_testing_unification_readers` in
  # scripts/tests/ci-gate/ci_gate_selftest.py exists to catch. Folding buys the
  # compile time back by deleting the configuration under test.
  #
  # The cache group buys the same time and deletes nothing: this job's own
  # artifacts, under its own feature resolution, restore on every later run. It
  # writes on a push to `main` because it is the only job that builds them.
  rust-test-optional-features:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / test (optional features, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: transport-optional
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: |
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${LIBDIR}${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          # Test scp-transport with optional features that aren't enabled by
          # --workspace (combined includes rusqlite + scp-platform; local-cache
          # enables caching logic).
          cargo test -p scp-transport --features combined,local-cache
          # Optional network transports (quic, http3, udp, coap, nostr,
          # webrtc) are also not activated by --workspace. They co-compile, so
          # one combined invocation exercises every transport's test suite and
          # guards against silent rot, which broke `quic` for months.
          # `nostr` and `webrtc` each declare a `[[test]] required-features`
          # target (nostr_roundtrip, webrtc_roundtrip) that this list must
          # activate; without them those 10 tests plus 31 in-module tests under
          # src/nostr/ and src/webrtc/ compiled into no test binary CI ran.
          # The first run takes every other transport test; each run after it
          # selects one of those four groups with `--no-tests=fail`, so
          # re-gating a group behind another feature, or deleting it, leaves
          # its run with nothing to select and fails this lane.
          cargo nextest run --no-tests=fail -p scp-transport --features quic,http3,udp,coap,nostr,webrtc -E 'not (binary(nostr_roundtrip) | binary(webrtc_roundtrip) | test(/^nostr::/) | test(/^webrtc::/))'
          cargo nextest run --no-tests=fail -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --test nostr_roundtrip
          cargo nextest run --no-tests=fail -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --test webrtc_roundtrip
          cargo nextest run --no-tests=fail -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --lib -E 'test(/^nostr::/)'
          cargo nextest run --no-tests=fail -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --lib -E 'test(/^webrtc::/)'
          # scp-node holds two auto-discovered test files (quic_listener,
          # quic_cross_transport), each gated on `quic` and
          # `allow_unencrypted_storage`, which `testing` implies. --workspace
          # activates `quic` for neither, so their 5 tests ran nowhere. One run
          # per file with `--no-tests=fail` (see the well_known lanes below), so
          # re-gating either file leaves its run with nothing to select and fails
          # this lane.
          cargo nextest run --no-tests=fail -p scp-node --features quic,testing --test quic_listener
          cargo nextest run --no-tests=fail -p scp-node --features quic,testing --test quic_cross_transport
          # scp-node's well_known module asserts its advertised-transport
          # list twice per transport: once for a feature-off arm and once for a
          # feature-on arm. --workspace activates neither http3 nor udp, so only
          # those off arms ran.
          #
          # One nextest run per feature-on arm, each selecting that one test by
          # its exact path, with `--no-tests=fail`: a filter that selects nothing
          # exits 0 under `cargo test`, while `--no-tests=fail` exits 4. Because
          # each expression names exactly one test, renaming the module, deleting
          # that arm, or re-gating it behind another feature selects nothing and
          # fails this lane. A substring filter such as `test(well_known)` would
          # not: it also selects well_known-named tests in http.rs and lib.rs, so
          # it keeps selecting tests after both arms are gone.
          cargo nextest run --no-tests=fail -p scp-node --features http3,udp,testing --lib -E 'test(=well_known::tests::advertised_transports_includes_webtransport_with_feature)'
          cargo nextest run --no-tests=fail -p scp-node --features http3,udp,testing --lib -E 'test(=well_known::tests::advertised_transports_includes_udp_dtls_with_feature)'
          # scp-platform gates its Apple SQLCipher storage adapter behind `apple`
          # and its syncable-storage trait behind `sync`. --workspace enables
          # neither (only scp-testing's opt-in `sync` feature enables
          # `scp-platform/sync`), so both modules' tests — including a
          # storage_conformance! expansion over SyncableStorage — compiled into
          # nothing. Each run below selects one of those three groups by module
          # path with `--no-tests=fail`, so deleting or re-gating a group fails
          # this lane; the crate's other tests already run under --workspace.
          cargo nextest run --no-tests=fail -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing --lib -E 'test(/^apple::/)'
          cargo nextest run --no-tests=fail -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing --lib -E 'test(/^syncable::tests::storage_conformance::/)'
          cargo nextest run --no-tests=fail -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing --lib -E 'test(/^syncable::tests::/) - test(/^syncable::tests::storage_conformance::/)'
          # persistence_advanced holds two tests gated on scp-testing's `sync` and
          # `combined` features, which --workspace does not activate; its other
          # tests already run under --workspace. One run per gated test, each
          # naming it exactly, with `--no-tests=fail`.
          cargo nextest run --no-tests=fail -p scp-testing --features sync,combined --test persistence_advanced -E 'test(=syncable_storage_export_apply_roundtrip)'
          cargo nextest run --no-tests=fail -p scp-testing --features sync,combined --test persistence_advanced -E 'test(=combined_node_storage_both_traits_roundtrip)'
          # scp-node and scp-relay compile the PostgreSQL and S3 arms of
          # `storage_from_env` only under their off-by-default `cloud-blobs`
          # feature, which --workspace leaves off. Run the two binaries' backend
          # selection tests with it on. Each test fails when its own package's
          # `cloud-blobs` feature is on and the build does not list both the
          # `postgres` and `s3` backends, and when a build that lists a backend
          # stops exiting on a missing SCP_RELAY_DATABASE_URL or
          # SCP_RELAY_S3_BUCKET. Each binary
          # runs in its own invocation because cargo unifies scp-transport's
          # features across every package one invocation builds: a combined
          # invocation compiles both arms into scp-relay through scp-node's
          # feature alone, and passes when scp-relay's `cloud-blobs` enables
          # nothing. The scp-transport command runs the `BackendChoice` unit
          # tests with both arms compiled, the only build in which they assert
          # that `postgres` and `s3` parse in either case and are cloud
          # backends. The scp-node command also enables `testing`, the only
          # build that compiles `--ephemeral`, so the test checks that
          # `--ephemeral` exits on `postgres` and `s3`.
          cargo nextest run --no-tests=fail -p scp-node --features cloud-blobs,testing --test storage_backend_selection
          cargo nextest run --no-tests=fail -p scp-relay --features cloud-blobs --test storage_backend
          cargo nextest run --no-tests=fail -p scp-transport --features sqlite-blob,redb-blob,postgres-blob,s3-blob,startup --lib startup::tests
          # The saga-journal durable crash-recovery round-trip is gated behind
          # scp-testing/sqlite (it opens a real on-disk SqliteStorage across two
          # processes). --workspace does NOT activate this optional feature, so
          # run that test explicitly with it enabled. Scoped to the
          # saga_bridge_journal_swap target on purpose: the broader
          # `-p scp-testing --features sqlite` also pulls in `persistence_sdk`,
          # which has a PRE-EXISTING SqliteStorage advisory-lock-on-reopen bug
          # (fails identically on main; the supervisor's spawned actors hold the
          # SqliteStorage Arc past the test's reopen). That is unrelated to this
          # journal swap and is left to its own focused fix.
          cargo nextest run -p scp-testing --features sqlite --test saga_bridge_journal_swap
          # crates/scp-testing/src/lib.rs compiles `pub mod helpers` only under
          # this crate's `testing` feature, and that feature's list must name
          # every feature helpers.rs needs, because the one build that turns it
          # on, this crate's own test build, also unifies its dev-dependency
          # features and would hide a missing entry. `--lib` builds no test
          # target, so cargo resolves no dev-dependency feature: the first
          # command fails if the module compiles without the feature or if any
          # other module names `scp_identity`, `scp_dht` or `scp_node`, whose
          # `[dependencies]` edges are optional and only `testing` turns on,
          # and the second fails if the feature cannot compile the module on
          # its own.
          cargo check -p scp-testing --lib
          cargo check -p scp-testing --lib --features testing

  # Exercises the napi bridge in its PRODUCTION configuration: default features
  # (`server` on) but WITHOUT `testing` / `scp-core/testing` /
  # `scp-runtime/testing`. This is the config the feature-free context-export
  # tests target — `NodeMlsFactory::validate_creator_identity` only accepts
  # `did:dht:z*` identities here (no `did:test:` / `did:key:` test gate), so a
  # callback-shaped custody signer must round-trip and fail-closed for real.
  # Without this lane the production/bare napi test target could silently
  # regress (stop compiling, or stop running the export tests) unnoticed.
  rust-test-napi-production:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / test (napi production config)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - name: Run napi tests in production config (no custody/testing features)
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Default features = production: `server` on, no in-memory custody and
          # no `scp-runtime`/`scp-core` `testing` gates. The feature-free
          # context-export tests run here for real; the bare/production target
          # must compile and pass without the testing affordances.
          cargo test -p scp-ffi-napi --features server
          # Run scp-ffi-common with DEFAULT features (no `testing`, no
          # `testing`) so the DHT capability-injection ABSENCE
          # tripwires — `ffi_dht_client_is_pkarr_only_in_shipped_build` and
          # `disabled_node_resolution_returns_ok_none_for_unknown_did`, both
          # `#[cfg(not(feature = "testing"))]` — actually EXECUTE in CI. The
          # workspace nextest lane enables `scp-ffi-common/testing`, which
          # compiles those tests OUT, so without this production-config lane the
          # G1 in-memory-nullifier-absence tripwires would be latent (ADR-062
          # Slice 1). ci.yml is not an enforcement file; this is an added
          # positive test lane.
          cargo test -p scp-ffi-common
          # `cargo test -p scp-ffi-common` above carries no name filter, so it
          # exits 0 over the package's un-gated tests even when the two
          # assertions named below compiled out. Nothing in that command
          # observes whether the build it ran had `scp-ffi-common/testing` on:
          # a manifest anywhere in the build can turn the feature on, and
          # `command_unifies_testing` in scripts/tests/ci-gate/ci_gate_selftest.py
          # answers that question by reading manifest text, which means
          # enumerating the spellings cargo accepts — the non-convergent shape
          # .docs/lessons/ast-gate-checks-definition-not-name-resolution.md
          # names. This command answers it from the build cargo actually
          # resolved instead: both tests are
          # `#[cfg(not(feature = "testing"))]`, so a build carrying the feature
          # selects zero tests and `--no-tests=fail` exits 4 whatever spelling
          # turned the feature on. Jobs rust-build-pyo3-production,
          # rust-build-uniffi-production and fail-closed-pre-rotation already
          # carried such a command for their packages; scp-ffi-common was the
          # one package with shipped-build assertions and no such command, and
          # `check_shipped_assertion_tripwires` in the self-test now requires
          # one for every package that has them.
          cargo nextest run --no-tests=fail -p scp-ffi-common \
            -E 'test(ffi_dht_client_is_pkarr_only_in_shipped_build) + test(disabled_node_resolution_returns_ok_none_for_unknown_did)'

  # Builds the pyo3 bridge (`scp-ffi`) in its PRODUCTION configuration: default
  # features (`server` on) but WITHOUT `testing`. `build-matrix.yml` builds the
  # PyPI wheel only at release/tag time, so a PR could re-gate a production
  # identity/SCPID/custody op behind the test-only `testing` feature — making it
  # vanish from the production lib — and the regression would go unnoticed until
  # release. This is the per-PR guard against that over-gating regression class.
  #
  # The wheel adds the features `[tool.maturin] features` in
  # `bindings/python/pyproject.toml` names (`extension-module`,
  # `vendored-openssl`), and `vendored-openssl` compiles OpenSSL from source
  # through openssl-src for a Linux or Windows target and activates nothing for an
  # Apple target, whose SQLCipher keeps CommonCrypto when an Apple host builds it.
  # A third step checks that split with `cargo tree` for each wheel target, and a
  # fourth builds the library with exactly that list, read from the file, so a PR
  # that breaks the OpenSSL or SQLCipher source build fails here instead of in the
  # release run. The build covers the Linux x86_64 host only; the manylinux_2_28
  # container, the universal2 macOS build, and the Windows NASM build still run
  # only in `build-matrix.yml`.
  #
  # This job carried a "build-only" note claiming a pyo3 test suite assumes
  # in-memory custody and does not compile in prod config. Measured on this tree,
  # `cargo test -p scp-ffi --features server --no-run` exits 0 and links two test
  # binaries, so that reason no longer holds. A second step below runs two
  # shipped-build fail-closed assertions this crate documents at
  # crates/scp-ffi/src/scp.rs:536.
  rust-build-pyo3-production:
    needs: changes
    # `python` too: the `python` filter covers `bindings/python/pyproject.toml`,
    # whose `[tool.maturin] features` list the wheel step below builds.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    name: Rust / build + fail-closed test (pyo3 production config)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - name: Build pyo3 bridge in production config (no in-memory custody)
        run: |
          # pyo3 links libpython, so LD_LIBRARY_PATH must point at LIBDIR.
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Default features = production: `server` on, no `testing`.
          cargo build -p scp-ffi --features server
      - name: Shipped pyo3 fail-closed assertions
        run: |
          # Assigned before an export so a failing python3 stops this step
          # (shellcheck SC2155), matching what rust-test already does.
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # A doc block at crates/scp-ffi/src/scp.rs:536 states that two
          # `#[cfg(not(feature = "testing"))]` tests below it run in a shipped
          # test lane, "`cargo test -p scp-ffi` with the crate's own `testing`
          # feature OFF". No lane ran them: this job built that bridge and never
          # tested it, and a workspace lane compiles them out by enabling
          # `scp-ffi/testing`. This step is a lane that doc block names, so
          # AC5 (identity_create → SCP-IDENT-1059) and AC3 (device-attestation
          # verify → SCP-IDENT-1016) per-bridge proofs now execute.
          #
          # nextest supplies process-per-test isolation, which a SAFETY
          # comment at crates/scp-ffi/src/scp.rs:560-565 rests two
          # `std::env::set_var` calls on, and `--no-tests=fail` exits 4 rather
          # than 0 if a feature flip selects zero tests.
          cargo nextest run --no-tests=fail -p scp-ffi --features server --lib \
            -E 'test(identity_create_fails_closed_without_pre_rotation_backend) + test(verify_device_attestation_fails_closed)'
      - name: Check the PyPI wheel's features vendor OpenSSL on non-Apple targets only
        run: |
          # `crates/scp-platform/Cargo.toml` declares the libsqlite3-sys edge that
          # `vendored-openssl` sets for non-Apple targets only, because
          # libsqlite3-sys 0.30.1 checks `bundled-sqlcipher-vendored-openssl` before
          # the Apple branch that selects CommonCrypto. For each wheel target this
          # resolves the wheel's feature list, requires the vendored feature on the
          # Linux and Windows targets, and on the Apple targets requires
          # `bundled-sqlcipher` (proof that the tree rendered) without the vendored one.
          FEATURES="$(python3 -c 'import tomllib; print(",".join(tomllib.load(open("bindings/python/pyproject.toml", "rb"))["tool"]["maturin"]["features"]))')"
          VENDORED='libsqlite3-sys feature "bundled-sqlcipher-vendored-openssl"'
          BUNDLED='libsqlite3-sys feature "bundled-sqlcipher"'
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            TREE="$(cargo tree -p scp-ffi --features "${FEATURES}" -e features --target "${target}" -i libsqlite3-sys)"
            case "${target}" in
              *-apple-darwin)
                grep -qF "${BUNDLED}" <<<"${TREE}" || { echo "${target}: no SQLCipher in the resolved tree"; exit 1; }
                if grep -qF "${VENDORED}" <<<"${TREE}"; then echo "${target}: the wheel vendors OpenSSL and drops CommonCrypto"; exit 1; fi ;;
              *)
                grep -qF "${VENDORED}" <<<"${TREE}" || { echo "${target}: the wheel does not vendor OpenSSL"; exit 1; } ;;
            esac
            echo "${target}: OK"
          done
      - name: Build pyo3 bridge with the PyPI wheel's features (vendored OpenSSL)
        run: |
          # The feature list comes from the file maturin reads, so this step builds
          # what the wheel builds and follows any later edit to that list. `--lib`
          # because `extension-module` leaves libpython unlinked, which a shared
          # library tolerates and a test or bin target does not. A failing python3
          # stops the step before cargo runs (assigned before use, shellcheck SC2155).
          FEATURES="$(python3 -c 'import tomllib; print(",".join(tomllib.load(open("bindings/python/pyproject.toml", "rb"))["tool"]["maturin"]["features"]))')"
          # Without `vendored-openssl` this step compiles no OpenSSL and proves
          # nothing this step exists for, so it fails instead of passing quietly.
          case ",${FEATURES}," in
            *,vendored-openssl,*) ;;
            *) echo "bindings/python/pyproject.toml [tool.maturin] features lacks vendored-openssl: ${FEATURES}"; exit 1 ;;
          esac
          cargo build -p scp-ffi --lib --features "${FEATURES}"

  # Builds the uniffi bridge (`scp-ffi-uniffi`) in its PRODUCTION configuration:
  # default features (`server` on) but WITHOUT `testing`. Same
  # guardrail rationale as the pyo3 lane above: `build-matrix.yml` only builds
  # the mobile (iOS XCFramework / Android .aar) production libs at release time,
  # so a PR could re-gate a production op behind the test-only feature and break
  # the production lib unnoticed until release. This is the per-PR guard against
  # that over-gating regression class.
  #
  # This job carried a "build-only" note claiming a uniffi test suite assumes
  # in-memory custody and does not compile in prod config. The pass that deleted
  # the identical note from the pyo3 lane above left this one standing. That
  # note reported a real compile failure: measured before this change,
  # `cargo test -p scp-ffi-uniffi --features server --lib --no-run` exited 101
  # with eight resolution errors, every one of them in
  # crates/scp-ffi/uniffi/src/bridge.rs, where four sites named
  # `testing`-gated items from tests carrying only `#[cfg(test)]`. Those four
  # sites now carry `#[cfg(feature = "testing")]`, so this crate's `--lib` test
  # target compiles in the shipped configuration, and a second step below runs
  # the shipped-build fail-closed assertion it holds.
  #
  # Gating those tests on `testing` moves no assertion out of a lane: job
  # rust-test enables `scp-ffi-uniffi/testing` and runs each of them there,
  # exactly as it did before.
  rust-build-uniffi-production:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / build + fail-closed test (uniffi production config)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - name: Build uniffi bridge in production config (no in-memory custody)
        run: |
          # Default features = production: `server` on, no `testing`.
          cargo build -p scp-ffi-uniffi --features server
      - name: Shipped uniffi fail-closed assertion
        run: |
          # The four `#[cfg(not(feature = "testing"))]` assertions this bridge
          # defines, and what each one asserts about a shipped build:
          #
          #   identity_create_in_memory_rejected_without_feature
          #     (crates/scp-ffi/uniffi/src/lib.rs) — `identity_create` rejects
          #     `in_memory` custody with SCP-IDENT-1008.
          #   parse_custody_method_rejects_in_memory_on_a_shipped_build
          #     (same file) — the boundary parser rejects the same string with
          #     the same code, one layer earlier.
          #   identity_create_with_custody_fails_closed_without_pre_rotation_backend
          #     (crates/scp-ffi/uniffi/src/bridge.rs) — a create over CALLBACK
          #     custody declines with SCP-IDENT-1059, because the tree's only
          #     `PreRotationCustody` implementation is a `testing`-gated
          #     nullifier (ADR-062, capability injection and prove-absent dev
          #     backends, §Decision 6).
          #   shipped_build_reaches_every_callback_custody_identity_op
          #     (same file) — the fourteen identity operations a released
          #     Swift/Kotlin SDK reaches over callback custody each compile
          #     into a shipped library and state their shipped outcome:
          #     `identity_load`, `scpid_sign`, `rotate_key`,
          #     `identity_migrate`, `add_agent_key`, `rotate_agent_key`,
          #     `remove_agent_key`, `identity_create_link_attestation`,
          #     `identity_link_attestations`,
          #     `identity_remove_link_attestation`, `event_log_checkpoint`,
          #     `event_log_checkpoint_by_did`, `identity_remove_if_present`
          #     and `identity_remove`. Re-gating any of them on `testing`
          #     stops this test target compiling.
          #
          # The four `ucan_*_over_callback_custody` tests carry no cfg gate and
          # need none: they build a `ContextHandle` directly rather than
          # minting an identity, so they run their real bodies here. Until the
          # second command below named them they ran only in lanes that enable
          # `scp-ffi-uniffi/testing`, which proves nothing about the mobile libs
          # build-matrix.yml ships at tag time.
          #
          # The three lanes that run uniffi tests each enable
          # `scp-ffi-uniffi/testing`, which compiles every
          # `#[cfg(not(feature = "testing"))]` test out: job rust-test and job
          # rust-doc in this file, and job conformance in release.yml. Until
          # this step existed, this job built the bridge and tested nothing, so
          # `identity_create_in_memory_rejected_without_feature` executed in no
          # lane while build-matrix.yml shipped that bridge in an iOS
          # XCFramework and an Android AAR at tag time.
          #
          # `--no-tests=fail` exits 4 rather than 0 when a feature flip selects
          # zero tests. `check_shipped_build_assertions_run` in
          # scripts/tests/ci-gate/ci_gate_selftest.py rejects this workflow when
          # a `#[cfg(not(feature = "testing"))]` test this bridge defines is
          # absent from both filters below.
          #
          # Two commands, not one union filterset, because nextest's `+` is a
          # union: a single command naming the four cfg-gated assertions
          # alongside the four un-gated `ucan_*` tests selects at least four
          # tests in every feature configuration, so `--no-tests=fail` could
          # never fire and the empty-selection tripwire would report nothing.
          # The first command therefore names only tests that a `testing` flip
          # deletes, which keeps a zero-test selection reachable; the second
          # runs the un-gated `ucan_*` tests under a `--no-tests=fail` of their
          # own, which fires if one of them is renamed out of the filter.
          cargo nextest run --no-tests=fail -p scp-ffi-uniffi --features server --lib \
            -E 'test(identity_create_in_memory_rejected_without_feature) + test(parse_custody_method_rejects_in_memory_on_a_shipped_build) + test(identity_create_with_custody_fails_closed_without_pre_rotation_backend) + test(shipped_build_reaches_every_callback_custody_identity_op)'
          cargo nextest run --no-tests=fail -p scp-ffi-uniffi --features server --lib \
            -E 'test(ucan_mint_works_over_callback_custody) + test(ucan_delegate_works_over_callback_custody) + test(ucan_delegate_signs_with_delegator_key_not_context_creator_key) + test(ucan_mint_without_retained_custody_returns_ident_1017)'

  rust-doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / doc
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Two restores, one per compile mode this job's commands run under, and both write
      # nothing. `cargo test --doc` links every doctest against build-mode `.rlib`s, the
      # artifacts rust-test writes to the `workspace-debug` group; `cargo doc --no-deps`
      # compiles every dependency to a check-mode `.rmeta`, the artifacts rust-clippy
      # writes to the `workspace-check` group. Cargo names the two sets under different
      # metadata hashes in the one `target/debug`, so the second restore adds to the
      # first and overwrites nothing; each step's key names its own group, so neither
      # restore can match the other's entry. Neither entry holds the units that this
      # job's `scp-node/cloud-blobs` and `scp-relay/cloud-blobs` features change, so
      # the job recompiles those units on every run. The paragraph after THE GROUPS
      # list at the top of this file says why no group holds them.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-check
          save-if: false
      - name: Run doc tests and build docs
        # `--document-private-items` is what lets this job reject a broken intra-doc
        # link written in a private module. Rustdoc resolves an intra-doc link only
        # inside an item it documents, so without that flag the workspace's
        # `forbid(rustdoc::broken_intra_doc_links)` (`[workspace.lints.rustdoc]` in the
        # root Cargo.toml, inherited by every member through `[lints] workspace = true`)
        # fires on the public surface alone and reads nothing a private module writes.
        # That table is what makes the flag reach every crate: while
        # `crates/scp-runtime/src/lib.rs` alone declared the lint, this command exited
        # 0 over 271 unresolved links in the other crate directories, and
        # `check_rustdoc_lint_reaches_every_member` in
        # scripts/tests/ci-gate/ci_gate_selftest.py now fails when a member omits the
        # inheriting line.
        # All three links pull request #2274, the structured OutletErrorSurface change,
        # broke sat in `crates/scp-runtime/src/context/outlets_helpers.rs`, a private
        # module. This job passed, `ci` reported success, and only the `rust-docs` job
        # of .github/workflows/docs.yml went red, which the Default ruleset does not
        # require, so those links rode `main` for ten days after that pull request
        # merged. `ci` is the sole required status check, so a rustdoc diagnostic this
        # command cannot produce blocks no merge. Two checks in
        # scripts/tests/ci-gate/ci_gate_selftest.py hold this command to that:
        # `check_rustdoc_documents_private_items` rejects a `cargo doc` command in any
        # workflow of this repository that omits the flag, and
        # `check_required_rustdoc_surface` fails when a `cargo doc` in any other
        # workflow passes a flag this command omits.
        # `scp-node/cloud-blobs` and `scp-relay/cloud-blobs` compile
        # `crates/scp-transport/src/native/postgres_blob.rs` and `s3_blob.rs`, which
        # no other workspace member's dependency declaration enables. Without them
        # both commands skip those two modules, so rustdoc resolves none of their
        # intra-doc links and `cargo test --doc` compiles none of their doctests.
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --doc --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/outlet-capability-test-grant,scp-node/cloud-blobs,scp-relay/cloud-blobs
          cargo doc --workspace --no-deps --document-private-items --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/outlet-capability-test-grant,scp-node/cloud-blobs,scp-relay/cloud-blobs

  rust-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Container image ─────────────────────────────────────────────────
  # Builds the `Dockerfile` that ships `scp-relay` and `scp-node`, and that
  # `templates/personal-relay/README.md` tells a self-hosting operator to run. Nothing
  # built this image until this job existed, so it sat on `FROM rust:1.85-slim` —
  # thirteen minor versions behind the pin — while every other file read the current
  # one, and its `.dockerignore` excluded the `*.md` files twelve crates pull in with
  # `#![doc = include_str!("../README.md")]`. Both defects compile fine and break only
  # at `docker build`.
  #
  # The build reaches the release compile of both binaries, so it is the slowest job
  # here; the layer cache keeps a run that changes no dependency to the final compile.
  #
  # WHY THE LAYER CACHE LIVES IN GHCR AND NOT THE ACTIONS CACHE. The Actions cache holds
  # 10 GB per repository and evicts the least recently used entry when it goes over. The
  # `Swatinem/rust-cache` entries every run restores held about 8.6 GB on their own, so
  # the buildkit blobs, which only this job reads, were evicted first: a main run found
  # the cache manifest but none of its blobs and rebuilt from `WORKDIR` down, and a pull
  # request run an hour after a main export failed with `blob sha256:…: not found` on the
  # cook layer and recompiled every dependency. The repository's Actions cache, measured
  # for this change, held 10.68 GB against that 10 GB limit. A registry is outside that
  # cap.
  #
  # The Actions cache has one advantage the registry lacks: GitHub scopes its entries
  # by branch, so a pull-request branch cannot write an entry `main` reads. A registry
  # tag has no such scoping, which is why the export needs the main-only token below.
  #
  # Move the layer cache back to the Actions cache when either holds:
  # (a) the repository's Actions cache total, read from
  #     `gh api repos/{owner}/{repo}/actions/cache/usage`, plus the size of the Docker
  #     layer export, the sum of the layer `size` fields in the manifest that
  #     `docker buildx imagetools inspect --raw ghcr.io/<repository>/buildcache:docker-image`
  #     prints, stays under the repository's cache limit, because other changes
  #     shrank the Rust cache entries or GitHub raised the limit;
  # (b) the main-only token arrangement can no longer be kept: the token cannot be
  #     renewed, or the `docker-cache` environment loses its rule that admits only
  #     branch `main`.
  #
  # WHO CAN WRITE THE CACHE. This job holds `packages: read` and builds without
  # exporting. Job `docker-image-cache`, the only job that exports, declares
  # environment `docker-cache`, whose deployment rule admits only branch `main`, and
  # logs in with that environment's `GHCR_CACHE_TOKEN`, a classic token holding only
  # `write:packages`; no job in this file holds `packages: write`. Each export moves the
  # tag and leaves the manifest it replaced as an untagged package version, and no job
  # in this file deletes those versions: deleting one needs `delete:packages`, which the
  # token does not hold.
  docker-image:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Docker / relay and node image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      # The builder stage measures about 6 GB — 2 GB of it the pin's cross-compilation
      # targets — before the buildx cache blobs. `rust-clippy` here and all three jobs in
      # `fuzz.yml` already reclaim this space.
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # `continue-on-error` so a failed login cannot fail the build check.
      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # A missing or unreadable cache only makes buildkit warn and build every layer.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:docker-image

  # Builds the same image on every push to `main` and exports its layer cache; the
  # comment on job `docker-image` above says why the export lives in this job alone.
  # Its `if:` reads only the event, because the `ci` gate cannot read a condition that
  # joins the event to a filter output and a step-level filter condition would report
  # success over zero work, so a push that changes no Rust still builds here.
  docker-image-cache:
    needs: changes
    if: github.event_name == 'push'
    name: Docker / relay and node image (cache export)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: docker-cache
    permissions:
      contents: read
      packages: read
    steps:
      # Job `docker-image`'s copy of this step says why it is conditional.
      - name: Free disk space when the runner is short of it
        run: |
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_CACHE_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # `mode=max` keeps the chef and builder stages, which hold the toolchain,
          # cargo-chef, and the cooked dependencies; the final stage alone holds none of
          # them. `image-manifest=true` stores the cache as an OCI image manifest.
          # A missing or unreadable cache only makes buildkit warn and build every layer.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:docker-image
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:docker-image,mode=max,image-manifest=true,oci-mediatypes=true

  # ── Shared bridge artifacts ─────────────────────────────────────────
  #
  # THE CRITERION: two jobs may share one build only when both would run the same
  # command with the same cargo feature resolution on the same runner OS, because
  # cargo hashes the feature set into every artifact's metadata and a bridge built
  # with `testing` behaves differently from one built without it.
  #
  # WHAT THE DUPLICATES COST. Profiled on run 34805871209, the push to `main` for the
  # commit that cut 46 crates from the cold workspace test compile: `maturin develop
  # --release` ran in four jobs (8.8 min on macos-latest, and 7.6, 7.5 and 6.7 min on
  # ubuntu-latest), `bindings/swift/build-xcframework.sh --dev` ran in two macOS jobs
  # (9.2 and 7.4 min), and `cargo build -p scp-ffi-napi --release` ran in two
  # ubuntu-latest jobs (7.4 and 2.1 min). Those eight steps took 56.7 runner-minutes
  # to produce four distinct binaries, and the longest job in the run —
  # bridge-parity-swift at 22.2 min — spent 18.0 of those minutes on two of them, which
  # set the run's 22.8-minute wall.
  #
  # WHY EACH ARTIFACT GETS ITS OWN JOB rather than a build added to one consumer that
  # the others then wait on. A consumer starts only after every job in its `needs` list
  # finishes, so putting both macOS builds in one job makes bridge-parity-swift wait
  # for the whole of it and finish later than it does today. Job xcframework and job
  # pyo3-module-macos run concurrently instead, and bridge-parity-swift starts when the
  # slower of the two ends.
  #
  # The UniFFI cdylib is the exception, and the measurement decides it: kotlin-test
  # builds it and uploads it, and bridge-parity-kotlin waits for the whole of
  # kotlin-test. In run 37177220484 bridge-parity-kotlin started when pyo3-module ended
  # (5.0 min), spent 2.6 of its 4.4 min installing a toolchain, restoring the cargo
  # cache and building that cdylib, and ended at 9.4 min, while kotlin-test ended at
  # 6.1 min. Waiting for kotlin-test and downloading costs about 1.1 min of start time
  # and saves the 2.6, and a separate producer job would pay its own checkout, cache
  # restore and toolchain install for a build kotlin-test still needs before its tests.
  #
  # WHICH FEATURE SETS ARE THE SAME, read out of the manifests rather than off the
  # command lines, because the four consumers spell one set three ways:
  #
  #   * crates/scp-ffi/Cargo.toml gives `testing` the list
  #     `scp-core/testing, scp-dht/testing, scp-ffi-common/testing,
  #     scp-platform/testing, dep:scp-testing`. python-test passed
  #     `--features testing` and the three parity jobs passed
  #     `--features scp-core/testing,testing`, so the second spelling names a feature
  #     the first already forwards and the two resolve to one graph.
  #   * crates/scp-ffi/napi/Cargo.toml gives `testing` a list that opens with
  #     `scp-core/testing`. typescript-check passed
  #     `--features scp-ffi-napi/testing,scp-ffi-napi/testing` and bridge-parity passed
  #     that pair plus `scp-core/testing`, so both resolve to `scp-ffi-napi/testing`.
  #   * Both macOS jobs ran `bindings/swift/build-xcframework.sh --dev` with no
  #     argument of their own, and that script's `--dev` branch sets
  #     `EXTRA_FEATURES="--features testing"` and builds the single target
  #     aarch64-apple-darwin.
  #
  # WHICH PAIRS DO NOT SHARE, and why:
  #
  #   * rust-build-pyo3-production, rust-build-uniffi-production and
  #     rust-test-napi-production each build a bridge with NO testing feature, to assert
  #     that a shipped build fails closed where a test build does not. An artifact built
  #     here carries `scp-platform/testing`, which compiles the in-memory custody and
  #     attestation nullifiers, so handing one to those jobs would delete the property
  #     they exist to prove. They keep building their own.
  #   * typescript-wasm-check and scaffold-typescript-web-check both run
  #     `bun run build` in bindings/typescript-wasm, which runs one `wasm-pack build`,
  #     on one runner OS. A producer would not pay for itself: that build took 1.8 min
  #     and 1.7 min in run 34805871209 against job totals of 4.1 min and 2.5 min, so a
  #     producer job's own checkout, toolchain and cache steps cost about what the
  #     second build costs, and both consumers would then start after it instead of at
  #     the top of the run. The measurement, not the shape, is what decides: a wasm
  #     build that grew past a few minutes would be worth splitting out.
  #
  # Each upload names `if-no-files-found: error`. An upload over an empty set succeeds
  # and publishes an empty artifact, which reaches a consumer as a missing file rather
  # than as a failed producer — the shape `.github/workflows/release.yml` hit when a
  # signing job published an artifact named as signed that held nothing. The option
  # fails a producer only when every listed path matches nothing, so the XCFramework
  # upload, which lists a tracked file, is guarded by a verify step in its own job.
  #
  # Each upload names `retention-days: 30` because GitHub offers "Re-run failed jobs"
  # for 30 days after a run starts, and that re-run skips a producer that passed, so
  # the re-run consumer downloads the first attempt's upload. An upload that expired
  # sooner would fail that download. scripts/tests/ci-gate/ci_gate_selftest.py
  # reports a downloaded artifact kept for fewer days.
  #
  # REUSE ACROSS RUNS. Each producer restores its artifact files from `actions/cache`
  # under the key below, and skips the cargo-cache and build steps when the
  # key hits. The upload runs either way, so consumers download the same artifact name
  # and path on a hit and on a miss.
  # The key holds:
  #
  #   * a literal `bridge-artifact-v1`; raising the number makes every producer miss
  #     and rebuild, for an input nobody listed;
  #   * the job id, the runner OS and the runner architecture;
  #   * `hashFiles` over rust-toolchain.toml (the compiler), Cargo.lock (every
  #     dependency version), every Cargo.toml (features, profiles, workspace
  #     inheritance), `.cargo/**` (rustflags), all of `crates/**` (the sources of
  #     every crate any bridge reaches, hashed whole so that no hand-kept crate list
  #     can go stale), bindings/python/pyproject.toml for the two PyO3 jobs,
  #     bindings/swift/build-xcframework.sh for job xcframework, and
  #     scripts/generate-uniffi-kotlin.sh for job kotlin-test;
  #   * a digest the `artifact-inputs` step computes over the job's own definition in
  #     this file (its build command and feature list), the workflow-level `env:`
  #     block every build inherits, the list of tracked paths under crates/
  #     (`hashFiles` hashes contents alone, so a renamed file changes no file hash),
  #     the runner image name and build (`ImageVersion` changes whenever any
  #     preinstalled package on the image changes), and the versions of the tools
  #     the build runs outside cargo: Python and maturin for the PyO3 jobs, glibc,
  #     the C compiler and the libssl-dev package on Linux, and Xcode and its macOS
  #     SDK on macOS.
  #
  # The cache holds the uploaded files alone, never `target/`. Only a push to `main`
  # saves on a miss, for the reason the cache section at the top of this file gives
  # for `save-if`: an entry a pull-request or merge-queue run wrote is readable by
  # that ref alone and would evict entries later runs read. No pull request can
  # place an artifact that `main` or another pull request restores. A push to `main`
  # that misses on all five producers saves five entries; the four artifacts other
  # than kotlin-test's totalled about 102 MB in run 37154692160.
  # scripts/tests/ci-gate/ci_gate_selftest.py
  # reports a producer whose key drops one of the file inputs above.
  pyo3-module:
    needs: changes
    # The union of the three consumers' conditions: python-test reads
    # `python || rust`, bridge-parity reads `python || typescript || rust`, and
    # bridge-parity-kotlin reads `python || kotlin || rust`. GitHub skips a job whose
    # `needs` holds a skipped job, so a producer selected by anything narrower than
    # that union would turn a consumer that was supposed to run into a skip. The `ci`
    # aggregator evaluates that consumer's own `if:`, finds it true, and fails the run
    # on the skip; the needs-condition check in
    # scripts/tests/ci-gate/ci_gate_selftest.py reports the narrowed union before any
    # pull request reaches that failure.
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.kotlin == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Bridge artifact / PyO3 module (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed before the key is computed, because the maturin version is one of
      # the key's inputs.
      - name: Create virtualenv and install maturin
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
      - name: Hash the artifact inputs no file glob covers
        id: artifact-inputs
        run: |
          set -euo pipefail
          job_definition=$(awk -v start="  ${GITHUB_JOB}:" \
            '$0 == start {found = 1; print; next} found && /^  [^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          if [ -z "$job_definition" ]; then
            echo "::error::.github/workflows/ci.yml defines no job ${GITHUB_JOB}"
            exit 1
          fi
          workflow_env=$(awk '$0 == "env:" {found = 1; print; next} found && /^[^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          source .venv/bin/activate
          inputs="$RUNNER_TEMP/artifact-inputs"
          {
            printf '%s\n' "$job_definition"
            printf '%s\n' "$workflow_env"
            git ls-files -- crates
            echo "image=${ImageOS:?ImageOS is unset}-${ImageVersion:?ImageVersion is unset}"
            python -VV
            maturin --version
            ldd --version 2>&1 | sed -n 1p
            cc --version | sed -n 1p
            dpkg-query -W -f='${Version}\n' libssl-dev
          } > "$inputs"
          digest=$(shasum -a 256 < "$inputs" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the PyO3 module a run with the same inputs built
        id: artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: bindings/python/scp_sdk/_scp_core*.so
          key: bridge-artifact-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**', 'crates/**', 'bindings/python/pyproject.toml') }}-${{ steps.artifact-inputs.outputs.digest }}
      - uses: Swatinem/rust-cache@v2
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        with:
          shared-key: workspace-ci-bridge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build PyO3 native module
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          cd bindings/python
          # `testing` forwards `scp-dht/testing`, which compiles the in-memory
          # DHT seam (`FfiDhtClient::InMemory`) the co-located multi-party tests
          # rely on to resolve each participant's DID within one process. Without
          # it the bridge would build the real Mainline Pkarr client for DID
          # resolution, and same-process governance vote verification would
          # fail-close to "unknown voter" (ADR-062 §Decision 1 gated the in-memory
          # DHT nullifier behind `testing`; the functional test harness opts in).
          maturin develop --profile ci-bridge --features testing
      - name: Upload PyO3 native module
        uses: actions/upload-artifact@v4
        with:
          # `[tool.maturin]` in bindings/python/pyproject.toml sets
          # `python-source = "."` and `module-name = "scp_sdk._scp_core"`, so
          # `maturin develop` writes the extension into the source tree beside the
          # Python package and every consumer runs pytest with `PYTHONPATH=.` from
          # bindings/python, which resolves `scp_sdk` out of that same tree. The
          # glob covers the interpreter tag in the filename
          # (`_scp_core.cpython-312-x86_64-linux-gnu.so`). Nothing else maturin
          # installs is read: every module under bindings/python/scp_sdk imports
          # the standard library and `scp_sdk` alone.
          name: pyo3-module-linux
          path: bindings/python/scp_sdk/_scp_core*.so
          retention-days: 30
          if-no-files-found: error
      - name: Save the PyO3 module under its input key
        if: steps.artifact-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: bindings/python/scp_sdk/_scp_core*.so
          key: ${{ steps.artifact-cache.outputs.cache-primary-key }}

