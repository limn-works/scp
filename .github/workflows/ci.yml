    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32
          save-if: false
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # Build the local wasm SDK package so the scaffold's file: dependency
      # resolves against real, built dist/ (types + ESM + the .wasm sibling).
      - name: Build @limn-works/scp-ts-wasm (dependency)
        working-directory: bindings/typescript-wasm
        run: |
          bun install
          bun run build
      - name: Install scaffold dependencies
        working-directory: scaffolds/typescript-web
        run: bun install
      - name: Check + lint + build
        working-directory: scaffolds/typescript-web
        run: |
          bun run check
          bun run lint
          bun run build

  # ── Kotlin ──────────────────────────────────────────────────────────
  kotlin-lint:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - name: Free disk space when the runner is short of it
        working-directory: /
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Google withdrew `tools`, the obsolete Android SDK Tools package,
          # from the SDK repository, and `tools platform-tools` is this
          # action's default package list. sdkmanager prints `Warning: Failed
          # to find package 'tools'` and exits 1, so the action throws before
          # it appends the command-line-tools bin directory to PATH, and the
          # job stops at this step. Naming the list drops the withdrawn
          # package and leaves the rest of the default. The two Kotlin jobs,
          # the Android build job in build-matrix.yml, and the Maven publish
          # job in release.yml each carry this input for the same reason.
          # First observed 2026-09-15 in the `Kotlin / test` job of workflow
          # run 34915608875.
          #
          # This step also carried `continue-on-error: true`, which pull
          # request #1352, the deployId return-value change, added so that
          # the action could fail while the sdkmanager the runner image
          # preinstalls served the steps below. The image stopped putting
          # that copy on PATH, so in workflow run 34915608875 the swallowed
          # failure reappeared three steps later as exit 127 against the
          # `sdkmanager "platforms;android-35"` step, which had run correct
          # code. A failed setup ends the job either way, so removing the key
          # turns no passing job red, and the job now stops at the step that
          # failed. The Android build job in build-matrix.yml and the Maven
          # publish job in release.yml stop there already.
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9acab5b5fbb560a72797e9277c5b0adfeed3bca" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-googlexr-license
          echo -e "\ne7ce8e93e13705710e8a1b7fdea3c49f149b1386" > $ANDROID_HOME/licenses/mips-android-sysimage-license
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      # `ktlintCheck`, not `runKtlintCheckOverMainSourceSet`: the `runKtlint*`
      # tasks only write the report and exit 0 whatever it lists; the
      # ktlint-gradle plugin fails the build in the `ktlint*SourceSetCheck`
      # tasks, and `ktlintCheck` runs them for the main, test and Kotlin-script
      # source sets (#2379). `:scp-kt` is the only module that applies ktlint.
      - run: ./gradlew :scp-kt:ktlintCheck
      - run: ./gradlew :scp-kt:detekt
      # `generateUniffiBindings` writes into `src/main/kotlin`, so Gradle fails
      # any task that reads that root and carries no ordering edge to it. Gradle
      # reports the failure only when both tasks land in one build and the
      # reader executes, and no job ran `sourcesJar` or `dokkaHtml` beside the
      # generator — so both shipped without an edge, and the release workflow's
      # publish-maven step would have aborted at `sourcesJar`. This gate reads
      # the edges out of Gradle's task model, so it fails on a missing edge
      # whatever the caller asked to build. It compiles no Rust, which is why it
      # belongs in this job rather than in `kotlin-test`.
      - run: ./gradlew :scp-kt:checkUniffiBindingsOrdering
      # `kotlin-test` and `bridge-parity-kotlin` pass `scp.uniffi.prebuiltBindings=true`
      # with the bindings present, so neither reaches
      # the property's failure branches or a relative directory. This step runs those
      # cases against scp-kt/build.gradle.kts. No step of this job generates the
      # bindings, so scp.kt is absent until the step writes a placeholder.
      - name: Check scp.uniffi.prebuiltBindings and CARGO_TARGET_DIR resolution
        env:
          BINDINGS: scp-kt/src/main/kotlin/works/limn/scp/internal/uniffi/scp/scp.kt
        run: |
          set -euo pipefail
          expect_failure() {
            local message=$1
            shift
            local output
            if output=$(./gradlew "$@" 2>&1); then
              echo "::error::./gradlew $* exited 0; it must fail with: $message"
              exit 1
            fi
            if ! grep -qF -- "$message" <<<"$output"; then
              echo "$output"
              echo "::error::./gradlew $* failed without: $message"
              exit 1
            fi
          }
          if [ -e "$BINDINGS" ]; then
            echo "::error::$BINDINGS exists before this step; the missing-file case needs it absent"
            exit 1
          fi
          expect_failure "scp.uniffi.prebuiltBindings is true and" \
            :scp-kt:compileKotlin --dry-run -Pscp.uniffi.prebuiltBindings=true
          expect_failure "scp.uniffi.prebuiltBindings is 'yes'; it takes true or false" \
            :scp-kt:compileKotlin --dry-run -Pscp.uniffi.prebuiltBindings=yes
          ./gradlew -q :scp-kt:compileKotlin --dry-run -Pscp.uniffi.prebuiltBindings=false
          mkdir -p "$(dirname "$BINDINGS")"
          echo "// placeholder" > "$BINDINGS"
          ./gradlew -q :scp-kt:compileKotlin --dry-run -Pscp.uniffi.prebuiltBindings=true
          rm "$BINDINGS"
          # Gradle runs with cargo off PATH, so the `cargo metadata` fallback fails
          # and only the branch that reads CARGO_TARGET_DIR can print the path.
          no_cargo_path="$(dirname "$(command -v java)"):/usr/bin:/bin"
          if PATH=$no_cargo_path command -v cargo >/dev/null; then
            echo "::error::cargo is on $no_cargo_path, so the fallback could answer"
            exit 1
          fi
          for value in relative/target "$RUNNER_TEMP/absolute-target"; do
            case $value in
              /*) dir=$value ;;
              *) dir=$GITHUB_WORKSPACE/$value ;;
            esac
            want="-Djna.library.path=$dir/debug:$dir/release"
            got=$(CARGO_TARGET_DIR=$value PATH=$no_cargo_path ./gradlew -q :scp-kt:printJnaLibraryPath | tail -n 1)
            if [ "$got" != "$want" ]; then
              echo "::error::CARGO_TARGET_DIR=$value gave '$got', not '$want'"
              exit 1
            fi
          done
      # `:scp-kt-android` declares detekt in its own build.gradle.kts and no job
      # invoked it, so every rule in ../detekt.yml — ForbiddenComment among them,
      # which is how this repository enforces its Kotlin stub policy — went
      # unread across that entire Android module.
      #
      # Run it in a step of its own rather than alongside a test task: Gradle
      # rejects `detekt` in one invocation with `:scp-kt:generateUniffiBindings`,
      # because detekt reads that task's output directory without declaring a
      # dependency on it.
      - run: ./gradlew :scp-kt-android:detekt

  # ORs on `rust` for a reason spelled out above python-test: this job builds
  # a UniFFI cdylib and runs a Kotlin suite against it, and that cdylib
  # reaches every Rust workspace crate through scp-core, while a `kotlin` filter
  # names only bindings/kotlin/**, crates/scp-ffi/uniffi/** and
  # crates/scp-ffi/common/**.
  kotlin-test:
    needs: changes
    # This job is also the producer of artifact `uniffi-kotlin-linux`, the UniFFI cdylib
    # and the Kotlin bindings generated from it, which bridge-parity-kotlin downloads.
    # Its own tests need `kotlin || rust`; the `python` clause is there because
    # bridge-parity-kotlin reads `python || kotlin || rust`, and GitHub skips a job whose
    # `needs` holds a skipped job, so a narrower condition here would skip the Kotlin half
    # of the parity harness on every change confined to bindings/python and fail the `ci`
    # aggregator on that skip.
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.kotlin == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Kotlin / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Google withdrew `tools`, the obsolete Android SDK Tools package,
          # from the SDK repository, and `tools platform-tools` is this
          # action's default package list. sdkmanager prints `Warning: Failed
          # to find package 'tools'` and exits 1, so the action throws before
          # it appends the command-line-tools bin directory to PATH, and the
          # job stops at this step. Naming the list drops the withdrawn
          # package and leaves the rest of the default. The two Kotlin jobs,
          # the Android build job in build-matrix.yml, and the Maven publish
          # job in release.yml each carry this input for the same reason.
          # First observed 2026-09-15 in the `Kotlin / test` job of workflow
          # run 34915608875.
          #
          # This step also carried `continue-on-error: true`, which pull
          # request #1352, the deployId return-value change, added so that
          # the action could fail while the sdkmanager the runner image
          # preinstalls served the steps below. The image stopped putting
          # that copy on PATH, so in workflow run 34915608875 the swallowed
          # failure reappeared three steps later as exit 127 against the
          # `sdkmanager "platforms;android-35"` step, which had run correct
          # code. A failed setup ends the job either way, so removing the key
          # turns no passing job red, and the job now stops at the step that
          # failed. The Android build job in build-matrix.yml and the Maven
          # publish job in release.yml stop there already.
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9acab5b5fbb560a72797e9277c5b0adfeed3bca" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-googlexr-license
          echo -e "\ne7ce8e93e13705710e8a1b7fdea3c49f149b1386" > $ANDROID_HOME/licenses/mips-android-sysimage-license
      - run: sdkmanager "platforms;android-35"
      - name: Hash the artifact inputs no file glob covers
        id: artifact-inputs
        run: |
          set -euo pipefail
          job_definition=$(awk -v start="  ${GITHUB_JOB}:" \
            '$0 == start {found = 1; print; next} found && /^  [^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          if [ -z "$job_definition" ]; then
            echo "::error::.github/workflows/ci.yml defines no job ${GITHUB_JOB}"
            exit 1
          fi
          workflow_env=$(awk '$0 == "env:" {found = 1; print; next} found && /^[^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          inputs="$RUNNER_TEMP/artifact-inputs"
          {
            printf '%s\n' "$job_definition"
            printf '%s\n' "$workflow_env"
            git ls-files -- crates
            echo "image=${ImageOS:?ImageOS is unset}-${ImageVersion:?ImageVersion is unset}"
            ldd --version 2>&1 | sed -n 1p
            cc --version | sed -n 1p
            dpkg-query -W -f='${Version}\n' libssl-dev
          } > "$inputs"
          digest=$(shasum -a 256 < "$inputs" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The key also hashes scripts/generate-uniffi-kotlin.sh, which runs uniffi-bindgen
      # over the cdylib and so decides the bindings this cache holds.
      - name: Restore the UniFFI cdylib and Kotlin bindings a run with the same inputs built
        id: artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug/libscp_ffi_uniffi.so
            bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/uniffi/scp/scp.kt
          key: bridge-artifact-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**', 'crates/**', 'scripts/generate-uniffi-kotlin.sh') }}-${{ steps.artifact-inputs.outputs.digest }}
      - name: Mark the start of the build
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: touch "$RUNNER_TEMP/uniffi-kotlin-build-start"
      - uses: Swatinem/rust-cache@v2
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        with:
          shared-key: workspace-debug
          save-if: false
      - name: Build UniFFI native library
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          cargo build -p scp-ffi-uniffi --features testing
      - name: Generate Kotlin bindings
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: ./scripts/generate-uniffi-kotlin.sh --skip-build --features=testing
      # `if-no-files-found: error` on the upload below fires only when both paths
      # together match nothing, so a build that wrote one of the two would publish half
      # an artifact under a green producer. This step fails the producer when either
      # path is absent or empty or, after a build, was not written by it. On a cache hit
      # no build ran, so it checks presence alone.
      # scripts/tests/ci-gate/ci_gate_selftest.py runs it against each path missing and
      # each path stale.
      - name: Verify the build wrote every uploaded output
        env:
          ARTIFACT_CACHE_HIT: ${{ steps.artifact-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/uniffi-kotlin-build-start"
          for output in \
            target/debug/libscp_ffi_uniffi.so \
            bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/uniffi/scp/scp.kt; do
            if [ ! -s "$output" ] && [ "${ARTIFACT_CACHE_HIT:-}" = true ]; then
              echo "::error::the cache restore reported a hit without writing $output"
              exit 1
            fi
            if [ ! -s "$output" ]; then
              echo "::error::the build exited 0 without writing $output"
              exit 1
            fi
            if [ "${ARTIFACT_CACHE_HIT:-}" = true ]; then
              continue
            fi
            if [ -z "$(find "$output" -newer "$marker" -print -quit)" ]; then
              echo "::error::$output holds nothing written by this build"
              exit 1
            fi
          done
      - name: Upload UniFFI cdylib and Kotlin bindings
        uses: actions/upload-artifact@v4
        with:
          # The two paths share no directory below the workspace, so upload-artifact
          # takes the workspace as the artifact root and bridge-parity-kotlin restores
          # both by downloading to `.`.
          name: uniffi-kotlin-linux
          path: |
            target/debug/libscp_ffi_uniffi.so
            bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/uniffi/scp/scp.kt
          retention-days: 30
          if-no-files-found: error
      - name: Save the UniFFI cdylib and Kotlin bindings under their input key
        if: steps.artifact-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug/libscp_ffi_uniffi.so
            bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/uniffi/scp/scp.kt
          key: ${{ steps.artifact-cache.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: bindings/kotlin
        env:
          # Read by `cargoTargetDir` in bindings/kotlin/scp-kt/build.gradle.kts in place
          # of a `cargo metadata` call, which on a cache hit, where no cargo command has
          # run, would make rustup install the pinned toolchain for that call alone.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          # Set JNA library path to find the compiled Rust cdylib
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Name both test tasks explicitly. `:scp-kt` is a kotlin-jvm module
          # and declares `test`; only the Android library module declares
          # `testDebugUnitTest`. Running the bare name `testDebugUnitTest`
          # therefore ran the Android unit tests alone and skipped every
          # `:scp-kt` test — including the real-FFI suites that exercise the
          # compiled cdylib this job builds or restores above.
          #
          # `-Pscp.uniffi.prebuiltBindings=true` skips `generateUniffiBindings`, which
          # would otherwise rebuild the crate, so these tests compile against the
          # bindings this job uploads and load the cdylib it uploads.
          # No PR or merge-queue run executes `generateUniffiBindings`; only
          # build-matrix.yml and release.yml do.
          ./gradlew :scp-kt:test :scp-kt-android:testDebugUnitTest -Pscp.uniffi.prebuiltBindings=true

  # ── Swift ──────────────────────────────────────────────────────────
  swift-lint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / lint + format
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/swift
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint and SwiftFormat
        # HOMEBREW_NO_AUTO_UPDATE prevents brew from auto-upgrading
        # formulae between CI runs, reducing version drift risk.
        # Known-good versions: swiftlint 0.63.2, swiftformat 0.60.1.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint swiftformat
      - run: swiftlint lint --strict
      - run: swiftformat --lint Sources/ Tests/

  # ORs on `rust` for a reason spelled out above python-test: this job runs a Swift
  # suite against an XCFramework, and that XCFramework reaches every Rust workspace
  # crate through scp-core, while a `swift` filter names only bindings/swift/**,
  # crates/scp-ffi/uniffi/** and crates/scp-ffi/common/**.
  swift-build-test:
    # Job xcframework builds ScpFFI.xcframework and regenerates ScpBindings.swift for
    # this job. This job runs no cargo command, so it installs no Rust toolchain and
    # reads no cargo cache.
    needs: [changes, xcframework]
    if: >-
      needs.changes.outputs.swift == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Swift / build + test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The Swift toolchain is the one the runner image ships, not a pinned download:
      # Swift 6.2, the minimum Package.swift declares, is not tested. This step records
      # which toolchain the build and tests below ran on.
      - name: Print Swift toolchain version
        run: swift --version
      - name: Download XCFramework and generated bindings
        uses: actions/download-artifact@v4
        with:
          name: swift-xcframework-dev
          path: bindings/swift
      - name: Build Swift package
        working-directory: bindings/swift
        run: swift build
      - name: Run Swift tests
        working-directory: bindings/swift
        run: swift test

  # ── Fuzz build check ─────────────────────────────────────────────────
  # Fast compilation check for the fuzz crate on every PR. Does not run
  # the fuzzer. Catches breakage when production APIs change and fuzz
  # targets are not updated to match. Requires nightly because the fuzz
  # crate uses libFuzzer internals.
  fuzz-build:
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    name: Fuzz / build check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # This step names no channel. rustup applies the toolchain file of the directory a
      # command runs in, so running `cargo check` from `fuzz/` resolves
      # `fuzz/rust-toolchain.toml` and installs the nightly it names — the same
      # invocation `fuzz/README.md` documents. That file records why the channel is a
      # dated nightly.
      - name: Check fuzz crate compiles
        working-directory: fuzz
        run: cargo check
      # `cargo check` never compiles `#[cfg(test)]`, so the fuzz crate's one
      # library test — which asserts that Arbitrary MessageType discriminants
      # still match a production enum — ran in no job. This step selects that
      # test by its exact path with `--no-tests=fail`, so renaming, deleting,
      # or cfg-gating it selects nothing and fails the step, whatever other
      # library tests the crate gains.
      - uses: taiki-e/install-action@nextest
      - name: Run fuzz crate library tests
        working-directory: fuzz
        run: cargo nextest run --no-tests=fail --lib -E 'test(=tests::arb_message_type_discriminants_match_production)'

  # ── Bridge parity (ADR-046) ────────────────────────────────────────
  # Cross-bridge runtime parity harness: drives PyO3 (in-process) and
  # NAPI (Bun child) with identical inputs, asserts normalized output
  # equality. Layer C of the bridge enforcement stack (Layer A = FFI
  # conformance, Layer B = SDK capability matrix).
  bridge-parity:
    # Jobs pyo3-module and napi-addon build the two bridges this harness drives. This
    # job runs no cargo command, so it installs no Rust toolchain and reads no cargo
    # cache.
    needs: [changes, pyo3-module, napi-addon]
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Cross-bridge runtime parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Check for unresolved issue placeholders
        # Runs immediately after checkout — a 1-second grep should not wait
        # on ~10 minutes of toolchain setup and native builds below.
        # Guards the whole bridge_parity directory (all op fixtures,
        # runners, and docstrings) against unresolved issue placeholders.
        # Any xfail or divergence callout must resolve to a real #NNNN
        # ref before merge — AGENTS.md forbids fabricated story references.
        #
        # Historically this grep targeted a tracking file that held xfail
        # paperwork; that file was deleted when the last xfail was resolved.
        # The directory-wide grep kept here is a durable tripwire for any
        # future divergence paperwork that sneaks in under a sentinel shape.
        #
        # Pattern is intentionally broad: matches angle-bracket sentinels
        # containing "issue", "TODO", "TBD", or "placeholder". This catches
        # common rewordings a reviewer might use to bypass a literal phrase
        # match — e.g. "<TODO: file issue>", "<issue: pending>",
        # "<TBD: will file later>", "<placeholder issue>". Harmless angle
        # brackets like List<str> or <em>text</em> do not match. If you hit
        # a false positive, resolve it to a real #NNNN ref rather than
        # weakening the pattern.
        run: |
          if grep -rnE '<[^>]*(issue|TODO|TBD|placeholder)[^>]*>' bindings/python/tests/bridge_parity/; then
            echo "ERROR: Unresolved issue placeholder in bridge_parity docs. File the GitHub issues and substitute real #NNNN refs before merging." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - name: Download PyO3 native module
        uses: actions/download-artifact@v4
        with:
          name: pyo3-module-linux
          path: bindings/python/scp_sdk
      - name: Download NAPI native addon
        uses: actions/download-artifact@v4
        with:
          name: napi-addon-linux
          path: target/ci-bridge
      - name: Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio
      # See the step of this name in job python-test for the skip-on-absence defect it
      # closes.
      - name: Assert the downloaded extension imports, constructs, and carries the gated methods
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. python -c "import scp_sdk._scp_core as module; print(module.__file__)"
          PYTHONPATH=. python -c "from scp_sdk import SCP; print(SCP(storage={'type': 'in_memory'}).instance_id)"
          PYTHONPATH=. python -c "
          from scp_sdk import _scp_core
          probe = _scp_core.SCP({'type': 'in_memory'})
          gated = (
              'relay_start_in_memory',
              'fullstack_create_node',
          )
          missing = [name for name in gated if not callable(getattr(probe, name, None))]
          if missing:
              raise SystemExit('the native SCP class is missing ' + ', '.join(missing) + ', so this extension was built without the feature that method needs')
          print('PyO3 extension carries the gated methods')
          "
      - name: Install TypeScript workspace deps
        working-directory: bindings/typescript
        run: bun install
      - name: Wire NAPI addon into node_modules
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) NAPI_PKG="@limn-works/scp-ts-napi-linux-x64-gnu" ;;
            aarch64|arm64) NAPI_PKG="@limn-works/scp-ts-napi-linux-arm64-gnu" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          PKG_DIR="bindings/typescript/node_modules/${NAPI_PKG}"
          mkdir -p "$PKG_DIR"
          LIB_FILE="target/ci-bridge/libscp_ffi_napi.so"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: cdylib not found at $LIB_FILE"
            ls -la target/ci-bridge/libscp_ffi_napi* 2>/dev/null || true
            exit 1
          fi
          cp "$LIB_FILE" "$PKG_DIR/index.node"
          echo '{"name":"'"$NAPI_PKG"'","version":"0.1.0","main":"index.node"}' > "$PKG_DIR/package.json"
      # See the step of this name in job typescript-check for the skip-on-absence
      # defect it closes. This job drives the NAPI half of the parity harness through a
      # Bun child process, so an addon that does not load surfaces in this step.
      - name: Assert the downloaded addon loads and constructs
        working-directory: bindings/typescript
        run: |
          bun -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            import { createRequire } from "node:module";
            import { loadNativeAddon } from "./src/internal/native.ts";
            import { SCP } from "./src/scp.ts";
            // The file the loader resolves must be the downloaded artifact, byte
            // for byte: a package bun installed from the registry, or one left by
            // an earlier step, would pass every property check below.
            const pkg = {
              x64: "@limn-works/scp-ts-napi-linux-x64-gnu",
              arm64: "@limn-works/scp-ts-napi-linux-arm64-gnu",
            }[process.arch];
            const loaderRequire = createRequire(process.cwd() + "/src/internal/native.ts");
            const resolved = loaderRequire.resolve(pkg);
            const digest = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
            const downloaded = "../../target/ci-bridge/libscp_ffi_napi.so";
            if (digest(resolved) !== digest(downloaded)) {
              throw new Error(resolved + " is not the downloaded addon " + downloaded);
            }
            const addon = loadNativeAddon();
            const NativeScp = addon.SCP;
            if (typeof NativeScp !== "function") {
              throw new Error("the native addon exports no SCP class");
            }
            const probe = new NativeScp(JSON.stringify({ type: "in_memory" }));
            for (const method of ["relayStartInMemory", "fullstackCreateNode"]) {
              if (typeof probe[method] !== "function") {
                throw new Error(
                  "the native SCP class is missing " + method +
                  ", so this addon was built without the feature that method needs"
                );
              }
            }
            // The skip guards under tests/ construct through the SDK class, so a
            // failure only that path raises must fail here, not skip those suites.
            const sdk = new SCP({ storage: { type: "in_memory" } });
            await sdk.shutdown(1);
            console.log("NAPI addon loaded, constructed through the SDK, and carries the gated methods");
            process.exit(0);
          '
      - name: Run parity tests (NAPI only)
        # The Kotlin and Swift alt-bridge cases are covered by dedicated
        # jobs (`bridge-parity-kotlin`, `bridge-parity-swift`) that own
        # their respective toolchains. Filter by test ID (which encodes
        # the alt-bridge mode as a prefix, e.g. `napi-identity_create...`)
        # so this job's selection stays a single source of truth aligned
        # with `_BRIDGE_MATRIX` in test_bridge_parity.py.
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/bridge_parity/ -v -m parity -k "napi"

  # ── Bridge parity (Kotlin UniFFI) ──────────────────────────────────
  # Layer C extension: runs the same ADR-046 harness against the UniFFI
  # Kotlin bindings. Separate job because it needs a JVM toolchain and
  # a pre-built UniFFI Kotlin binding tree on top of the Python + Rust
  # stack the parent bridge-parity job already carries.
  bridge-parity-kotlin:
    # Job pyo3-module builds the PyO3 half of this harness, and job kotlin-test builds
    # the UniFFI half: the `scp-ffi-uniffi --features testing` cdylib and the Kotlin
    # bindings generated from it, uploaded together as `uniffi-kotlin-linux`. This job
    # runs no cargo command, so it installs no Rust toolchain and reads no cargo cache.
    # The installDist step passes `-Pscp.uniffi.prebuiltBindings=true`, which skips
    # `generateUniffiBindings` in bindings/kotlin/scp-kt/build.gradle.kts; without it
    # that task would rebuild the crate whatever the download placed in `target/debug`.
    needs: [changes, pyo3-module, kotlin-test]
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.kotlin == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Cross-bridge runtime parity (UniFFI Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download PyO3 native module
        uses: actions/download-artifact@v4
        with:
          name: pyo3-module-linux
          path: bindings/python/scp_sdk
      # The artifact root is the workspace (see the upload in kotlin-test), so `.`
      # restores `target/debug/libscp_ffi_uniffi.so` and the generated `scp.kt` to the
      # paths kotlin-test wrote them at. A missing artifact fails this step.
      - name: Download UniFFI cdylib and Kotlin bindings
        uses: actions/download-artifact@v4
        with:
          name: uniffi-kotlin-linux
          path: .
      - name: Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio
      # See the step of this name in job python-test for the skip-on-absence defect it
      # closes.
      - name: Assert the downloaded extension imports, constructs, and carries the gated methods
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. python -c "import scp_sdk._scp_core as module; print(module.__file__)"
          PYTHONPATH=. python -c "from scp_sdk import SCP; print(SCP(storage={'type': 'in_memory'}).instance_id)"
          PYTHONPATH=. python -c "
          from scp_sdk import _scp_core
          probe = _scp_core.SCP({'type': 'in_memory'})
          gated = (
              'relay_start_in_memory',
              'fullstack_create_node',
          )
          missing = [name for name in gated if not callable(getattr(probe, name, None))]
          if missing:
              raise SystemExit('the native SCP class is missing ' + ', '.join(missing) + ', so this extension was built without the feature that method needs')
          print('PyO3 extension carries the gated methods')
          "
      # A download that left either file out or empty fails here, naming the file,
      # rather than as a Gradle compile error or a JNA load error in a later step.
      - name: Assert the downloaded cdylib and bindings are present
        run: |
          set -euo pipefail
          for output in \
            target/debug/libscp_ffi_uniffi.so \
            bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/uniffi/scp/scp.kt; do
            if [ ! -s "$output" ]; then
              echo "::error::artifact uniffi-kotlin-linux placed nothing at $output"
              exit 1
            fi
          done
      - name: Build Kotlin parity runner (installDist)
        # Uses the bindings/kotlin/gradlew wrapper against the runner
        # project; `-p` points Gradle at the runner's directory so its
        # settings.gradle.kts (which composite-includes scp-kt) is
        # honored. `installDist` lays out a runnable bin script that
        # the Python harness launches directly — NOT via `gradle run`,
        # which would wire the Gradle daemon into the stdio pipe.
        #
        # `-Pscp.uniffi.prebuiltBindings=true` reaches scp-kt through the
        # composite build and skips its `generateUniffiBindings` task, so
        # the runner compiles against the downloaded bindings, which
        # uniffi-bindgen generated from the downloaded cdylib with
        # `testing` enabled. The parity harness drives
        # `signed_at_override`, which is `#[cfg(feature = "testing")]`-
        # gated, so bindings and a cdylib built without it fail the
        # runner's compile or its calls.
        run: |
          bindings/kotlin/gradlew \
            -p bindings/python/tests/bridge_parity/helpers/kotlin_bridge_runner \
            installDist --no-daemon \
            -Pscp.uniffi.prebuiltBindings=true
      - name: Run parity tests (UniFFI Kotlin only)
        env:
          # JNA loads the UniFFI cdylib via the system library path.
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          # The kotlin_runner fixture reads this instead of running `cargo metadata`,
          # which on this toolchain-less job would make rustup install the pinned
          # channel.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          # Explicit runner-binary override (conftest also falls back
          # to the default installDist output; this makes CI failures
          # easier to diagnose by pinning the path).
          SCP_PARITY_KOTLIN_RUNNER: ${{ github.workspace }}/bindings/python/tests/bridge_parity/helpers/kotlin_bridge_runner/build/install/kotlin-bridge-runner/bin/kotlin-bridge-runner
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/bridge_parity/ -v -m parity -k "uniffi-kotlin"

  # ── Bridge parity (Swift UniFFI, macOS) ────────────────────────────
  # Layer C extension: runs the same ADR-046 harness against the UniFFI
  # Swift bindings. Pinned to macos-latest because UniFFI Swift ships
  # as an .xcframework that targets Apple platforms.
  bridge-parity-swift:
    # Jobs pyo3-module-macos and xcframework build the two bridges this harness
    # drives, and they run concurrently, so this job starts when the slower of the two
    # ends. Both producers are macOS jobs: an ELF `.so` and an aarch64-apple-darwin
    # static library are not interchangeable. This job runs no cargo command, so it
    # installs no Rust toolchain and reads no cargo cache.
    needs: [changes, pyo3-module-macos, xcframework]
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.swift == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Cross-bridge runtime parity (UniFFI Swift)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Swift toolchain is the one the runner image ships; see job swift-build-test.
      - name: Print Swift toolchain version
        run: swift --version
      - name: Download PyO3 native module
        uses: actions/download-artifact@v4
        with:
          name: pyo3-module-macos
          path: bindings/python/scp_sdk
      - name: Download XCFramework and generated bindings
        uses: actions/download-artifact@v4
        with:
          name: swift-xcframework-dev
          path: bindings/swift
      - name: Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio
      # See the step of this name in job python-test for the skip-on-absence defect it
      # closes.
      - name: Assert the downloaded extension imports, constructs, and carries the gated methods
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. python -c "import scp_sdk._scp_core as module; print(module.__file__)"
          PYTHONPATH=. python -c "from scp_sdk import SCP; print(SCP(storage={'type': 'in_memory'}).instance_id)"
          PYTHONPATH=. python -c "
          from scp_sdk import _scp_core
          probe = _scp_core.SCP({'type': 'in_memory'})
          gated = (
              'relay_start_in_memory',
              'fullstack_create_node',
          )
          missing = [name for name in gated if not callable(getattr(probe, name, None))]
          if missing:
              raise SystemExit('the native SCP class is missing ' + ', '.join(missing) + ', so this extension was built without the feature that method needs')
          print('PyO3 extension carries the gated methods')
          "
      # Debug, not release: the runner only decodes JSON-RPC frames and calls the UniFFI
      # bindings, whose work runs in the prebuilt Rust static library, and no parity
      # case asserts on timing, so an optimized Swift build buys nothing for its
      # compile time.
      - name: Build Swift parity runner
        run: |
          cd bindings/python/tests/bridge_parity/helpers/swift_bridge_runner
          swift build
      - name: Run parity tests (UniFFI Swift only)
        env:
          SCP_PARITY_SWIFT_RUNNER: ${{ github.workspace }}/bindings/python/tests/bridge_parity/helpers/swift_bridge_runner/.build/debug/swift-bridge-runner
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/bridge_parity/ -v -m parity -k "uniffi-swift"

  # ── CI workflow self-test ───────────────────────────────────────────
  # A `ci` gate below decides every merge, so logic deciding it gets its own
  # tests. scripts/tests/ci-gate/run-tests.sh feeds synthetic dependency
  # results to scripts/ci-aggregate-result.py and asserts each verdict against
  # a table of its own naming which jobs a scenario selects, never against that
  # script's reading of an `if:` condition. It also asserts structural properties
  # of these workflows that no single run can demonstrate. The docstring of
  # scripts/tests/ci-gate/ci_gate_selftest.py names every one of them and the
  # defect each one closes; seven of them, as examples: every job carries a
  # timeout-minutes, every job is a dependency of `ci`, every
  # `dtolnay/rust-toolchain` step names a ref that action publishes, an `if:`
  # naming a filter output `changes` never published stops that gate rather than
  # holding a job at `skipped`, a filter gating a `--workspace` cargo command
  # matches every member the root Cargo.toml lists, and a `cargo doc` command
  # passes `--document-private-items` so that rustdoc reads the intra-doc links
  # private modules write in every member the root Cargo.toml holds to
  # `forbid(rustdoc::broken_intra_doc_links)`, every `cargo doc` a tracked
  # Markdown file hands a developer to run passes the flags job rust-doc below
  # passes, so a developer's local run reports what this merge waits on, and
  # every `cargo doc` a tracked Markdown file writes with a `--features` list
  # sits inside a fenced shell block, which is the only place that comparison
  # reads a command.
  ci-workflow-selftest:
    needs: check-draft
    name: CI workflow / self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to a compatible range so a breaking upstream release cannot red
      # one required status check, matching a pytest pin in sdk-coverage.
      - run: pip install 'pyyaml>=6,<7'
      - run: bash scripts/tests/ci-gate/run-tests.sh
      # A ci-gate assertion pins every release.yml job that uploads a
      # `-signed` artifact — sign-apple, sign-windows and sign-maven — to
      # running scripts/assert-nonempty-signing-set.sh before that upload.
      # Whether that script rejects an empty set is a separate question, which
      # these fixtures answer by running it against real directories.
      - run: bash scripts/tests/signing-guard/run-tests.sh
      # Two fuzz.yml jobs size `timeout-minutes` by selecting a whole-minute
      # budget per `fuzz_time` option, because GitHub expressions carry no
      # arithmetic. scripts/tests/ci-gate reads those chains and assumes an
      # evaluator picks a matching arm, and falls through to a trailing value
      # when no input arrives. Reading a chain cannot prove that assumption, so
      # these two assertions hand identical shapes to a real evaluator.
      - name: Selection-chain evaluation matches what ci-gate assumes
        env:
          MATCHED_ARM: ${{ '7200' == '7200' && 150 || 45 }}
          ABSENT_INPUT: ${{ github.event.inputs.fuzz_time == '7200' && 150 || 45 }}
        run: |
          test "$MATCHED_ARM" = "150" || {
            echo "a matching arm evaluated to $MATCHED_ARM, expected 150" >&2; exit 1; }
          test "$ABSENT_INPUT" = "45" || {
            echo "an absent input evaluated to $ABSENT_INPUT, expected 45" >&2; exit 1; }
          echo "matching arm -> $MATCHED_ARM, absent input -> $ABSENT_INPUT"

  # ── CI Gate ─────────────────────────────────────────────────────────
  # One status check this repository's ruleset requires, so this job decides
  # every merge. `if: always()` runs it even when a dependency skipped.
  #
  # Its verdict lives in scripts/ci-aggregate-result.py, not in this file. That
  # script reads `toJSON(needs)`, so it covers every dependency by construction
  # rather than by a second hand-written copy of a dependency list, and it
  # decides per job whether that job was supposed to run by evaluating its
  # own `if:` condition against a `changes` job's filter outputs. A job that
  # was supposed to run and did not report success fails this gate.
  ci:
    if: always()
    needs:
      - check-draft
      - changes
      - error-codes
      - shipped-feature-graph
      - fail-closed-pre-rotation
      - cross-layer
      - bridge-symmetry
      - sdk-coverage
      - protocol-sync
      - pyi-generated
      - construction-pattern
      - protocol-deps
      - bridge-globals
      - fallback-registry
      - handle-affinity
      - pyi-generated
      - construction-pattern
      - block-in-place
      - no-panic-abort
      - handler-no-panic
      - saga-gating-granularity
      - block-in-place
      - doc-citations
      - doc-includes
      - agent-verdict-criterion
      - deleted-primitives
      - bridge-instance-lifecycle
      - toolchain-wiring
      - fix-round-check-selftest
      - docker-image
      - docker-image-cache
      - no-mutable-globals-rust
      - no-mutable-globals-python
      - no-mutable-globals-ts
      - no-mutable-globals-kotlin
      - wasm-protocol
      - wasm-test
      - rust-fmt
      - rust-clippy
      - rust-test
      - rust-test-optional-features
      - rust-test-napi-production
      - rust-build-pyo3-production
      - rust-build-uniffi-production
      - rust-doc
      - rust-deny
      - pyo3-module
      - napi-addon
      - xcframework
      - pyo3-module-macos
      - python-lint
      - python-test
      - typescript-check
      - typescript-wasm-check
      - scaffold-typescript-web-check
      - kotlin-lint
      - kotlin-test
      - swift-lint
      - swift-build-test
      - fuzz-build
      - bridge-parity
      - bridge-parity-kotlin
      - bridge-parity-swift
      - ci-workflow-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to a compatible range so a breaking upstream release cannot red
      # one required status check, matching a pytest pin in sdk-coverage.
      - run: pip install 'pyyaml>=6,<7'
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci-aggregate-result.py .github/workflows/ci.yml
