name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'merge_group' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft PR, proceeding"

  # Detect which language areas changed. Jobs skip when their paths
  # haven't been touched, but still report "success" to branch protection.
  changes:
    needs: check-draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            python:
              - 'bindings/python/**'
              - 'crates/scp-ffi/src/**'
              - 'crates/scp-ffi/common/**'
            typescript:
              - 'bindings/typescript/**'
              - 'crates/scp-ffi/napi/**'
              - 'crates/scp-ffi/wasm/**'
              - 'crates/scp-ffi/common/**'
            kotlin:
              - 'bindings/kotlin/**'
              - 'crates/scp-ffi/uniffi/**'
              - 'crates/scp-ffi/common/**'
            swift:
              - 'bindings/swift/**'
              - 'crates/scp-ffi/uniffi/**'
              - 'crates/scp-ffi/common/**'

  # ── Error codes ───────────────────────────────────────────────────
  error-codes:
    needs: check-draft
    name: Error code conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check-error-codes.sh

  # ── Rust ────────────────────────────────────────────────────────────
  rust-fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Enable allow_in_memory_custody for scp-ffi-uniffi so that the
          # in-memory custody code paths are lint-checked. Mobile production
          # builds (iOS XCFramework, Android .aar) MUST NOT enable this
          # feature. See GitHub issue #88.
          cargo clippy --workspace --all-targets --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing -- -D warnings

  # Matrix jobs must always expand so each OS variant reports a status
  # to branch protection. Step-level `if` skips the heavy work instead.
  rust-test:
    needs: changes
    name: Rust / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Free disk space (Ubuntu)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          # The full Rust workspace (657 deps, 16 crates) needs ~12GB to compile.
          # Ubuntu runners ship with ~14GB free but pre-installed SDKs consume
          # most of it. Remove unused toolchains to reclaim ~20GB.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        if: needs.changes.outputs.rust == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.rust == 'true'
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
      - uses: taiki-e/install-action@nextest
        if: needs.changes.outputs.rust == 'true'
      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        run: |
          LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export DYLD_LIBRARY_PATH="${LIBDIR}${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="${LIBDIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          # Enable allow_in_memory_custody for scp-ffi-uniffi so that
          # in-memory custody tests run. Mobile production builds (iOS
          # XCFramework, Android .aar) MUST NOT enable this feature.
          # See GitHub issue #88.
          cargo nextest run --workspace --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing
          # Test scp-transport with optional features that aren't enabled by
          # --workspace (combined includes rusqlite + scp-platform; local-cache
          # enables caching logic).
          cargo test -p scp-transport --features combined,local-cache

  rust-doc:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / doc
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Run doc tests and build docs
        run: |
          export LD_LIBRARY_PATH="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --doc --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing
          cargo doc --workspace --no-deps --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing

  rust-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ── Python ──────────────────────────────────────────────────────────
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff format --check .
      - run: ruff check .

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio maturin
      - name: Build PyO3 native module
        run: |
          source .venv/bin/activate
          cd bindings/python
          maturin develop --release --features allow_in_memory_custody
      - name: Run tests (including real FFI)
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. pytest tests/ -v

  # ── TypeScript ──────────────────────────────────────────────────────
  typescript-check:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    name: TypeScript / check + lint + test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NAPI native addon
        run: |
          cargo build -p scp-ffi-napi --release --features scp-ffi-napi/allow_in_memory_custody
      - name: Install TypeScript dependencies
        working-directory: bindings/typescript
        run: bun install
      - name: Wire NAPI addon into node_modules
        run: |
          # Determine the platform-specific package name and library filename
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) NAPI_PKG="@limn-works/scp-ts-napi-linux-x64-gnu" ;;
            aarch64|arm64) NAPI_PKG="@limn-works/scp-ts-napi-linux-arm64-gnu" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          # Create a fake platform package in node_modules so createRequire finds it
          PKG_DIR="bindings/typescript/node_modules/${NAPI_PKG}"
          mkdir -p "$PKG_DIR"
          # The cargo build produces a cdylib; copy and rename to .node for NAPI loading
          LIB_FILE="target/release/libscp_ffi_napi.so"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: cdylib not found at $LIB_FILE"
            ls -la target/release/libscp_ffi_napi* 2>/dev/null || true
            exit 1
          fi
          cp "$LIB_FILE" "$PKG_DIR/index.node"
          # Create a minimal package.json so require() resolves
          echo '{"name":"'"$NAPI_PKG"'","version":"0.1.0","main":"index.node"}' > "$PKG_DIR/package.json"
      - name: Run checks
        working-directory: bindings/typescript
        run: |
          bun run check
          bun run lint
          bun test

  # ── Kotlin ──────────────────────────────────────────────────────────
  kotlin-lint:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - name: Free disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9acab5b5fbb560a72797e9277c5b0adfeed3bca" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-googlexr-license
          echo -e "\ne7ce8e93e13705710e8a1b7fdea3c49f149b1386" > $ANDROID_HOME/licenses/mips-android-sysimage-license
      - run: sdkmanager "platforms;android-35"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :scp-kt:runKtlintCheckOverMainSourceSet
      - run: ./gradlew :scp-kt:detekt

  kotlin-test:
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    name: Kotlin / test
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9acab5b5fbb560a72797e9277c5b0adfeed3bca" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/android-googlexr-license
          echo -e "\ne7ce8e93e13705710e8a1b7fdea3c49f149b1386" > $ANDROID_HOME/licenses/mips-android-sysimage-license
      - run: sdkmanager "platforms;android-35"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build UniFFI native library
        run: |
          cargo build -p scp-ffi-uniffi --features allow_in_memory_custody
      - name: Generate Kotlin bindings
        run: ./scripts/generate-uniffi-kotlin.sh --skip-build --features=allow_in_memory_custody
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: bindings/kotlin
        run: |
          # Set JNA library path to find the compiled Rust cdylib
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./gradlew testDebugUnitTest

  # ── WASM ───────────────────────────────────────────────────────────
  wasm-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: WASM / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p scp-ffi-wasm --target wasm32-unknown-unknown -- -D warnings

  # ── Swift ──────────────────────────────────────────────────────────
  swift-lint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / lint + format
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bindings/swift
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint and SwiftFormat
        # HOMEBREW_NO_AUTO_UPDATE prevents brew from auto-upgrading
        # formulae between CI runs, reducing version drift risk.
        # Known-good versions: swiftlint 0.63.2, swiftformat 0.60.1.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install swiftlint swiftformat
      - run: swiftlint lint --strict
      - run: swiftformat --lint Sources/ Tests/

  swift-build-test:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    name: Swift / build + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build XCFramework (dev mode — macOS arm64 only)
        run: bindings/swift/build-xcframework.sh --dev
      - name: Build Swift package
        working-directory: bindings/swift
        run: swift build
      - name: Run Swift tests
        working-directory: bindings/swift
        run: swift test

  # ── CI Gate ─────────────────────────────────────────────────────────
  # Single required check for branch protection. Depends on all CI jobs
  # and uses if: always() so it runs even when paths-filter skips jobs.
  # Reports success only when every non-skipped job succeeded.
  ci:
    if: always()
    needs:
      - error-codes
      - rust-fmt
      - rust-clippy
      - rust-test
      - rust-doc
      - rust-deny
      - python-lint
      - python-test
      - typescript-check
      - kotlin-lint
      - kotlin-test
      - wasm-clippy
      - swift-lint
      - swift-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          results=( \
            "${{ needs.error-codes.result }}" \
            "${{ needs.rust-fmt.result }}" \
            "${{ needs.rust-clippy.result }}" \
            "${{ needs.rust-test.result }}" \
            "${{ needs.rust-doc.result }}" \
            "${{ needs.rust-deny.result }}" \
            "${{ needs.python-lint.result }}" \
            "${{ needs.python-test.result }}" \
            "${{ needs.typescript-check.result }}" \
            "${{ needs.kotlin-lint.result }}" \
            "${{ needs.kotlin-test.result }}" \
            "${{ needs.wasm-clippy.result }}" \
            "${{ needs.swift-lint.result }}" \
            "${{ needs.swift-build-test.result }}" \
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::CI job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."
