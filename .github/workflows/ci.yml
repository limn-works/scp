          key: bridge-artifact-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**', 'crates/**') }}-${{ steps.artifact-inputs.outputs.digest }}
      - uses: Swatinem/rust-cache@v2
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        with:
          shared-key: workspace-ci-bridge
          save-if: false
      - name: Build NAPI native addon
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          # `scp-ffi-napi/testing` compiles the in-memory DHT seam
          # (`FfiDhtClient::InMemory`) the co-located multi-party TypeScript tests
          # and the parity harness rely on to resolve each participant's DID within
          # one process. Without it the addon builds the real Mainline Pkarr client
          # for DID resolution, and same-process resolution and governance flows
          # would block on the network or fail-close to "unknown voter"
          # (ADR-062 §Decision 1 gated the in-memory DHT nullifier behind `testing`).
          # crates/scp-ffi/napi/Cargo.toml opens that feature's list with
          # `scp-core/testing`, so this one flag is the set both consumers spelled.
          cargo build -p scp-ffi-napi --profile ci-bridge --features scp-ffi-napi/testing
      - name: Upload NAPI native addon
        uses: actions/upload-artifact@v4
        with:
          name: napi-addon-linux
          path: target/ci-bridge/libscp_ffi_napi.so
          retention-days: 30
          if-no-files-found: error
      - name: Save the NAPI addon under its input key
        if: steps.artifact-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/ci-bridge/libscp_ffi_napi.so
          key: ${{ steps.artifact-cache.outputs.cache-primary-key }}

  xcframework:
    needs: changes
    # The union of swift-build-test (`swift || rust`) and bridge-parity-swift
    # (`python || swift || rust`).
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.swift == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Bridge artifact / Swift XCFramework (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # `build-xcframework.sh` runs cargo, `xcodebuild -create-xcframework` and `lipo`,
      # and compiles no Swift. No macOS job installs a Swift toolchain: the two
      # consumers that run `swift build` use the one the runner image ships, and each
      # prints `swift --version`.
      - name: Hash the artifact inputs no file glob covers
        id: artifact-inputs
        run: |
          set -euo pipefail
          job_definition=$(awk -v start="  ${GITHUB_JOB}:" \
            '$0 == start {found = 1; print; next} found && /^  [^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          if [ -z "$job_definition" ]; then
            echo "::error::.github/workflows/ci.yml defines no job ${GITHUB_JOB}"
            exit 1
          fi
          workflow_env=$(awk '$0 == "env:" {found = 1; print; next} found && /^[^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          inputs="$RUNNER_TEMP/artifact-inputs"
          {
            printf '%s\n' "$job_definition"
            printf '%s\n' "$workflow_env"
            git ls-files -- crates
            echo "image=${ImageOS:?ImageOS is unset}-${ImageVersion:?ImageVersion is unset}"
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
          } > "$inputs"
          digest=$(shasum -a 256 < "$inputs" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the XCFramework a run with the same inputs built
        id: artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            bindings/swift/ScpFFI.xcframework
            bindings/swift/Headers
            bindings/swift/Sources/SCP/Internal/ScpBindings.swift
          key: bridge-artifact-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**', 'crates/**', 'bindings/swift/build-xcframework.sh') }}-${{ steps.artifact-inputs.outputs.digest }}
      - uses: Swatinem/rust-cache@v2
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        with:
          shared-key: apple-uniffi-ci-bridge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build XCFramework (dev mode — macOS arm64 only)
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          touch "$RUNNER_TEMP/xcframework-build-start"
          bindings/swift/build-xcframework.sh --dev --profile ci-bridge
      # The upload below cannot fail on its own: `if-no-files-found: error` fires only
      # when all three paths together match nothing, and ScpBindings.swift is tracked,
      # so the checkout always supplies one match. A script that exited 0 without
      # writing the XCFramework, or without regenerating the bindings, would publish
      # the checkout's copy under a green producer. This step fails the producer when
      # any uploaded path is absent or holds nothing written after the build began.
      # scripts/tests/ci-gate/ci_gate_selftest.py runs it against each path missing
      # and each path stale. On a cache hit no build ran, so the step checks presence
      # alone. ScpBindings.swift is tracked, so on a hit the checkout supplies it and
      # the presence check cannot detect a restore that left it out.
      - name: Verify the build wrote every uploaded output
        env:
          ARTIFACT_CACHE_HIT: ${{ steps.artifact-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/xcframework-build-start"
          for output in \
            bindings/swift/ScpFFI.xcframework \
            bindings/swift/Headers \
            bindings/swift/Sources/SCP/Internal/ScpBindings.swift; do
            if [ ! -e "$output" ] && [ "${ARTIFACT_CACHE_HIT:-}" = true ]; then
              echo "::error::the cache restore reported a hit without writing $output"
              exit 1
            fi
            if [ ! -e "$output" ]; then
              echo "::error::build-xcframework.sh --dev exited 0 without writing $output"
              exit 1
            fi
            if [ "${ARTIFACT_CACHE_HIT:-}" = true ]; then
              continue
            fi
            if [ -z "$(find "$output" -newer "$marker" -print -quit)" ]; then
              echo "::error::$output holds nothing written by this build"
              exit 1
            fi
          done
      - name: Upload XCFramework and generated bindings
        uses: actions/upload-artifact@v4
        with:
          # Three outputs, all under bindings/swift, which upload-artifact takes as
          # the artifact root: the binary target Package.swift names by path, the C
          # header and module map the script regenerates, and the Swift bindings
          # uniffi-bindgen emits. ScpBindings.swift is tracked, and a `--dev` build
          # regenerates it over the tracked copy with the `testing`-gated surface the
          # parity harness calls (`signed_at_override`), so a consumer that kept the
          # checkout's copy would compile against a narrower API than the dylib
          # exports.
          name: swift-xcframework-dev
          path: |
            bindings/swift/ScpFFI.xcframework
            bindings/swift/Headers
            bindings/swift/Sources/SCP/Internal/ScpBindings.swift
          retention-days: 30
          if-no-files-found: error
      - name: Save the XCFramework under its input key
        if: steps.artifact-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            bindings/swift/ScpFFI.xcframework
            bindings/swift/Headers
            bindings/swift/Sources/SCP/Internal/ScpBindings.swift
          key: ${{ steps.artifact-cache.outputs.cache-primary-key }}

  pyo3-module-macos:
    needs: changes
    # bridge-parity-swift is the only consumer, and this job repeats its condition.
    # An Ubuntu build cannot serve it: a Python extension module is a native shared
    # object, and the one job pyo3-module publishes is an ELF `.so` built against
    # glibc for x86_64.
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.swift == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Bridge artifact / PyO3 module (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed before the key is computed, because the maturin version is one of
      # the key's inputs.
      - name: Create virtualenv and install maturin
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
      - name: Hash the artifact inputs no file glob covers
        id: artifact-inputs
        run: |
          set -euo pipefail
          job_definition=$(awk -v start="  ${GITHUB_JOB}:" \
            '$0 == start {found = 1; print; next} found && /^  [^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          if [ -z "$job_definition" ]; then
            echo "::error::.github/workflows/ci.yml defines no job ${GITHUB_JOB}"
            exit 1
          fi
          workflow_env=$(awk '$0 == "env:" {found = 1; print; next} found && /^[^ #]/ {exit} found {print}' \
            .github/workflows/ci.yml)
          source .venv/bin/activate
          inputs="$RUNNER_TEMP/artifact-inputs"
          {
            printf '%s\n' "$job_definition"
            printf '%s\n' "$workflow_env"
            git ls-files -- crates
            echo "image=${ImageOS:?ImageOS is unset}-${ImageVersion:?ImageVersion is unset}"
            python -VV
            maturin --version
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
          } > "$inputs"
          digest=$(shasum -a 256 < "$inputs" | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Restore the PyO3 module a run with the same inputs built
        id: artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: bindings/python/scp_sdk/_scp_core*.so
          key: bridge-artifact-v1-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/**', 'crates/**', 'bindings/python/pyproject.toml') }}-${{ steps.artifact-inputs.outputs.digest }}
      - uses: Swatinem/rust-cache@v2
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        with:
          shared-key: apple-parity-ci-bridge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build PyO3 native module
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          cd bindings/python
          maturin develop --profile ci-bridge --features testing
      - name: Upload PyO3 native module
        uses: actions/upload-artifact@v4
        with:
          name: pyo3-module-macos
          path: bindings/python/scp_sdk/_scp_core*.so
          retention-days: 30
          if-no-files-found: error
      - name: Save the PyO3 module under its input key
        if: steps.artifact-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: bindings/python/scp_sdk/_scp_core*.so
          key: ${{ steps.artifact-cache.outputs.cache-primary-key }}

  # ── Python ──────────────────────────────────────────────────────────
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python / lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff pinned for reproducible CI (see the pyi-generated job above for
      # rationale). Bump deliberately in its own PR.
      - run: pip install ruff==0.15.4
      - run: ruff format --check .
      - run: ruff check .
      # H14 / M16: enforce `is not None` over falsy checks on Optional
      # collection parameters at the FFI boundary. Run from the repo root
      # because the script resolves paths relative to its own location.
      - name: Falsy-Optional check
        working-directory: ${{ github.workspace }}
        run: python3.12 scripts/check-python-falsy-optionals.py

  # A `rust` clause is load-bearing. `scp-ffi`, the PyO3 bridge job pyo3-module
  # builds through maturin for this job, depends on scp-core, scp-runtime,
  # scp-transport, scp-mls, scp-node and eleven more workspace crates
  # (`cargo tree -p scp-ffi -e no-dev`). A `python` filter lists only bindings/python/**,
  # crates/scp-ffi/src/** and crates/scp-ffi/common/**, so a pull request that
  # changed crates/scp-runtime/ alone skipped this job and every assertion in
  # bindings/python/tests/ went unexecuted under a green check.
  #
  # `rust` is a whole-workspace filter (crates/**, Cargo.toml, Cargo.lock,
  # deny.toml), which is a superset of this bridge's Rust path-dependency
  # closure and stays a superset by construction: a new crate lands under
  # crates/**. Enumerating a closure per job — a shape typescript-wasm-check
  # uses, which works there because scp-client-wasm reaches nine crates — would
  # here list nearly every crate and would need re-verification on every new
  # dependency edge. bridge-parity below already ORs on `rust` for that same
  # reason.
  python-test:
    # Job pyo3-module builds the extension module this job imports. This job runs no
    # cargo command, so it installs no Rust toolchain and reads no cargo cache.
    needs: [changes, pyo3-module]
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: Python / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download PyO3 native module
        uses: actions/download-artifact@v4
        with:
          name: pyo3-module-linux
          path: bindings/python/scp_sdk
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pytest pytest-asyncio
      # THE DEFECT THIS CLOSES: every real-FFI test module under bindings/python/tests
      # skips itself when its import of the extension raises ImportError, and the `scp`
      # fixture in bindings/python/tests/conftest.py skips every test that requests it
      # when `scp_sdk` does not import or `SCP(storage=...)` raises. A download that
      # landed the module anywhere but bindings/python/scp_sdk, or a module that does
      # not load, would leave pytest exiting 0 over zero executed assertions, which is
      # the `zero-test` shape scripts/tests/ci-gate/ci_gate_selftest.py names. This step
      # runs the import and the construction those guards run, so such a module fails
      # the job here rather than skipping every real-FFI module. It then reads the two
      # methods the `server` and `testing` feature lists compile onto the native class,
      # so a build missing either feature fails here, before pytest, with
      # the name of the missing method. Every consumer of a PyO3 artifact runs this step.
      - name: Assert the downloaded extension imports, constructs, and carries the gated methods
        run: |
          source .venv/bin/activate
          cd bindings/python
          PYTHONPATH=. python -c "import scp_sdk._scp_core as module; print(module.__file__)"
          PYTHONPATH=. python -c "from scp_sdk import SCP; print(SCP(storage={'type': 'in_memory'}).instance_id)"
          PYTHONPATH=. python -c "
          from scp_sdk import _scp_core
          probe = _scp_core.SCP({'type': 'in_memory'})
          gated = (
              'relay_start_in_memory',
              'fullstack_create_node',
          )
          missing = [name for name in gated if not callable(getattr(probe, name, None))]
          if missing:
              raise SystemExit('the native SCP class is missing ' + ', '.join(missing) + ', so this extension was built without the feature that method needs')
          print('PyO3 extension carries the gated methods')
          "
      - name: Run tests (including real FFI)
        run: |
          source .venv/bin/activate
          cd bindings/python
          # Parity tests require Bun/Kotlin/Swift runners that are not
          # available in this job — they run in dedicated parity jobs below.
          PYTHONPATH=. pytest tests/ -v -m "not parity"
      # `cd bindings/python` above resolves `tests/` to `bindings/python/tests/`,
      # so this step runs no pytest suite that lives elsewhere in this
      # repository. Four such suites exist. Two of them, under `scripts/`, run in
      # their own steps (`scripts/test_check_sdk_coverage.py` and
      # `scripts/tests/call-invariants/`). The other two run in no CI job, and
      # each comment below says why its suite gets no step.
      #
      # `examples/reference-agent/test_agent.py` gets no step. Two of its 23
      # tests, `TestEndToEnd::test_full_lifecycle` and
      # `TestDemoScript::test_demo_exits_zero`, fail whenever `scp_sdk` imports,
      # which the download step above makes true. Every one of the eleven
      # SDK call sites in `examples/reference-agent/agent.py` names a symbol
      # `scp_sdk` no longer defines: `Identity.create_sync`, `Identity.load_sync`,
      # `Context.create_sync`, `Context.join_sync`, `context.send_sync`,
      # `context.leave_sync`, and a `Context(context_id=..., identity=...)`
      # constructor whose real signature reads `Context(handle, identity_did,
      # scp)`. `scp_sdk` defines no `*_sync` method at all today, because
      # identity and context operations moved onto an async `SCP` facade whose
      # constructor requires a storage config, as
      # `await scp.identity_create(custody)` and
      # `await scp.context_create(identity_did, params)`. Each call site sits
      # under `except ImportError`, which does not catch the `AttributeError`
      # that a deleted attribute raises, so that example returns a
      # `uuid`-fabricated DID when `scp_sdk` is absent and raises when it is
      # present. Rewriting that example against the async facade replaces its
      # agent module, its demo module, and its end-to-end tests, and makes the
      # suite require the compiled PyO3 module that its README calls optional,
      # which is a scoped work item rather than a CI wiring change.
      #
      # `tests/integration/phase3_integration_test.py` gets no step. Its 17 tests
      # import `ToolDefinition` and call `Identity.create`, `Context.create`,
      # `ctx.join`, `ctx.send`, `ctx.receive`, `ctx.close`, and `ctx.invoke`.
      # `scp_sdk` exports none of those today: an outlet redesign replaced
      # `ToolDefinition` with `scp_sdk.outlets.OutletDefinition`, which adds a
      # required `kind: OutletKind`, and context operations moved onto an `SCP`
      # facade as `SCP.context_create(identity_did, params)` and its siblings.
      # That module therefore fails at import, and every test in it patches
      # `sys.modules["_scp_core"]` with a `MagicMock`, so no test in it reaches
      # a PyO3 bridge either way. Rewriting that suite against a current facade
      # means re-deriving its 13 steps from `.docs/adrs/phase-3.md`, which is a
      # scoped work item rather than a CI wiring change.

  # ── TypeScript ──────────────────────────────────────────────────────
  # ORs on `rust` for a reason spelled out above python-test: the NAPI addon job
  # napi-addon compiles for this job reaches every Rust workspace crate through
  # scp-core, while a `typescript` filter names only bindings/typescript/**,
  # crates/scp-ffi/napi/** and crates/scp-ffi/common/**.
  typescript-check:
    # Job napi-addon builds the native addon this job loads. This job runs no cargo
    # command, so it installs no Rust toolchain and reads no cargo cache.
    needs: [changes, napi-addon]
    if: >-
      needs.changes.outputs.typescript == 'true' ||
      needs.changes.outputs.rust == 'true'
    name: TypeScript / check + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Download NAPI native addon
        uses: actions/download-artifact@v4
        with:
          # Into the directory the wiring step below reads, so that step keeps its
          # one source of truth for the cdylib's path.
          name: napi-addon-linux
          path: target/ci-bridge
      - name: Install TypeScript dependencies
        working-directory: bindings/typescript
        run: bun install
      - name: Wire NAPI addon into node_modules
        run: |
          # Determine the platform-specific package name and library filename
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) NAPI_PKG="@limn-works/scp-ts-napi-linux-x64-gnu" ;;
            aarch64|arm64) NAPI_PKG="@limn-works/scp-ts-napi-linux-arm64-gnu" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          # Create a fake platform package in node_modules so createRequire finds it
          PKG_DIR="bindings/typescript/node_modules/${NAPI_PKG}"
          mkdir -p "$PKG_DIR"
          # The cargo build produces a cdylib; copy and rename to .node for NAPI loading
          LIB_FILE="target/ci-bridge/libscp_ffi_napi.so"
          if [ ! -f "$LIB_FILE" ]; then
            echo "ERROR: cdylib not found at $LIB_FILE"
            ls -la target/ci-bridge/libscp_ffi_napi* 2>/dev/null || true
            exit 1
          fi
          cp "$LIB_FILE" "$PKG_DIR/index.node"
          # Create a minimal package.json so require() resolves
          echo '{"name":"'"$NAPI_PKG"'","version":"0.1.0","main":"index.node"}' > "$PKG_DIR/package.json"
      # THE DEFECT THIS CLOSES: every real-NAPI test file under
      # bindings/typescript/tests wraps its addon load and its first construction in
      # one `try` and resolves to `describe.skip` or a lone `test.skip` on any error.
      # An addon wired anywhere but the package directory `require()` resolves, or one
      # that does not load, would leave `bun test` exiting 0 over zero executed NAPI
      # assertions, which is the `zero-test` shape
      # scripts/tests/ci-gate/ci_gate_selftest.py names. The `[ ! -f ]` check above
      # reads whether target/ci-bridge holds the cdylib and never resolves the package.
      # This step runs the SDK loader and the native constructor, so such an addon
      # fails the job here, and it reads the two methods the `server` and
      # `testing` feature lists compile onto the native class, so a build missing
      # either feature fails here, before `bun test`, with the name of
      # the missing method. Every consumer of a NAPI artifact runs this step.
      - name: Assert the downloaded addon loads and constructs
        working-directory: bindings/typescript
        run: |
          bun -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            import { createRequire } from "node:module";
            import { loadNativeAddon } from "./src/internal/native.ts";
            import { SCP } from "./src/scp.ts";
            // The file the loader resolves must be the downloaded artifact, byte
            // for byte: a package bun installed from the registry, or one left by
            // an earlier step, would pass every property check below.
            const pkg = {
              x64: "@limn-works/scp-ts-napi-linux-x64-gnu",
              arm64: "@limn-works/scp-ts-napi-linux-arm64-gnu",
            }[process.arch];
            const loaderRequire = createRequire(process.cwd() + "/src/internal/native.ts");
            const resolved = loaderRequire.resolve(pkg);
            const digest = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
            const downloaded = "../../target/ci-bridge/libscp_ffi_napi.so";
            if (digest(resolved) !== digest(downloaded)) {
              throw new Error(resolved + " is not the downloaded addon " + downloaded);
            }
            const addon = loadNativeAddon();
            const NativeScp = addon.SCP;
            if (typeof NativeScp !== "function") {
              throw new Error("the native addon exports no SCP class");
            }
            const probe = new NativeScp(JSON.stringify({ type: "in_memory" }));
            for (const method of ["relayStartInMemory", "fullstackCreateNode"]) {
              if (typeof probe[method] !== "function") {
                throw new Error(
                  "the native SCP class is missing " + method +
                  ", so this addon was built without the feature that method needs"
                );
              }
            }
            // The skip guards under tests/ construct through the SDK class, so a
            // failure only that path raises must fail here, not skip those suites.
            const sdk = new SCP({ storage: { type: "in_memory" } });
            await sdk.shutdown(1);
            console.log("NAPI addon loaded, constructed through the SDK, and carries the gated methods");
            process.exit(0);
          '
      - name: Run checks
        working-directory: bindings/typescript
        run: |
          bun run check
          bun run lint
          bun test

  # ── TypeScript (wasm tier) ──────────────────────────────────────────
  typescript-wasm-check:
    needs: changes
    if: needs.changes.outputs.typescript-wasm == 'true'
    name: TypeScript-wasm / build + check + lint + guards + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          # Conditional for the reason job rust-test's copy of this step states in
          # full: the image these jobs run on reports `/dev/root 145G 40G 105G 28% /`
          # AFTER the deletions, so about 85 GB was free before them, against the
          # ~12 GB this workspace needs. The deletions reclaimed space nothing was
          # short of and cost between 21 s and 2 min 12 s per job.
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
