# SCP Release Pipeline
#
# 7-step release checklist enforced by CI:
#   1. Conformance pass (100% — hard gate)
#   2. Changelog verification
#   3. Version tags
#   4. Build all artifacts (triggers build-matrix.yml)
#   5. Sign artifacts (platform-specific)
#   6. Publish to registries
#   7. GitHub Release with binary attachments
#
# Source: .docs/scaffold/shared.md sections "Release Pipeline", "Versioning"
# Story: SCP-136
#
# Required repository secrets:
#   CRATES_IO_TOKEN        — crates.io API token for publishing Rust crates
#   NPM_TOKEN              — npm token for @limn-works/scp-ts and @limn-works/scp-ts-napi-* packages
#   APPLE_CERTIFICATE      — Base64-encoded Apple Developer ID certificate (.p12)
#   APPLE_CERTIFICATE_PWD  — Password for the Apple certificate
#   APPLE_TEAM_ID          — Apple Developer Team ID
#   APPLE_ID               — Apple ID for notarization
#   APPLE_ID_PASSWORD      — App-specific password for Apple ID
#   WINDOWS_SIGN_CERT      — Base64-encoded Authenticode certificate (.pfx)
#   WINDOWS_SIGN_PWD       — Password for the Authenticode certificate
#   GPG_KEY_ID             — GPG key ID (short or long form) for Gradle signing
#   GPG_PRIVATE_KEY        — GPG private key for Maven artifact signing
#   GPG_PASSPHRASE         — Passphrase for GPG private key
#   MAVEN_USERNAME         — Sonatype OSSRH username (Maven Central)
#   MAVEN_PASSWORD         — Sonatype OSSRH password
#
# Required repository variables:
#   (none — all configuration is derived from the version input)
#
# Required GitHub environment:
#   PyPI uses Trusted Publishers (GitHub Actions OIDC) — no token needed.
#   Configure at: https://pypi.org/manage/project/scp-python/settings/publishing/

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Release version (SemVer 2.0, e.g. 0.1.0). This is the scp-core
          version and becomes the shared major.minor for all SDKs.
        required: true
        type: string
      dry-run:
        description: "Dry run — validate everything but skip publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishers (OIDC)
  packages: write

env:
  VERSION: ${{ inputs.version }}
  CARGO_TERM_COLOR: always

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Step 1: Conformance gate (100% pass required)
  # ===========================================================================
  conformance:
    name: "Step 1: Conformance tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: conformance-

      - name: Run all workspace tests
        run: cargo test --workspace --release --features scp-ffi-uniffi/allow_in_memory_custody,scp-ffi/allow_in_memory_custody,scp-ffi-napi/allow_in_memory_custody,scp-core/testing,scp-runtime/saga-witness-test-mint

      # Conformance test suite runs against JSON fixtures.
      # When tests/conformance/ exists, run the dedicated conformance runner.
      - name: Run conformance test suite
        run: |
          if [ -d tests/conformance ]; then
            cargo test --release -p scp-testing -- conformance
          else
            echo "::notice::Conformance fixture directory not yet created — workspace tests serve as gate"
          fi

      - name: Verify clippy clean
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify formatting
        run: cargo fmt --all -- --check

  # ===========================================================================
  # Step 2: Changelog verification
  # ===========================================================================
  changelog:
    name: "Step 2: Verify changelog"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check CHANGELOG.md exists and mentions version
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in repository root"
            exit 1
          fi

          if ! grep -qE "## \[?v?${{ env.VERSION }}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version ${{ env.VERSION }}"
            echo "Expected a section header like: ## ${{ env.VERSION }} or ## [v${{ env.VERSION }}]"
            exit 1
          fi

          echo "Changelog entry found for ${{ env.VERSION }}"

  # ===========================================================================
  # Step 3: Create version tags
  # ===========================================================================
  version-tags:
    name: "Step 3: Create version tags"
    needs: [conformance, changelog]
    runs-on: ubuntu-latest
    outputs:
      core-tag: ${{ steps.tags.outputs.core-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for tag operations

      - name: Verify Cargo.toml version matches input
        run: |
          for CRATE in scp-core scp-protocol scp-runtime; do
            CARGO_VERSION=$(grep -m1 '^version' "crates/$CRATE/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
            if [ "$CARGO_VERSION" != "${{ env.VERSION }}" ]; then
              echo "::error::$CRATE/Cargo.toml version ($CARGO_VERSION) does not match release version (${{ env.VERSION }})"
              echo "Update crates/$CRATE/Cargo.toml before releasing."
              exit 1
            fi
            echo "Version verified for $CRATE: $CARGO_VERSION"
          done

      - name: Create version tags
        id: tags
        run: |
          TAGS=(
            "scp-primitives@${{ env.VERSION }}"
            "scp-platform@${{ env.VERSION }}"
            "scp-identity@${{ env.VERSION }}"
            "scp-event-log@${{ env.VERSION }}"
            "scp-protocol@${{ env.VERSION }}"
            "scp-runtime@${{ env.VERSION }}"
            "scp-core@${{ env.VERSION }}"
            "scp-transport@${{ env.VERSION }}"
            "scp-mcp@${{ env.VERSION }}"
            "scp-media@${{ env.VERSION }}"
            "scp-node@${{ env.VERSION }}"
            "scp-relay@${{ env.VERSION }}"
          )

          for tag in "${TAGS[@]}"; do
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::warning::Tag $tag already exists — skipping"
            else
              git tag -a "$tag" -m "Release $tag"
              echo "Created tag: $tag"
            fi
          done

          echo "core-tag=scp-core@${{ env.VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Push tags
        if: ${{ !inputs.dry-run }}
        run: git push origin --tags

  # ===========================================================================
  # Step 4: Build all artifacts (delegates to build-matrix.yml)
  # ===========================================================================
  build:
    name: "Step 4: Build artifacts"
    needs: [version-tags]
    uses: ./.github/workflows/build-matrix.yml
    with:
      scp-core-version: ${{ inputs.version }}

  # ===========================================================================
  # Step 5: Sign artifacts
  # ===========================================================================
  sign-apple:
    name: "Step 5a: Apple codesigning"
    needs: [build]
    runs-on: macos-latest
    steps:
      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: swift-xcframework
          path: xcframework/

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/release.keychain-db
          KEYCHAIN_PWD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Codesign XCFramework
        run: |
          find xcframework/ -name "*.a" -o -name "*.dylib" | while read -r lib; do
            codesign --force --sign "Developer ID Application" \
              --options runtime \
              --timestamp \
              "$lib"
          done

      - name: Upload signed XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: swift-xcframework-signed
          path: xcframework/
          retention-days: 14

  sign-windows:
    name: "Step 5b: Authenticode signing"
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-x86_64-pc-windows-msvc
          path: windows-artifacts/

      - name: Download cbindgen Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cbindgen-x86_64-pc-windows-msvc
          path: windows-cbindgen/

      - name: Import Authenticode certificate
        env:
          WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_PWD: ${{ secrets.WINDOWS_SIGN_PWD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $cert = Import-PfxCertificate -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_SIGN_PWD -AsPlainText -Force)
          echo "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Sign DLLs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.dll windows-artifacts/, windows-cbindgen/ | ForEach-Object {
            & signtool sign /sha1 $env:SIGN_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            Write-Host "Signed: $($_.FullName)"
          }

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: |
            windows-artifacts/
            windows-cbindgen/
          retention-days: 14

  sign-maven:
    name: "Step 5c: GPG sign Maven artifacts"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Kotlin AAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: kotlin-aar
          path: maven-artifacts/

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo -n "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent

      - name: Sign artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          find maven-artifacts/ -type f \( -name "*.aar" -o -name "*.jar" -o -name "*.pom" \) | while read -r file; do
            gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
              --pinentry-mode loopback \
              --armor --detach-sign "$file"
            echo "Signed: $file"
          done

      - name: Upload signed Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-signed
          path: maven-artifacts/
          retention-days: 14

  # ===========================================================================
  # Step 6: Publish to registries
  # ===========================================================================
  publish-crates:
    name: "Step 6a: Publish to crates.io"
    needs: [sign-apple, sign-windows, sign-maven]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Publish order matters: dependencies first
      - name: Publish scp-primitives
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-primitives --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-platform
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-platform --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-identity
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-identity --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-event-log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-event-log --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-protocol --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-runtime --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-core --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-transport
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-transport --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-mcp --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-media
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-media --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-node
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-node --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-relay
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-relay --allow-dirty

  publish-pypi:
    name: "Step 6b: Publish to PyPI"
    needs: [sign-apple, sign-windows, sign-maven]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Uses Trusted Publishers (OIDC) — no token required
    environment:
      name: pypi
      url: https://pypi.org/project/scp-python/${{ inputs.version }}/
    steps:
      - name: Download all Python wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true

      - name: Download Python sdist
        uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm:
    name: "Step 6c: Publish to npm"
    needs: [sign-apple, sign-windows, sign-maven]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} to
      # .npmrc but does not add a scope line. The @limn-works scope line is
      # required for first-time publishes of org-scoped packages.
      - name: Configure @limn-works npm scope
        run: echo "@limn-works:registry=https://registry.npmjs.org/" >> ~/.npmrc

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # @limn-works/scp-ts — Node.js/Bun TypeScript SDK wrapper
      - name: Build @limn-works/scp-ts
        run: |
          cd bindings/typescript
          bun install --frozen-lockfile
          bun run build

      - name: Set release version in package.json
        run: |
          cd bindings/typescript
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ env.VERSION }}';
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = '${{ env.VERSION }}';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish @limn-works/scp-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish bindings/typescript --access public

      # @limn-works/scp-ts-napi-{platform} — per-platform native addons
      # Each artifact (napi-{target}) contains a single index.node binary
      # staged by build-matrix.yml's typescript-napi job.
      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: /tmp/napi-artifacts/

      - name: Publish per-platform NAPI packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          declare -A TARGET_MAP=(
            ["napi-x86_64-unknown-linux-gnu"]="linux-x64-gnu linux x64"
            ["napi-aarch64-unknown-linux-gnu"]="linux-arm64-gnu linux arm64"
            ["napi-x86_64-apple-darwin"]="darwin-x64 darwin x64"
            ["napi-aarch64-apple-darwin"]="darwin-arm64 darwin arm64"
            ["napi-x86_64-pc-windows-msvc"]="win32-x64-msvc win32 x64"
          )

          for artifact in /tmp/napi-artifacts/napi-*/; do
            artifact_name=$(basename "$artifact")
            info="${TARGET_MAP[$artifact_name]}"
            if [ -z "$info" ]; then
              echo "::warning::Unknown artifact $artifact_name — skipping"
              continue
            fi

            suffix=$(echo "$info" | awk '{print $1}')
            os=$(echo "$info" | awk '{print $2}')
            cpu=$(echo "$info" | awk '{print $3}')
            pkg_name="@limn-works/scp-ts-napi-${suffix}"
            pkg_dir="/tmp/pkg-${suffix}"

            mkdir -p "$pkg_dir"
            cp "$artifact/index.node" "$pkg_dir/index.node"

            cat > "$pkg_dir/package.json" <<JSON
          {
            "name": "${pkg_name}",
            "version": "${{ env.VERSION }}",
            "description": "${os} ${cpu} native addon for @limn-works/scp-ts",
            "os": ["${os}"],
            "cpu": ["${cpu}"],
            "main": "index.node",
            "files": ["index.node"],
            "license": "MIT OR Apache-2.0",
            "repository": { "type": "git", "url": "https://github.com/limn/scp" },
            "publishConfig": { "access": "public" }
          }
          JSON

            echo "Publishing ${pkg_name}@${{ env.VERSION }}…"
            npm publish "$pkg_dir" --access public
          done

  publish-maven:
    name: "Step 6d: Publish to Maven Central"
    needs: [sign-apple, sign-windows, sign-maven]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Kotlin AAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: kotlin-aar
          path: kotlin-artifacts/

      # Kotlin JVM JAR: works.limn:scp-kt
      - name: Publish Kotlin JVM JAR to Maven Central
        working-directory: bindings/kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew :scp-kt:publishMavenJavaPublicationToSonatypeStagingRepository \
            -PscpVersion=${{ env.VERSION }}

      # Kotlin Android AAR: works.limn:scp-kt-android
      - name: Publish Kotlin Android AAR to Maven Central
        working-directory: bindings/kotlin
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew :scp-kt-android:publishReleasePublicationToSonatypeStagingRepository \
            -PscpVersion=${{ env.VERSION }}

  publish-spm:
    name: "Step 6f: Publish Swift Package (SPM)"
    needs: [sign-apple]
    if: ${{ !inputs.dry-run }}
    runs-on: macos-latest
    outputs:
      xcframework-zip: ScpFFI-${{ inputs.version }}.xcframework.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download signed XCFramework
        uses: actions/download-artifact@v4
        with:
          name: swift-xcframework-signed
          path: xcframework-signed/

      - name: Zip XCFramework and compute checksum
        id: xcf
        run: |
          ZIP="ScpFFI-${{ env.VERSION }}.xcframework.zip"
          cd xcframework-signed
          zip -r "../$ZIP" .
          cd ..
          CHECKSUM=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "XCFramework zip: $ZIP ($CHECKSUM)"

      # The GitHub Release URL is deterministic — the zip will be uploaded
      # to the scp-core@{version} release in Step 7.
      - name: Update Package.swift with URL binary target
        env:
          CHECKSUM: ${{ steps.xcf.outputs.checksum }}
        run: |
          RELEASE_URL="https://github.com/limn-works/scp/releases/download/scp-core@${{ env.VERSION }}/ScpFFI-${{ env.VERSION }}.xcframework.zip"
          python3 - <<PYEOF
          import re, os, pathlib
          path = pathlib.Path("bindings/swift/Package.swift")
          src = path.read_text()
          # Matches .binaryTarget(name: "ScpFFI", ...) regardless of whether
          # it currently uses path: or url:/checksum: (handles repeated releases).
          old = r'\.binaryTarget\(\s*name:\s*"ScpFFI"[^)]*\)'
          new = (
              '.binaryTarget(\n'
              '            name: "ScpFFI",\n'
              f'            url: "{os.environ["RELEASE_URL"]}",\n'
              f'            checksum: "{os.environ["CHECKSUM"]}"\n'
              '        )'
          )
          updated = re.sub(old, new, src, flags=re.DOTALL)
          assert updated != src, "Pattern not found in Package.swift — update the regex"
          path.write_text(updated)
          PYEOF

      - name: Commit and tag updated Package.swift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add bindings/swift/Package.swift
          git commit -m "chore(swift): update Package.swift binary target for ${{ env.VERSION }}"
          git push origin HEAD:main
          git tag -a "scp-swift@${{ env.VERSION }}" -m "Swift SDK ${{ env.VERSION }}"
          git push origin "scp-swift@${{ env.VERSION }}"

      - name: Upload XCFramework zip for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: xcframework-zip
          path: ScpFFI-${{ env.VERSION }}.xcframework.zip
          retention-days: 1

  # ===========================================================================
  # Step 7: Create GitHub Release
  # ===========================================================================
  github-release:
    name: "Step 7: GitHub Release"
    needs:
      - publish-crates
      - publish-pypi
      - publish-npm
      - publish-maven
      - publish-spm
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          name: scp-release-bundle
          path: release-artifacts/

      - name: Download XCFramework zip (produced by publish-spm)
        uses: actions/download-artifact@v4
        with:
          name: xcframework-zip
          path: release-artifacts/

      - name: Download signed Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: release-artifacts/windows-signed/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[?v?${{ env.VERSION }}\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ env.VERSION }}"
          fi
          # Write to file for gh release
          echo "$NOTES" > release-notes.md

      - name: Append commit log to release notes
        run: |
          # Find the previous release tag (if any)
          PREV_TAG=$(git tag --list 'scp-core@*' --sort=-version:refname | head -1)

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Commits" >> release-notes.md
          echo "" >> release-notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> release-notes.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges -50 >> release-notes.md
          fi

      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -type f ! -name "SHA256SUMS" | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS
          echo "Generated checksums for $(wc -l < SHA256SUMS) files"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "scp-core@${{ env.VERSION }}" \
            --title "SCP ${{ env.VERSION }}" \
            --notes-file release-notes.md \
            --verify-tag \
            release-artifacts/SHA256SUMS \
            release-artifacts/ScpFFI-${{ env.VERSION }}.xcframework.zip \
            release-artifacts/python-wheel-*/*.whl \
            release-artifacts/python-sdist/*.tar.gz

  # ===========================================================================
  # Dry-run summary (when dry-run is true, skip publishing but report status)
  # ===========================================================================
  dry-run-summary:
    name: "Dry-run summary"
    needs: [build]
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: scp-release-bundle
          path: release-artifacts/

      - name: Summary
        run: |
          echo "## Dry-run release summary for v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts built:" >> $GITHUB_STEP_SUMMARY
          find release-artifacts/ -type f | sort | while read -r f; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "- \`$f\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Registries that would be published to:" >> $GITHUB_STEP_SUMMARY
          echo "- crates.io: scp-primitives, scp-platform, scp-identity, scp-event-log, scp-protocol, scp-runtime, scp-core, scp-transport, scp-mcp, scp-media, scp-node, scp-relay" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: scp-python" >> $GITHUB_STEP_SUMMARY
          echo "- npm: @limn-works/scp-ts + @limn-works/scp-ts-napi-{linux-x64-gnu,linux-arm64-gnu,darwin-x64,darwin-arm64,win32-x64-msvc}" >> $GITHUB_STEP_SUMMARY
          echo "- Maven Central: works.limn:scp-kt, works.limn:scp-kt-android" >> $GITHUB_STEP_SUMMARY
          echo "- SPM: SCP (via GitHub Release)" >> $GITHUB_STEP_SUMMARY
          echo "- Go: github.com/limn-works/scp-go (via tag)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Re-run without dry-run to publish." >> $GITHUB_STEP_SUMMARY
