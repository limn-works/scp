# SCP Release Pipeline
#
# 7-step release checklist enforced by CI:
#   1. Conformance pass (100% — hard gate)
#   2. Changelog verification
#   3. Version tags
#   4. Build all artifacts (triggers build-matrix.yml)
#   5. Sign artifacts (platform-specific)
#   6. Publish to registries
#   7. GitHub Release with binary attachments
#
# Source: .docs/scaffold/shared.md sections "Release Pipeline", "Versioning"
# Story: SCP-136
#
# Required repository secrets:
#   CRATES_IO_TOKEN        — crates.io API token for publishing Rust crates
#   NPM_TOKEN              — npm token for @limn-works/scp-ts and @limn-works/scp-ts-napi-* packages
#   APPLE_CERTIFICATE      — Base64-encoded Apple Developer ID certificate (.p12)
#   APPLE_CERTIFICATE_PWD  — Password for the Apple certificate
#   APPLE_TEAM_ID          — Apple Developer Team ID
#   APPLE_ID               — Apple ID for notarization
#   APPLE_ID_PASSWORD      — App-specific password for Apple ID
#   WINDOWS_SIGN_CERT      — Base64-encoded Authenticode certificate (.pfx)
#   WINDOWS_SIGN_PWD       — Password for the Authenticode certificate
#   GPG_KEY_ID             — GPG key ID (short or long form) for Maven signing
#   GPG_PRIVATE_KEY        — ASCII-armored GPG private key for Maven signing
#   GPG_PASSPHRASE         — Passphrase for the GPG private key
#   MAVEN_USERNAME         — Maven Central Portal user token name (central.sonatype.com,
#                            Account → Generate User Token). NOT the legacy OSSRH login.
#   MAVEN_PASSWORD         — Maven Central Portal user token password
#   SWIFT_MIRROR_TOKEN     — PAT/fine-grained token with contents:write on
#                            limn-works/scp-swift (github.token cannot push cross-repo)
#
# Required repository variables:
#   (none — all configuration is derived from the version input)
#
# Required GitHub environment:
#   PyPI uses Trusted Publishers (GitHub Actions OIDC) — no token needed.
#   Configure at: https://pypi.org/manage/project/scp-python/settings/publishing/

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >
          Release version (SemVer 2.0, e.g. 0.1.0). This is the scp-core
          version and becomes the shared major.minor for all SDKs.
        required: true
        type: string
      dry-run:
        description: "Dry run — validate everything but skip publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishers (OIDC)
  packages: write

env:
  VERSION: ${{ inputs.version }}
  CARGO_TERM_COLOR: always

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Step 0: Validate the version input (fail-closed gate)
  #
  # `inputs.version` is free-form and flows into many shell/JS/Gradle sinks. Every
  # other job depends on this one, so a non-SemVer (or injection-bearing) version
  # is rejected before it can reach any of those sinks. The value is read from the
  # environment, never interpolated with ${{ }} into the script body.
  # ===========================================================================
  validate-version:
    name: "Step 0: Validate version input"
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer 2.0
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # bash [[ =~ ]] matches the whole string — unlike `grep`, whose ^/$ are
          # per-line anchors, so a newline-bearing input could smuggle a valid
          # first line past the gate. An embedded newline fails this match.
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not valid SemVer 2.0 (e.g. 0.1.0 or 0.1.0-beta.2)."
            exit 1
          fi
          echo "Version validated: $VERSION"

  # ===========================================================================
  # Step 1: Conformance gate (100% pass required)
  # ===========================================================================
  conformance:
    name: "Step 1: Conformance tests"
    needs: [validate-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: conformance-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: conformance-

      - name: Run all workspace tests
        run: cargo test --workspace --release --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/saga-witness-test-mint

      # Conformance test suite runs against JSON fixtures.
      # When tests/conformance/ exists, run the dedicated conformance runner.
      - name: Run conformance test suite
        run: |
          if [ -d tests/conformance ]; then
            cargo test --release -p scp-testing -- conformance
          else
            echo "::notice::Conformance fixture directory not yet created — workspace tests serve as gate"
          fi

      - name: Verify clippy clean
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify formatting
        run: cargo fmt --all -- --check

  # ===========================================================================
  # Step 2: Changelog verification
  # ===========================================================================
  changelog:
    name: "Step 2: Verify changelog"
    needs: [validate-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check CHANGELOG.md exists and mentions version
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in repository root"
            exit 1
          fi

          if ! grep -qE "## \[?v?${{ env.VERSION }}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version ${{ env.VERSION }}"
            echo "Expected a section header like: ## ${{ env.VERSION }} or ## [v${{ env.VERSION }}]"
            exit 1
          fi

          echo "Changelog entry found for ${{ env.VERSION }}"

  # ===========================================================================
  # Step 3: Create version tags
  # ===========================================================================
  version-tags:
    name: "Step 3: Create version tags"
    needs: [conformance, changelog]
    runs-on: ubuntu-latest
    outputs:
      core-tag: ${{ steps.tags.outputs.core-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for tag operations

      - name: Verify Cargo.toml version matches input
        run: |
          for CRATE in scp-core scp-protocol scp-runtime; do
            CARGO_VERSION=$(grep -m1 '^version' "crates/$CRATE/Cargo.toml" | sed 's/.*"\(.*\)".*/\1/')
            if [ "$CARGO_VERSION" != "${{ env.VERSION }}" ]; then
              echo "::error::$CRATE/Cargo.toml version ($CARGO_VERSION) does not match release version (${{ env.VERSION }})"
              echo "Update crates/$CRATE/Cargo.toml before releasing."
              exit 1
            fi
            echo "Version verified for $CRATE: $CARGO_VERSION"
          done

      - name: Create version tags
        id: tags
        run: |
          TAGS=(
            "scp-clock@${{ env.VERSION }}"
            "scp-crypto@${{ env.VERSION }}"
            "scp-did@${{ env.VERSION }}"
            "scp-dht@${{ env.VERSION }}"
            "scp-platform@${{ env.VERSION }}"
            "scp-event-log@${{ env.VERSION }}"
            "scp-protocol@${{ env.VERSION }}"
            "scp-identity@${{ env.VERSION }}"
            "scp-mls@${{ env.VERSION }}"
            "scp-client@${{ env.VERSION }}"
            "scp-runtime@${{ env.VERSION }}"
            "scp-core@${{ env.VERSION }}"
            "scp-transport@${{ env.VERSION }}"
            "scp-mcp@${{ env.VERSION }}"
            "scp-media@${{ env.VERSION }}"
            "scp-node@${{ env.VERSION }}"
            "scp-relay@${{ env.VERSION }}"
          )

          for tag in "${TAGS[@]}"; do
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::warning::Tag $tag already exists — skipping"
            else
              git tag -a "$tag" -m "Release $tag"
              echo "Created tag: $tag"
            fi
          done

          echo "core-tag=scp-core@${{ env.VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Push tags
        if: ${{ !inputs.dry-run }}
        run: git push origin --tags

  # ===========================================================================
  # Step 4: Build all artifacts (delegates to build-matrix.yml)
  # ===========================================================================
  build:
    name: "Step 4: Build artifacts"
    needs: [version-tags]
    uses: ./.github/workflows/build-matrix.yml
    with:
      scp-core-version: ${{ inputs.version }}

  # ===========================================================================
  # Step 5: Sign artifacts
  # ===========================================================================
  sign-apple:
    name: "Step 5a: Apple codesigning"
    needs: [build]
    # Signing requires Apple secrets and is publish-adjacent; a dry run validates
    # the build/version/changelog path with zero secrets configured.
    if: ${{ !inputs.dry-run }}
    runs-on: macos-latest
    steps:
      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: swift-xcframework
          path: xcframework/

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/release.keychain-db
          KEYCHAIN_PWD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Codesign XCFramework
        run: |
          find xcframework/ -name "*.a" -o -name "*.dylib" | while read -r lib; do
            codesign --force --sign "Developer ID Application" \
              --options runtime \
              --timestamp \
              "$lib"
          done

      - name: Upload signed XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: swift-xcframework-signed
          path: xcframework/
          retention-days: 14

  sign-windows:
    name: "Step 5b: Authenticode signing"
    needs: [build]
    # See sign-apple: skipped in dry-run so no signing secrets are required.
    if: ${{ !inputs.dry-run }}
    runs-on: windows-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: rust-x86_64-pc-windows-msvc
          path: windows-artifacts/

      - name: Download cbindgen Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: cbindgen-x86_64-pc-windows-msvc
          path: windows-cbindgen/

      - name: Import Authenticode certificate
        env:
          WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_PWD: ${{ secrets.WINDOWS_SIGN_PWD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $cert = Import-PfxCertificate -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_SIGN_PWD -AsPlainText -Force)
          echo "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Sign DLLs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.dll windows-artifacts/, windows-cbindgen/ | ForEach-Object {
            & signtool sign /sha1 $env:SIGN_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            Write-Host "Signed: $($_.FullName)"
          }

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: |
            windows-artifacts/
            windows-cbindgen/
          retention-days: 14

  # Maven artifacts are GPG-signed inline by the vanniktech plugin during
  # publish (signAllPublications), so there is no separate signing job — see the
  # publish-maven job below.

  # ===========================================================================
  # Step 6: Publish to registries
  # ===========================================================================
  publish-crates:
    name: "Step 6a: Publish to crates.io"
    needs: [sign-apple, sign-windows]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Publish order matters: dependencies first
      - name: Publish scp-clock
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-clock --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-crypto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-crypto --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-did
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-did --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-dht
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-dht --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-platform
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-platform --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-event-log
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-event-log --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-protocol
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-protocol --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-identity
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-identity --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-mls
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-mls --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-client --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-runtime --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-core --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-relay-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-relay-client --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-transport
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-transport --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-mcp --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-media
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-media --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-node
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-node --allow-dirty

      - name: Wait for crates.io index
        run: sleep 60

      - name: Publish scp-relay
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish -p scp-relay --allow-dirty

  publish-pypi:
    name: "Step 6b: Publish to PyPI"
    needs: [sign-apple, sign-windows]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Uses Trusted Publishers (OIDC) — no token required
    environment:
      name: pypi
      url: https://pypi.org/project/scp-python/${{ inputs.version }}/
    steps:
      - name: Download all Python wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true

      - name: Download Python sdist
        uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-npm:
    name: "Step 6c: Publish to npm"
    needs: [sign-apple, sign-windows]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} to
      # .npmrc but does not add a scope line. The @limn-works scope line is
      # required for first-time publishes of org-scoped packages.
      - name: Configure @limn-works npm scope
        run: echo "@limn-works:registry=https://registry.npmjs.org/" >> ~/.npmrc

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # @limn-works/scp-ts — Node.js/Bun TypeScript SDK wrapper
      - name: Build @limn-works/scp-ts
        run: |
          cd bindings/typescript
          bun install --frozen-lockfile
          bun run build

      - name: Set release version in package.json
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          cd bindings/typescript
          # Read VERSION from process.env rather than interpolating the workflow
          # expression into the JS body: the version input is validated as SemVer
          # in Step 0, and reading from the environment removes the injection sink.
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = version;
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = version;
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Publish @limn-works/scp-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish bindings/typescript --access public

      # @limn-works/scp-ts-napi-{platform} — per-platform native addons
      # Each artifact (napi-{target}) contains a single index.node binary
      # staged by build-matrix.yml's typescript-napi job.
      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: /tmp/napi-artifacts/

      - name: Publish per-platform NAPI packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          declare -A TARGET_MAP=(
            ["napi-x86_64-unknown-linux-gnu"]="linux-x64-gnu linux x64"
            ["napi-aarch64-unknown-linux-gnu"]="linux-arm64-gnu linux arm64"
            ["napi-x86_64-apple-darwin"]="darwin-x64 darwin x64"
            ["napi-aarch64-apple-darwin"]="darwin-arm64 darwin arm64"
            ["napi-x86_64-pc-windows-msvc"]="win32-x64-msvc win32 x64"
          )

          for artifact in /tmp/napi-artifacts/napi-*/; do
            artifact_name=$(basename "$artifact")
            info="${TARGET_MAP[$artifact_name]}"
            if [ -z "$info" ]; then
              echo "::warning::Unknown artifact $artifact_name — skipping"
              continue
            fi

            suffix=$(echo "$info" | awk '{print $1}')
            os=$(echo "$info" | awk '{print $2}')
            cpu=$(echo "$info" | awk '{print $3}')
            pkg_name="@limn-works/scp-ts-napi-${suffix}"
            pkg_dir="/tmp/pkg-${suffix}"

            mkdir -p "$pkg_dir"
            cp "$artifact/index.node" "$pkg_dir/index.node"

            cat > "$pkg_dir/package.json" <<JSON
          {
            "name": "${pkg_name}",
            "version": "${{ env.VERSION }}",
            "description": "${os} ${cpu} native addon for @limn-works/scp-ts",
            "os": ["${os}"],
            "cpu": ["${cpu}"],
            "main": "index.node",
            "files": ["index.node"],
            "license": "MIT OR Apache-2.0",
            "repository": { "type": "git", "url": "https://github.com/limn-works/scp" },
            "publishConfig": { "access": "public" }
          }
          JSON

            echo "Publishing ${pkg_name}@${{ env.VERSION }}…"
            npm publish "$pkg_dir" --access public
          done

  # Publishes works.limn:scp-kt (JVM) and works.limn:scp-kt-android (AAR) to
  # Maven Central via the Central Portal (vanniktech `publishAndReleaseToMavenCentral`,
  # which uploads + auto-releases — no OSSRH staging close/release).
  #
  # This job runs NO cargo build. Both native inputs are precomputed in the
  # credential-free build matrix and downloaded here: the Android jniLibs
  # (kotlin-jnilibs) re-staged so Gradle assembles the AAR with native libraries,
  # and the UniFFI Kotlin bindings (kotlin-bindings) placed into the scp-kt module
  # so the publish runs with `-x generateUniffiBindings`. Keeping cargo out of the
  # credential-bearing step means no dependency build script ever executes with the
  # Maven signing key or Portal token in its environment.
  publish-maven:
    name: "Step 6d: Publish to Maven Central"
    needs: [sign-apple, sign-windows]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Android jniLibs
        uses: actions/download-artifact@v4
        with:
          name: kotlin-jnilibs
          path: bindings/kotlin/scp-kt-android/src/main/jniLibs/

      - name: Download UniFFI Kotlin bindings
        uses: actions/download-artifact@v4
        with:
          name: kotlin-bindings
          path: bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/

      # publishAndReleaseToMavenCentral uploads a Portal deployment and triggers
      # its release. `-x generateUniffiBindings` uses the downloaded bindings
      # instead of regenerating them (which would run cargo). --no-configuration-cache:
      # the publish tasks are not configuration-cache compatible.
      #
      # MAVEN_USERNAME/MAVEN_PASSWORD must be a Central Portal user token
      # (central.sonatype.com → Account → Generate User Token), NOT the old OSSRH
      # password.
      - name: Publish to Maven Central (JVM + Android)
        working-directory: bindings/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Assemble both modules first so a build failure in either aborts before
          # any (irreversible) Central Portal release. Full cross-coordinate
          # atomicity is not achievable on the Portal (each module is a separate
          # deployment); on a partial failure, bump the version rather than
          # re-publishing an immutable coordinate.
          ./gradlew \
            :scp-kt:assemble :scp-kt-android:assembleRelease \
            -x generateUniffiBindings \
            -PscpVersion=${{ env.VERSION }} \
            --no-configuration-cache
          ./gradlew publishAndReleaseToMavenCentral \
            -x generateUniffiBindings \
            -PscpVersion=${{ env.VERSION }} \
            --no-configuration-cache

  # Zips the signed XCFramework and computes its SHA-256 (== SwiftPM binary-target
  # checksum). The exact zip is both attached to the GitHub Release (Step 7) and
  # checksummed here, so the URL/checksum the mirror commits always match the
  # asset consumers download. No git operations — the mirror is pushed only after
  # the release asset exists (job `publish-spm`, after `github-release`).
  package-swift:
    name: "Step 6f: Package Swift XCFramework"
    needs: [sign-apple]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    outputs:
      checksum: ${{ steps.xcf.outputs.checksum }}
    steps:
      - name: Download signed XCFramework
        uses: actions/download-artifact@v4
        with:
          name: swift-xcframework-signed
          path: xcframework-signed/

      - name: Zip XCFramework and compute checksum
        id: xcf
        run: |
          set -euo pipefail
          ZIP="ScpFFI-${{ env.VERSION }}.xcframework.zip"
          # upload/download-artifact strips the named directory, so the signed
          # artifact's root is the bundle's *contents* (Info.plist + slices).
          # SwiftPM's binaryTarget requires the archive to contain the
          # `*.xcframework` bundle directory at its root, so reconstruct it.
          mkdir ScpFFI.xcframework
          cp -R xcframework-signed/. ScpFFI.xcframework/
          zip -r "$ZIP" ScpFFI.xcframework
          CHECKSUM=$(sha256sum "$ZIP" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "XCFramework zip: $ZIP ($CHECKSUM)"

      - name: Upload XCFramework zip for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: xcframework-zip
          path: ScpFFI-${{ env.VERSION }}.xcframework.zip
          retention-days: 1

  # ===========================================================================
  # Step 7: Create GitHub Release
  # ===========================================================================
  github-release:
    name: "Step 7: GitHub Release"
    needs:
      - publish-crates
      - publish-pypi
      - publish-npm
      - publish-maven
      - package-swift
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          name: scp-release-bundle
          path: release-artifacts/

      - name: Download XCFramework zip (produced by package-swift)
        uses: actions/download-artifact@v4
        with:
          name: xcframework-zip
          path: release-artifacts/

      - name: Download signed Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: release-artifacts/windows-signed/

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[?v?${{ env.VERSION }}\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ env.VERSION }}"
          fi
          # Write to file for gh release
          echo "$NOTES" > release-notes.md

      - name: Append commit log to release notes
        run: |
          # Find the previous release tag (if any)
          PREV_TAG=$(git tag --list 'scp-core@*' --sort=-version:refname | head -1)

          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Commits" >> release-notes.md
          echo "" >> release-notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> release-notes.md
          else
            git log --pretty=format:"- %s (%h)" --no-merges -50 >> release-notes.md
          fi

      - name: Generate checksums
        run: |
          cd release-artifacts
          find . -type f ! -name "SHA256SUMS" | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS
          echo "Generated checksums for $(wc -l < SHA256SUMS) files"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "scp-core@${{ env.VERSION }}" \
            --title "SCP ${{ env.VERSION }}" \
            --notes-file release-notes.md \
            --verify-tag \
            release-artifacts/SHA256SUMS \
            release-artifacts/ScpFFI-${{ env.VERSION }}.xcframework.zip \
            release-artifacts/python-wheel-*/*.whl \
            release-artifacts/python-sdist/*.tar.gz

  # ===========================================================================
  # Step 6g: Publish the Swift Package mirror (limn-works/scp-swift)
  #
  # SwiftPM cannot consume this monorepo directly: it requires a root
  # Package.swift and SemVer git tags, but the Swift sources live under
  # bindings/swift/ and the repo is tagged per-component (scp-<crate>@<version>).
  # The mirror repo carries only the thin generated manifest + Swift sources; the
  # binary stays a release artifact of this repo, referenced by url:/checksum:.
  #
  # Runs AFTER github-release so the binaryTarget URL resolves before the mirror
  # tag is published (no broken-window where `swift package resolve` 404s). The
  # mirror is CI-owned and unprotected, so per-release manifest commits never
  # fight this repo's branch protection.
  # ===========================================================================
  publish-spm:
    name: "Step 6g: Publish Swift Package (SPM mirror)"
    needs: [github-release, package-swift]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        # Provides bindings/swift/Package.dist.swift (manifest template) + LICENSE.
        uses: actions/checkout@v5

      - name: Checkout scp-swift mirror
        # actions/checkout configures the token as a scrubbed http.extraHeader and
        # removes it in its post step — the token never appears in a clone URL or
        # persists in .git/config, unlike `git clone https://x-access-token:...`.
        # SWIFT_MIRROR_TOKEN needs contents:write on limn-works/scp-swift only
        # (github.token cannot push cross-repo).
        uses: actions/checkout@v5
        with:
          repository: limn-works/scp-swift
          token: ${{ secrets.SWIFT_MIRROR_TOKEN }}
          path: mirror
          fetch-depth: 0

      - name: Download Swift sources
        uses: actions/download-artifact@v4
        with:
          name: swift-sources
          path: swift-sources/

      - name: Assemble and publish scp-swift mirror
        working-directory: mirror
        env:
          CHECKSUM: ${{ needs.package-swift.outputs.checksum }}
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          RELEASE_URL="https://github.com/limn-works/scp/releases/download/scp-core@${VERSION}/ScpFFI-${VERSION}.xcframework.zip"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A released version is an immutable contract: SwiftPM resolves `from:`
          # to this tag, so re-pointing it would silently change what consumers
          # get. Refuse to republish an existing version — bump it instead.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag ${VERSION} already exists on limn-works/scp-swift. Released versions are immutable — bump the version to publish a fix."
            exit 1
          fi

          # Reset tracked content (preserve .git history).
          git rm -rqf . >/dev/null 2>&1 || true
          rm -rf Sources
          mkdir -p Sources/SCP

          # Swift sources (hand-written wrapper + UniFFI-generated bindings) come
          # from the build artifact, post-generation. Keep only regular .swift
          # files — drop symlinks and the generated FFI header/modulemap, which
          # belong to the binary XCFramework, not the Swift target.
          cp -R ../swift-sources/SCP/. Sources/SCP/
          find Sources/SCP -type l -delete
          find Sources/SCP -type f ! -name '*.swift' -delete

          # Materialize the root manifest from the committed template.
          sed -e "s|__SCP_XCFRAMEWORK_URL__|${RELEASE_URL}|" \
              -e "s|__SCP_XCFRAMEWORK_CHECKSUM__|${CHECKSUM}|" \
              ../bindings/swift/Package.dist.swift > Package.swift

          # License (fail closed — a published package must carry one) + a
          # generated do-not-edit README.
          cp ../LICENSE LICENSE
          printf '%s\n' \
            "# SCP — Swift SDK" \
            "" \
            "Auto-generated SwiftPM distribution of the Shared Context Protocol Swift SDK." \
            "Source of truth: https://github.com/limn-works/scp (bindings/swift)." \
            "Do not edit; every release regenerates and publishes this repository." \
            "" \
            "## Installation" \
            "" \
            '```swift' \
            ".package(url: \"https://github.com/limn-works/scp-swift.git\", from: \"${VERSION}\")" \
            '```' > README.md

          git add -A
          git commit -m "Release ${VERSION}" --quiet
          git push origin HEAD:main

          # SwiftPM resolves versions from SemVer tags. Non-force: the existence
          # check above already guarantees this version is new.
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"

  # ===========================================================================
  # Dry-run summary (when dry-run is true, skip publishing but report status)
  # ===========================================================================
  dry-run-summary:
    name: "Dry-run summary"
    needs: [build]
    if: ${{ inputs.dry-run }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: scp-release-bundle
          path: release-artifacts/

      - name: Summary
        run: |
          echo "## Dry-run release summary for v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts built:" >> $GITHUB_STEP_SUMMARY
          find release-artifacts/ -type f | sort | while read -r f; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "- \`$f\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Registries that would be published to:" >> $GITHUB_STEP_SUMMARY
          echo "- crates.io: scp-clock, scp-crypto, scp-did, scp-dht, scp-platform, scp-event-log, scp-protocol, scp-identity, scp-mls, scp-client, scp-runtime, scp-core, scp-relay-client, scp-transport, scp-mcp, scp-media, scp-node, scp-relay" >> $GITHUB_STEP_SUMMARY
          echo "- PyPI: scp-python" >> $GITHUB_STEP_SUMMARY
          echo "- npm: @limn-works/scp-ts + @limn-works/scp-ts-napi-{linux-x64-gnu,linux-arm64-gnu,darwin-x64,darwin-arm64,win32-x64-msvc}" >> $GITHUB_STEP_SUMMARY
          echo "- Maven Central: works.limn:scp-kt, works.limn:scp-kt-android" >> $GITHUB_STEP_SUMMARY
          echo "- SPM: limn-works/scp-swift mirror (binary target -> GitHub Release zip)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Re-run without dry-run to publish." >> $GITHUB_STEP_SUMMARY
