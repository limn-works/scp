name: Spec Drift Detection

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'tests/**'
      - 'scripts/**'
      - '.docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: spec-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec-drift:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute review scope
        id: diff
        run: |
          EVENT="${{ github.event.action }}"
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          PR_BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          if [[ "$EVENT" == "synchronize" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            MODE="incremental"
            DIFF_BASE="$BEFORE"
            DIFF_HEAD="$AFTER"
          else
            MODE="full"
            DIFF_BASE="$PR_BASE"
            DIFF_HEAD="$HEAD"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

          # Write raw file list, then filter to in-scope paths
          if ! git diff --name-only "$DIFF_BASE".."$DIFF_HEAD" > /tmp/all-changed-files.txt 2>/dev/null; then
            # BEFORE sha is unreachable (force push) — fall back to full PR diff
            MODE="full"
            DIFF_BASE="$PR_BASE"
            DIFF_HEAD="$HEAD"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path' > /tmp/all-changed-files.txt
          fi

          grep -E '^(crates/|bindings/|tests/|scripts/|\.docs/|Cargo\.(toml|lock)$)' /tmp/all-changed-files.txt > /tmp/changed-files.txt || true

          FILE_COUNT=$(wc -l < /tmp/changed-files.txt | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "No in-scope files changed — skipping spec drift check."
            exit 0
          fi

          echo "## Review Scope" > /tmp/review-scope.md
          echo "**Mode:** $MODE" >> /tmp/review-scope.md
          echo "**Range:** \`${DIFF_BASE:0:8}..${DIFF_HEAD:0:8}\`" >> /tmp/review-scope.md
          echo "**Files in scope:** $FILE_COUNT" >> /tmp/review-scope.md
          echo "" >> /tmp/review-scope.md
          echo "### Changed files" >> /tmp/review-scope.md
          cat /tmp/changed-files.txt >> /tmp/review-scope.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch review history
        if: steps.diff.outputs.file_count != '0'
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "## Previous Spec Drift Comments" > /tmp/review-history.md

          # PR-level comments (spec-drift posts as PR comments)
          gh api "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | "- \(.user.login) at \(.created_at): \(.body | .[0:500])"' >> /tmp/review-history.md 2>/dev/null || echo "None." >> /tmp/review-history.md

          # Previous review verdicts (in case of inline comments)
          echo "" >> /tmp/review-history.md
          echo "## Previous Review Verdicts" >> /tmp/review-history.md
          gh api "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | "- \(.state) by \(.user.login) at \(.submitted_at): \(.body | .[0:300])"' >> /tmp/review-history.md 2>/dev/null || echo "None." >> /tmp/review-history.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude spec drift check
        if: steps.diff.outputs.file_count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--model claude-opus-4-20250514 --max-turns 50 --allowedTools "Bash(gh *),Read,Write,Glob,Grep"'
          prompt: |
            Check PR #${{ github.event.pull_request.number }} for spec drift — implementation
            that diverges from the project's specifications.

            IMPORTANT: Be turn-efficient. Use parallel tool calls aggressively. Read multiple
            files in one turn.

            ## Setup

            Read pre-computed files:
            1. `/tmp/review-scope.md` — files in scope and review mode
            2. `/tmp/review-history.md` — previous spec-drift comments
            3. `/tmp/changed-files.txt` — file list for grouping by spec area

            This check is in **${{ steps.diff.outputs.mode }}** mode.
            - **full**: Check all PR files against specs.
            - **incremental**: Check ONLY files from the latest push against specs.

            ## History Rules

            Review previous spec-drift comments in /tmp/review-history.md.
            - Do NOT repeat findings on files not in the current scope.
            - If a previous "Action Required" is on a file in scope, check if fixed.
              Report as **Resolved** or re-flag.
            - If a previous finding is on a file NOT in scope, ignore it entirely.

            ## Step 1: Group changed files by spec area

            Group files from /tmp/changed-files.txt into spec areas using these path prefixes:
            - `**/identity/**`, `**/did/**` → `.docs/specs/01-identity.md`
            - `**/crypto/**`, `**/mls/**` → `.docs/specs/04-encryption.md`
            - `**/context/**` → `.docs/specs/05-contexts.md`
            - `**/message/**`, `**/messaging/**` → `.docs/specs/04-encryption.md`, `.docs/specs/06-cross-context-communication.md`
            - `**/capability/**`, `**/ucan/**` → `.docs/specs/07-capabilities.md`
            - `**/provenance/**` → `.docs/specs/08-provenance.md`
            - `**/transport/**`, `**/relay/**` → `.docs/specs/10-transport.md`
            - `**/discovery/**` → `.docs/specs/12-discovery.md`
            - `**/governance/**` → `.docs/specs/13-governance.md`
            - `**/storage/**`, `**/persist/**` → `.docs/specs/17-persistence-and-storage.md`

            Skip files that don't map to any spec (Cargo.toml, Cargo.lock, tests, etc.).

            **When `.docs/specs/` or `.docs/prds/` files are changed**: The source of truth itself
            changed. Re-check the most relevant source files (in `crates/` or `bindings/`) against
            the updated spec/PRD content, even if those source files are not in the diff. Focus on
            sections that were modified in the spec change.

            ## Step 2: Check each spec area (batched)

            For each spec area, IN PARALLEL:
            1. Read the spec file
            2. Read the 2-3 most structurally significant changed files in that area
               (prefer files with new types, trait impls, or public APIs over test files or minor edits)
            3. Compare public types, field names, method signatures, and behavioral contracts against spec

            Focus on:
            - **Structural drift:** types, fields, or relationships differ from spec
            - **Behavioral drift:** handling differs from spec-defined behavior
            - **Missing implementation:** spec requires something the code omits
            - **Unauthorized extras:** code adds behavior not in any spec

            Do NOT read every changed file. Sample the most important ones per area.

            ## Step 2b: Cross-reference with PRD

            Read `.docs/prds/main.json` and extract pending story titles:
            ```
            jq '[.stories[] | select(.status == "pending") | .title]' .docs/prds/main.json
            ```

            For each drift finding, check if a pending story clearly covers that gap. If so,
            classify it as **Planned** (non-actionable). If no pending story covers it, classify
            it as **Action Required**.

            ## Step 3: Report

            ## When to post

            **In incremental mode**: Only post if you found new drift (Action Required or Planned),
            or if a previous Action Required finding was resolved by the new changes. If the
            incremental diff has no spec-relevant files or no drift findings, exit silently —
            do not post an empty "PASSED" comment.

            **In full mode**: Always post (this is the first check).

            ## How to post

            IMPORTANT: Always write the comment body to a file first, then post with --body-file.
            Do NOT pass the body inline with --body (it breaks permission matching on multi-line content).

            Write the report to /tmp/drift-report.md, then post:
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/drift-report.md
            ```

            **Report format:**

            Always start with a header line:
            `## Spec Drift Check — [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`

            Include a scope line:
            `**Mode:** ${{ steps.diff.outputs.mode }} | **Files checked:** <count>`

            **If there are previously-resolved findings**, list them under:
            `### Resolved (from previous review)`
            Format: brief summary of what was fixed.

            **If there are Action Required findings**, list them under:
            `### Action Required`
            Format each as:
            - **File:** `path/to/file.rs`
            - **Spec:** `.docs/specs/XX-name.md` section Y.Z
            - **Type:** structural | behavioral | missing | unauthorized
            - **Description:** what diverges and how

            **If there are Planned findings**, list them under:
            `### Planned (covered by pending stories)`
            Format each as:
            - **File:** `path/to/file.rs`
            - **Spec:** `.docs/specs/XX-name.md` section Y.Z
            - **Story:** title of the pending PRD story that covers this
            - **Description:** brief note on what's missing

            **If no drift at all**, write:
            `**PASSED** — No drift detected.`
