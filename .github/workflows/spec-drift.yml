name: Spec Drift Detection

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "crates/**"
      - "scp-*/**"
      - "sdk/**"
      - "src/**"
      - "bindings/**"

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude spec drift check
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-4-20250514 --max-turns 15"
          allowed_tools: "Bash(gh *),Read,Glob,Grep"
          prompt: |
            Check PR #${{ github.event.pull_request.number }} for spec drift — implementation
            that diverges from the project's specifications.

            ## Step 1: Understand the changes

            ```bash
            gh pr diff ${{ github.event.pull_request.number }}
            gh pr view ${{ github.event.pull_request.number }} --json files
            ```

            ## Step 2: Map changes to specs

            For each changed file, determine which spec section(s) it relates to:

            - `crates/scp-core/` or `scp-core/` → Multiple specs depending on module
            - `**/identity/**` or `**/did/**` → `.docs/specs/01-identity.md`
            - `**/crypto/**` or `**/mls/**` → `.docs/specs/04-encryption.md`
            - `**/context/**` → `.docs/specs/05-contexts.md`
            - `**/message/**` or `**/messaging/**` → `.docs/specs/04-encryption.md`, `.docs/specs/06-cross-context-communication.md`
            - `**/capability/**` or `**/ucan/**` → `.docs/specs/07-capabilities.md`
            - `**/provenance/**` → `.docs/specs/08-provenance.md`
            - `**/transport/**` or `**/relay/**` → `.docs/specs/10-transport.md`
            - `**/discovery/**` → `.docs/specs/12-discovery.md`
            - `**/governance/**` → `.docs/specs/13-governance.md`
            - `**/storage/**` or `**/persist/**` → `.docs/specs/17-persistence-and-storage.md`

            Also read `.docs/sketch.md` for API surface expectations.

            ## Step 3: Check for drift

            For each mapping, read the relevant spec section and compare against the
            implementation. Look for:

            - **Structural drift:** Implementation uses different types, fields, or relationships than spec describes
            - **Behavioral drift:** Implementation handles cases differently than spec defines
            - **Missing implementation:** Spec requires something the implementation omits
            - **Unauthorized extras:** Implementation adds behavior not described in any spec

            ## Step 4: Report

            If drift is found, comment on the PR:
            ```bash
            gh pr comment ${{ github.event.pull_request.number }} --body "<drift report>"
            ```

            Format each finding as:
            - **File:** `path/to/file.rs`
            - **Spec:** `.docs/specs/XX-name.md` section Y.Z
            - **Type:** structural | behavioral | missing | unauthorized
            - **Description:** what diverges and how

            If no drift is found, do NOT comment. Exit silently.
