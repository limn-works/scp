name: Cache warm

# EXPERIMENT (branch ci/workspace-crate-cache-exp, dispatched by hand): measures
# workspace-crate reuse by (a) content manifest and (b) sccache against today's
# deps-only restore. Writes no Actions cache entry (every rust-cache step has
# save-if false); artifacts expire after one day.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        default: measure
        type: string
      artifact_run:
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTUP_AUTO_INSTALL: "0"
  PYO3_PYTHON: python3.12
  MAIN_SHA: 63eca462b75ef4962e7bea0c136348852fbac4a2

jobs:
  writer:
    if: inputs.mode == 'measure'
    name: writer ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [workspace-debug, workspace-check, clippy-packages]
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          cp .github/workflows/cache-warm.yml "$RUNNER_TEMP/exp.yml"
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
          cp .github/workflows/cache-warm.yml "$RUNNER_TEMP/main-warm.yml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: ${{ matrix.group }}
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@nextest
      - name: Compile the group's commands
        run: |
          pip install -q pyyaml
          python3 scripts/ws-exp-writer.py "${{ matrix.group }}" "$RUNNER_TEMP/main-warm.yml" "$RUNNER_TEMP/wsteps"
          start=$(date +%s)
          for f in "$RUNNER_TEMP"/wsteps/*.sh; do
            echo "::group::$f"; cat "$f"
            CARGO_TERM_COLOR=never bash "$f" 2>&1 | command grep -vE '^\s+(Compiling|Checking|Fresh)' | tail -100
            echo "::endgroup::"
          done
          echo "WRITER group=${{ matrix.group }} compile_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pack
        run: |
          start=$(date +%s)
          python3 scripts/ci-workspace-cache.py pack --target target --out "$RUNNER_TEMP/ws.tar.zst"
          echo "PACK group=${{ matrix.group }} seconds=$(( $(date +%s) - start )) bytes=$(stat -c %s "$RUNNER_TEMP/ws.tar.zst")" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target
      - uses: actions/upload-artifact@v4
        with:
          name: ws-${{ matrix.group }}
          path: ${{ runner.temp }}/ws.tar.zst
          compression-level: 0
          retention-days: 1

  base:
    if: inputs.mode == 'measure'
    name: base ${{ matrix.reader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reader: testing, group: workspace-debug }
          - { reader: runtime, group: workspace-debug }
          - { reader: napi, group: workspace-debug }
          - { reader: pyo3, group: workspace-debug }
          - { reader: uniffi, group: workspace-debug }
          - { reader: doctest, group: workspace-debug }
          - { reader: clippy-ws, group: workspace-check }
          - { reader: clippy-cloud, group: clippy-packages }
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: ${{ matrix.group }}
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@nextest
      - name: Compile
        run: |
          source scripts/ws-exp.sh
          run_reader "${{ matrix.reader }}" base

  manifest:
    needs: writer
    name: manifest ${{ matrix.reader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reader: testing, group: workspace-debug }
          - { reader: runtime, group: workspace-debug }
          - { reader: napi, group: workspace-debug }
          - { reader: pyo3, group: workspace-debug }
          - { reader: uniffi, group: workspace-debug }
          - { reader: doctest, group: workspace-debug }
          - { reader: clippy-ws, group: workspace-check }
          - { reader: clippy-cloud, group: clippy-packages }
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: ${{ matrix.group }}
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@nextest
      - name: Download
        id: dl
        run: |
          start=$(date +%s)
          echo "start=$start" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ws-${{ matrix.group }}
          path: ${{ runner.temp }}/ws
      - name: Restore
        run: |
          echo "DOWNLOAD seconds=$(( $(date +%s) - ${{ steps.dl.outputs.start }} ))" | tee -a "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          python3 scripts/ci-workspace-cache.py restore --target target --archive "$RUNNER_TEMP/ws/ws.tar.zst"
          echo "RESTORE seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile under each scenario
        run: |
          source scripts/ws-exp.sh
          r="${{ matrix.reader }}"
          run_reader "$r" none
          if [[ $r == clippy-ws ]]; then
            echo "pub fn workspace_cache_plant(v: &[u8]) -> bool { v.len() == 0 }" >> crates/scp-clock/src/lib.rs
            run_reader "$r" plant-warning-in-changed-crate
            git checkout -q crates/scp-clock/src/lib.rs
            run_reader "$r" plant-reverted
            sed -i 's/-D warnings/-D warnings -A clippy::len_zero/' scripts/ws-exp.sh
            source scripts/ws-exp.sh
            run_reader "$r" clippy-args-changed
            git checkout -q scripts/ws-exp.sh
            source scripts/ws-exp.sh
            run_reader "$r" clippy-args-restored
            echo "# workspace-cache experiment" >> .clippy.toml
            run_reader "$r" clippy-toml-changed
          fi
          edit leaf "$(leaf_file "$r")"
          run_reader "$r" leaf
          edit mid crates/scp-runtime/src/lib.rs
          run_reader "$r" mid
          edit root crates/scp-crypto/src/lib.rs
          run_reader "$r" root

  sccache:
    if: inputs.mode == 'measure'
    name: sccache ${{ matrix.reader }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { reader: testing, group: workspace-debug }
          - { reader: napi, group: workspace-debug }
          - { reader: uniffi, group: workspace-debug }
          - { reader: clippy-ws, group: workspace-check }
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: ${{ matrix.group }}
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Compile under each scenario, every hit served from a local sccache dir
        run: |
          export RUSTC_WRAPPER=sccache SCCACHE_DIR="$RUNNER_TEMP/sccache" SCCACHE_CACHE_SIZE=30G
          source scripts/ws-exp.sh
          r="${{ matrix.reader }}"
          run_reader "$r" populate
          sccache --show-stats | head -30
          du -sh "$SCCACHE_DIR"
          sccache --zero-stats >/dev/null
          python3 scripts/ci-workspace-cache.py clean --target target
          run_reader "$r" none
          sccache --show-stats | head -30
          python3 scripts/ci-workspace-cache.py clean --target target
          edit leaf "$(leaf_file "$r")"
          run_reader "$r" leaf
          python3 scripts/ci-workspace-cache.py clean --target target
          edit mid crates/scp-runtime/src/lib.rs
          run_reader "$r" mid
          python3 scripts/ci-workspace-cache.py clean --target target
          edit root crates/scp-crypto/src/lib.rs
          run_reader "$r" root
          sccache --show-stats | head -30

  exactness:
    if: inputs.mode == 'exactness'
    name: exactness
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - name: Exactness plants
        run: |
          start=$(date +%s)
          CARGO_TERM_COLOR=never python3 scripts/tests/workspace-cache/exactness.py
          echo "EXACTNESS seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"

  clippy-proof:
    if: inputs.mode == 'clippy-proof'
    name: clippy-proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: clippy-packages
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: actions/download-artifact@v4
        with:
          name: ws-clippy-packages
          path: ${{ runner.temp }}/ws
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Restore
        run: python3 scripts/ci-workspace-cache.py restore --target target --archive "$RUNNER_TEMP/ws/ws.tar.zst"
      - name: Clippy proofs
        run: bash scripts/ws-clippy-proof.sh

  split-writer:
    if: inputs.mode == 'split'
    name: split-writer ${{ matrix.reader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        reader: [testing, runtime, napi, pyo3, uniffi, doctest]
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@nextest
      - name: Compile the reader's commands
        run: |
          source scripts/ws-exp.sh
          run_reader "${{ matrix.reader }}" writer
      - name: Pack
        run: |
          start=$(date +%s)
          python3 scripts/ci-workspace-cache.py pack --target target --out "$RUNNER_TEMP/ws.tar.zst"
          echo "PACK reader=${{ matrix.reader }} seconds=$(( $(date +%s) - start )) bytes=$(stat -c %s "$RUNNER_TEMP/ws.tar.zst")" | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh target
      - uses: actions/upload-artifact@v4
        with:
          name: ws-split-${{ matrix.reader }}
          path: ${{ runner.temp }}/ws.tar.zst
          compression-level: 0
          retention-days: 1

  split-reader:
    needs: split-writer
    name: split-reader ${{ matrix.reader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        reader: [testing, runtime, napi, pyo3, uniffi, doctest]
    steps:
      - uses: actions/checkout@v5
      - name: Put main's cache-warm.yml in place for the cache key
        run: |
          git fetch -q --depth=1 origin "$MAIN_SHA"
          git show FETCH_HEAD:.github/workflows/cache-warm.yml > .github/workflows/cache-warm.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: false
      - uses: ./.github/actions/cargo-fetch
      - uses: taiki-e/install-action@nextest
      - name: Download
        id: dl
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ws-split-${{ matrix.reader }}
          path: ${{ runner.temp }}/ws
      - name: Restore
        run: |
          echo "DOWNLOAD seconds=$(( $(date +%s) - ${{ steps.dl.outputs.start }} ))" | tee -a "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          python3 scripts/ci-workspace-cache.py restore --target target --archive "$RUNNER_TEMP/ws/ws.tar.zst"
          echo "RESTORE seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile under each scenario
        run: |
          source scripts/ws-exp.sh
          r="${{ matrix.reader }}"
          run_reader "$r" none
          edit leaf "$(leaf_file "$r")"
          run_reader "$r" leaf
          edit mid crates/scp-runtime/src/lib.rs
          run_reader "$r" mid
          edit root crates/scp-crypto/src/lib.rs
          run_reader "$r" root
