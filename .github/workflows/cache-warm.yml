name: Cache warm

# Writes every cargo cache group that more than one job of ci.yml reads, and every group
# whose ci.yml reader restores it only when a bridge-artifact cache misses, on each push
# to `main`. Each job here restores one group, and when the restore is not an exact match it
# compiles every feature set, in every compile mode, that any job reading the group
# compiles, so the entry it saves holds every dependency unit each reader needs. A
# reader that restores an entry missing its units compiles them from source on every
# run and never saves them, because an exact match skips the save (merge_group run
# 41499098021: rust-doctest recompiled 223 registry crates, wasm-test 228).
#
# The commands below are the readers' own commands, with `--no-run` added where cargo
# accepts it and the test filters dropped, because a filter changes which tests run and
# not what compiles. `cargo test --doc` and `wasm-pack test` have no `--no-run` form,
# so those run their tests too. Check `group coverage` in
# scripts/check-workflow-compile-steps.py fails when a reader of a group compiles a
# command no job writing that group compiles, so a reader's new feature set or mode
# lands here in the same change. Editing this file changes the key of every group it
# writes, because ./.github/actions/rust-cache digests it into those groups'
# `prefix-key`, so the next push to `main` re-warms each one under the new commands.
#
# These jobs are not in ci.yml so that a push to `main` runs ci.yml's legs exactly as a
# merge-queue run does and is not held up by a job that compiles every reader's feature
# set. A job here whose restore is an exact match compiles nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false

# Identical to ci.yml's `env:`: rust-cache hashes every CARGO*/RUST* variable into the
# key, so a value that differed here would write an entry no ci.yml job restores, and
# check `group coverage` compares the two. ci.yml's `env:` says why each value is set.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUSTUP_AUTO_INSTALL: "0"
  PYO3_PYTHON: python3.12

jobs:
  workspace-debug:
    name: Warm workspace-debug
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space when the runner is short of it
        run: |
          AVAILABLE_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "available: ${AVAILABLE_GB}G"
          if [ "$AVAILABLE_GB" -lt 40 ]; then
            echo "under 40G — reclaiming the preinstalled SDK trees"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            df -h /
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest
      # rust-test, one command per leg.
      - name: Compile rust-test's legs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          PY_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$PY_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo nextest run --no-run -p scp-ffi -p scp-ffi-common -p scp-ffi-napi -p scp-ffi-napi-test-stubs -p scp-ffi-uniffi --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/outlet-capability-test-grant,scp-platform/filesystem,scp-testing/testing
          cargo nextest run --no-run -p scp-runtime -p scp-core --features scp-core/testing,scp-core/allow_unencrypted_storage,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-core/outlet-capability-test-grant,serde_json/raw_value,serde_json/unbounded_depth,tracing/log,scp-runtime/outlet-capability-test-grant,scp-dht/production-dht,scp-identity/production-dht,scp-platform/file,scp-platform/sqlite,tokio-util/codec,tokio-util/io
          cargo nextest run --no-run -p scp-testing -p scp-platform --features openmls_basic_credential/test-utils,serde_json/unbounded_depth,scp-core/outlet-capability-test-grant,tokio/test-util,scp-runtime/outlet-capability-test-grant,scp-runtime/saga-witness-test-mint,scp-platform/filesystem,scp-ffi-common/custody,scp-ffi-common/server,scp-ffi-common/testing
          cargo nextest run --no-run -p scp-alloc -p scp-sqlite-pools -p scp-clock -p scp-crypto -p scp-did -p scp-kel -p scp-dht -p scp-identity -p scp-event-log -p scp-protocol -p scp-relay-client -p scp-mls -p scp-client -p scp-client-wasm -p scp-relay-mock -p scp-transport -p scp-mcp -p scp-media -p scp-node -p scp-relay --features serde_json/unbounded_depth,rustix/net,scp-crypto/testing,scp-identity/testing,scp-testing/testing,scp-core/outlet-capability-test-grant,scp-mcp/testing,scp-node/allow_unencrypted_storage,scp-node/testing
      # fail-closed-pre-rotation and rust-test-prose.
      - name: Compile the fail-closed and prose-reading test targets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo nextest run --no-run -p scp-node --lib
          cargo nextest run --no-run -p scp-node --test run_mode_selection
          cargo nextest run --no-run -p scp-identity --lib
          cargo nextest run --no-run -p scp-testing --features openmls_basic_credential/test-utils,serde_json/unbounded_depth,scp-core/outlet-capability-test-grant,tokio/test-util,scp-runtime/outlet-capability-test-grant,scp-runtime/saga-witness-test-mint,scp-platform/filesystem,scp-ffi-common/custody,scp-ffi-common/server,scp-ffi-common/testing --test ffi_conformance --test trust
          cargo nextest run --no-run -p scp-event-log -p scp-protocol --features scp-protocol/testing,serde_json/unbounded_depth --lib
      # rust-test-napi-production, rust-build-pyo3-production,
      # rust-build-uniffi-production and uniffi-cdylib-linux.
      - name: Compile the production-configuration bridges
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          PY_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$PY_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --no-run -p scp-ffi-napi --features server
          cargo test --no-run -p scp-ffi-common
          cargo nextest run --no-run -p scp-ffi-common --features server --test node_start_shipped
          cargo nextest run --no-run -p scp-ffi-napi --features server --lib
          cargo build -p scp-ffi-napi --features server --lib
          cargo build -p scp-ffi --features server
          cargo nextest run --no-run -p scp-ffi --features server --lib
          FEATURES="$(python3 -c 'import tomllib; print(",".join(tomllib.load(open("bindings/python/pyproject.toml", "rb"))["tool"]["maturin"]["features"]))')"
          cargo build -p scp-ffi --lib --features "${FEATURES}"
          cargo build -p scp-ffi-uniffi --features server
          cargo clippy -p scp-ffi-uniffi --all-targets --features server -- -D warnings
          cargo test --no-run -p scp-ffi-uniffi --features server
          cargo nextest run --no-run -p scp-ffi-uniffi --features server --lib
          cargo build -p scp-ffi-uniffi --features testing
          ./scripts/generate-uniffi-kotlin.sh --skip-build --features=testing
      # rust-doctest: `cargo test --doc` has no `--no-run`.
      - name: Run rust-doctest's doc tests
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          PY_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$PY_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --doc --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/outlet-capability-test-grant,scp-node/cloud-blobs,scp-relay/cloud-blobs

  workspace-check:
    name: Warm workspace-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      # rust-clippy's `workspace` leg and rust-doc.
      - name: Compile the workspace in check mode and document it
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          PY_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$PY_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo clippy --workspace --all-targets --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/testing,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/testing,scp-ffi-uniffi/outlet-capability-test-grant -- -D warnings
          cargo doc --workspace --no-deps --document-private-items --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/outlet-capability-test-grant,scp-node/cloud-blobs,scp-relay/cloud-blobs

  clippy-packages:
    name: Warm clippy-packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: clippy-packages
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      # rust-clippy's six `packages-*` legs.
      - name: Compile every package feature set in check mode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          PY_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$PY_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo clippy -p scp-transport --features quic,http3,udp,coap,nostr,webrtc,push-store --all-targets -- -D warnings
          cargo clippy -p scp-transport --features quic,http3,udp,push-store,testing --all-targets -- -D warnings
          cargo clippy -p scp-node --features quic,http3,udp,coap,upnp,testing --all-targets -- -D warnings
          cargo clippy -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing --all-targets -- -D warnings
          cargo clippy -p scp-testing --features sync,combined --all-targets -- -D warnings
          cargo clippy -p scp-transport --features sqlite-blob,redb-blob,postgres-blob,s3-blob,startup --all-targets -- -D warnings
          cargo clippy -p scp-transport --features sqlite-blob,redb-blob,postgres-blob,s3-blob,startup,webpush --all-targets -- -D warnings
          cargo clippy -p scp-transport --features push-store --all-targets -- -D warnings
          cargo clippy -p scp-transport --features push-store,testing --all-targets -- -D warnings
          cargo clippy -p scp-transport --features combined,local-cache,push-store,relay-persistence,testing,upnp --all-targets -- -D warnings
          cargo clippy -p scp-node --features cloud-blobs,testing --all-targets -- -D warnings
          cargo clippy -p scp-relay --features cloud-blobs --all-targets -- -D warnings
          cargo clippy -p scp-node --no-default-features --lib -- -D warnings
          cargo clippy -p scp-node --no-default-features --features testing --all-targets -- -D warnings

  workspace-ci-bridge:
    name: Warm workspace-ci-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: workspace-ci-bridge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      # pyo3-module and napi-addon.
      - name: Build the PyO3 module and the NAPI addon under the ci-bridge profile
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          cargo build -p scp-ffi-napi --profile ci-bridge --features scp-ffi-napi/testing
          cd bindings/python
          maturin develop --profile ci-bridge --features testing

  wasm32:
    name: Warm wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # typescript-wasm-check and scaffold-typescript-web-check.
      - name: Build the wasm package
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: bindings/typescript-wasm
        run: |
          bun install
          bun run build
      # wasm-protocol, and wasm-test, whose `wasm-pack test` has no `--no-run`.
      - name: Check the wasm32 protocol crates and run the wasm tests
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo check -p scp-alloc -p scp-clock -p scp-crypto -p scp-did -p scp-kel -p scp-protocol -p scp-relay-client -p scp-mls -p scp-client -p scp-event-log -p scp-client-wasm --target wasm32-unknown-unknown
          cargo check -p scp-kel --tests --target wasm32-unknown-unknown
          wasm-pack test --node crates/scp-client-wasm

  transport-optional-transport:
    name: Warm transport-optional-transport
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: transport-optional-transport
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest
      # rust-test-optional-features's four `transport-*` legs.
      - name: Compile every scp-transport feature set the transport legs test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo test --no-run -p scp-transport --features combined,local-cache
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc,push-store
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc,push-store --test nostr_roundtrip
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc,push-store --test webrtc_roundtrip
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc,push-store --lib
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,push-store,testing --lib
          cargo nextest run --no-run -p scp-transport --features push-store,testing --lib --tests
          cargo nextest run --no-run -p scp-transport --features push-store --lib --tests
          cargo nextest run --no-run -p scp-transport --features push-store --lib
          cargo nextest run --no-run -p scp-transport --features sqlite-blob,redb-blob,postgres-blob,s3-blob,startup --lib
          cargo nextest run --no-run -p scp-transport --features sqlite-blob,redb-blob,postgres-blob,s3-blob,startup --test postgres_blob_fail_closed --test s3_blob_fail_closed

  apple-transport-platform:
    name: Warm apple-transport-platform
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: apple-transport-platform
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@nextest
      # rust-test-macos's three legs.
      - name: Compile every scp-transport and scp-platform feature set the macOS legs test
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo test --no-run -p scp-transport --features combined,local-cache
          cargo nextest run --no-run -p scp-transport --features sqlite-blob,redb-blob,startup
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --test nostr_roundtrip
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --test webrtc_roundtrip
          cargo nextest run --no-run -p scp-transport --features quic,http3,udp,coap,nostr,webrtc --lib
          cargo nextest run --no-run -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing --lib
          cargo nextest run --no-run -p scp-platform --features apple,sync,sqlite,filesystem,file,encrypting,testing

  apple-uniffi-ci-bridge:
    name: Warm apple-uniffi-ci-bridge
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-toolchain
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: apple-uniffi-ci-bridge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      # xcframework.
      - name: Build the XCFramework under the ci-bridge profile
        if: steps.cache.outputs.cache-hit != 'true'
        run: bindings/swift/build-xcframework.sh --dev --profile ci-bridge

  apple-parity-ci-bridge:
    name: Warm apple-parity-ci-bridge
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/rust-toolchain
      - id: cache
        uses: ./.github/actions/rust-cache
        with:
          shared-key: apple-parity-ci-bridge
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-fetch
      # pyo3-module-macos.
      - name: Build the PyO3 module under the ci-bridge profile
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          cd bindings/python
          maturin develop --profile ci-bridge --features testing
