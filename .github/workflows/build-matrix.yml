# Build matrix for SCP release artifacts
#
# Triggered by tag pushes (scp-*@*) or by the release workflow (workflow_call).
# Builds platform-specific artifacts for all SDK targets and uploads them as
# GitHub Actions artifacts for downstream signing and publishing.
#
# Source: .docs/scaffold/shared.md section "Build matrix"
# Story: SCP-136

name: Build Matrix

on:
  push:
    tags:
      - "scp-*@*"
  workflow_call:
    inputs:
      scp-core-version:
        description: "scp-core version (source of truth for all SDK versions)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  # Resolved from tag or workflow_call input
  SCP_CORE_VERSION: ${{ inputs.scp-core-version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Rust crates — build and test on all platforms
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Every crate Cargo.lock names, downloaded once with retries; every later cargo
      # command in this job runs with CARGO_NET_OFFLINE=true. fetch.sh states why.
      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      # Every cargo step below compiles scp-ffi, whose pyo3-ffi build script reads the
      # interpreter PYO3_PYTHON names and fails when its version is newer than the
      # newest one pyo3 supports. Without the pin it reads the runner image's default
      # Python, which moves with the image.
      - name: Setup Python 3.12
        id: python
        uses: ./.github/actions/toolcache-setup
        with:
          tool: python
          version: "3.12"

      - name: Point PyO3 at Python 3.12
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # Compile coverage for this target across `default-members`. Its outputs
      # are not uploaded: a later `cargo test` step rewrites them.
      - name: Build all crates
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      # The feature list is the one job rust-clippy's `workspace` leg in ci.yml lints
      # every pull request with, under `-- -D warnings`. With the same list, a
      # `#[cfg(feature = ...)]` test or helper is live here exactly when it is live
      # there, so a helper whose only callers are feature-gated cannot pass every
      # pull request and then fail `dead_code` here, at tag time. Check
      # `release-test-features` in scripts/tests/ci-gate/ci_gate_selftest.py fails
      # when the two lists differ.
      - name: Run tests (native targets only)
        if: >-
          matrix.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: cargo test --workspace --release --target ${{ matrix.target }} --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint,scp-ffi/testing,scp-ffi/outlet-capability-test-grant,scp-ffi-napi/testing,scp-ffi-napi/outlet-capability-test-grant,scp-ffi-uniffi/testing,scp-ffi-uniffi/outlet-capability-test-grant

      # Builds every uploaded binary, one package per invocation, into a target
      # directory no other step writes.
      #
      # Two hazards make both properties load-bearing. Resolver 2 unifies
      # normal-dependency features per invocation, so building several packages
      # at once resolves a union rather than each package's own set — and
      # `scripts/check-shipped-feature-graph.sh` gates each package's own set.
      # A `cargo test` step rebuilds these same cdylib targets under its test
      # feature flags and overwrites them in `target/`, so an upload reading
      # `target/` would ship whatever ran last rather than a release build.
      # `.github/workflows/release.yml` Authenticode-signs every DLL in this
      # artifact, so a signature would otherwise cover a test-featured binary.
      #
      # `shell: bash` is load-bearing on runner windows-latest, where GitHub
      # runs a `run:` script under PowerShell unless a step names a shell.
      # PowerShell parses neither `for pkg in …; do` nor `done`, so this step
      # failed before its first `cargo build`, job rust for target
      # x86_64-pc-windows-msvc uploaded no artifact, and job sign-windows in
      # .github/workflows/release.yml found no DLL to Authenticode-sign.
      - name: Build shipped bridge artifacts (one package per invocation)
        shell: bash
        run: |
          for pkg in scp-core scp-ffi scp-ffi-napi scp-ffi-uniffi; do
            cargo build --release --target ${{ matrix.target }} \
              -p "$pkg" --target-dir target-shipped
          done

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-${{ matrix.target }}
          path: |
            target-shipped/${{ matrix.target }}/release/libscp_core*
            target-shipped/${{ matrix.target }}/release/scp_core*
            target-shipped/${{ matrix.target }}/release/libscp_ffi*
            target-shipped/${{ matrix.target }}/release/scp_ffi*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Python wheels — maturin-built manylinux_2_28 / macOS / Windows wheels
  #
  # The 0.1.0b3 publish was the first run that reached this job. The settings
  # below, and the reason for each:
  #   - maturin in CI finds no python by itself, so every leg names its
  #     interpreters (`-i`). Without abi3 a wheel serves one CPython minor, so
  #     each leg builds one wheel per CPython minor that the classifiers in
  #     bindings/python/pyproject.toml name, 3.10-3.13; a platform with no
  #     wheel falls back to the sdist. The sdist builds with the same
  #     `vendored-openssl` feature, so installing it on Linux or Windows
  #     compiles OpenSSL; bindings/python/README.md §Requirements lists what
  #     that build needs.
  #   - `vendored-openssl` compiles OpenSSL into SQLCipher on the Linux and
  #     Windows legs only. On the universal2 leg it activates nothing, and
  #     SQLCipher keeps CommonCrypto: crates/scp-platform/Cargo.toml declares
  #     the edge the feature sets for non-Apple targets only. Job
  #     rust-build-pyo3-production in ci.yml checks that split with `cargo tree`.
  #   - manylinux 2_28, not 2014: CentOS 7 (EOL) can build neither
  #     ring (glibc >= 2.18, newer gcc) nor vendored OpenSSL.
  #   - The manylinux_2_28 images ship a minimal perl that openssl-src's
  #     Configure rejects -> install the full perl distribution with dnf,
  #     which checks each package's signature (`gpgcheck=1`).
  #   - The Linux legs are job python-wheels-linux, which runs the pypa image
  #     itself; this job builds only on macOS and Windows.
  #   - Windows installs NASM so the vendored OpenSSL keeps its assembly
  #     routines; without NASM openssl-src builds OpenSSL with `no-asm`.
  #   - No --manifest-path arg: bindings/python/pyproject.toml already carries
  #     [tool.maturin] manifest-path.
  #   - Job rust-build-pyo3-production in ci.yml builds the `scp-ffi` library
  #     with the same [tool.maturin] features on every PR that ci.yml's `rust` or
  #     `python` path filter selects, on the Linux x86_64 runner only. The
  #     manylinux_2_28 containers, the universal2 build, and the Windows NASM
  #     build run nowhere but here.
  # ---------------------------------------------------------------------------
  python-wheels:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal2 wheel, as ADR phase-3 and `.docs/standards/python.md`
          # name it: maturin compiles x86_64-apple-darwin and
          # aarch64-apple-darwin and joins the two into one fat binary.
          - target: universal2-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Both legs build on the runner, so each interpreter `-i` names below must
      # exist there. No runner image
      # caches CPython 3.10; pinned-tool installs the package actions/setup-python
      # would download, after checking its digest.
      - name: Install Python 3.10
        uses: ./.github/actions/pinned-tool
        with:
          tool: python3.10

      - name: Setup Python 3.10-3.13
        uses: ./.github/actions/toolcache-setup
        with:
          tool: python
          version: |
            3.10
            3.11
            3.12
            3.13

      - name: Setup NASM (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/pinned-tool
        with:
          tool: nasm

      - name: Install maturin
        uses: ./.github/actions/pinned-tool
        with:
          tool: maturin

      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      # MACOSX_DEPLOYMENT_TARGET sets the macOS floor the universal2 wheel's tag
      # names, `macosx_11_0_universal2` in `.docs/standards/python.md`; 11.0 is the
      # first release that runs on arm64. rustc and the cc crate read it only when
      # they compile for an Apple target, so the Windows leg ignores it.
      # rust-toolchain.toml lists both Apple targets universal2 joins, so the
      # toolchain step already installed them.
      # pwsh, not bash: Git Bash puts its MSYS perl first on PATH, and openssl-src's
      # Configure exits 2 under that perl. Under pwsh, `perl` is the runner image's
      # Strawberry Perl, a native Windows build, as it was under maturin-action.
      - name: Build wheel
        working-directory: bindings/python
        shell: pwsh
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          TARGET: ${{ matrix.target }}
        run: >-
          maturin build --release --out dist --target $env:TARGET
          -i python3.10 python3.11 python3.12 python3.13

      - name: Upload Python wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Python wheels for Linux, built in the pypa manylinux_2_28 image of the
  # runner's own architecture, with every input checked:
  #   - The image is named by digest. Docker checks the manifest and every layer
  #     against it, so a pull that returns anything else fails.
  #   - maturin is the binary pinned-tool installed on the runner after checking
  #     its SHA-256; it is a static musl executable, so it runs in the image.
  #   - Rust is the toolchain rust-toolchain.toml names, which rustup installed
  #     on the runner (checking each component against the SHA-256 the channel
  #     manifest lists) when cargo-fetch first ran cargo. rustup builds its Linux
  #     toolchains against glibc 2.17, so they run in the 2_28 image unchanged.
  #     cargo and rustc run straight from the toolchain's `bin`, with no rustup
  #     in the image to read rust-toolchain.toml or download anything.
  #   - The crates are the ones cargo-fetch downloaded, under the registry it
  #     reports; CARGO_NET_OFFLINE keeps cargo from fetching any other.
  #   - The interpreters are the image's own /opt/python/cp3XX builds.
  # The aarch64 leg runs on an arm64 runner, so neither leg cross-compiles.
  # Every mount but the workspace is read-only, the registry and the git checkouts
  # included: the container's cargo writes its lock and cache bookkeeping under its
  # own /root/.cargo, outside the mounts.
  # ---------------------------------------------------------------------------
  python-wheels-linux:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.31-1@sha256:43f7ce12d79ed98b6dbfa3291d5afe389efd40a7e76de089959ffe99501b6edf
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.31-1@sha256:724b504247662e1cf122590957c857211ec2d16b113ec134f92c570a2d01250f
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install maturin
        uses: ./.github/actions/pinned-tool
        with:
          tool: maturin

      - name: Fetch crates, then take cargo offline
        id: cargo-fetch
        uses: ./.github/actions/cargo-fetch

      # A pull that fails, a digest mismatch among them, is retried three times.
      - name: Pull the manylinux image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          for attempt in 1 2 3 4; do
            if docker pull "$IMAGE"; then exit 0; fi
            echo "pulling $IMAGE failed (attempt $attempt of 4)"
            [ "$attempt" = 4 ] || sleep $((attempt * 10))
          done
          echo "::error::$IMAGE: every pull attempt failed"
          exit 1

      # IN_CONTAINER is the script the image runs; `docker run -e IN_CONTAINER` passes
      # it in, and bash inside the image expands its variables. The container gets
      # every `CARGO_*` variable of the runner but CARGO_HOME (a runner path), the
      # offline switch cargo-fetch wrote to `$GITHUB_ENV` among them, and RUSTFLAGS.
      # It mounts the registry and the git checkouts (openmls is a git dependency)
      # cargo-fetch filled, since an offline cargo downloads neither.
      - name: Build wheel
        env:
          IMAGE: ${{ matrix.image }}
          CARGO_HOME_ON_RUNNER: ${{ steps.cargo-fetch.outputs.cargo-home }}
          IN_CONTAINER: |
            dnf install -y --setopt=gpgcheck=1 perl
            export PATH="/opt/rust/bin:$PATH"
            for minor in 10 11 12 13; do PATH="$PATH:/opt/python/cp3$minor-cp3$minor/bin"; done
            maturin --version
            cargo --version
            maturin build --release --out dist --compatibility manylinux_2_28 \
              -i python3.10 python3.11 python3.12 python3.13
        run: |
          sysroot="$(rustc --print sysroot)"
          maturin="$(command -v maturin)"
          env | command grep -E '^(CARGO_|RUSTFLAGS=)' | command grep -v '^CARGO_HOME=' \
            > "$RUNNER_TEMP/cargo.env"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" \
            -w /io/bindings/python \
            -v "$sysroot:/opt/rust:ro" \
            -v "$maturin:/usr/local/bin/maturin:ro" \
            -v "$CARGO_HOME_ON_RUNNER/registry:/root/.cargo/registry:ro" \
            -v "$CARGO_HOME_ON_RUNNER/git:/root/.cargo/git:ro" \
            --env-file "$RUNNER_TEMP/cargo.env" \
            -e IN_CONTAINER \
            "$IMAGE" \
            bash -euo pipefail -c "$IN_CONTAINER"

      - name: Upload Python wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Every crate Cargo.lock names, downloaded once with retries; every later cargo
      # command in this job runs with CARGO_NET_OFFLINE=true. fetch.sh states why.
      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      - name: Install maturin
        uses: ./.github/actions/pinned-tool
        with:
          tool: maturin

      # No --manifest-path: pyproject.toml carries [tool.maturin] manifest-path.
      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # TypeScript (Node/Bun) — napi-rs native addon for @limn-works/scp-ts-napi-*
  # One artifact per platform; release workflow publishes each as a separate
  # optional dependency package consumed by @limn-works/scp-ts.
  # ---------------------------------------------------------------------------
  typescript-napi:
    name: TypeScript NAPI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            npm-platform: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            npm-platform: linux-arm64-gnu
          - target: x86_64-apple-darwin
            runner: macos-latest
            npm-platform: darwin-x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            npm-platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            npm-platform: win32-x64-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Every crate Cargo.lock names, downloaded once with retries; every later cargo
      # command in this job runs with CARGO_NET_OFFLINE=true. fetch.sh states why.
      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build NAPI addon
        shell: bash
        run: cargo build -p scp-ffi-napi --release --target ${{ matrix.target }}

      - name: Stage index.node (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p napi-out
          LIB=$(find "target/${{ matrix.target }}/release" -maxdepth 1 \( -name "libscp_ffi_napi.dylib" -o -name "libscp_ffi_napi.so" \) | head -1)
          [ -z "$LIB" ] && { echo "::error::cdylib not found"; exit 1; }
          cp "$LIB" napi-out/index.node

      - name: Stage index.node (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force napi-out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/scp_ffi_napi.dll" napi-out/index.node

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: napi-${{ matrix.target }}
          path: napi-out/index.node
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Swift — XCFramework (macOS universal2 + iOS arm64 + iOS Simulator)
  # ---------------------------------------------------------------------------
  swift-xcframework:
    name: Swift XCFramework
    # Pinned: Package.swift requires swift-tools-version 6.2, which the macOS 26 image ships
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Every crate Cargo.lock names, downloaded once with retries; every later cargo
      # command in this job runs with CARGO_NET_OFFLINE=true. fetch.sh states why.
      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      - name: Build for macOS (x86_64)
        run: cargo build --release --target x86_64-apple-darwin -p scp-ffi-uniffi

      - name: Build for macOS (aarch64)
        run: cargo build --release --target aarch64-apple-darwin -p scp-ffi-uniffi

      - name: Build for iOS (arm64)
        run: cargo build --release --target aarch64-apple-ios -p scp-ffi-uniffi

      - name: Build for iOS Simulator (arm64)
        run: cargo build --release --target aarch64-apple-ios-sim -p scp-ffi-uniffi

      - name: Build for iOS Simulator (x86_64)
        run: cargo build --release --target x86_64-apple-ios -p scp-ffi-uniffi

      - name: Create universal macOS binary
        run: |
          mkdir -p target/universal-macos/release
          lipo -create \
            target/x86_64-apple-darwin/release/libscp_ffi_uniffi.a \
            target/aarch64-apple-darwin/release/libscp_ffi_uniffi.a \
            -output target/universal-macos/release/libscp_ffi_uniffi.a

      - name: Create universal iOS Simulator binary
        run: |
          mkdir -p target/universal-ios-sim/release
          lipo -create \
            target/aarch64-apple-ios-sim/release/libscp_ffi_uniffi.a \
            target/x86_64-apple-ios/release/libscp_ffi_uniffi.a \
            -output target/universal-ios-sim/release/libscp_ffi_uniffi.a

      # `--release --target aarch64-apple-darwin` names the directory the "Build for
      # macOS (aarch64)" step above already filled, so this command compiles the bindgen
      # binary alone and reuses that step's ~650 dependencies. Without both flags cargo
      # compiles the same crate graph a second time, under the dev profile, into
      # `target/debug` — six minutes on this runner, measured on run 34724307976 of the
      # same shape in ci.yml. `cargo run` executes what it builds, and this runner is
      # arm64, so the triple it names is the host's. The library it reads is the one that
      # step built, so the bindings match the dylib the XCFramework ships.
      # `scripts/check-workflow-compile-steps.py` holds every uniffi-bindgen step to this.
      - name: Generate UniFFI Swift bindings
        run: |
          cargo run --release --target aarch64-apple-darwin -p scp-ffi-uniffi --bin uniffi-bindgen -- generate \
            --library target/aarch64-apple-darwin/release/libscp_ffi_uniffi.dylib \
            --language swift \
            --out-dir bindings/swift/Sources/SCP

      - name: Create module map
        run: |
          mkdir -p bindings/swift/ScpFFI.xcframework/Headers
          cat > bindings/swift/ScpFFI.xcframework/Headers/module.modulemap <<'MODULEMAP'
          framework module ScpFFI {
            header "scpFFI.h"
            export *
          }
          MODULEMAP

      - name: Build XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library target/universal-macos/release/libscp_ffi_uniffi.a \
            -headers bindings/swift/ScpFFI.xcframework/Headers \
            -library target/aarch64-apple-ios/release/libscp_ffi_uniffi.a \
            -headers bindings/swift/ScpFFI.xcframework/Headers \
            -library target/universal-ios-sim/release/libscp_ffi_uniffi.a \
            -headers bindings/swift/ScpFFI.xcframework/Headers \
            -output bindings/swift/ScpFFI.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swift-xcframework
          path: bindings/swift/ScpFFI.xcframework/
          retention-days: 7

      - name: Generate Swift DocC
        working-directory: bindings/swift
        run: swift package generate-documentation --target SCP --output-path docs

      - name: Upload Swift docs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-swift
          path: bindings/swift/docs/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Kotlin — Android AAR with bundled .so (UniFFI)
  # ---------------------------------------------------------------------------
  kotlin-aar:
    name: Kotlin AAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # gradlew runs the wrapper jar committed under bindings/kotlin/gradle/wrapper;
      # this job has no setup-gradle, whose `validate-wrappers` does the same check.
      - name: Validate the Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Setup Java
        uses: ./.github/actions/toolcache-setup
        with:
          tool: java
          version: "17"

      # A package the runner image already holds at its pinned revision is kept from the
      # image; every other package is downloaded and checked against a pinned SHA-256
      # before it is unpacked. .github/actions/android-sdk/install.py states why. The AAR build
      # compiles against android-35.
      - name: Install the Android NDK and platform
        uses: ./.github/actions/android-sdk
        with:
          packages: ndk;27.3.13750724 platforms;android-35

      # cc-rs, which ring's build script and the vendored OpenSSL compile C through,
      # otherwise looks for unversioned `aarch64-linux-android-clang` and
      # `aarch64-linux-android-ranlib` tools that NDK 27 does not ship, so each triple's
      # C compiler, archiver and ranlib are named beside its linker. The Android job in
      # ci.yml names the same four tools for x86_64.
      - name: Set NDK environment
        run: |
          ndk_bin="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724"
            for pair in aarch64-linux-android:aarch64-linux-android21 \
                armv7-linux-androideabi:armv7a-linux-androideabi21 \
                x86_64-linux-android:x86_64-linux-android21 \
                i686-linux-android:i686-linux-android21; do
              triple="${pair%%:*}"
              clang="$ndk_bin/${pair#*:}-clang"
              upper="$(echo "$triple" | tr 'a-z-' 'A-Z_')"
              lower="${triple//-/_}"
              echo "CARGO_TARGET_${upper}_LINKER=$clang"
              echo "CC_${lower}=$clang"
              echo "AR_${lower}=$ndk_bin/llvm-ar"
              echo "RANLIB_${lower}=$ndk_bin/llvm-ranlib"
            done
          } >> "$GITHUB_ENV"

      # Every crate Cargo.lock names, downloaded once with retries; every later cargo
      # command in this job runs with CARGO_NET_OFFLINE=true. fetch.sh states why.
      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      - name: Build for Android targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            cargo build --release --target "$target" -p scp-ffi-uniffi
          done

      # uniffi-bindgen reads the UniFFI metadata symbols out of a library and never loads
      # it, so it generates from the x86_64 Android cdylib the step above built, and the
      # bindings describe a library this AAR ships. scripts/uniffi-bindgen.sh builds the
      # tool from tools/uniffi-bindgen, which compiles the `uniffi` crate alone; the
      # `[[bin]]` in scp-ffi-uniffi this step ran before compiled that crate's whole graph
      # a second time, for the host. The tool exits 0 and writes nothing for a library
      # whose `.symtab` was stripped, so the script fails unless it wrote a non-empty
      # `uniffi/scp/scp.kt` under the out-dir.
      - name: Generate Kotlin bindings
        run: |
          ./scripts/uniffi-bindgen.sh generate \
            --library target/x86_64-linux-android/release/libscp_ffi_uniffi.so \
            --language kotlin \
            --out-dir bindings/kotlin/src/main/kotlin

      - name: Stage native libraries for AAR
        run: |
          JNILIBS=bindings/kotlin/scp-kt-android/src/main/jniLibs
          mkdir -p "$JNILIBS/arm64-v8a" "$JNILIBS/armeabi-v7a" "$JNILIBS/x86_64" "$JNILIBS/x86"
          cp target/aarch64-linux-android/release/libscp_ffi_uniffi.so "$JNILIBS/arm64-v8a/"
          cp target/armv7-linux-androideabi/release/libscp_ffi_uniffi.so "$JNILIBS/armeabi-v7a/"
          cp target/x86_64-linux-android/release/libscp_ffi_uniffi.so "$JNILIBS/x86_64/"
          cp target/i686-linux-android/release/libscp_ffi_uniffi.so "$JNILIBS/x86/"

      - name: Build Android AAR
        working-directory: bindings/kotlin
        run: ./gradlew :scp-kt-android:assembleRelease

      - name: Build Kotlin JVM JAR
        working-directory: bindings/kotlin
        run: ./gradlew :scp-kt:jar

      - name: Upload Kotlin AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kotlin-aar
          path: |
            bindings/kotlin/scp-kt-android/build/outputs/aar/*-release.aar
            bindings/kotlin/scp-kt/build/libs/*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # C ABI — cbindgen shared library for Go, C#, Java JNA consumers
  # ---------------------------------------------------------------------------
  cbindgen:
    name: C ABI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            lib-ext: so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            lib-ext: so
          - target: x86_64-apple-darwin
            runner: macos-latest
            lib-ext: dylib
          - target: aarch64-apple-darwin
            runner: macos-latest
            lib-ext: dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            lib-ext: dll
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Every crate Cargo.lock names, downloaded once with retries; every later cargo
      # command in this job runs with CARGO_NET_OFFLINE=true. fetch.sh states why.
      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # cbindgen crate will be added in a future story; for now build the
      # cdylib from scp-ffi-uniffi which already produces a C-compatible .so
      - name: Build cdylib
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p scp-ffi-uniffi

      - name: Upload C ABI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbindgen-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/*scp_ffi_uniffi*.${{ matrix.lib-ext }}
            target/${{ matrix.target }}/release/*scp_ffi_uniffi*.a
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Aggregate — collect all artifacts into a single summary
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - rust
      - python-wheels
      - python-wheels-linux
      - python-sdist
      - typescript-napi
      - swift-xcframework
      - kotlin-aar
      - cbindgen
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts/

      - name: List artifacts
        run: find release-artifacts/ -type f | sort

      - name: Upload combined release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scp-release-bundle
          path: release-artifacts/
          retention-days: 14
