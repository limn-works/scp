# Build matrix for SCP release artifacts
#
# Triggered by tag pushes (scp-*@*) or by the release workflow (workflow_call).
# Builds platform-specific artifacts for all SDK targets and uploads them as
# GitHub Actions artifacts for downstream signing and publishing.
#
# Source: .docs/scaffold/shared.md section "Build matrix"
# Story: SCP-136

name: Build Matrix

on:
  push:
    tags:
      - "scp-*@*"
  workflow_call:
    inputs:
      scp-core-version:
        description: "scp-core version (source of truth for all SDK versions)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  # Resolved from tag or workflow_call input
  SCP_CORE_VERSION: ${{ inputs.scp-core-version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # Rust crates — build and test on all platforms
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ matrix.target }}-

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build all crates
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests (native targets only)
        if: >-
          matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --release --target ${{ matrix.target }} --features scp-core/testing,scp-runtime/saga-witness-test-mint

      - name: Upload Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/libscp_core*
            target/${{ matrix.target }}/release/scp_core*
            target/${{ matrix.target }}/release/libscp_ffi*
            target/${{ matrix.target }}/release/scp_ffi*
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Python wheels — maturin-built manylinux2014 / macOS / Windows wheels
  # ---------------------------------------------------------------------------
  python-wheels:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: manylinux2014
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: manylinux2014
          - target: x86_64-apple-darwin
            runner: macos-latest
            manylinux: auto
          - target: aarch64-apple-darwin
            runner: macos-latest
            manylinux: auto
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --out dist
            --manifest-path crates/scp-ffi/Cargo.toml
          working-directory: bindings/python

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  python-sdist:
    name: Python sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out dist
            --manifest-path crates/scp-ffi/Cargo.toml
          working-directory: bindings/python

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------------
  # TypeScript (Node/Bun) — napi-rs native addon for @limn-works/scp-ts-napi-*
  # One artifact per platform; release workflow publishes each as a separate
  # optional dependency package consumed by @limn-works/scp-ts.
  # ---------------------------------------------------------------------------
  typescript-napi:
    name: TypeScript NAPI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            npm-platform: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            npm-platform: linux-arm64-gnu
          - target: x86_64-apple-darwin
            runner: macos-latest
            npm-platform: darwin-x64
          - target: aarch64-apple-darwin
            runner: macos-latest
            npm-platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            npm-platform: win32-x64-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: napi-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: napi-${{ matrix.target }}-

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build NAPI addon
        run: cargo build -p scp-ffi-napi --release --target ${{ matrix.target }}

      - name: Stage index.node (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p napi-out
          LIB=$(find "target/${{ matrix.target }}/release" -maxdepth 1 \( -name "libscp_ffi_napi.dylib" -o -name "libscp_ffi_napi.so" \) | head -1)
          [ -z "$LIB" ] && { echo "::error::cdylib not found"; exit 1; }
          cp "$LIB" napi-out/index.node

      - name: Stage index.node (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force napi-out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/scp_ffi_napi.dll" napi-out/index.node

      - name: Upload NAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: napi-out/index.node
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Swift — XCFramework (macOS universal2 + iOS arm64 + iOS Simulator)
  # ---------------------------------------------------------------------------
  swift-xcframework:
    name: Swift XCFramework
    # Pinned: Package.swift requires swift-tools-version 6.2; macos-latest (macOS 15) only ships 6.1
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-darwin,
            x86_64-apple-darwin,
            aarch64-apple-ios,
            x86_64-apple-ios,
            aarch64-apple-ios-sim

      # Delegate to the canonical builder (single source of truth). It builds all
      # five Apple targets, lipos the macOS + iOS-simulator fat libraries,
      # generates the UniFFI bindings into the single committed file
      # Sources/SCP/Internal/ScpBindings.swift (no duplicate scp_ffi_uniffi.swift at
      # the target root), writes ScpFFI.h + module.modulemap into the XCFramework's
      # Headers, and packages ScpFFI.xcframework. Production mode → no
      # allow_in_memory_custody / testing features. Reimplementing these steps
      # inline previously diverged (duplicate bindings, wrong header name).
      - name: Build XCFramework
        working-directory: bindings/swift
        run: ./build-xcframework.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: swift-xcframework
          path: bindings/swift/ScpFFI.xcframework/
          retention-days: 7

      # Swift sources post-generation: hand-written wrapper + the UniFFI bindings
      # just regenerated for this exact release commit (so they match the binary
      # in the XCFramework). Consumed by release.yml's publish-spm job to populate
      # the limn-works/scp-swift mirror, which strips everything but *.swift.
      - name: Upload Swift sources
        uses: actions/upload-artifact@v4
        with:
          name: swift-sources
          path: bindings/swift/Sources/
          retention-days: 7

      - name: Generate Swift DocC
        working-directory: bindings/swift
        run: swift package generate-documentation --target SCP --output-path docs

      - name: Upload Swift docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-swift
          path: bindings/swift/docs/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Kotlin — Android AAR with bundled .so (UniFFI)
  # ---------------------------------------------------------------------------
  kotlin-aar:
    name: Kotlin AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang" >> $GITHUB_ENV
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang" >> $GITHUB_ENV

      - name: Build for Android targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android; do
            cargo build --release --target "$target" -p scp-ffi-uniffi
          done

      - name: Stage native libraries for AAR
        run: |
          JNILIBS=bindings/kotlin/scp-kt-android/src/main/jniLibs
          mkdir -p "$JNILIBS/arm64-v8a" "$JNILIBS/armeabi-v7a" "$JNILIBS/x86_64" "$JNILIBS/x86"
          cp target/aarch64-linux-android/release/libscp_ffi_uniffi.so "$JNILIBS/arm64-v8a/"
          cp target/armv7-linux-androideabi/release/libscp_ffi_uniffi.so "$JNILIBS/armeabi-v7a/"
          cp target/x86_64-linux-android/release/libscp_ffi_uniffi.so "$JNILIBS/x86_64/"
          cp target/i686-linux-android/release/libscp_ffi_uniffi.so "$JNILIBS/x86/"

      # Generate the UniFFI Kotlin bindings via the canonical Gradle task, which
      # host-builds the cdylib and writes to the correct scp-kt module path.
      # release.yml's publish-maven downloads these (kotlin-bindings) and runs
      # `-x generateUniffiBindings`, so the credential-bearing publish step never
      # invokes cargo (no dependency build script ever sees the signing key).
      - name: Generate Kotlin bindings
        working-directory: bindings/kotlin
        run: ./gradlew :scp-kt:generateUniffiBindings

      # The cross-compiled UniFFI jniLibs (one .so per Android ABI). publish-maven
      # downloads + re-stages these so Gradle assembles the published AAR with
      # native libraries present — without a second NDK cross-compile in the
      # publish job (which would also have to track the ABI list above).
      - name: Upload Android jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-jnilibs
          path: bindings/kotlin/scp-kt-android/src/main/jniLibs/
          retention-days: 7

      - name: Upload Kotlin bindings
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-bindings
          path: bindings/kotlin/scp-kt/src/main/kotlin/works/limn/scp/internal/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # C ABI — cbindgen shared library for Go, C#, Java JNA consumers
  # ---------------------------------------------------------------------------
  cbindgen:
    name: C ABI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            lib-ext: so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            lib-ext: so
          - target: x86_64-apple-darwin
            runner: macos-latest
            lib-ext: dylib
          - target: aarch64-apple-darwin
            runner: macos-latest
            lib-ext: dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            lib-ext: dll
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # cbindgen crate will be added in a future story; for now build the
      # cdylib from scp-ffi-uniffi which already produces a C-compatible .so
      - name: Build cdylib
        run: cargo build --release --target ${{ matrix.target }} -p scp-ffi-uniffi

      - name: Upload C ABI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cbindgen-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/*scp_ffi_uniffi*.${{ matrix.lib-ext }}
            target/${{ matrix.target }}/release/*scp_ffi_uniffi*.a
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Aggregate — collect all artifacts into a single summary
  # ---------------------------------------------------------------------------
  aggregate:
    name: Aggregate artifacts
    runs-on: ubuntu-latest
    needs:
      - rust
      - python-wheels
      - python-sdist
      - typescript-napi
      - swift-xcframework
      - kotlin-aar
      - cbindgen
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List artifacts
        run: find release-artifacts/ -type f | sort

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: scp-release-bundle
          path: release-artifacts/
          retention-days: 14
