# TEMPORARY: exercises, on a pull request, the jobs a release or a schedule runs and
# this branch changed: every build-matrix.yml job (the macOS and Windows wheels and the
# sdist without maturin-action, the Linux wheels with read-only mounts, kotlin-aar), and
# the cargo-fuzz and cargo-llvm-lines installs from pinned sources. build-matrix.yml
# builds and uploads artifacts only. No step pushes, publishes, or tags. Removed in the
# commit after its run passes.

name: Temporary fix-round check

on:
  pull_request:

permissions:
  contents: read

# The rust-toolchain action refuses to run without it, as ci.yml sets it.
env:
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  build-matrix:
    uses: ./.github/workflows/build-matrix.yml
    with:
      scp-core-version: 0.0.0-check

  fuzz-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: read
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            fuzz/rust-toolchain.toml | head -n 1)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  cargo-fuzz-install:
    needs: fuzz-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ needs.fuzz-toolchain.outputs.channel }}
      - name: Download the cargo-fuzz source
        id: cargo-fuzz
        uses: ./.github/actions/pinned-tool
        with:
          tool: cargo-fuzz
      - name: Install cargo-fuzz
        env:
          CRATE: ${{ steps.cargo-fuzz.outputs.path }}
        run: cargo +${{ needs.fuzz-toolchain.outputs.channel }} install --locked --path "$CRATE"
      - run: cargo +${{ needs.fuzz-toolchain.outputs.channel }} fuzz --version

  cargo-llvm-lines-install:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-toolchain
      - name: Download the cargo-llvm-lines source
        id: cargo-llvm-lines
        uses: ./.github/actions/pinned-tool
        with:
          tool: cargo-llvm-lines
      - name: Install cargo-llvm-lines
        env:
          CRATE: ${{ steps.cargo-llvm-lines.outputs.path }}
        run: cargo install --locked --path "$CRATE"
      - run: cargo llvm-lines --version
