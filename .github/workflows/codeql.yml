name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  security-events: write
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The toolchain step below refuses to run without it: with rustup's auto-install on,
    # a cargo command outside that step's override would download 1.98.0 with every
    # component and target rust-toolchain.toml lists, in one attempt.
    env:
      RUSTUP_AUTO_INSTALL: "0"

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Rust extractor runs `cargo metadata` and the workspace's build scripts while
      # it loads the manifests, and cargo downloads the index and every crate on demand
      # there, with three retries. These two steps download them first in one step that
      # retries for minutes and then take cargo offline, as every Rust job in ci.yml does.
      # They run on every leg, because a step skipped on the other legs would leave the
      # Rust leg's analysis step, which every leg shares, with no step that proves it ran
      # after a fetch; the other legs run in parallel with the longer Rust leg, so the
      # run's wall time does not grow. Check `offline-cargo` of
      # scripts/tests/ci-gate/ci_gate_selftest.py holds this job to that order.
      - name: Install the pinned toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Fetch crates, then take cargo offline
        uses: ./.github/actions/cargo-fetch

      # The Rust extractor runs scp-ffi's pyo3-ffi build script, which reads the
      # interpreter PYO3_PYTHON names and fails when its version is newer than the newest
      # one pyo3 supports. Without the pin it reads the runner image's default `python3`,
      # which moves with the image. Every leg runs it for the reason the fetch steps above
      # run on every leg.
      - name: Setup Python 3.12
        id: python
        uses: ./.github/actions/toolcache-setup
        with:
          tool: python
          version: "3.12"

      - name: Point PyO3 at Python 3.12
        run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
