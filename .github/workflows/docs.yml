# SDK API Reference Documentation
#
# Generates and publishes API reference docs for all language SDKs
# on every release tag. Also runs on PRs for validation.
#
# When a change doesn't touch doc-relevant paths (see the `docs:` filter in the
# `changes` job), all doc jobs skip via an `if` condition rather than failing.
# GitHub counts a skipped job as passing for a required status check, so these
# jobs are safe to promote to required -- that promotion is the standing plan.
#
# Until it happens this whole workflow is ADVISORY: `ci` is the sole required
# status check, so nothing here can block a merge. See the note on the `push`
# trigger below for what that cost us.
#
# Source: .docs/scaffold/shared.md section "SDK Documentation Requirements"
# Story: SCP-139
#
# Doc generators per language:
#   Rust       — rustdoc (cargo doc)
#   Python     — sphinx (autodoc + napoleon)
#   TypeScript — typedoc
#   Swift      — DocC (runs in build-matrix.yml; requires XCFramework binary)
#   Kotlin     — Dokka (./gradlew dokkaHtml)

name: SDK Docs

on:
  push:
    # Also run on `main` so the post-merge tip is doc-tested. NOTE: this run is
    # ADVISORY -- `ci` is the only required status check on the Default ruleset,
    # which is why PR #2274's failing `Rust API docs (rustdoc)` job (run
    # 30878568409, attempt 1, never re-run) did not block its merge and three
    # broken intra-doc links rode `main` for ten days. Making rustdoc a required
    # check is the actual fix; this trigger only shortens time-to-detection.
    branches: [main]
    tags:
      - "scp-core@*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  # Only cancel superseded PR runs. Every `main` push shares one group, and each
  # run is path-filtered on its OWN diff, so cancelling on push lets a later
  # docs-irrelevant merge kill an in-flight run that was validating a
  # doc-breaking tip -- and then skip `rust-docs` itself. Neither run would
  # validate the broken commit, and a cancelled run notifies nobody. The merge
  # queue batches 2-5 entries, so that interleaving is the common case.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft PR, proceeding"

  # Detect whether doc-relevant files changed. When they haven't, all doc
  # jobs skip but still report a "success" status to branch protection.
  changes:
    needs: check-draft
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              # Manifests count: a dependency removal or a feature-flag change
              # readily breaks a cross-crate intra-doc link in `scp-runtime`,
              # the crate that denies `rustdoc::broken_intra_doc_links`.
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'
              - 'bindings/**'
              - 'crates/scp-core/src/**'
              - 'crates/scp-protocol/src/**'
              - 'crates/scp-runtime/src/**'
              - 'crates/scp-ffi/**'
              - 'crates/scp-did/src/**'
              - 'crates/scp-dht/src/**'
              - 'crates/scp-clock/src/**'
              - 'crates/scp-crypto/src/**'
              - 'crates/scp-mls/src/**'
              - 'crates/scp-client/src/**'
              - 'crates/scp-client-wasm/src/**'

  # ---- Rust (rustdoc) ----
  rust-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "Rust API docs (rustdoc)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate rustdoc
        # FFI bridge methods like `scpid_sign` and `identity_*_link_attestation`
        # on `impl Scp` are feature-gated by `testing` so that
        # production builds drop the testing/dev-only custody path entirely.
        # UniFFI's `#[uniffi::export]` macro still tries to wire the method
        # through `Arc<Scp>` when the feature is off, producing rustdoc
        # resolution errors. Enable the feature here to mirror the full
        # runtime surface used by CI/tests.
        run: |
          cargo doc --workspace --no-deps --document-private-items \
            --features scp-ffi-uniffi/testing,scp-ffi/testing,scp-ffi-napi/testing,scp-core/testing,scp-runtime/testing,scp-runtime/saga-witness-test-mint
      - uses: actions/upload-artifact@v4
        with:
          name: docs-rust
          path: target/doc/
          retention-days: 7

  # ---- Python (sphinx) ----
  python-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "Python API docs (sphinx)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doc dependencies
        run: pip install sphinx furo sphinx-autodoc-typehints
      - name: Generate docs
        working-directory: bindings/python
        run: |
          if [ -f docs/conf.py ]; then
            sphinx-build -b html docs docs/_build/html
          else
            echo "::notice::Sphinx conf.py not found -- skipping Python docs"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-python
          path: bindings/python/docs/_build/html/
          retention-days: 7
          if-no-files-found: ignore

  # ---- TypeScript (typedoc) ----
  typescript-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "TypeScript API docs (typedoc)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: bindings/typescript
        run: bun install
      - name: Generate docs
        working-directory: bindings/typescript
        run: bunx typedoc
      - uses: actions/upload-artifact@v4
        with:
          name: docs-typescript
          path: bindings/typescript/docs/
          retention-days: 7
          if-no-files-found: ignore

  # ---- Kotlin (Dokka) ----
  kotlin-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "Kotlin API docs (Dokka)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Dokka
        working-directory: bindings/kotlin
        run: ./gradlew :scp-kt:dokkaHtml
      - uses: actions/upload-artifact@v4
        with:
          name: docs-kotlin
          path: bindings/kotlin/scp-kt/build/dokka/html/
          retention-days: 7
          if-no-files-found: ignore

  # ---- Aggregate and publish ----
  publish-docs:
    name: "Publish API docs"
    needs: [check-draft, rust-docs, python-docs, typescript-docs, kotlin-docs]
    if: startsWith(github.ref, 'refs/tags/scp-core@')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download all doc artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: site/

      - name: Create index page
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>SCP SDK API Reference</title></head>
          <body>
          <h1>SCP SDK API Reference</h1>
          <ul>
            <li><a href="docs-rust/scp_core/">Rust (scp-core)</a></li>
            <li><a href="docs-python/">Python (scp-python)</a></li>
            <li><a href="docs-typescript/">TypeScript (@limn-works/scp-ts)</a></li>
            <li><a href="docs-kotlin/">Kotlin (scp-kt)</a></li>
          </ul>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
