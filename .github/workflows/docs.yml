# SDK API Reference Documentation
#
# Generates and publishes API reference docs for all language SDKs
# on every release tag. Also runs on PRs for validation.
#
# When a PR doesn't touch doc-relevant paths (bindings/, crates/scp-core/src/,
# crates/scp-ffi/), all doc jobs skip via `if` condition. GitHub reports
# skipped jobs as passing for required status checks.
#
# Source: .docs/scaffold/shared.md section "SDK Documentation Requirements"
# Story: SCP-139
#
# Doc generators per language:
#   Rust     — rustdoc (cargo doc)
#   Python   — sphinx (autodoc + napoleon)
#   TypeScript — typedoc
#   Swift    — DocC (runs in build-matrix.yml; requires XCFramework binary)
#   Kotlin   — Dokka (./gradlew dokkaHtml)
#   Go       — godoc / pkgsite
#   C#       — xmldoc (dotnet build /p:GenerateDocumentationFile=true)
#   Java     — javadoc (./gradlew javadoc)

name: SDK Docs

on:
  push:
    tags:
      - "scp-core@*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-draft:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Not a draft PR, proceeding"

  # Detect whether doc-relevant files changed. When they haven't, all doc
  # jobs skip but still report a "success" status to branch protection.
  changes:
    needs: check-draft
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'bindings/**'
              - 'crates/scp-core/src/**'
              - 'crates/scp-ffi/**'

  # ---- Rust (rustdoc) ----
  rust-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "Rust API docs (rustdoc)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate rustdoc
        run: cargo doc --workspace --no-deps --document-private-items
      - uses: actions/upload-artifact@v4
        with:
          name: docs-rust
          path: target/doc/
          retention-days: 7

  # ---- Python (sphinx) ----
  python-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "Python API docs (sphinx)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install doc dependencies
        run: pip install sphinx furo sphinx-autodoc-typehints
      - name: Generate docs
        working-directory: bindings/python
        run: |
          if [ -f docs/conf.py ]; then
            sphinx-build -b html docs docs/_build/html
          else
            echo "::notice::Sphinx conf.py not found -- skipping Python docs"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-python
          path: bindings/python/docs/_build/html/
          retention-days: 7
          if-no-files-found: ignore

  # ---- TypeScript (typedoc) ----
  typescript-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "TypeScript API docs (typedoc)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install typedoc
        working-directory: bindings/typescript
        run: |
          npm install --no-save typedoc typedoc-plugin-markdown typescript
      - name: Generate docs
        working-directory: bindings/typescript
        run: npx typedoc
      - uses: actions/upload-artifact@v4
        with:
          name: docs-typescript
          path: bindings/typescript/docs/
          retention-days: 7
          if-no-files-found: ignore

  # ---- Kotlin (Dokka) ----
  kotlin-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    name: "Kotlin API docs (Dokka)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Dokka
        working-directory: bindings/kotlin
        run: |
          if [ -f build.gradle.kts ] || [ -f gradlew ]; then
            ./gradlew dokkaHtml 2>/dev/null || echo "::notice::Dokka not configured -- skipping"
          else
            echo "::notice::Gradle project not found -- skipping Kotlin docs"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: docs-kotlin
          path: bindings/kotlin/build/dokka/
          retention-days: 7
          if-no-files-found: ignore

  # ---- Aggregate and publish ----
  publish-docs:
    name: "Publish API docs"
    needs: [check-draft, rust-docs, python-docs, typescript-docs, kotlin-docs]
    if: startsWith(github.ref, 'refs/tags/scp-core@')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download all doc artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: site/

      - name: Create index page
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>SCP SDK API Reference</title></head>
          <body>
          <h1>SCP SDK API Reference</h1>
          <ul>
            <li><a href="docs-rust/scp_core/">Rust (scp-core)</a></li>
            <li><a href="docs-python/">Python (scp-sdk)</a></li>
            <li><a href="docs-typescript/">TypeScript (@scp/sdk)</a></li>
            <li><a href="docs-swift/">Swift (SCP)</a></li>
            <li><a href="docs-kotlin/">Kotlin (scp-sdk-kotlin)</a></li>
            <li><a href="docs-java/">Java (scp-sdk-java)</a></li>
          </ul>
          <p>Go docs available at <a href="https://pkg.go.dev/github.com/limn/scp-go">pkg.go.dev</a></p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
