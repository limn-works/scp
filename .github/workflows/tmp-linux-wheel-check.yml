# TEMPORARY: exercises python-wheels-linux on a pull request without a release.
# It builds both Linux wheels exactly as build-matrix.yml does, then installs each
# wheel into a clean venv on a runner of its own architecture and imports it. No
# step pushes, publishes, or tags. Removed in the commit after its run passes.

name: Temporary Linux wheel check

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  python-wheels-linux:
    name: Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.31-1@sha256:43f7ce12d79ed98b6dbfa3291d5afe389efd40a7e76de089959ffe99501b6edf
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.31-1@sha256:724b504247662e1cf122590957c857211ec2d16b113ec134f92c570a2d01250f
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install maturin
        uses: ./.github/actions/pinned-tool
        with:
          tool: maturin

      - name: Fetch crates, then take cargo offline
        id: cargo-fetch
        uses: ./.github/actions/cargo-fetch

      # A pull that fails, a digest mismatch among them, is retried three times.
      - name: Pull the manylinux image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          for attempt in 1 2 3 4; do
            if docker pull "$IMAGE"; then exit 0; fi
            echo "docker pull $IMAGE failed (attempt $attempt of 4)"
            [ "$attempt" = 4 ] || sleep $((attempt * 10))
          done
          echo "::error::$IMAGE: docker pull failed on every attempt"
          exit 1

      # IN_CONTAINER is the script the image runs; `docker run -e IN_CONTAINER` passes
      # it in, and bash inside the image expands its variables. The container gets
      # every `CARGO_*` variable of the runner but CARGO_HOME (a runner path), the
      # offline switch cargo-fetch wrote to `$GITHUB_ENV` among them, and RUSTFLAGS.
      # It mounts the registry and the git checkouts (openmls is a git dependency)
      # cargo-fetch filled, since an offline cargo downloads neither.
      - name: Build wheel
        env:
          IMAGE: ${{ matrix.image }}
          CARGO_HOME_ON_RUNNER: ${{ steps.cargo-fetch.outputs.cargo-home }}
          IN_CONTAINER: |
            dnf install -y --setopt=gpgcheck=1 perl
            export PATH="/opt/rust/bin:$PATH"
            for minor in 10 11 12 13; do PATH="$PATH:/opt/python/cp3$minor-cp3$minor/bin"; done
            maturin --version
            cargo --version
            maturin build --release --out dist --compatibility manylinux_2_28 \
              -i python3.10 python3.11 python3.12 python3.13
        run: |
          sysroot="$(rustc --print sysroot)"
          maturin="$(command -v maturin)"
          env | command grep -E '^(CARGO_|RUSTFLAGS=)' | command grep -v '^CARGO_HOME=' \
            > "$RUNNER_TEMP/cargo.env"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" \
            -w /io/bindings/python \
            -v "$sysroot:/opt/rust:ro" \
            -v "$maturin:/usr/local/bin/maturin:ro" \
            -v "$CARGO_HOME_ON_RUNNER/registry:/root/.cargo/registry" \
            -v "$CARGO_HOME_ON_RUNNER/git:/root/.cargo/git" \
            --env-file "$RUNNER_TEMP/cargo.env" \
            -e IN_CONTAINER \
            "$IMAGE" \
            bash -euo pipefail -c "$IN_CONTAINER"

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          retention-days: 7

  import-wheel:
    name: Import wheel (${{ matrix.target }})
    needs: python-wheels-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: wheels

      - name: Install into a clean venv and import
        run: |
          ls -l wheels
          uname -m
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --find-links wheels scp-python
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -I -c "import scp_sdk, scp_sdk._scp_core as core; print(scp_sdk.__file__); print(core.__file__)"
