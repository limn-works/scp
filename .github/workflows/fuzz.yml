name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly (Tier 1 + Tier 2)
    - cron: "0 0 * * 6"   # 00:00 UTC Saturday (Tier 1 deep-fuzz)
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Seconds per target"
        default: "900"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── The nightly every job below compiles on ────────────────────────────────
  # `fuzz/rust-toolchain.toml` names it, records why it is a dated nightly, and records
  # what unpins it. This job reads the channel out of that file and no other step in this
  # workflow repeats it, so the file and the workflow cannot disagree.
  #
  # Every job reaches the value through `dtolnay/rust-toolchain@master` plus a
  # `toolchain:` input, rather than through the directory override `fuzz/README.md`
  # documents, because these jobs run `cargo fuzz --fuzz-dir fuzz` from the repository
  # root so that their corpus-cache paths and their command paths agree. The action
  # publishes `master`, `stable`, `beta`, `nightly`, and a branch per released version,
  # but no dated-nightly branch, so the `@nightly-<date>` ref these jobs used before
  # never resolved and every scheduled run failed at setup.
  toolchain:
    name: Fuzz / read the pinned nightly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          channel=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            fuzz/rust-toolchain.toml | head -n 1)
          if [ -z "$channel" ]; then
            echo "fuzz/rust-toolchain.toml names no [toolchain] channel" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # ── Nightly: regression + corpus growth ────────────────────────────────────
  # Runs every night at 03:00 UTC. Tier 1 targets get 15 min each; Tier 2 get
  # 5 min each. All targets run in parallel. Corpus is cached per-target and
  # minimized after each run with cargo fuzz cmin.
  fuzz-nightly:
    name: Fuzz / ${{ matrix.target }}
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1 — Wire Format Parsers — 15 min each
          - target: fuzz_outer_envelope
            dict: msgpack_outer_envelope.dict
            max_len: 1048576
            time: 900
          - target: fuzz_inner_envelope
            dict: msgpack_inner_envelope.dict
            max_len: 1048576
            time: 900
          - target: fuzz_client_message
            dict: msgpack_client_message.dict
            max_len: 524288
            time: 900
          - target: fuzz_relay_message
            dict: msgpack_relay_message.dict
            max_len: 524288
            time: 900
          - target: fuzz_sender_key_dist
            dict: msgpack_sender_key.dict
            max_len: 65536
            time: 900
          - target: fuzz_scp_credential
            dict: msgpack_credential.dict
            max_len: 32768
            time: 900
          # Tier 2 — Parsers & Content Trust Boundaries — 5 min each
          - target: fuzz_parse_ucan
            dict: ucan_jwt.dict
            max_len: 32768
            time: 300
          - target: fuzz_scp_uri
            dict: scp_uri.dict
            max_len: 8192
            time: 300
          - target: fuzz_capability_uri
            dict: capability_uri.dict
            max_len: 4096
            time: 300
          - target: fuzz_broadcast_content
            dict: msgpack_broadcast.dict
            max_len: 524288
            time: 300
          - target: fuzz_deserialize_export
            dict: msgpack_export.dict
            max_len: 1048576
            time: 300
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      # `fuzz/rust-toolchain.toml` names this channel and records why it is a dated
      # nightly and what unpins it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}

      - name: Install cargo-fuzz
        run: cargo +${{ needs.toolchain.outputs.channel }} install cargo-fuzz --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          key: fuzz-${{ matrix.target }}

      - name: Restore corpus cache
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-

      # Every `cargo fuzz` command below names its toolchain explicitly. These
      # steps run from the repository root, where `rust-toolchain.toml` names a
      # stable channel, and cargo-fuzz only runs on nightly. An explicit
      # `+toolchain` sets RUSTUP_TOOLCHAIN for the command and everything it
      # spawns, which overrides that file. The same convention already governs
      # the fuzz-crate check in ci.yml.
      - name: Run fuzzer
        run: |
          cargo +${{ needs.toolchain.outputs.channel }} fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            fuzz/corpus/${{ matrix.target }} \
            -- \
            -dict=fuzz/dicts/${{ matrix.dict }} \
            -max_total_time=${{ github.event.inputs.fuzz_time || matrix.time }} \
            -max_len=${{ matrix.max_len }} \
            -rss_limit_mb=2048 \
            -timeout=30 \
            -detect_leaks=0

      - name: Minimize corpus
        if: always()
        run: |
          cargo +${{ needs.toolchain.outputs.channel }} fuzz cmin ${{ matrix.target }} \
            --fuzz-dir fuzz \
            fuzz/corpus/${{ matrix.target }} \
            || true

      - name: Save corpus cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 90

  # ── MLS decrypt-path panic safety (ADR-057 §Prereq-4, #1444) ─────────────
  # Separate job because this target MUST run with `-O` (release,
  # debug-assertions OFF). It validates the SHIPPED RELEASE decrypt path, where
  # openmls's `debug_assert!` ("Ciphertext decryption failed") is compiled out
  # and a tampered ciphertext yields a typed `Err` instead of a panic. The
  # standard Tier matrices run WITHOUT `-O`, so cargo-fuzz injects
  # `-Cdebug-assertions` and that assert would false-crash on every tampered
  # input — which is exactly why this target cannot live in those matrices. No
  # dictionary: the input is raw MLS wire ciphertext and the target
  # self-generates a valid frame to tamper.
  fuzz-mls-decrypt:
    name: Fuzz / fuzz_mls_decrypt (release, debug-assertions off)
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      # `fuzz/rust-toolchain.toml` names this channel and records why it is a dated
      # nightly and what unpins it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}

      - name: Install cargo-fuzz
        run: cargo +${{ needs.toolchain.outputs.channel }} install cargo-fuzz --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          key: fuzz-mls-decrypt

      - name: Restore corpus cache
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/fuzz_mls_decrypt
          key: corpus-fuzz_mls_decrypt-${{ github.run_id }}
          restore-keys: corpus-fuzz_mls_decrypt-

      - name: Run fuzzer (release, debug-assertions off)
        # `-O` is LOAD-BEARING: it builds the release profile with
        # debug-assertions OFF (the shipped path). Dropping it would re-arm
        # openmls's decrypt `debug_assert!` and turn every tampered input into a
        # false crash.
        run: |
          cargo +${{ needs.toolchain.outputs.channel }} fuzz run fuzz_mls_decrypt -O \
            --fuzz-dir fuzz \
            fuzz/corpus/fuzz_mls_decrypt \
            -- \
            -max_total_time=${{ github.event.inputs.fuzz_time || '300' }} \
            -max_len=8192 \
            -rss_limit_mb=2048 \
            -timeout=30 \
            -detect_leaks=0

      - name: Minimize corpus
        if: always()
        run: |
          cargo +${{ needs.toolchain.outputs.channel }} fuzz cmin fuzz_mls_decrypt -O \
            --fuzz-dir fuzz \
            fuzz/corpus/fuzz_mls_decrypt \
            || true

      - name: Save corpus cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/fuzz_mls_decrypt
          key: corpus-fuzz_mls_decrypt-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-fuzz_mls_decrypt-${{ github.run_id }}
          path: fuzz/artifacts/fuzz_mls_decrypt/
          retention-days: 90

  # ── Weekly deep-fuzz: Tier 1 targets, 2 hours each ────────────────────────
  # Runs at 00:00 UTC every Saturday, or on workflow_dispatch. Only Tier 1
  # targets (highest trust-boundary exposure). Longer time budget surfaces
  # deeper code paths. AddressSanitizer is cargo-fuzz's default and is what
  # these jobs run.
  #
  # THIS JOB USED TO SET `RUSTFLAGS: -Zsanitizer=address,undefined`, AND THAT
  # VALUE HAS NEVER BEEN LEGAL. rustc offers no `undefined` sanitizer; run
  # 32634187570 recorded the compiler's own list —
  #   error: incorrect value `address,undefined` for unstable option `sanitizer`
  #   - comma separated list of sanitizers: `address`, `cfi`, `dataflow`,
  #     `hwaddress`, `kcfi`, `kernel-address`, `kernel-hwaddress`, `leak`,
  #     `memory`, `memtag`, `safestack`, `shadow-call-stack`, `thread`, or
  #     'realtime' was expected
  # — and every one of the six matrix jobs died at `cargo fuzz`'s first rustc
  # invocation, before the fuzzer started. No deep-fuzz campaign has ever run.
  # The line's comment also named rmp-serde and OpenMLS as the C code it would
  # instrument, and both are pure Rust.
  fuzz-weekly:
    name: Deep Fuzz / ${{ matrix.target }}
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event.schedule == '0 0 * * 6' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz_outer_envelope
            dict: msgpack_outer_envelope.dict
            max_len: 1048576
          - target: fuzz_inner_envelope
            dict: msgpack_inner_envelope.dict
            max_len: 1048576
          - target: fuzz_client_message
            dict: msgpack_client_message.dict
            max_len: 524288
          - target: fuzz_relay_message
            dict: msgpack_relay_message.dict
            max_len: 524288
          - target: fuzz_sender_key_dist
            dict: msgpack_sender_key.dict
            max_len: 65536
          - target: fuzz_scp_credential
            dict: msgpack_credential.dict
            max_len: 32768
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v5

      # `fuzz/rust-toolchain.toml` names this channel and records why it is a dated
      # nightly and what unpins it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}

      - name: Install cargo-fuzz
        run: cargo +${{ needs.toolchain.outputs.channel }} install cargo-fuzz --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          key: fuzz-weekly-${{ matrix.target }}

      - name: Restore corpus cache
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-

      - name: Run deep fuzzer (2 hours, AddressSanitizer)
        # cargo-fuzz enables AddressSanitizer and its own coverage instrumentation
        # through RUSTFLAGS it assembles itself. This step sets no RUSTFLAGS: a
        # value set here is appended to cargo-fuzz's, and the value this step used
        # to set named a sanitizer rustc does not have. The comment above the job
        # records what the compiler reported.
        run: |
          cargo +${{ needs.toolchain.outputs.channel }} fuzz run ${{ matrix.target }} \
            --fuzz-dir fuzz \
            fuzz/corpus/${{ matrix.target }} \
            -- \
            -dict=fuzz/dicts/${{ matrix.dict }} \
            -max_total_time=7200 \
            -max_len=${{ matrix.max_len }} \
            -rss_limit_mb=4096 \
            -timeout=60 \
            -detect_leaks=0

      - name: Minimize corpus
        if: always()
        run: |
          cargo +${{ needs.toolchain.outputs.channel }} fuzz cmin ${{ matrix.target }} \
            --fuzz-dir fuzz \
            fuzz/corpus/${{ matrix.target }} \
            || true

      - name: Save corpus cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-weekly-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 90
