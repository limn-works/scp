name: CI Fix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            // Find the PR associated with this workflow run
            const head_sha = context.payload.workflow_run.head_sha;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
              state: 'open'
            });
            if (prs.data.length === 0) {
              core.setOutput('skip', 'true');
              return;
            }
            const pr = prs.data[0];
            // Check for claude-fix label (prevents infinite retry loops)
            const hasFixLabel = pr.labels.some(l => l.name === 'claude-fix');
            core.setOutput('skip', hasFixLabel ? 'true' : 'false');
            core.setOutput('number', pr.number);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('run_id', context.payload.workflow_run.id);

      - name: Checkout repository
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Add claude-fix label
        if: steps.pr.outputs.skip != 'true'
        run: gh pr edit ${{ steps.pr.outputs.number }} --add-label claude-fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude CI fix
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-4-20250514 --max-turns 20"
          prompt: |
            CI has failed on PR #${{ steps.pr.outputs.number }} (branch: ${{ steps.pr.outputs.branch }}).

            ## Step 1: Get the failure logs

            ```bash
            gh run view ${{ steps.pr.outputs.run_id }} --log-failed
            ```

            ## Step 2: Analyze the failure

            Read the relevant source files to understand the failure context. Determine if this is:
            - A compilation/type error
            - A test failure
            - A lint/format violation
            - A configuration issue

            ## Step 3: Fix the issue

            Make the minimal fix needed. Do not refactor or improve surrounding code.

            ## Step 4: Commit and push

            If you can fix the issue:
            ```bash
            git add <specific-files>
            git commit --no-gpg-sign -m "fix(ci): <description of fix>"
            git push origin ${{ steps.pr.outputs.branch }}
            ```

            Then comment on the PR:
            ```bash
            gh pr comment ${{ steps.pr.outputs.number }} --body "CI fix pushed: <description>"
            ```

            ## Step 5: If you can't fix it

            If the failure is not something you can fix automatically, comment with analysis:
            ```bash
            gh pr comment ${{ steps.pr.outputs.number }} --body "CI failure analysis: <detailed explanation of what failed and why, with suggestions for manual resolution>"
            ```

            Do NOT push broken code. Only push if you're confident the fix resolves the failure.
