# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Audits workspace dependencies for license compliance, security advisories,
# and duplicate crate detection. Run: cargo deny check

[graph]
all-features = true

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",  # not currently used but a known-safe license
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",  # webpki-root-certs (root CA bundle)
    "AGPL-3.0-only",  # scp-node only
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained — awaiting upstream migration
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via netlink-packet-utils (natpmp); no safe upgrade
    # instant: unmaintained, transitive dep via openmls -> fluvio-wasm-timer.
    # No alternative available; openmls uses it for WASM time abstraction.
    "RUSTSEC-2024-0384",
    # libcrux-ed25519: all-zero key on catastrophic RNG failure. Transitive via
    # openmls -> openmls_libcrux_crypto. Awaiting openmls upgrade.
    "RUSTSEC-2026-0075",
    # libcrux-poly1305: panic in standalone MAC. Transitive via openmls ->
    # openmls_libcrux_crypto -> libcrux-aead. Standalone MAC not used by SCP;
    # OpenMLS uses AEAD path which is unaffected. Awaiting openmls upgrade.
    "RUSTSEC-2026-0073",
    # libcrux-chacha20poly1305: panic when caller supplies a ciphertext buffer
    # longer than `ptxt.len() + TAG_LEN`. Transitive via openmls ->
    # openmls_libcrux_crypto -> libcrux-aead. SCP never sizes the ciphertext
    # buffer from attacker-controlled input — buffer length is always
    # `ptxt.len() + TAG_LEN` per the AEAD trait contract OpenMLS implements.
    # Awaiting openmls / libcrux upstream patch.
    "RUSTSEC-2026-0124",
    # libcrux-sha3: incorrect incremental SHAKE XOF output. Transitive via
    # openmls -> openmls_libcrux_crypto. Awaiting openmls upgrade.
    "RUSTSEC-2026-0074",
    # rand 0.8.5 unsound: aliased mutable reference when a custom logger
    # calls `rand::rng()` during ThreadRng reseed. Transitive via
    # hpke-rs-rust-crypto -> openmls_rust_crypto. Cannot upgrade: hpke-rs
    # pins rand ^0.8; fix requires rand >= 0.9.3. SCP uses tracing (not
    # log) and no logging callback generates random data, so the specific
    # soundness violation is unreachable in our code path. Awaiting
    # hpke-rs upstream upgrade.
    "RUSTSEC-2026-0097",
    # rustls-webpki: URI name constraints incorrectly accepted + wildcard
    # name constraints accepted. Transitive via rustls -> webpki. Awaiting
    # upstream rustls-webpki patch.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    # rustls-webpki: reachable panic in certificate revocation list parsing
    # (0.103.10). Transitive via rustls -> webpki. Awaiting upstream
    # rustls-webpki patch. Panic is reachable only when parsing attacker-
    # controlled CRLs; SCP does not consume external CRLs today.
    "RUSTSEC-2026-0104",
    # proc-macro-error2: unmaintained (fork of proc-macro-error, also
    # unmaintained). Build-time proc-macro support crate, transitive via
    # hax-lib-macros (the hax/F* verification toolchain pulled through the
    # libcrux/openmls dependency chain). No runtime exposure; no upstream
    # fix available. Awaiting hax-lib migration off proc-macro-error2.
    "RUSTSEC-2026-0173",
    # pyo3: out-of-bounds read in `nth` / `nth_back` for `PyList` and
    # `PyTuple` iterators. Direct dependency, but patched only in pyo3
    # >= 0.29 (a five-minor-version breaking migration from our 0.24).
    # The vulnerable path is unreachable in SCP: the PyO3 bridge never
    # applies `nth`/`nth_back` (nor `skip`/`step_by`/`rev`) to a
    # `PyList`/`PyTuple` iterator. The sole `.nth()` in the codebase
    # (scp-ffi/src/mcp.rs) is on a Rust `SplitWhitespace` string iterator
    # (HTTP status-line parse), and there are zero `.nth_back()` sites.
    # Inbound `PyList` values are only constructed (`PyList::new`/`empty`)
    # or forward-iterated via `.iter()` (`next()`); `PyTuple` is never
    # Rust-iterated. The one Rust-tuple extraction (`(u8, u8)` for
    # min_protocol_version in scp-ffi/src/context.rs) is safe because
    # pyo3's tuple/array `FromPyObject` uses indexed `get_borrowed_item`,
    # not the iterator's `nth`/`nth_back`. Awaiting a feasible pyo3 0.29
    # migration.
    "RUSTSEC-2026-0176",
    # pyo3: missing `Sync` bound on `PyCFunction::new_closure` closures.
    # Direct dependency; the bound was added only in pyo3 >= 0.29 (the same
    # five-minor-version breaking migration from our 0.24 noted above). The
    # advisory's hazard is a *non-Sync* closure capture executed concurrently
    # across a GIL `Python::detach`. SCP's only two `new_closure` sites
    # (scp-ffi/src/context.rs, exposing the Rust ed25519 signer to Python)
    # capture solely `Sync` state — `Arc<ed25519_dalek::SigningKey>` (Send +
    # Sync) and `Vec<u8>` — so the missing-bound exploit condition cannot be
    # met by our usage. Awaiting a feasible pyo3 0.29 migration.
    "RUSTSEC-2026-0177",
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
