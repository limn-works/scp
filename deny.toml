# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Audits workspace dependencies for license compliance, security advisories,
# and duplicate crate detection. Run: cargo deny check

[graph]
all-features = true

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",  # not currently used but a known-safe license
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",  # webpki-root-certs (root CA bundle)
    "AGPL-3.0-only",  # scp-node only
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained — awaiting upstream migration
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via netlink-packet-utils (natpmp); no safe upgrade
    # instant: unmaintained. Reached only on wasm32, through
    # openmls -> fluvio-wasm-timer, which openmls's `js` feature supplies and which
    # openmls imports under `#[cfg(target_arch = "wasm32")]` to read a KeyPackage
    # Lifetime's wall-clock time. No native build carries it: scp-mls, scp-client and
    # scp-client-wasm each declare `js` in a `cfg(target_arch = "wasm32")` section.
    # openmls offers no other wasm32 time source.
    "RUSTSEC-2024-0384",
    # rand 0.8.5 unsound: an aliased mutable reference when a custom `log` logger calls
    # `rand::rng()` while ThreadRng reseeds. This workspace pins `rand = "0.8"` in its own
    # `[workspace.dependencies]` and eleven crates take it from there, so this is a direct
    # dependency and not only the transitive one through
    # `openmls_rust_crypto -> hpke-rs-rust-crypto`. The advisory names rand 0.8.6 as the
    # patched release on that line, and hpke-rs pins `^0.8` as well. SCP logs through
    # `tracing` rather than `log` and installs no logging callback that generates random
    # data, so the aliasing the advisory describes cannot occur on any SCP path.
    #
    # Do not delete this entry on the strength of a local `cargo deny` run.
    # cargo-deny 0.19.0 on a developer machine reports it as `advisory-not-detected`,
    # and `EmbarkStudios/cargo-deny-action@v2` reports it as `error[unsound]` and fails
    # the `Rust / deny` job. See
    # .docs/lessons/local-cargo-deny-sees-fewer-advisories-than-ci.md.
    "RUSTSEC-2026-0097",
    # libcrux-sha3: incorrect incremental SHAKE XOF output. Transitive via
    # openmls_rust_crypto -> hpke-rs -> libcrux-sha3, the SHA-3 backend hpke-rs
    # compiles in. OpenMLS drives hpke-rs through its one-shot AEAD and KDF surface,
    # not the incremental SHAKE squeeze API this advisory covers. Awaiting an hpke-rs
    # release that raises its libcrux-sha3 floor.
    "RUSTSEC-2026-0074",
    # proc-macro-error2: unmaintained (fork of proc-macro-error, also
    # unmaintained). Build-time proc-macro support crate, transitive via
    # hax-lib-macros <- hax-lib <- libcrux-sha3 <- hpke-rs <- openmls_rust_crypto:
    # the hax/F* verification toolchain that libcrux's crates annotate themselves with.
    # It runs at compile time and links into no binary. No upstream fix available;
    # awaiting hax-lib migration off proc-macro-error2.
    "RUSTSEC-2026-0173",
    # pyo3: out-of-bounds read in `nth` / `nth_back` for `PyList` and
    # `PyTuple` iterators. Direct dependency, but patched only in pyo3
    # >= 0.29 (a five-minor-version breaking migration from our 0.24).
    # The vulnerable path is unreachable in SCP: the PyO3 bridge never
    # applies `nth`/`nth_back` (nor `skip`/`step_by`/`rev`) to a
    # `PyList`/`PyTuple` iterator. The sole `.nth()` in the codebase
    # (scp-ffi/src/mcp.rs) is on a Rust `SplitWhitespace` string iterator
    # (HTTP status-line parse), and there are zero `.nth_back()` sites.
    # Inbound `PyList` values are only constructed (`PyList::new`/`empty`)
    # or forward-iterated via `.iter()` (`next()`); `PyTuple` is never
    # Rust-iterated. The one Rust-tuple extraction (`(u8, u8)` for
    # min_protocol_version in scp-ffi/src/context.rs) is safe because
    # pyo3's tuple/array `FromPyObject` uses indexed `get_borrowed_item`,
    # not the iterator's `nth`/`nth_back`. Awaiting a feasible pyo3 0.29
    # migration.
    "RUSTSEC-2026-0176",
    # pyo3: missing `Sync` bound on `PyCFunction::new_closure` closures.
    # Direct dependency; the bound was added only in pyo3 >= 0.29 (the same
    # five-minor-version breaking migration from our 0.24 noted above). The
    # advisory's hazard is a *non-Sync* closure capture executed concurrently
    # across a GIL `Python::detach`. SCP's only two `new_closure` sites
    # (scp-ffi/src/context.rs, exposing the Rust ed25519 signer to Python)
    # capture solely `Sync` state — `Arc<ed25519_dalek::SigningKey>` (Send +
    # Sync) and `Vec<u8>` — so the missing-bound exploit condition cannot be
    # met by our usage. Awaiting a feasible pyo3 0.29 migration.
    "RUSTSEC-2026-0177",
    # libcrux-sha3: incorrect output of the incremental portable SHAKE API across
    # multiple squeeze calls. Same openmls_rust_crypto -> hpke-rs -> libcrux-sha3 path
    # as RUSTSEC-2026-0074 above. OpenMLS uses SHA-2/HKDF for its KDF, not the
    # incremental SHAKE squeeze path. Awaiting upstream.
    "RUSTSEC-2026-0207",
    # libcrux: potential panic in the AVX2 SHAKE-256 implementation. Same
    # openmls_rust_crypto -> hpke-rs -> libcrux-sha3 path as RUSTSEC-2026-0074 above.
    # OpenMLS does not drive this SHAKE code path. Awaiting upstream.
    "RUSTSEC-2026-0208",
    # libcrux: potentially incorrect output of constant-time swap/select on aarch64.
    # Same openmls_rust_crypto -> hpke-rs -> libcrux-sha3 path as RUSTSEC-2026-0074
    # above; awaiting upstream migration. No runtime exposure.
    "RUSTSEC-2026-0212",
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
