# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Audits workspace dependencies for license compliance, security advisories,
# and duplicate crate detection. Run: cargo deny check

[graph]
all-features = true

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",  # not currently used but a known-safe license
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",  # webpki-root-certs (root CA bundle)
    "AGPL-3.0-only",  # scp-node only
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny's default `unsound = "workspace"` reports an unsound advisory only against a
# crate a workspace member names directly, so a transitive copy of the same crate compiles
# in unreported. "all" reports every copy in the graph.
unsound = "all"
ignore = [
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained — awaiting upstream migration
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via netlink-packet-utils (natpmp); no safe upgrade
    # instant: unmaintained. Reached only on wasm32, through
    # openmls -> fluvio-wasm-timer, which openmls's `js` feature supplies and which
    # openmls imports under `#[cfg(target_arch = "wasm32")]` to read a KeyPackage
    # Lifetime's wall-clock time. No native build carries it: scp-mls, scp-client and
    # scp-client-wasm each declare `js` in a `cfg(target_arch = "wasm32")` section.
    # openmls offers no other wasm32 time source.
    "RUSTSEC-2024-0384",
    # proc-macro-error2: unmaintained (fork of proc-macro-error, also
    # unmaintained). Build-time proc-macro support crate, transitive via
    # hax-lib-macros <- hax-lib <- libcrux-sha3 <- hpke-rs <- openmls_rust_crypto:
    # the hax/F* verification toolchain that libcrux's crates annotate themselves with.
    # It runs at compile time and links into no binary. No upstream fix available;
    # awaiting hax-lib migration off proc-macro-error2.
    "RUSTSEC-2026-0173",
    # pyo3: out-of-bounds read in `nth` / `nth_back` for `PyList` and
    # `PyTuple` iterators. Direct dependency, but patched only in pyo3
    # >= 0.29 (a five-minor-version breaking migration from our 0.24).
    # The vulnerable path is unreachable in SCP: the PyO3 bridge never
    # applies `nth`/`nth_back` (nor `skip`/`step_by`/`rev`) to a
    # `PyList`/`PyTuple` iterator. The sole `.nth()` in the codebase
    # (scp-ffi/src/mcp.rs) is on a Rust `SplitWhitespace` string iterator
    # (HTTP status-line parse), and there are zero `.nth_back()` sites.
    # Inbound `PyList` values are only constructed (`PyList::new`/`empty`)
    # or forward-iterated via `.iter()` (`next()`); `PyTuple` is never
    # Rust-iterated. The one Rust-tuple extraction (`(u8, u8)` for
    # min_protocol_version in scp-ffi/src/context.rs) is safe because
    # pyo3's tuple/array `FromPyObject` uses indexed `get_borrowed_item`,
    # not the iterator's `nth`/`nth_back`. Awaiting a feasible pyo3 0.29
    # migration.
    "RUSTSEC-2026-0176",
    # pyo3: missing `Sync` bound on `PyCFunction::new_closure` closures.
    # Direct dependency; the bound was added only in pyo3 >= 0.29 (the same
    # five-minor-version breaking migration from our 0.24 noted above). The
    # advisory's hazard is a *non-Sync* closure capture executed concurrently
    # across a GIL `Python::detach`. SCP's only two `new_closure` sites
    # (scp-ffi/src/context.rs, exposing the Rust ed25519 signer to Python)
    # capture solely `Sync` state — `Arc<ed25519_dalek::SigningKey>` (Send +
    # Sync) and `Vec<u8>` — so the missing-bound exploit condition cannot be
    # met by our usage. Awaiting a feasible pyo3 0.29 migration.
    "RUSTSEC-2026-0177",
    # libcrux-sha3 0.0.8: incorrect output of the incremental portable SHAKE API across
    # multiple squeeze calls. Transitive via openmls_rust_crypto -> hpke-rs 0.6.1 ->
    # libcrux-sha3, the SHA-3 backend hpke-rs compiles in. OpenMLS drives hpke-rs through
    # its one-shot AEAD and KDF surface and uses SHA-2/HKDF for its KDF, so no SCP path
    # reaches the incremental SHAKE squeeze API this advisory covers. The advisory names
    # libcrux-sha3 >= 0.0.10 as patched. hpke-rs 0.6.1 requires libcrux-sha3 `^0.0.8`,
    # hpke-rs 0.7.0 requires libcrux-sha3 `=0.0.10`, and openmls_rust_crypto 0.5.1
    # requires hpke-rs `^0.6.0`, so one of two releases clears this entry: an hpke-rs 0.6
    # release that requires libcrux-sha3 >= 0.0.10, or an openmls_rust_crypto release
    # that requires hpke-rs 0.7. Re-check with `cargo update --dry-run -p hpke-rs` and
    # `cargo update --dry-run -p openmls_rust_crypto` whenever you touch this file.
    "RUSTSEC-2026-0207",
    # libcrux-sha3 0.0.8: potential panic in the AVX2 SHAKE-256 implementation. Same path
    # and same patched release (libcrux-sha3 >= 0.0.10) as RUSTSEC-2026-0207 above; OpenMLS
    # does not drive this SHAKE code path. Either release named above clears both entries.
    "RUSTSEC-2026-0208",
    # libcrux-secrets 0.0.5: potentially incorrect output of constant-time swap/select on
    # aarch64. Transitive via
    # openmls_rust_crypto -> hpke-rs -> libcrux-sha3 -> libcrux-traits 0.0.6 -> libcrux-secrets.
    # The advisory names libcrux-secrets >= 0.0.6 as patched; libcrux-traits 0.0.6 requires
    # libcrux-secrets 0.0.5, so a libcrux-traits release that requires libcrux-secrets
    # >= 0.0.6 clears this entry. Re-check with
    # `cargo update --dry-run -p libcrux-secrets` whenever you touch this file.
    "RUSTSEC-2026-0212",
    # lru: `IterMut` violates Stacked Borrows. Reported by `unsound = "all"` above against
    # lru 0.12.5 alone, which reaches the build only through aws-sdk-s3 1.119.0 (the
    # optional S3 blob backend), whose manifest requires lru `^0.12.2`; the advisory names
    # lru >= 0.16.3 as patched. aws-sdk-s3 builds its one `LruCache` in `s3_express.rs`
    # and never calls `iter_mut`. An aws-sdk-s3 release that requires lru >= 0.18.2
    # clears this entry and the next one's 0.12.5 copy.
    "RUSTSEC-2026-0002",
    # lru: `LruCache::pop()` leaves dangling pointers when a key's `Drop` panics. Reported
    # against lru 0.12.5 (aws-sdk-s3, above) and lru 0.16.3, which mainline 6.0.1 (the
    # scp-dht DHT client) requires as `^0.16`; the advisory names lru >= 0.18.2 as
    # patched, and every workspace crate that names lru directly resolves 0.18.2; the
    # `[bans]` entry for lru below fails the check if any other crate pulls in a lower
    # version, because both IDs here are ignored for every lru version. The
    # keys both crates store (aws-sdk-s3's cache key, mainline's `Id` and
    # `SocketAddrV4`) have no panicking `Drop`, so the trigger cannot occur. A mainline
    # release that requires lru >= 0.18.2 clears the 0.16.3 copy. Re-check with
    # `cargo update --dry-run -p mainline` and `cargo update --dry-run -p aws-sdk-s3`
    # whenever you touch this file.
    "RUSTSEC-2026-0253",
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"
# The two lru ignores above hold an advisory ID for every lru version in the graph.
# This ban keeps them scoped to the transitive copies they justify: an lru below the
# patched 0.18.2 fails the check unless aws-sdk-s3 or mainline is what depends on it,
# so a workspace crate naming an unpatched lru directly is reported.
deny = [
    { crate = "lru:<0.18.2", wrappers = ["aws-sdk-s3", "mainline"], reason = "RUSTSEC-2026-0002 and RUSTSEC-2026-0253 are ignored only for these two dependents" },
]

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
