# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Audits workspace dependencies for license compliance, security advisories,
# and duplicate crate detection. Run: cargo deny check

[graph]
all-features = true

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",  # not currently used but a known-safe license
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",  # webpki-root-certs (root CA bundle)
    "AGPL-3.0-only",  # scp-node only
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained — awaiting upstream migration
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via netlink-packet-utils (natpmp); no safe upgrade
    # instant: unmaintained, transitive dep via openmls -> fluvio-wasm-timer.
    # No alternative available; openmls uses it for WASM time abstraction.
    "RUSTSEC-2024-0384",
    # aws-lc-sys: X.509 CN wildcard/unicode bypass, CRL distribution point logic errors.
    # Transitive dep via rustls/aws-sdk. Awaiting upstream aws-lc-sys patch release.
    "RUSTSEC-2026-0044",
    "RUSTSEC-2026-0048",
    # rustls-webpki CRL distribution point logic — transitive dep via aws-smithy-http-client
    # -> rustls 0.21 -> rustls-webpki 0.101.7. Fix requires >=0.103.10 but AWS SDK pins 0.101.x.
    "RUSTSEC-2026-0049",
    # rustls-webpki: name constraints accepted for wildcard certs. Transitive
    # dep via aws-sdk -> rustls -> rustls-webpki. Awaiting upstream patch.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    # libcrux-ed25519: all-zero key on catastrophic RNG failure. Transitive via
    # openmls -> openmls_libcrux_crypto. Awaiting openmls upgrade.
    "RUSTSEC-2026-0075",
    # libcrux-poly1305: panic in standalone MAC. Transitive via openmls ->
    # openmls_libcrux_crypto -> libcrux-aead. Standalone MAC not used by SCP;
    # OpenMLS uses AEAD path which is unaffected. Awaiting openmls upgrade.
    "RUSTSEC-2026-0073",
    # libcrux-sha3: incorrect incremental SHAKE XOF output. Transitive via
    # openmls -> openmls_libcrux_crypto. Awaiting openmls upgrade.
    "RUSTSEC-2026-0074",
    # rand 0.8.5 unsound: aliased mutable reference when custom logger calls
    # rand::rng() during ThreadRng reseed. Transitive via hpke-rs-rust-crypto
    # 0.6.0 -> openmls_rust_crypto. Cannot upgrade: hpke-rs pins rand ^0.8,
    # fix requires rand >= 0.9.3. SCP uses tracing (not log) and no logging
    # callback generates random data. Awaiting hpke-rs upstream upgrade.
    "RUSTSEC-2026-0097",
    # rustls-webpki: URI name constraints incorrectly accepted + wildcard
    # name constraints accepted. Transitive via rustls -> webpki. Awaiting
    # upstream rustls-webpki patch.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
