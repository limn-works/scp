# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Audits workspace dependencies for license compliance, security advisories,
# and duplicate crate detection. Run: cargo deny check

[graph]
all-features = true

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",  # not currently used but a known-safe license
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",  # webpki-root-certs (root CA bundle)
    "AGPL-3.0-only",  # scp-node only
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny's default `unsound = "workspace"` reports an unsound advisory only against a
# crate a workspace member names directly, so a transitive copy of the same crate compiles
# in unreported. "all" reports every copy in the graph.
unsound = "all"
ignore = [
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained — awaiting upstream migration
    "RUSTSEC-2024-0436",  # paste unmaintained — transitive via netlink-packet-utils (natpmp); no safe upgrade
    # proc-macro-error2: unmaintained (fork of proc-macro-error, also
    # unmaintained). Build-time proc-macro support crate, transitive via
    # hax-lib-macros <- hax-lib <- libcrux-sha3 <- hpke-rs <- openmls_rust_crypto:
    # the hax/F* verification toolchain that libcrux's crates annotate themselves with.
    # It runs at compile time and links into no binary. No upstream fix available;
    # awaiting hax-lib migration off proc-macro-error2.
    "RUSTSEC-2026-0173",
    # pyo3: out-of-bounds read in `nth` / `nth_back` for `PyList` and
    # `PyTuple` iterators. Direct dependency, but patched only in pyo3
    # >= 0.29 (a five-minor-version breaking migration from our 0.24).
    # The vulnerable path is unreachable in SCP: the PyO3 bridge never
    # applies `nth`/`nth_back` (nor `skip`/`step_by`/`rev`) to a
    # `PyList`/`PyTuple` iterator. The sole `.nth()` in the codebase
    # (scp-ffi/src/mcp.rs) is on a Rust `SplitWhitespace` string iterator
    # (HTTP status-line parse), and there are zero `.nth_back()` sites.
    # Inbound `PyList` values are only constructed (`PyList::new`/`empty`)
    # or forward-iterated via `.iter()` (`next()`); `PyTuple` is never
    # Rust-iterated. The one Rust-tuple extraction (`(u8, u8)` for
    # min_protocol_version in scp-ffi/src/context.rs) is safe because
    # pyo3's tuple/array `FromPyObject` uses indexed `get_borrowed_item`,
    # not the iterator's `nth`/`nth_back`. Awaiting a feasible pyo3 0.29
    # migration.
    "RUSTSEC-2026-0176",
    # pyo3: missing `Sync` bound on `PyCFunction::new_closure` closures.
    # Direct dependency; the bound was added only in pyo3 >= 0.29 (the same
    # five-minor-version breaking migration from our 0.24 noted above). The
    # advisory's hazard is a *non-Sync* closure capture executed concurrently
    # across a GIL `Python::detach`. SCP's only two `new_closure` sites
    # (scp-ffi/src/context.rs, exposing the Rust ed25519 signer to Python)
    # capture solely `Sync` state — `Arc<ed25519_dalek::SigningKey>` (Send +
    # Sync) and `Vec<u8>` — so the missing-bound exploit condition cannot be
    # met by our usage. Awaiting a feasible pyo3 0.29 migration.
    "RUSTSEC-2026-0177",
    # lru: `LruCache::pop()` leaves dangling pointers when a key's `Drop` panics. Reported
    # against lru 0.16.3, which mainline 6.0.1 (the scp-dht DHT client) requires as
    # `^0.16`; the advisory names lru >= 0.18.2 as patched. No mainline release clears
    # it: every mainline release through 8.0.0 requires lru `^0.16`. Every workspace crate
    # that names lru directly resolves 0.18.2, and the `[bans]` entry for lru below fails
    # the check if any crate other than mainline pulls in a lower version, because this
    # ID is ignored for every lru version. Every mainline `LruCache` is keyed by `Id`,
    # which has no panicking `Drop`, so the trigger cannot occur. A mainline release that
    # requires lru >= 0.18.2 clears this entry. scp-dht requires mainline `"6"`, so a
    # clearing release will most likely be a later major that `cargo update --dry-run`
    # never offers. Re-check whenever you touch this file: `cargo info mainline` prints
    # the newest release after `latest`, and `cargo info mainline@<latest> --verbose`
    # lists that release's lru requirement.
    "RUSTSEC-2026-0253",
    # rsa: Marvin Attack, a non-constant-time RSA decryption and signing path that leaks
    # private-key bits through timing an attacker observes over the network. rsa is a
    # dev-dependency of scp-transport only: the FCM sender tests use it to generate a
    # throwaway RSA-2048 service-account key at test time, so no private key is
    # committed, and the key signs nothing outside those tests. Production RS256 signing
    # uses ring. No patched version exists: the advisory lists `patched = []`, and rsa
    # 0.9.10 and 0.10.0-rc.18 are both affected. The `[bans]` entry for rsa below fails
    # the check if any crate other than scp-transport depends on rsa, because this ID is
    # ignored for every rsa version. A patched rsa release clears this entry.
    "RUSTSEC-2023-0071",
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"
# P-256 arithmetic stays inside scp-crypto (`scp_crypto::p256`, including the
# scalar multiplication behind `ecdh_p256`): no other workspace crate may depend
# on the curve crates, normal or dev. `wrappers` lists every crate allowed to
# depend on each one directly; the rest are the upstream crates that need them.
#
# The lru ignore above holds an advisory ID for every lru version in the graph. This
# ban keeps it scoped to the transitive copy it justifies: an lru below the patched
# 0.18.2 fails the check unless mainline is what depends on it, so a workspace crate
# or any other dependency pulling in an unpatched lru is reported.
#
# The rsa ignore above holds RUSTSEC-2023-0071 for every rsa version. This ban keeps
# it scoped to scp-transport's dev-only test-key generation: any other crate that
# depends on rsa, normal or dev, fails the check.
deny = [
    { crate = "p256", wrappers = [
        "scp-crypto",
        "hpke-rs-rust-crypto",
        "openmls_basic_credential",
        "openmls_rust_crypto",
    ], reason = "P-256 arithmetic stays in scp-crypto" },
    { crate = "elliptic-curve", wrappers = [
        "ecdsa",
        "k256",
        "p256",
        "p384",
        "primeorder",
    ], reason = "P-256 arithmetic stays in scp-crypto" },
    { crate = "primeorder", wrappers = [
        "p256",
        "p384",
    ], reason = "P-256 arithmetic stays in scp-crypto" },
    { crate = "lru:<0.18.2", wrappers = ["mainline"], reason = "RUSTSEC-2026-0253 is ignored only for mainline's copy" },
    { crate = "rsa", wrappers = ["scp-transport"], reason = "RUSTSEC-2023-0071 is ignored only for scp-transport's dev-only test-key generation" },
]

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
