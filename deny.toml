# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Audits workspace dependencies for license compliance, security advisories,
# and duplicate crate detection. Run: cargo deny check

[graph]
all-features = true

# ── Licenses ────────────────────────────────────────────────────────────────
[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",  # webpki-root-certs (root CA bundle)
    "AGPL-3.0-only",  # scp-node only
]

# ── Advisories ──────────────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0020",  # pyo3 0.23.5 PyString buffer overflow — bump to 0.24+ when available
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained — awaiting upstream migration
]

# ── Bans ────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"

# ── Sources ─────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
