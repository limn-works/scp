# Leaves the scp-testing `perf_baseline` binary (the ADR-049 Decision 14 benchmark)
# out of every `cargo nextest run`, local and CI alike. Without `SCP_PERF_GATE=1` it
# measures, writes a git-ignored JSON file and asserts nothing; Decision 14 asks for a
# before-and-after comparison on one machine, which an operator runs by hand:
#
#   cargo nextest run -p scp-testing --ignore-default-filter --test perf_baseline
#
# The filter keeps the `not binary_id(...)` form, because
# scripts/check-test-shard-features.py reads it and fails when it leaves out a binary
# that file's UNRUN_BINARIES does not declare.
[profile.default]
default-filter = "not binary_id(scp-testing::perf_baseline)"
