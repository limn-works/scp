# WASM target configuration for getrandom 0.3.x (pulled in by jsonschema -> ahash).
# getrandom 0.3+ requires explicit backend selection for wasm32-unknown-unknown.
# See: https://docs.rs/getrandom/0.3/getrandom/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# 17-persistence-and-storage.md §17.6 (page-cache bulk block): every SQLCipher connection
# SCP opens runs on a SQLite compiled with SQLITE_ENABLE_MEMORY_MANAGEMENT, and
# `scp_sqlite_pools` refuses to open one compiled without it. libsqlite3-sys 0.30.1
# passed the option itself; 0.40.0 passes it no longer, and its build script adds each
# `-D`/`-U` word of LIBSQLITE3_FLAGS to the compile of the bundled SQLCipher, so this
# entry restores the option for every cargo command run inside this repository. A
# LIBSQLITE3_FLAGS already in the environment wins over this entry (no `force`), which is
# how the `sqlite-without-memory-management` CI group builds the SQLite the crate must
# refuse. A build outside this repository, or one whose environment sets
# LIBSQLITE3_FLAGS without the option, compiles SQLite without it, and every SCP SQLCipher
# constructor then fails with `PoolsError::PageCacheBulkPossible`.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_MEMORY_MANAGEMENT"
