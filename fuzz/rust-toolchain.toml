# The one place this repository names the nightly the standalone fuzz crate compiles on.
# `fuzz/` sits outside the workspace, and cargo-fuzz only runs on nightly (see the Fuzzing
# row of AGENTS.md's toolchain table), so stable cannot supply it.
#
# WHO READS IT.
#   - `.github/workflows/fuzz.yml` reads the channel below in its `toolchain` job and
#     passes that output to every other job; `.github/workflows/ci.yml` reads it in a step
#     of its fuzz-build job. Neither workflow repeats the channel.
#   - `cargo` and `rustup` read it for a command run inside `fuzz/`.
#   - `build.rs` beside it reads the channel below and fails this crate's build when the
#     compiler cargo resolved is not a nightly, naming `RUSTUP_TOOLCHAIN` as the thing that
#     overrides this file when it is set.
#
# THE CHANNEL is the undated `nightly`. openmls 0.9.0's prelude still glob-re-exports its
# `pub(crate) use signature::*`, as 0.8.1's did, but current nightlies accept that
# re-export again (checked on nightly-2026-08-14 and nightly-2026-09-28), so no date needs
# pinning. rustup resolves `nightly` to the newest nightly installed locally, and CI
# installs the current one.
#
# A command run from the repository root resolves the STABLE pin instead, because rustup
# applies the toolchain file of the directory the command runs in, and cargo-fuzz refuses
# to run on stable. Every documented fuzz invocation therefore runs from inside this
# directory — `cd fuzz && cargo fuzz run <target>` — which is why no command in `fuzz/`,
# in `fuzz/README.md`, or in `fuzz/AGENTS.md` names a channel.
#
# That directory rule holds only while nothing exports `RUSTUP_TOOLCHAIN`, which overrides
# a toolchain file entirely. `.mise.toml` names no Rust version and installs no Rust
# toolchain for exactly that reason, and `scripts/check-toolchain-wiring.sh` fails when it
# names one again. `build.rs` catches every other exporter at build time.
#
# `.github/workflows/fuzz.yml` is the exception: its `cargo fuzz` commands run from the
# repository root so that `--fuzz-dir fuzz` and the corpus cache paths agree, so it reads
# the channel below in one job and passes it on the command line, where an explicit
# `+toolchain` sets `RUSTUP_TOOLCHAIN` for the command and everything it spawns.
[toolchain]
channel = "nightly"
components = ["rust-analyzer"]
