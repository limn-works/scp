[package]
name = "scp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

# ── Release profile ─────────────────────────────────────────────────────────
# CRITICAL for `fuzz_mls_decrypt` (ADR-057 §Prereq-4). cargo-fuzz builds the
# `release` profile but, unless `-O`/`--release` is passed, ALSO injects
# `-Cdebug-assertions` — which would make openmls's decrypt `debug_assert!`
# ("Ciphertext decryption failed") fire on EVERY tampered ciphertext and report
# a false crash. `fuzz_mls_decrypt` must validate the SHIPPED release path
# (debug_assert compiled out → typed `Err`), so it MUST be run with
# `cargo +nightly fuzz run fuzz_mls_decrypt -O ...` (release, debug-assertions
# off). This explicit profile line keeps debug-assertions off in the profile
# itself (the release default) so the two agree; the `-O` flag is the operative
# switch that stops cargo-fuzz re-enabling them. See the dedicated
# `fuzz-mls-decrypt` job in `.github/workflows/fuzz.yml`.
[profile.release]
debug-assertions = false

[lib]
name = "scp_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
scp-protocol = { path = "../crates/scp-protocol", features = ["testing"] }
scp-relay-client = { path = "../crates/scp-relay-client" }
scp-transport = { path = "../crates/scp-transport" }
scp-runtime = { path = "../crates/scp-runtime", features = ["testing"] }
scp-event-log = { path = "../crates/scp-event-log" }
scp-clock = { path = "../crates/scp-clock" }
scp-did = { path = "../crates/scp-did" }
scp-mls = { path = "../crates/scp-mls" }

