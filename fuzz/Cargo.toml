[package]
name = "scp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[lib]
name = "scp_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
arbitrary = { version = "1", features = ["derive"] }
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
scp-protocol = { path = "../crates/scp-protocol", features = ["testing"] }
scp-transport = { path = "../crates/scp-transport" }
scp-runtime = { path = "../crates/scp-runtime", features = ["testing"] }
scp-event-log = { path = "../crates/scp-event-log" }
scp-primitives = { path = "../crates/scp-primitives" }

# Tier 1 — Wire Format Parsers
[[bin]]
name = "fuzz_outer_envelope"
path = "fuzz_targets/fuzz_outer_envelope.rs"
test = false
doc = false

