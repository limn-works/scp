[settings]
# Read `rust-toolchain.toml` instead of naming a Rust version here.
#
# mise installs rust through rustup and, for an installed toolchain, exports
# `RUSTUP_TOOLCHAIN` for every command it runs. That variable overrides
# `rust-toolchain.toml` entirely — channel, components, and targets alike — so a
# `rust = "..."` entry in this file used to decide which compiler a local shell got,
# and `rust = "stable"` is how a shell came to run 1.97.1 while every file in the
# repository read 1.98.0. See
# `.docs/lessons/pin-the-rust-toolchain-or-ci-drifts-from-local.md`.
#
# This setting registers `rust-toolchain.toml` as the rust tool's version source, so
# mise reads `channel`, `components`, and `targets` out of that file, passes them to
# `rustup toolchain install`, and exports the channel it just read, so the value mise
# exports is derived from the file and cannot contradict it. When the file names a
# toolchain rustup has not installed yet, mise exports nothing and rustup reads the same
# file directly; both paths resolve the channel below. A `RUSTUP_TOOLCHAIN` exported from
# outside this repository still wins over both, which is why `scripts/hooks/pre-commit`
# compares `rustc --version` against the pin before it runs cargo.
# https://mise.jdx.dev/configuration.html#idiomatic-version-files names the setting;
# the rust tool registers `rust-toolchain.toml` (registry/rust.toml).
idiomatic_version_file_enable_tools = ["rust"]

[tools]
java = "zulu-17.64.17"
bun = "1.3.9"
python = "3.12.12"
kotlin = "2.3.10"
gradle = "8.14.4"
"cargo:cargo-nextest" = "latest"
"cargo:maturin" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-fuzz" = "latest"
# wasm-pack builds the `@limn-works/scp-ts-wasm` browser SDK's wasm artifact
# (ADR-057 Slice 3). Pinned so the release-only build guard has a reproducible
# toolchain (`wasm-pack build --release --target web`, never `--dev`).
"cargo:wasm-pack" = "0.14.0"
"npm:@napi-rs/cli" = "latest"

[env]
ANDROID_NDK_VERSION = "27.2.12479018"
ANDROID_HOME = "{% if os() == 'macos' %}{{ env.HOME }}/Library/Android/sdk{% else %}{{ env.HOME }}/Android/Sdk{% endif %}"
ANDROID_NDK_HOME = "{{ env.ANDROID_HOME }}/ndk/{{ env.ANDROID_NDK_VERSION }}"

# Android NDK linkers need host-platform detection — delegate to shell
_.source = "scripts/android-linkers.sh"
