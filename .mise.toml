[tools]
java = "zulu-17.64.17"
bun = "1.3.9"
python = "3.12.12"
kotlin = "2.3.10"
gradle = "8.14.4"
# Keep `version` equal to `channel` in `rust-toolchain.toml`, and keep `targets` a
# superset of that file's `targets`.
#
# mise sets RUSTUP_TOOLCHAIN for the commands it runs, and that variable overrides
# `rust-toolchain.toml` entirely — channel, components, and targets alike. Check it
# with `mise x -- printenv RUSTUP_TOOLCHAIN`; note that plain `mise env` does not
# print the variable, so that command is the one that answers the question. Naming
# "stable" here would therefore let a local shell resolve a different compiler than
# CI resolves and hide the exact failure the pin exists to prevent, and omitting a
# target here makes a cross-build that CI performs fail locally.
#
# `mise ls rust` reports the requested version as `(missing)` until `mise install`
# runs, and mise falls back to the previously installed toolchain until then.
rust = { version = "1.98.0", targets = "wasm32-unknown-unknown,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-msvc" }
"cargo:cargo-nextest" = "latest"
"cargo:maturin" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-fuzz" = "latest"
# wasm-pack builds the `@limn-works/scp-ts-wasm` browser SDK's wasm artifact
# (ADR-057 Slice 3). Pinned so the release-only build guard has a reproducible
# toolchain (`wasm-pack build --release --target web`, never `--dev`).
"cargo:wasm-pack" = "0.14.0"
"npm:@napi-rs/cli" = "latest"

[env]
ANDROID_NDK_VERSION = "27.2.12479018"
ANDROID_HOME = "{% if os() == 'macos' %}{{ env.HOME }}/Library/Android/sdk{% else %}{{ env.HOME }}/Android/Sdk{% endif %}"
ANDROID_NDK_HOME = "{{ env.ANDROID_HOME }}/ndk/{{ env.ANDROID_NDK_VERSION }}"

# Android NDK linkers need host-platform detection — delegate to shell
_.source = "scripts/android-linkers.sh"
